/* ---------- 4) Monthly Attendance Register (replaces the plain Google-Sheet print) ---------- */
/** Text of one day cell, same rule as the sheet: P, 2P, 3P ... or (no P) L / A / B, with the lecture count in front. */
function dayCell(pm, roll){
  const ps = Object.keys(pm || {}), seen = {}; let p = 0;
  ps.forEach(k => { const v = pm[k][roll]; if(!v) return; if(v === 'P') p++; else seen[v] = 1; });
  if(p) return p === 1 ? 'P' : p + 'P';
  for(const k of ['L', 'A', 'B']) if(seen[k]) return ps.length > 1 ? ps.length + k : k;
  return '';
}
function registerPdf(){
  const d = data[sheetName()], { m, y, n } = dayInfo(), T = mtView(d);
  const days = Array.from({ length:n }, (_, i) => i + 1), PM = {}, isSun = {}, held = {};
  let lect = 0;
  days.forEach(day => {
    PM[day] = pmOf(day);                                   // sheet data + anything still waiting on the phone
    isSun[day] = new Date(y, m, day).getDay() === 0;
    held[day] = Object.keys(PM[day]).filter(p => Object.values(PM[day][p]).some(v => v === 'P' || v === 'A')).length;
    lect += held[day];
  });
  const rows = d.students.map(s => {
    let p = 0, a = 0;
    days.forEach(day => Object.keys(PM[day]).forEach(k => { const v = PM[day][k][s.roll]; if(v === 'P') p++; else if(v === 'A') a++; }));
    const den = s.guest ? p + a : lect, pct = !s.off && den ? Math.round(p / den * 1000) / 10 : null, t = s.off ? null : T.get(s.roll);
    return { s, p, den, pct, t, low:pct != null && pct < LOW, cells:days.map(day => s.off ? '' : dayCell(PM[day], s.roll)) };
  });
  const act = rows.filter(r => !r.s.off), ps = act.map(r => r.pct).filter(v => v != null);
  const avg = ps.length ? Math.round(ps.reduce((a, b) => a + b, 0) / ps.length * 10) / 10 : null;
  const nLow = act.filter(r => r.low).length, nMt = act.filter(r => r.t && r.t.low).length;

  const doc = newDoc('landscape'); let Y = TOP;
  Y = heading(doc, Y, 'Monthly Attendance Register', sel.cls + ' \u00b7 ' + titleCase(sel.sub) + ' \u00b7 ' + MONTHS[m] + ' ' + y);
  Y = infoGrid(doc, Y, [
    ['Class / Section', sel.cls], ['Subject', titleCase(sel.sub)], ['Subject teacher', teacher || user],
    ['Month', MONTHS[m] + ' ' + y], ['Lectures held', lect], ['Students', act.length]
  ], 6) + 3;
  Y = statBoxes(doc, Y, [
    { l:'Avg attendance', v:avg == null ? '-' : avg + '%', c:avg != null && avg < LOW ? RED : GREEN, bg:avg != null && avg < LOW ? REDBG : GREENBG },
    { l:'Students below ' + LOW + '%', v:nLow, c:nLow ? RED : INK, bg:nLow ? REDBG : SOFT },
    { l:'Monthly test total', v:T.total || '-' },
    { l:'Test below 50% / absent', v:T.total ? nMt : '-', c:nMt ? RED : INK, bg:nMt ? REDBG : SOFT }
  ]) + 4;

  const D0 = 3, DN = D0 + n - 1, cAtt = DN + 1, cHeld = DN + 2, cPct = DN + 3, cMt = DN + 4;
  const fixed = 7 + 23 + 42 + 10 + 10 + 12 + 11, dayW = (W(doc) - 20 - fixed) / n;
  const colStyles = { 0:{ cellWidth:7, halign:'center' }, 1:{ cellWidth:23 }, 2:{ cellWidth:42 } };
  days.forEach((_, i) => { colStyles[D0 + i] = { cellWidth:dayW, halign:'center', fontSize:6.2 }; });
  colStyles[cAtt] = { cellWidth:10, halign:'center', fontStyle:'bold' }; colStyles[cHeld] = { cellWidth:10, halign:'center' };

/** Every finished PDF / Excel file opens this small window: Share (WhatsApp, email...), Download, Open / Print.

function fileDlg(){

  const big = (id, label, sub, primary) => `<button type="button" class="fbtn ${primary ? 'primary' : ''}" id="${id}"><b>${label}</b><small>${sub}</small></button>`;
  const first = preferOpen && isPdf ? 'open' : canShare ? 'share' : 'down';

  if(!d.open) d.showModal();

  if(sh) sh.onclick = () => navigator.share({ files:[file], title })
    .then(close).catch(e => { if(!e || e.name !== 'AbortError') toast('Could not share. Use Download, then attach the file.'); });

  };
}

  const per = {}; let lect = 0;
  d.students.forEach(s => { per[s.roll] = { p:0, a:0, l:0, b:0, g:!!s.guest }; });
  for(let day = 1; day <= 31; day++){
    if(range && (day < range.from || day > range.to)) continue;

    Object.keys(pm).forEach(k => {

    const pm = sheetPm(e.name, day), ks = Object.keys(pm).map(Number).sort((a, b) => a - b), note = sheetNote(e.name, day);
    let p = 0, a = 0;
    if(ks.length) Object.values(pm[ks[ks.length - 1]]).forEach(v => { if(v === 'P') p++; else if(v === 'A') a++; });
    const plan = dayPlan(e, dow), known = hasTT(e);
    return { e, done:ks.length > 0, note, lec:ks.length, p, a, loaded:!!data[e.name], plan, sched:known ? plan.length > 0 : null,
      waiting:queue.some(q => q.sheet === e.name && q.day === day && q.kind !== 'mt') };
  });
  /* only the classes the timetable has today (and classes missing from the timetable), in period order */
  const items = all.filter(x => x.sched !== false || x.done || x.note).sort((x, y) => firstP(x.plan) - firstP(y.plan));
  const offs = all.filter(x => !items.includes(x));
  const total = items.length, doneN = items.filter(x => x.done || x.note).length, pc = total ? Math.round(doneN / total * 100) : 0;

  let nowX = null, nextX = null;
  items.forEach(x => { const r = planRange(x.plan); if(!r) return; if(r.s <= nowM && nowM < r.e) nowX = x; else if(r.s > nowM && !nextX && !x.done) nextX = x; });

  /* Today: one compact line per class: period + start time | class (room, practical, now) | status */

    ${sun || !total ? '' : `<span class="mbar"><i class="${doneN === total ? '' : 'mid'}" style="width:${pc}%"></i></span>`}
    ${items.map(x => {
      const k = x.done ? 'done' : x.note ? 'note' : sun ? 'idle' : 'pend', t = planRange(x.plan), pr = x.plan.some(q => q.kind === 'Practical');

      const sub = [x === nowX ? 'Now' : x === nextX ? 'Next' : '', x.plan.length ? x.plan[0].room : '', pr ? 'Practical' : '', x.sched === null ? 'not in timetable' : ''].filter(Boolean).join(' · ');
      return `<button class="li cmp tt ${x === nowX ? 'now' : ''}" type="button" data-xopen="${esc(x.e.name)}" data-xday="${day}" title="${esc(x.note ? 'Note: ' + x.note : x.done ? 'Marked' : 'Not marked yet')}">
        <span class="pbadge ${k}"><b>${x.plan.length ? esc(pLabel(x.plan)) : '–'}</b><small>${t ? esc(fmtT(t.s)) : ''}</small></span>
        <span class="tx"><b>${esc(x.e.cls)} · ${esc(titleCase(x.e.sub))}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>${right}</button>`;
    }).join('') || `<div class="empty">${sun ? 'Sunday: no classes.' : 'You have no class in today\'s timetable.'}</div>`}
    ${offs.length && !sun ? `<div class="offt"><span>No class today:</span> ${offs.map(x => `<button type="button" data-xopen="${esc(x.e.name)}" data-xday="${day}">${esc(x.e.cls)} · ${esc(abbr(x.e.sub))}</button>`).join('')}</div>` : ''}</section>`;

  if(myRows().length) h += myTTCard();
  if(canFree()) h += freeCard();

  if(cur.length){
    const lows = lowList(lowMode, cur), wk = weekRange();
    h += `<section class="card"><h3>${I.alert} Low attendance <span class="ct">${lows.length}</span></h3>
      <div class="seg2" role="group" aria-label="Period"><button type="button" data-xlow="week" class="${lowMode === 'week' ? 'on' : ''}">This week</button><button type="button" data-xlow="month" class="${lowMode === 'month' ? 'on' : ''}">This month</button></div>
      <div class="sub">${lowMode === 'week' ? 'Below ' + LOW + '% from ' + wk.from + ' to ' + wk.to + ' ' + MONTHS[now.getMonth()].slice(0, 3) : 'Below ' + LOW + '% so far in ' + MONTHS[now.getMonth()]}</div>
      ${lows.slice(0, 4).map(lowRow).join('') || '<div class="empty">Nobody is below ' + LOW + '%. </div>'}
      ${lows.length ? `<div class="acts2"><button class="btn" type="button" id="xLowAll">See all (${lows.length})</button><button class="btn primary" type="button" id="xLowPdf">${I.share}Share PDF</button></div>` : ''}</section>`;

    const aggs = cur.map(e => secAgg(e)).filter(Boolean);
    if(aggs.length) h += `<section class="card"><h3>${I.chart} My sections this month</h3><div class="sub">${MONTHS[now.getMonth()]} attendance by class. Tap for the summary.</div>${aggs.map(g =>

    h += `<section class="card"><h3>${I.search} Find a student</h3><div class="sub">Search all your sections and open the full profile</div>
      <input id="hq" class="sq" type="search" placeholder="Name or roll no." autocomplete="off" autocapitalize="none" spellcheck="false"><div id="hres"></div></section>`;
  }

  lastReps = rq.map(x => Object.assign({}, x, { wait:true })).concat(myReports).slice(0, 5);
  if(cur.length || lastReps.length) h += `<section class="card"><h3>${I.flag} Recent reports <span class="ct">${rq.length + myReports.length}</span></h3><div class="sub">Reports you sent to the Chief Proctor</div>
    ${lastReps.map((r, i) => `<button class="li" type="button" data-xrep="${i}"><span class="av" style="background:var(--absent-bg);color:var(--absent)">${esc(initials(r.who))}</span><span class="tx"><b>${esc(r.who)}</b><small>${esc(r.cls || '')} · ${esc(r.cat || '')} · ${esc(fmtIso(r.date) || r.at || '')}</small></span><span class="pill ${r.wait ? 'mid' : /Action|Closed/.test(r.status) ? 'good' : ''}">${esc(r.wait ? 'Waiting' : r.status || 'Received')}</span></button>`).join('') || '<div class="empty">No reports yet.</div>'}
    <button class="more" type="button" id="xRepAll">All reports</button></section>`;

  if(college && cur.length) h += college;
  h += '</div></main>';
  $q('#app').innerHTML = h;
}

function homeSearch(q){

function openProfile(roll, cls, sheet){
  prof = { roll, cls, sheet:sheet || '' };
  if(appView !== 'profile') prevView = appView;
  appView = 'profile';
  const need = profileEntries().filter(e => !data[e.name]);
  if(need.length && navigator.onLine){
    toast('Loading the student record…');
    (async () => { for(const e of need){ try{ await loadSheet(e, false); }catch(err){} } if(appView === 'profile') rerender(); })();
  }
  rerender();
}
function profileEntries(){
  if(!prof) return [];
  const list = sheets.filter(e => e.cls === prof.cls);
  if(isAdmin){ const src = sheets.find(e => e.name === prof.sheet); return src ? list.filter(e => e.sub === src.sub) : list.filter(e => data[e.name]); }
  return list;
}
function profileModel(){
  let stu = null; const subs = {};
  profileEntries().filter(e => data[e.name]).forEach(e => {
    const s = data[e.name].students.find(x => x.roll === prof.roll); if(!s) return;
    if(!stu || isCurMonth(e)) stu = s;
    const st = sheetStats(e.name);
    (subs[e.sub] = subs[e.sub] || []).push({ e, s, c:st.per[s.roll], lect:st.lect, t:s.off ? null : mtOf(e.name, s.roll) });
  });
  Object.keys(subs).forEach(k => subs[k].sort((x, y) => seasonIdx(x.e) - seasonIdx(y.e)));
  return { stu, subs };
}
function profTotals(M){
  const cur = { p:0, d:0 }, all = { p:0, d:0 };
  Object.keys(M.subs).forEach(k => M.subs[k].forEach(x => {
    if(x.s.off || !x.c || !x.c.den) return;
    all.p += x.c.p; all.d += x.c.den;
    if(isCurMonth(x.e)){ cur.p += x.c.p; cur.d += x.c.den; }
  }));
  return { cur, all, cp:pct2(cur.p, cur.d), ap:pct2(all.p, all.d) };
}
function profEntry(){
  const M = profileModel();
  for(const k of Object.keys(M.subs)){ const a = M.subs[k], x = a.find(y => isCurMonth(y.e) && !y.s.off) || a[a.length - 1]; if(x) return x.e; }
  return null;
}

/* ======================= self-update =======================
   A phone or laptop may keep opening an old saved copy of the app after a new index.html is put on GitHub.
   Each time the app opens online it reads the newest index.html (bypassing every cache); when its version
   differs, the saved copies are replaced and the app reloads once with the new version. */
const APP_BUILD = '2026-10-29 registers';
async function checkUpdate(manual){
  if(!navigator.onLine) return manual && toast('No internet. Try again when online.');
  try{
    const url = location.pathname + (location.pathname.endsWith('/') ? 'index.html' : '');
    const res = await fetch(url + '?nocache=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text(), m = txt.match(/const APP_BUILD = '([^']+)'/), remote = m ? m[1] : '';
    if(!remote || remote === APP_BUILD){ if(manual) toast('You have the latest version (' + APP_BUILD + ').'); return; }
    if(sessionStorage.getItem('jcwUpd') === remote && !manual) return;           // tried once already in this visit: no reload loop
    sessionStorage.setItem('jcwUpd', remote);
    if(queue.length && !manual) return toast('A new version of the app is ready. It installs after your records are synced.');
    toast('Installing the new version…');
    try{ for(const k of await caches.keys()) if(k !== 'jcw-pdf-tools-v1') await caches.delete(k); }catch(e){}
    try{ const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.update().catch(() => {}))); }catch(e){}
    try{ const c = await caches.open('jcw-shell-latest'); await c.put(url, new Response(txt, { headers:{ 'Content-Type':'text/html; charset=utf-8' } })); }catch(e){}
    setTimeout(() => location.reload(), 800);
  }catch(e){ if(manual) toast('Could not check for an update: ' + errText(e)); }
}
setTimeout(() => checkUpdate(false), 4000);
window.addEventListener('online', () => setTimeout(() => checkUpdate(false), 3000));

const SEAS = ['SEPT', 'OCT', 'NOV', 'DEC', 'JAN'];

/** rows -> students: [{ roll, name, cls, guest, subs:{ SUB:{ sub, teacher, months:{ MON:{p,d,mt,mtT,off} }, p, d, ms, mtT, pct, tp, off } } }] */
function aggregate(rows){
  const S = {};
  rows.forEach(r => r.st.forEach(x => {
    const k = x[0] + '|' + r.cls, s = S[k] = S[k] || { roll:x[0], name:x[1], cls:r.cls, guest:'', subs:{} };
    if(x[6]) s.guest = x[6];
    const g = s.subs[r.sub] = s.subs[r.sub] || { sub:r.sub, teacher:r.teacher, months:{}, p:0, d:0, ms:0, mtT:0, abs:0 };
    const off = !!x[5], mv = x[4];
    g.months[r.mon] = { p:Number(x[2]) || 0, d:Number(x[3]) || 0, mt:mv, mtT:r.mt, off };
    if(off) return;
    g.p += Number(x[2]) || 0; g.d += Number(x[3]) || 0;
    if(r.mt && mv !== '' && mv != null){ g.mtT += r.mt; if(mv === 'A') g.abs++; else g.ms += Number(mv) || 0; }
  }));
  return Object.values(S).map(s => {
    Object.values(s.subs).forEach(g => {
      const last = Object.keys(g.months).sort((a, b) => SEAS.indexOf(b) - SEAS.indexOf(a))[0];
      g.off = !!(last && g.months[last].off);
      g.pct = pct2(g.p, g.d); g.tp = g.mtT ? pct2(g.ms, g.mtT) : null;
    });
    const live = Object.values(s.subs).filter(g => !g.off);
    s.p = live.reduce((a, g) => a + g.p, 0); s.d = live.reduce((a, g) => a + g.d, 0); s.pct = pct2(s.p, s.d);
    s.ms = live.reduce((a, g) => a + g.ms, 0); s.mtT = live.reduce((a, g) => a + g.mtT, 0); s.tp = s.mtT ? pct2(s.ms, s.mtT) : null;
    return s;
  }).sort((a, b) => a.cls.localeCompare(b.cls, undefined, { numeric:true }) || enrollN(a.roll) - enrollN(b.roll));
}

<script>
/* ===== JCW Approved-leave add-on v1.2 ===== */
(function(){
'use strict';
const css = document.createElement('style');
css.textContent = '.rtag.lv{background:var(--leave-bg);color:var(--leave);font-weight:800}.rtag.lv.clash{background:var(--absent-bg);color:var(--absent)}';
document.head.appendChild(css);

/* 1) keep the leaves that the server sends with each sheet */
const lvIn = {};
const baseApi = window.api;
window.api = async function(payload, ms){
  const r = await baseApi.apply(this, arguments);
  try{
    if(payload && payload.action === 'sheet' && r && r.ok && !r.missing){
      lvIn[payload.sheet] = r.lv || {};
      store.set('lvSrv', r.lv === undefined ? 'old' : 'ok');      // 'old' = Code.gs edit not deployed
    }
  }catch(e){}
  return r;
};
const baseLoadSheet = window.loadSheet;
window.loadSheet = function(e){
  return baseLoadSheet.apply(this, arguments).then(res => {
    if(e && data[e.name] && lvIn[e.name]){ data[e.name].lv = lvIn[e.name]; delete lvIn[e.name]; store.set('data', data); if(!dirty){ loadDraft(); } }
    return res;
  });
};

/** { roll: 'Leave type' } for a day of the sheet on screen */
function leavesOn(day){
  const d = data[sheetName()];
  return (d && d.lv && d.lv[String(day)]) || {};
}
window.leavesOn = leavesOn;

/* 2) pre-mark L for students on approved leave who have no mark yet in this lecture */
const toasted = {};
function fillLeaves(){
  if(mode !== 'att') return 0;
  const d = data[sheetName()]; if(!d) return 0;
  const lv = leavesOn(sel.day); let n = 0;
  d.students.forEach(s => { if(!s.off && lv[s.roll] && !draft[s.roll]){ draft[s.roll] = 'L'; n++; } });
  if(n){
    const k = sheetName() + '|' + sel.day + '|' + sel.period;
    if(!toasted[k]){ toasted[k] = 1; setTimeout(() => toast(n + ' student' + (n > 1 ? 's are' : ' is') + ' on approved leave today and marked L. You can still change it.'), 300); }
  }
  return n;
}
const baseLoadDraft = window.loadDraft;
window.loadDraft = function(){
  const r = baseLoadDraft.apply(this, arguments);
  try{ fillLeaves(); }catch(e){}
  return r;
};

/* 3) tag on the student row */
const baseTag = window.tagHtml;
window.tagHtml = function(roll){
  let h = baseTag.apply(this, arguments);
  try{
    const d = data[sheetName()], st = d && d.students.find(x => x.roll === roll);
    const t = mode === 'att' && !(st && st.off) ? leavesOn(sel.day)[roll] : null;
    if(t) h = `<span class="rtag lv ${draft[roll] === 'A' ? 'clash' : ''}" title="Approved by the Leave In-Charge">Leave:${esc(t)}</span>` + h;
    else if(!(st && st.off) && d && d.lv && d.lv._u && d.lv._u[roll]){      // leave without dates: only a tag, never an automatic L
      const u = d.lv._u[roll], n = String(u[0] || '').trim();
      h = `<span class="rtag lv" title="The Leave In-Charge entered this leave without dates, so the days are not known">${n ? '' + esc(n) + ' day' + (n === '1' ? '' : 's') : ''} · ${esc(u[1])} (no dates)</span>` + h;
    }
  }catch(e){}
  return h;
};

/* 4) "Mark all P / A / B" keeps students on approved leave as L */
document.addEventListener('change', ev => {
  const t = ev.target;
  if(!t || !t.dataset || !t.dataset.all || !t.checked || t.dataset.all === 'L') return;
  const d = data[sheetName()]; if(!d) return;
  const lv = leavesOn(sel.day); let n = 0;
  d.students.forEach(s => { if(!s.off && lv[s.roll] && draft[s.roll] === t.dataset.all){ draft[s.roll] = 'L'; n++; } });
  if(n){ document.querySelectorAll('#list .row').forEach(paintRow); updateTally(); }
});

/* 5) check line in "Account and sync" (tap the status chip) */
const baseOpenSync = window.openSync;
window.openSync = function(){
  baseOpenSync.apply(this, arguments);
  try{
    const m = document.querySelector('#dlgBody .meta'); if(!m) return;
    const d = data[sheetName()], lv = (d && d.lv) || null, srv = store.get('lvSrv', '');
    let txt;
    if(srv === 'old') txt = 'Approved leaves: the server does not send them yet (Code.gs edit not deployed as a New version).';
    else if(!lv) txt = 'Approved leaves: not loaded for this sheet yet. Open it once with internet.';
    else {
      const days = Object.keys(lv).filter(x => x !== '_u').map(Number).sort((a, b) => a - b), n = new Set(days.flatMap(x => Object.keys(lv[x]))).size;
      const u = Object.keys(lv._u || {}).length;
      txt = 'Approved leaves in this sheet: ' + (days.length ? n + ' student(s) on day(s) ' + days.join(', ') : 'none with dates this month') +
        (u ? '; ' + u + ' student(s) with leave but no dates (shown as a tag only)' : '');
    }
    m.insertAdjacentHTML('beforeend', '<br><span style="color:var(--leave);font-weight:700">' + esc(txt) + '</span> <small>(leave add-on 1.2)</small>');
  }catch(e){}
};

/* 6) when a teacher marks A on a student with approved leave, the tag turns red at once */
document.addEventListener('click', ev => {
  const b = ev.target && ev.target.closest && ev.target.closest('#list button[data-v]'); if(!b) return;
  setTimeout(() => {
    const row = b.closest('.row'); if(!row) return;
    const tag = row.querySelector('.rtag.lv'); if(tag) tag.classList.toggle('clash', draft[row.dataset.roll] === 'A');
  }, 0);
});
})();
</script>
<script>
/* ===== JCW Registers & Results add-on v1.0 =====
   Adds a "Registers & results" card to the Reports screen:
   1) Daily register  - day-by-day P / A / L / B for any months: one section (one or all subjects),
                         all sections (admin / principal / HOD), or one student (subjects x days).
   2) Session register - one page per student of a section: every subject, month by month (Present / Held / %).
   3) Test results    - monthly tests with Obtained / Total, session %, and class position;
                         also one result card per student, or one student's card.
   Needs: Code.gs v6.6 (actions reg_opts, reg_find, reg_plan, reg_days) and the PDF Reports add-on (window.JCWPDF).
   Paste this block just before </body>, AFTER the other <script> blocks. */
(function(){
'use strict';
const P = window.JCWPDF;
if(!P) return;
const $q = s => document.querySelector(s);
const initials = n => String(n || '?').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const SEAS = ['SEPT', 'OCT', 'NOV', 'DEC', 'JAN'];
const TEST_LOW = 50;                       // test % below this is red (same as the rest of the app)
const CHUNK = 12;                          // sheets read per server call

const css = document.createElement('style');
css.textContent = `
#zrCard .zprog{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
#zrCard .zbar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:6px}
#zrCard .zbar i{display:block;height:100%;width:0;background:var(--acc,#2F5BEA);transition:width .3s}
#zrCard .zres{max-height:260px;overflow:auto}
#zrCard .zwarn{margin-top:8px;font-size:12px;color:var(--absent);font-weight:650}`;
document.head.appendChild(css);

/* ---------- state ---------- */
const seasNow = () => { const m = new Date().getMonth(), i = m >= 8 ? m - 8 : (m === 0 ? 4 : -1); return i < 0 ? 4 : i; };
let zr = { kind:'daily', who:'sec', cls:'', sub:'', from:SEAS[seasNow()], to:SEAS[seasNow()], roll:'', name:'', scls:'' };
let opts = null, optsAt = 0, optsBusy = false, optsErr = '', busy = false, prog = null, found = [], findT = 0;
const scope = () => store.get('scope', '');
const allLabel = () => scope() === 'all' ? 'Whole college' : scope() === 'dept' ? 'My department' : 'All my sections';
const monName = t => MONTHS[monIdx(t)];
const enrollN = r => parseInt(String(r).split('-').pop(), 10) || 0;
const pct1 = (a, b) => b ? Math.round(a / b * 1000) / 10 : null;
const yearOf = t => { const n = new Date(), s = (n.getMonth() > 7 || (n.getMonth() === 7 && n.getDate() >= 15)) ? n.getFullYear() : n.getFullYear() - 1; return monIdx(t) >= 7 ? s : s + 1; };
const rangeTxt = (f, t) => f === t ? monName(f) + ' ' + yearOf(f) : monName(f) + ' ' + yearOf(f) + ' to ' + monName(t) + ' ' + yearOf(t);
const monthsIn = (f, t) => SEAS.slice(SEAS.indexOf(f), SEAS.indexOf(t) + 1);

/* ---------- server ---------- */
async function call(payload, ms){
  if(!navigator.onLine) throw new Error('This needs internet.');
  const r = await api(payload, ms || 120000);
  if(r && r.error === 'BAD_LOGIN'){ signOut('Your username or password was changed. Sign in again.'); throw new Error('Sign in again.'); }
  if(r && !r.ok && r.error === 'UNKNOWN_ACTION') throw new Error('The server is not updated yet: deploy Code.gs v6.6 as a New version.');
  if(!r || !r.ok) throw new Error((r && r.error) || 'Server error');
  return r;
}
async function loadOpts(force){
  if(optsBusy || (!force && opts && Date.now() - optsAt < 600000)) return;
  if(!navigator.onLine){ if(!opts) optsFromSheets(); return; }
  optsBusy = true; optsErr = '';
  try{ const r = await call({ action:'reg_opts' }, 60000); opts = r.sections; optsAt = Date.now(); }
  catch(e){ optsErr = e.message; if(!opts) optsFromSheets(); }
  finally{ optsBusy = false; paint(); }
}
function optsFromSheets(){
  const m = {};
  sheets.forEach(e => { (m[e.cls] = m[e.cls] || new Set()).add(e.sub); });
  opts = Object.keys(m).sort((a, b) => a.localeCompare(b, undefined, { numeric:true })).map(c => ({ cls:c, subs:[...m[c]].sort() }));
}

/* ---------- card ---------- */
const fld = (l, inner, wide) => `<div class="fld ${wide ? 'wide' : ''}"><span>${l}</span>${inner}</div>`;
const seg = (name, cur, list) => `<div class="seg2" role="tablist">${list.map(x => `<button type="button" data-z${name}="${x[0]}" class="${cur === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div>`;
function cardHtml(){
  const secs = opts || [], mons = SEAS.slice(0, seasNow() + 1);
  if(!mons.includes(zr.from)) zr.from = mons[mons.length - 1];
  if(!mons.includes(zr.to)) zr.to = mons[mons.length - 1];
  if(SEAS.indexOf(zr.from) > SEAS.indexOf(zr.to)) zr.from = zr.to;
  const allOk = zr.kind === 'daily';                                   // "all sections" only for the daily register
  if(zr.cls === '*' && !allOk) zr.cls = '';
  if(zr.cls !== '*' && !secs.some(s => s.cls === zr.cls)) zr.cls = secs[0] ? secs[0].cls : '';
  const subs = zr.cls && zr.cls !== '*' ? (secs.find(s => s.cls === zr.cls) || { subs:[] }).subs
             : [...new Set(secs.flatMap(s => s.subs))].sort();
  if(zr.sub && !subs.includes(zr.sub)) zr.sub = '';
  if(zr.kind === 'cards') zr.who = 'sec';
  const desc = {
    daily:'Every date of the month with P / A / L / B, then Present, Held and %. One page per subject and month.',
    cards:'One page for every student of the section: each subject month by month (Present / Held / %) and the session total.',
    tests:'Monthly tests: Obtained / Total for each test, session %, and the class position.'
  }[zr.kind];
  let h = `<section class="card" id="zrCard"><h3>Registers &amp; results</h3>
    ${seg('k', zr.kind, [['daily', 'Daily register'], ['cards', 'Session register'], ['tests', 'Test results']])}
    <div class="sub">${desc}</div>`;
  if(zr.kind !== 'cards') h += seg('w', zr.who, [['sec', 'Section'], ['stu', 'One student']]);
  h += '<div class="form">';
  if(zr.who === 'sec'){
    h += fld('Section', `<select id="zrCls" aria-label="Section">${allOk ? `<option value="*" ${zr.cls === '*' ? 'selected' : ''}>${esc(allLabel())}</option>` : ''}${secs.map(s => `<option ${s.cls === zr.cls ? 'selected' : ''}>${esc(s.cls)}</option>`).join('')}</select>`);
    if(zr.kind !== 'cards') h += fld('Subject', `<select id="zrSub" aria-label="Subject"><option value="">All subjects</option>${subs.map(x => `<option value="${esc(x)}" ${x === zr.sub ? 'selected' : ''}>${esc(titleCase(x))}</option>`).join('')}</select>`);
  } else {
    h += fld('Student', zr.roll
      ? `<div class="pickd"><span class="av">${esc(initials(zr.name))}</span><span class="tx"><b>${esc(zr.name)}</b><small>${esc(zr.roll)} · ${esc(zr.scls)}</small></span><button type="button" class="btn small" id="zrClr">Change</button></div>`
      : `<input id="zrQ" class="sq" type="search" placeholder="Name, father name or roll no." autocomplete="off" autocapitalize="none" spellcheck="false"><div id="zrRes" class="zres">${resHtml()}</div>`, true);
  }
  const ms = o => `<select id="${o}" aria-label="${o === 'zrFrom' ? 'From month' : 'To month'}">${mons.map(t => `<option value="${t}" ${t === zr[o === 'zrFrom' ? 'from' : 'to']}>${monName(t)}</option>`).join('')}</select>`;
  h += `<div class="frow">${fld('From', ms('zrFrom'))}${fld('To', ms('zrTo'))}</div></div>`;
  if(zr.kind === 'daily' && zr.who === 'sec' && zr.cls === '*' && scope() && zr.from !== zr.to)

async function fetchDays(list, roll){
  const out = [], queue = [];
  for(let i = 0; i < list.length; i += CHUNK) queue.push(list.slice(i, i + CHUNK));
  let done = 0, skipped = [];
  while(queue.length){
    const part = queue.shift();
    setProg('Reading attendance sheets… ' + done + ' of ' + list.length, Math.round(done / list.length * 95));
    let r;
    try{ r = await call({ action:'reg_days', names:part.map(x => x.name), roll:roll || '' }, 180000); }
    catch(e){
      if(/Sign in|internet|not updated/i.test(e.message)) throw e;
      if(part.length > 1){ const h = Math.ceil(part.length / 2); queue.unshift(part.slice(0, h), part.slice(h)); continue; }
      skipped.push(part[0].name); done++; continue;
    }
    (r.sheets || []).forEach(x => { if(x.missing) skipped.push(x.name); else out.push(x); });
    done += part.length;
  }
  if(skipped.length) toast(skipped.length + ' sheet(s) could not be read and are left out.');
  return out;
}
const cellRe = /^(\d*)([PALB])$/;

function styleCell(h, v, C){
  if(/P$/.test(v)){ h.cell.styles.textColor = C.GREEN; h.cell.styles.fontStyle = 'bold'; }
  else if(/A$/.test(v)){ h.cell.styles.textColor = C.RED; h.cell.styles.fillColor = C.REDBG; h.cell.styles.fontStyle = 'bold'; }
  else if(/L$/.test(v)){ h.cell.styles.textColor = C.AMB; h.cell.styles.fillColor = C.AMBBG; h.cell.styles.fontStyle = 'bold'; }
  else if(/B$/.test(v)){ h.cell.styles.textColor = C.PUR; h.cell.styles.fillColor = C.PURBG; h.cell.styles.fontStyle = 'bold'; }
}

async function buildDaily(){

  const list = plan.sheets || [];
  if(!list.length) throw new Error('No attendance sheets found for this choice.');
  if(list.length > 120 && !confirm(list.length + ' attendance sheets will be put in one PDF. This can take several minutes. Continue?')) throw new Error('Cancelled.');
  const got = await fetchDays(list, stu ? zr.roll : '');
  if(!got.length) throw new Error('No attendance could be read.');
  setProg('Making the PDF…', 97);
  await new Promise(res => setTimeout(res, 30));
  const doc = P.newDoc('landscape'); let Y = P.TOP;

  const what = stu ? zr.name + '_' + zr.roll : zr.cls === '*' ? allLabel() : zr.cls + (zr.sub ? '_' + titleCase(zr.sub) : '_All-subjects');

function model(rows){

  rows.forEach(r => (r.st || []).forEach(x => {
    const s = S[x[0]] = S[x[0]] || { roll:x[0], name:x[1], cls:r.cls, guest:'', subs:{} };
    if(x[6]) s.guest = x[6];

    g.months[r.mon] = { p:Number(x[2]) || 0, d:Number(x[3]) || 0, mt:x[4], mtT:Number(r.mt) || 0, off:!!x[5] };
  }));
  Object.values(S).forEach(s => Object.values(s.subs).forEach(g => {
    const ms = Object.keys(g.months).sort((a, b) => SEAS.indexOf(b) - SEAS.indexOf(a));
    g.off = !!(ms[0] && g.months[ms[0]].off);
    let p = 0, d = 0, o = 0, t = 0, n = 0;

    Object.assign(g, { p, d, pct:pct1(p, d), o, t, n, tp:t ? pct1(o, t) : null });
  }));

  const body = subs.map(g => [titleCase(g.sub) + (g.off ? ' (left)' : ''), g.teacher || ''].concat(
    mons.flatMap(t => { const m = g.months[t]; return !m ? ['-', ''] : m.off ? ['left', ''] : [m.p + ' / ' + m.d, m.d ? pct1(m.p, m.d) : '-']; }),
    g.off ? ['', '', 'Left subject'] : [g.p + ' / ' + g.d, g.pct == null ? '-' : g.pct, g.pct == null ? '' : g.pct < LOW ? 'SHORTAGE' : 'OK']));
  body.push(['Overall', ''].concat(mons.flatMap(t => { let p = 0, d = 0; live.forEach(g => { const m = g.months[t]; if(m && !m.off){ p += m.p; d += m.d; } }); return d ? [p + ' / ' + d, pct1(p, d)] : ['-', '']; }),
    [gP + ' / ' + gD, gp == null ? '-' : gp, short ? short + ' short' : 'OK']));
  const pctCols = new Set(); mons.forEach((_, i) => pctCols.add(3 + i * 2)); pctCols.add(3 + mons.length * 2);
  P.table(doc, { startY:Y, margin:{ top:P.TOP, left:10, right:10, bottom:16 },
    styles:{ font:'helvetica', fontSize:8, cellPadding:1.4, lineColor:C.LINE, lineWidth:0.15, textColor:C.INK, valign:'middle', halign:'center' },
    head, body, columnStyles:{ 0:{ halign:'left', fontStyle:'bold', cellWidth:38 }, 1:{ halign:'left', cellWidth:36 } },
    didParseCell:h => {
      if(h.section !== 'body') return;
      const v = String(h.cell.raw == null ? '' : h.cell.raw), last = h.row.index === body.length - 1;
      if(last){ h.cell.styles.fontStyle = 'bold'; h.cell.styles.fillColor = [234, 238, 246]; }
      if(pctCols.has(h.column.index) && v !== '' && v !== '-' && Number(v) < LOW){ h.cell.styles.textColor = C.RED; h.cell.styles.fillColor = C.REDBG; h.cell.styles.fontStyle = 'bold'; }
      if(/SHORTAGE|short$/.test(v)){ h.cell.styles.textColor = C.RED; h.cell.styles.fontStyle = 'bold'; }
      if(v === 'OK') h.cell.styles.textColor = C.GREEN;
      if(v === 'left'){ h.cell.styles.textColor = [150, 156, 168]; h.cell.styles.fontStyle = 'italic'; }
    } });
  Y = doc.lastAutoTable.finalY + 3;
  Y = P.smallNote(doc, Y, 'Present = lectures attended, Held = lectures delivered (for a guest: lectures in which she was marked). Only P counts as attended. Minimum required: ' + LOW + '%.' + (scope() ? '' : ' Only the subjects taught by ' + (teacher || user) + ' are included.'));
  P.signatures(doc, Y, ['Class In-charge', 'HOD', 'Principal']);
}
async function buildCards(){
  setProg('Reading the section…', 20);
  const q = { from:zr.from, to:zr.to, cls:zr.cls };
  const S = sortStu(model(await reportRows(q)));
  if(!S.length) throw new Error('No students found for this section.');
  setProg('Making ' + S.length + ' pages…', 80);
  await new Promise(res => setTimeout(res, 30));
  const doc = P.newDoc('landscape'), mons = monthsIn(zr.from, zr.to);
  S.forEach((s, i) => studentSessionPage(doc, s, mons, i === 0, q));
  P.finalize(doc);
  return { doc, title:'Session registers ' + zr.cls, file:'Session-registers_' + P.safe(zr.cls) + '_' + zr.from + '-' + zr.to + '.pdf' };
}

/* ======================= 3) TEST RESULTS ======================= */
const mtTxt = m => !m || m.off || m.mt === '' || m.mt == null || !m.mtT ? '' : m.mt === 'A' ? 'Absent' : m.mt + ' / ' + m.mtT;
const mtPct = m => !m || m.off || m.mt === '' || m.mt == null || !m.mtT ? null : m.mt === 'A' ? 0 : pct1(Number(m.mt) || 0, m.mtT);
/** grand obtained / total of a student over the given subjects */
function grand(s, subs){ let o = 0, t = 0; subs.forEach(x => { const g = s.subs[x]; if(g && !g.off && g.t){ o += g.o; t += g.t; } }); return { o, t, p:t ? pct1(o, t) : null }; }
const testLegend = 'Obtained / Total for each monthly test. Session % = all marks obtained ÷ all total marks of the chosen months (a test marked Absent counts as 0). Red = below ' + TEST_LOW + '% or absent. Tests not entered are left out.';

function subjectResultPage(doc, list, sub, mons, q, first){
  const C = P.C, rk = ranks(list.map(s => ({ k:s.roll, v:s.subs[sub] && !s.subs[sub].off ? s.subs[sub].tp : null })));
  const g0 = list.find(s => s.subs[sub]), teacherName = g0 ? g0.subs[sub].teacher : '';
  if(!first) doc.addPage();
  let Y = P.heading(doc, P.TOP, 'Monthly Test Result  ·  ' + q.cls + '  ·  ' + titleCase(sub), 'Teacher: ' + (teacherName || '-') + '  ·  ' + rangeTxt(q.from, q.to));
  const head = [[{ content:'#', rowSpan:2 }, { content:'Roll No', rowSpan:2 }, { content:'Student Name', rowSpan:2 }].concat(mons.map(t => ({ content:monName(t) + ' test', colSpan:2 })),
    [{ content:'SESSION', colSpan:2 }, { content:'Position', rowSpan:2 }]), mons.flatMap(() => ['Obtained / Total', '%']).concat(['Obtained / Total', '%'])];
  const rows = list.filter(s => s.subs[sub]);
  const body = rows.map((s, i) => { const g = s.subs[sub];
    return [i + 1, s.roll, s.name + (g.off ? ' (left)' : '')].concat(mons.flatMap(t => { const m = g.months[t], p = mtPct(m); return [mtTxt(m) || '-', p == null ? '' : p]; }),
      g.off || !g.t ? ['-', '', ''] : [g.o + ' / ' + g.t, g.tp, rk.pos[s.roll] || '']); });
  const pctCols = new Set(); mons.forEach((_, i) => pctCols.add(4 + i * 2)); pctCols.add(4 + mons.length * 2);
  P.table(doc, { startY:Y, margin:{ top:P.TOP, left:10, right:10, bottom:16 },
    styles:{ font:'helvetica', fontSize:7.6, cellPadding:1.1, lineColor:C.LINE, lineWidth:0.15, textColor:C.INK, valign:'middle', halign:'center' },
    head, body, columnStyles:{ 0:{ cellWidth:8 }, 1:{ cellWidth:24, halign:'left' }, 2:{ cellWidth:44, halign:'left' } },
    didParseCell:h => { if(h.section !== 'body') return; const v = String(h.cell.raw == null ? '' : h.cell.raw);
      if(v === 'Absent' || (pctCols.has(h.column.index) && v !== '' && Number(v) < TEST_LOW)){ h.cell.styles.textColor = C.RED; h.cell.styles.fillColor = C.REDBG; h.cell.styles.fontStyle = 'bold'; }
      if(h.column.index === 5 + mons.length * 2 && v){ h.cell.styles.fontStyle = 'bold'; if(Number(v) <= 3){ h.cell.styles.fillColor = C.GREENBG; h.cell.styles.textColor = C.GREEN; } } } });
  Y = doc.lastAutoTable.finalY + 3;
  const ok = rows.filter(s => s.subs[sub].t && !s.subs[sub].off), low = ok.filter(s => s.subs[sub].tp < TEST_LOW).length;
  Y = P.smallNote(doc, Y, 'Students with marks: ' + ok.length + '  ·  Below ' + TEST_LOW + '%: ' + low + '.  ' + testLegend);
  P.signatures(doc, Y, ['Subject Teacher', 'HOD', 'Principal']);
}
function summaryResultPage(doc, list, subs, q){
  const C = P.C, rk = ranks(list.map(s => ({ k:s.roll, v:grand(s, subs).p })));
  let Y = P.heading(doc, P.TOP, 'Monthly Test Result Summary  ·  ' + q.cls, (scope() ? 'All subjects' : 'Subjects taught by ' + (teacher || user)) + '  ·  ' + rangeTxt(q.from, q.to));
  const head = [['#', 'Roll No', 'Student Name'].concat(subs.map(x => titleCase(x).split(' ').map(w => w.length > 8 ? w.slice(0, 6) + '.' : w).join(' ') + '\n%'), ['Obtained', 'Total', '%', 'Position'])];
  const body = list.map((s, i) => { const G = grand(s, subs);
    return [i + 1, s.roll, s.name].concat(subs.map(x => { const g = s.subs[x]; return !g ? '—' : g.off ? 'left' : g.tp == null ? '' : g.tp; }),
      G.t ? [G.o, G.t, G.p, rk.pos[s.roll] || ''] : ['', '', '', '']); });
  const n = subs.length;
  P.table(doc, { startY:Y, margin:{ top:P.TOP, left:10, right:10, bottom:16 },
    styles:{ font:'helvetica', fontSize:7.2, cellPadding:1, lineColor:C.LINE, lineWidth:0.15, textColor:C.INK, valign:'middle', halign:'center' },
    headStyles:{ fillColor:C.NAVY, textColor:[255, 255, 255], fontStyle:'bold', halign:'center', valign:'middle', fontSize:6.6 },
    head, body, columnStyles:{ 0:{ cellWidth:7 }, 1:{ cellWidth:23, halign:'left' }, 2:{ cellWidth:42, halign:'left' } },
    didParseCell:h => { if(h.section !== 'body') return; const c = h.column.index, v = String(h.cell.raw == null ? '' : h.cell.raw);
      if(((c >= 3 && c < 3 + n) || c === 5 + n) && v !== '' && !isNaN(Number(v)) && Number(v) < TEST_LOW){ h.cell.styles.textColor = C.RED; h.cell.styles.fillColor = C.REDBG; h.cell.styles.fontStyle = 'bold'; }
      if(c === 6 + n && v){ h.cell.styles.fontStyle = 'bold'; if(Number(v) <= 3){ h.cell.styles.fillColor = C.GREENBG; h.cell.styles.textColor = C.GREEN; } }
      if(v === 'left'){ h.cell.styles.textColor = [150, 156, 168]; h.cell.styles.fontStyle = 'italic'; } } });
  Y = doc.lastAutoTable.finalY + 3;
  Y = P.smallNote(doc, Y, 'Subject % = session test % in that subject. Position = by overall % of the subjects shown. — = subject not taken. ' + testLegend);
  P.signatures(doc, Y, ['Class In-charge', 'HOD', 'Principal']);
}
function studentResultPage(doc, s, mons, q, first, place){
  const C = P.C, subs = Object.keys(s.subs).sort(), G = grand(s, subs);
  if(!first) doc.addPage();
  let Y = P.heading(doc, P.TOP, 'Student Monthly Test Report', s.name + '  ·  ' + s.roll + '  ·  ' + s.cls + '  ·  ' + rangeTxt(q.from, q.to));
  Y = P.statBoxes(doc, Y, [
    { l:'Overall test %', v:G.p == null ? '-' : G.p + '%', c:G.p != null && G.p < TEST_LOW ? C.RED : C.GREEN, bg:G.p != null && G.p < TEST_LOW ? C.REDBG : C.GREENBG },
    { l:'Obtained / Total', v:G.t ? G.o + ' / ' + G.t : '-' },
    { l:'Class position', v:place ? place.pos + ' of ' + place.of : '-' }]) + 3;
  const head = [[{ content:'Subject', rowSpan:2 }, { content:'Teacher', rowSpan:2 }].concat(mons.map(t => ({ content:monName(t) + ' test', colSpan:2 })), [{ content:'SESSION', colSpan:2 }]),
    mons.flatMap(() => ['Obtained / Total', '%']).concat(['Obtained / Total', '%'])];
  const body = subs.map(x => { const g = s.subs[x];
    return [titleCase(x) + (g.off ? ' (left)' : ''), g.teacher || ''].concat(mons.flatMap(t => { const m = g.months[t], p = mtPct(m); return [mtTxt(m) || '-', p == null ? '' : p]; }),
      g.off || !g.t ? ['-', ''] : [g.o + ' / ' + g.t, g.tp]); });
  body.push(['Overall', ''].concat(mons.flatMap(t => { let o = 0, tt = 0; subs.forEach(x => { const g = s.subs[x], m = g.months[t]; if(g.off || !m || m.off || !m.mtT || m.mt === '' || m.mt == null) return; tt += m.mtT; if(m.mt !== 'A') o += Number(m.mt) || 0; }); return tt ? [o + ' / ' + tt, pct1(o, tt)] : ['-', '']; }),
    G.t ? [G.o + ' / ' + G.t, G.p] : ['-', '']));
  const pctCols = new Set(); mons.forEach((_, i) => pctCols.add(3 + i * 2)); pctCols.add(3 + mons.length * 2);
  P.table(doc, { startY:Y, margin:{ top:P.TOP, left:10, right:10, bottom:16 },
    styles:{ font:'helvetica', fontSize:8, cellPadding:1.4, lineColor:C.LINE, lineWidth:0.15, textColor:C.INK, valign:'middle', halign:'center' },
    head, body, columnStyles:{ 0:{ halign:'left', fontStyle:'bold', cellWidth:38 }, 1:{ halign:'left', cellWidth:36 } },
    didParseCell:h => { if(h.section !== 'body') return; const v = String(h.cell.raw == null ? '' : h.cell.raw);
      if(h.row.index === body.length - 1){ h.cell.styles.fontStyle = 'bold'; h.cell.styles.fillColor = [234, 238, 246]; }
      if(v === 'Absent' || (pctCols.has(h.column.index) && v !== '' && v !== '-' && Number(v) < TEST_LOW)){ h.cell.styles.textColor = C.RED; h.cell.styles.fillColor = C.REDBG; h.cell.styles.fontStyle = 'bold'; } } });
  Y = doc.lastAutoTable.finalY + 3;
  Y = P.smallNote(doc, Y, testLegend + (place ? ' Position = among the students of ' + s.cls + ', by overall % of ' + (scope() ? 'the subjects of that section.' : 'the subjects shown.') : '') + (scope() ? '' : ' Only the subjects taught by ' + (teacher || user) + ' are included.'));
  P.signatures(doc, Y, ['Class In-charge', 'HOD', 'Principal']);
}
async function buildTests(everyStudent){
  const mons = monthsIn(zr.from, zr.to), doc = P.newDoc('landscape');
  if(zr.who === 'stu'){
    setProg('Reading the student’s tests…', 20);
    const mine = model(await reportRows({ from:zr.from, to:zr.to, roll:zr.roll }))[zr.roll];
    if(!mine) throw new Error('No monthly test data found for this student.');
    setProg('Working out the class position…', 55);
    let place = null;
    try{
      const S = model(await reportRows({ from:zr.from, to:zr.to, cls:mine.cls })), subs = [...new Set(Object.values(S).flatMap(s => Object.keys(s.subs)))];
      const rk = ranks(Object.values(S).map(s => ({ k:s.roll, v:grand(s, subs).p })));
      if(rk.pos[zr.roll]) place = { pos:rk.pos[zr.roll], of:rk.of };
    }catch(e){}
    studentResultPage(doc, mine, mons, { from:zr.from, to:zr.to }, true, place);
    P.finalize(doc);
    return { doc, title:'Test report ' + zr.name, file:'Test-report_' + P.safe(zr.name) + '_' + P.safe(zr.roll) + '_' + zr.from + '-' + zr.to + '.pdf' };
  }
  setProg('Reading the section’s tests…', 20);
  const q = { from:zr.from, to:zr.to, cls:zr.cls };
  const S = sortStu(model(await reportRows(q)));
  if(!S.length) throw new Error('No students found for this section.');
  const subsAll = [...new Set(S.flatMap(s => Object.keys(s.subs)))].sort();
  if(!subsAll.some(x => S.some(s => s.subs[x] && s.subs[x].t))) throw new Error('No monthly test marks are entered for this section in the chosen months.');
  setProg('Making the PDF…', 80);
  await new Promise(res => setTimeout(res, 30));
  if(everyStudent){
    const rk = ranks(S.map(s => ({ k:s.roll, v:grand(s, subsAll).p })));
    S.forEach((s, i) => studentResultPage(doc, s, mons, q, i === 0, rk.pos[s.roll] ? { pos:rk.pos[s.roll], of:rk.of } : null));
    P.finalize(doc);
    return { doc, title:'Test result cards ' + zr.cls, file:'Test-cards_' + P.safe(zr.cls) + '_' + zr.from + '-' + zr.to + '.pdf' };
  }
  if(zr.sub){
    if(!subsAll.includes(zr.sub)) throw new Error('No test data for ' + titleCase(zr.sub) + ' in this section.');
    subjectResultPage(doc, S, zr.sub, mons, q, true);
  } else {
    summaryResultPage(doc, S, subsAll, q);
    subsAll.forEach(x => subjectResultPage(doc, S, x, mons, q, false));
  }
  P.finalize(doc);
  return { doc, title:'Test result ' + zr.cls, file:'Test-result_' + P.safe(zr.cls) + '_' + (zr.sub ? P.safe(titleCase(zr.sub)) : 'All-subjects') + '_' + zr.from + '-' + zr.to + '.pdf' };
}

if(document.body.dataset.screen === 'reports'){ paint(); loadOpts(false); }
})();
