let sel = { cls:store.get('cls', ''), sub:store.get('sub', ''), mon:store.get('mon', ''), day:0 };
let draft = {}, searchQ = '', filterQ = 'all', lowInfo = '', lastError = '';
let dirty = false, syncing = false, refreshing = false, prefetching = false, syncPromise = null, rSyncing = false;
let compact = false;   // control panel folded into a one-line bar while scrolling
const tried = {}, loading = new Set(), sheetErr = {}, fresh = {};
const authed = () => !!(user && pass);

/* ---------- background sync: lets the service worker send the queue even when the app is closed ---------- */
function bgDb(){ return new Promise((res, rej) => { const r = indexedDB.open('csa_bg', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function bgSet(k, v){ const db = await bgDb(); return new Promise((res, rej) => {
  const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function bgGet(k){ const db = await bgDb(); return new Promise((res, rej) => {
  const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function registerBgSync(){
  try{ if(!('serviceWorker' in navigator)) return; const reg = await navigator.serviceWorker.ready; if(reg.sync) await reg.sync.register('csa-sync'); }catch(e){}
}
async function mirrorBg(){
  try{
    const labels = {}; queue.forEach(q => { try{ const i = recInfo(q); labels[q.id] = i.who + ' \u00b7 ' + i.what; }catch(e){} });   // readable names for the background notification
    await bgSet('job', { api:API, user, pass, queue:JSON.parse(JSON.stringify(queue)), labels });
    if(queue.length && user && pass) registerBgSync();
  }catch(e){}
}
/** Picks up records the service worker already sent while the app was closed. */
async function absorbBg(){
  try{
    const done = await bgGet('done'); if(!done || !done.length) return;
    await bgSet('done', []);
    const lines = [];
    done.forEach(d => { lines.push(...savedLines(d.batch, d.res)); applySaved(d.batch, d.res); });
    if(authed()){ if(!dirty) loadDraft(); renderMain(); toast(lines.length ? joinLines(lines) : 'Attendance was synced in the background'); }
  }catch(e){}
}
const greet = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };
const ic = p => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC = {
  cal: ic('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>'),
  note: ic('<path d="M4 4h16v11l-5 5H4z"/><path d="M15 20v-5h5"/><path d="M8 9h8M8 13h4"/>'),

  down: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
};

/* ---------- helpers: class / subject / month / day ---------- */
const uniq = a => [...new Set(a)];
const titleCase = s => String(s).toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
const monIdx = t => MONTHS.findIndex(m => m.slice(0, 3).toUpperCase() === String(t).slice(0, 3).toUpperCase());
const monLabel = t => { const i = monIdx(t); return i >= 0 ? MONTHS[i].slice(0, 3) : t; };
const classes = () => uniq(sheets.map(s => s.cls));
const subjects = c => uniq(sheets.filter(s => s.cls === c).map(s => s.sub));
const monthsOf = (c, s) => uniq(sheets.filter(x => x.cls === c && x.sub === s).map(x => x.mon));
const entry = () => sheets.find(s => s.cls === sel.cls && s.sub === sel.sub && s.mon === sel.mon);
const sheetName = () => { const e = entry(); return e ? e.name : ''; };
const bestMonth = (list, want) => list.includes(want) ? want : (list.find(t => monIdx(t) === new Date().getMonth()) || list[list.length - 1] || '');
function ensureSel(){
  if(!sheets.length || entry()) return;
  const cl = classes(); if(!cl.includes(sel.cls)) sel.cls = cl[0];
  const sb = subjects(sel.cls); if(!sb.includes(sel.sub)) sel.sub = sb[0];
  sel.mon = bestMonth(monthsOf(sel.cls, sel.sub), sel.mon); initDay();
}
function choose(kind, v){
  searchQ = ''; filterQ = 'all';
  if(kind === 'cls'){ sel.cls = v; const sb = subjects(v); if(!sb.includes(sel.sub)) sel.sub = sb[0]; sel.mon = bestMonth(monthsOf(sel.cls, sel.sub), sel.mon); }
  else if(kind === 'sub'){ sel.sub = v; sel.mon = bestMonth(monthsOf(sel.cls, v), sel.mon); }
  else sel.mon = v;
  store.set('cls', sel.cls); store.set('sub', sel.sub); store.set('mon', sel.mon); initDay();
}
function monthYear(){
  const d = data[sheetName()];
  if(d && d.m != null && d.y) return { m:d.m, y:d.y };
  const e = entry(), now = new Date(); let m = e ? monIdx(e.mon) : -1; if(m < 0) m = now.getMonth();
  const start = (now.getMonth() > 7 || (now.getMonth() === 7 && now.getDate() >= 15)) ? now.getFullYear() : now.getFullYear() - 1;
  return { m, y: m >= 7 ? start : start + 1 };
}
function dayInfo(){
  const { m, y } = monthYear(), n = new Date(y, m + 1, 0).getDate(), d = data[sheetName()];
  const srv = d && d.days && d.days.length >= 25 ? d.days : null;
  const avail = Array.from({ length:n }, (_, i) => i + 1).filter(x => (!srv || srv.includes(x)) && new Date(y, m, x).getDay() !== 0);
  const now = new Date();
  return { m, y, n, avail, isCur: now.getMonth() === m && now.getFullYear() === y, today: now.getDate() };
}
function initDay(){ const { isCur, today, avail } = dayInfo(); sel.day = isCur && avail.includes(today) ? today : (avail[0] || 1); }
function fixDay(){ const { avail } = dayInfo(); if(!sel.day || !avail.includes(sel.day)) initDay(); }
const queued = day => { const n = sheetName(); return queue.find(q => q.sheet === n && q.day === day); };
function noteFor(day){
  const q = queued(day); if(q && q.note !== undefined) return q.note;
  const d = data[sheetName()]; return (d && d.notes && d.notes[day]) || '';
}
function hasData(day){
  const d = data[sheetName()], q = queued(day);
  return !!((d && d.marks && d.marks[day] && Object.keys(d.marks[day]).length) || (q && Object.keys(q.marks).length));
}
function firstDataDay(n){ for(let i = 1; i <= n; i++) if(hasData(i)) return i; return 0; }
function isMissed(day, fd, info){
  if(!fd || day <= fd || !info.avail.includes(day) || hasData(day) || noteFor(day)) return false;
  const t = new Date(); t.setHours(0, 0, 0, 0); return new Date(info.y, info.m, day) < t;
}
function loadDraft(){
  draft = {}; dirty = false; const d = data[sheetName()]; if(!d) return;
  Object.assign(draft, (d.marks && d.marks[sel.day]) || {});
  const q = queued(sel.day);
  if(q) Object.keys(q.marks).forEach(r => { if(q.marks[r] === '') delete draft[r]; else draft[r] = q.marks[r]; });
}
function counts(){
  const d = data[sheetName()]; let p = 0, a = 0, l = 0, b = 0, n = 0;
  (d ? d.students : []).forEach(s => { const v = draft[s.roll]; if(v === 'P') p++; else if(v === 'A') a++; else if(v === 'L') l++; else if(v === 'B') b++; else n++; });
  return { p, a, l, b, n, total: p + a + l + b + n };
}

/* ---------- network ---------- */
function errText(e){
  if(!e) return 'Unknown error';
  if(e.name === 'AbortError') return 'The server took too long to answer. It will retry.';
  if(e instanceof TypeError) return 'Could not reach the server (network blocked or wrong API_URL).';
  return e.message || String(e);
}
async function api(payload, ms = 45000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(API, { method:'POST', body:JSON.stringify({ username:user, password:pass, ...payload }), signal:ctl.signal, redirect:'follow' });
    const txt = await r.text();
    try{ return JSON.parse(txt); }
    catch(e){ throw new Error('Server sent a web page instead of data. Deploy the Apps Script as "Anyone" and check API_URL.'); }
  } finally { clearTimeout(t); }
}
async function loadSheet(e, create){
  loading.add(e.name);
  try{
    const d = await api({ action:'sheet', sheet:e.name, create:!!create }, 90000);
    if(d.ok && d.missing) delete data[e.name];
    else if(d.ok){ data[e.name] = { title:d.title, m:d.m, y:d.y, days:d.days, students:d.students, marks:d.marks, notes:d.notes || {}, mt:d.mt || { total:0, marks:{} } }; delete sheetErr[e.name]; }
    else if(d.error === 'BAD_LOGIN'){ signOut('Your username or password was changed. Sign in again.'); return false; }
    else throw new Error(d.error || 'Could not load the sheet');
    fresh[e.name] = Date.now(); store.set('data', data); return true;
  } finally { loading.delete(e.name); }
}
const isCurMonth = e => monIdx(e.mon) === new Date().getMonth();
async function refreshAll(){
  if(!authed() || refreshing || prefetching) return;
  refreshing = true; updateStatus(); let rest = [];
  try{
    const s = await api({ action:'sheets' });
    if(!s.ok){ if(s.error === 'BAD_LOGIN') return signOut('Your username or password was changed. Sign in again.'); throw new Error(s.error); }
    sheets = s.sheets; teacher = s.teacher || teacher; isAdmin = !!s.admin;
    store.set('sheets', sheets); store.set('teacher', teacher); store.set('admin', isAdmin);
    ensureSel(); const cur = entry();
    if(cur){ try{ await loadSheet(cur, true); }catch(err){ sheetErr[cur.name] = errText(err); } if(!dirty){ fixDay(); loadDraft(); } }
    rest = sheets.filter(x => x !== cur);
    if(!dirty){ ensureSel(); fixDay(); loadDraft(); if(mode === 'mt') loadMtDraft(); render(); }
  }catch(e){ lastError = errText(e); }
  finally{ refreshing = false; updateStatus(); }
  if(!rest.length || !authed()) return;
  prefetching = true;
  try{
    for(const e of rest){
      if(!authed()) break;
      if(queue.length && !syncing) await syncQueue();
      if(fresh[e.name] && Date.now() - fresh[e.name] < 120000) continue;
      try{ await loadSheet(e, isCurMonth(e)); }catch(err){ sheetErr[e.name] = errText(err); }
    }
  } finally { prefetching = false; }
}

/* ---------- readable notification text (class, subject, day, counts) ---------- */
function recInfo(b){
  const e = sheets.find(s => s.name === b.sheet);
  const who = e ? e.cls + ' ' + titleCase(e.sub) : b.sheet;
  const mon = e ? monLabel(e.mon) : '';
  let what;
  if(b.kind === 'mt') what = 'Monthly test';
  else if(!Object.keys(b.marks || {}).length && b.note !== undefined) what = 'Note for ' + b.day + ' ' + mon;
  else what = 'Attendance ' + b.day + ' ' + mon;
  return { who, what };
}
function savedLines(batch, res){
  return (res.saved || []).map(id => {
    const b = batch.find(x => x.id === id); if(!b) return null;
    const { who, what } = recInfo(b), c = res.confirmed && res.confirmed[id]; let d = '';
    if(b.kind === 'mt') d = c && c.total ? ' (out of ' + c.total + ')' : '';
    else if(c && c.p != null) d = ' (P ' + c.p + ', A ' + c.a + (c.l ? ', L ' + c.l : '') + (c.b ? ', B ' + c.b : '') + ')';
    return '\u2713 ' + who + ' \u00b7 ' + what + ' reached the sheet' + d;
  }).filter(Boolean);
}
const joinLines = l => l.slice(0, 4).join('\n') + (l.length > 4 ? '\n+' + (l.length - 4) + ' more' : '');

/* ---------- saving to the sheet ---------- */
function applySaved(batch, res){
  const saved = res.saved || [];
  saved.forEach(id => {
    const b = batch.find(x => x.id === id);
    if(b && b.kind === 'mt'){ if(data[b.sheet]) data[b.sheet].mt = { total:b.total, marks:Object.assign({}, b.marks) }; }
    else if(b && data[b.sheet]){
      const D = data[b.sheet], m = D.marks = D.marks || {}, day = Object.assign({}, m[b.day]);
      Object.keys(b.marks).forEach(r => { if(b.marks[r] === '') delete day[r]; else day[r] = b.marks[r]; });
      if(Object.keys(day).length) m[b.day] = day; else delete m[b.day];
      if(b.note !== undefined){ D.notes = D.notes || {}; if(b.note) D.notes[b.day] = b.note; else delete D.notes[b.day]; }
    }
    if(res.confirmed && res.confirmed[id]) confirms[id] = res.confirmed[id];
  });
  queue = queue.filter(x => { const b = batch.find(y => y.id === x.id); return !(saved.includes(x.id) && b && b.ts === x.ts); });
  (res.failed || []).forEach(f => { const x = queue.find(q => q.id === f.id); if(x) x.error = f.error; });
  lastSync = Date.now(); store.set('lastSync', lastSync); store.set('queue', queue); store.set('data', data); store.set('confirms', confirms);
}
function syncQueue(){
  if(syncPromise) return syncPromise;
  if(!queue.length || !authed()) return Promise.resolve(false);
  syncPromise = doSync().finally(() => { syncPromise = null; }); return syncPromise;
}
async function doSync(){
  syncing = true; updateStatus(); let ok = false;
  try{
    const batch = queue.map(q => ({ ...q })), res = await api({ action:'save', records:batch }, 90000);
    if(res.ok){
      const lines = savedLines(batch, res); applySaved(batch, res);
      const f = res.failed && res.failed[0];
      if(f){ const fb = batch.find(x => x.id === f.id), fi = fb ? recInfo(fb) : null; lastError = (fi ? fi.who + ' \u00b7 ' + fi.what + ': ' : '') + f.error; }
      else lastError = '';
      ok = !lastError;
      if(lines.length) toast(joinLines(lines));
      else if(f) toast('\u2717 Not saved. ' + lastError);
    } else if(res.error === 'BAD_LOGIN') signOut('Your username or password was changed. Sign in again.');
    else lastError = res.error || 'The server refused the save.';
  }catch(e){ lastError = errText(e); }
  finally{ syncing = false; updateStatus(); if(authed() && sheetName() && !dirty) loadDraft(); }
  if(ok && queue.length) setTimeout(syncQueue, 300);
  return ok;
}

/* ---------- student remarks (tags + comments), synced to the sheet ---------- */
const rk = roll => user + '|' + sel.cls + '|' + roll;
const getR = roll => remarks[rk(roll)] || { tags:[], log:[] };
function saveR(roll, R){
  R.u = Date.now(); remarks[rk(roll)] = R; store.set('remarks', remarks);
  const st = ((data[sheetName()] || {}).students || []).find(x => x.roll === roll);
  rDirty[sel.cls + '|' + roll] = st ? st.name : ''; store.set('rdirty', rDirty); syncRemarks();
}
function tagHtml(roll){
  const R = remarks[rk(roll)]; if(!R) return '';
  return R.tags.slice(0, 2).map(t => `<span class="rtag ${t === 'Excellent' ? 'good' : ''}">${esc(t)}</span>`).join('') +
    (R.log.length ? `<span class="rtag cm">\u{1F4AC} ${R.log.length}</span>` : '');
}
async function syncRemarks(){
  if(!authed() || !navigator.onLine || rSyncing) return;
  rSyncing = true;
  try{
    const keys = Object.keys(rDirty);
    if(keys.length){
      const recs = keys.map(k => { const i = k.indexOf('|'), R = remarks[user + '|' + k] || { tags:[], log:[] };
        return { cls:k.slice(0, i), roll:k.slice(i + 1), name:rDirty[k], tags:R.tags, log:R.log, u:R.u || Date.now() }; });
      const r = await api({ action:'remarks_save', records:recs });
      if(r.ok){ (r.saved || []).concat(r.skipped || []).forEach(k => delete rDirty[k]); store.set('rdirty', rDirty); }
    }
    const g = await api({ action:'remarks_get' });
    if(g.ok){
      let changed = false;
      Object.keys(g.remarks).forEach(k => { const lk = user + '|' + k, mine = remarks[lk];
        if(!mine || (mine.u || 0) < g.remarks[k].u){ remarks[lk] = g.remarks[k]; changed = true; } });
      store.set('remarks', remarks); if(changed && authed()) renderMain();
    }
  }catch(e){} finally{ rSyncing = false; }
}
function openStudent(roll, keep){
  const d = data[sheetName()]; if(!d) return;
  const s = d.students.find(x => x.roll === roll); if(!s) return;
  const S = stats(), c = S.per[roll] || { p:0, a:0 }, p = pctOf(c, S.lect), R = getR(roll), dlg = $('#dlg');
  const mt = d.mt && d.mt.marks ? d.mt.marks[roll] : null;
  $('#dlgBody').innerHTML = `
    <h2>${esc(s.name)}</h2><div class="meta">Roll ${esc(roll)} \u00b7 ${esc(sel.cls)} \u00b7 ${esc(titleCase(sel.sub))}</div>
    <div class="stats"><div><b>${p == null ? '-' : p + '%'}</b><small>Attendance</small></div><div><b>${c.p}</b><small>Present</small></div><div><b>${c.a}</b><small>Absent</small></div>
      <div><b>${mt == null ? '-' : mt === 'A' ? 'Abs' : mt + '/' + d.mt.total}</b><small>Test</small></div></div>
    <div class="chips">${TAGS.map(t => `<button class="chip ${R.tags.includes(t) ? 'on' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <textarea id="rkTxt" maxlength="400" placeholder="Add a comment, e.g. bunking the last lecture often...">${esc(keep || '')}</textarea>
    <div class="acts"><button class="btn small primary grow" id="rkAdd">Add comment</button><button class="btn small grow" id="closeDlg">Close</button></div>
    ${R.log.slice().reverse().map((e, i) => `<div class="lg2"><div>${esc(e.txt)}<small>${new Date(e.t).toLocaleDateString([], { day:'numeric', month:'short', year:'numeric' })}</small></div><button data-del="${R.log.length - 1 - i}">Delete</button></div>`).join('')}`;
  if(!dlg.open) dlg.showModal();
  $('#closeDlg').onclick = () => dlg.close();
  dlg.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => {
    const kt = $('#rkTxt').value, i = R.tags.indexOf(b.dataset.tag);
    if(i >= 0) R.tags.splice(i, 1); else R.tags.push(b.dataset.tag);
    saveR(roll, R); renderMain(); openStudent(roll, kt);
  });
  $('#rkAdd').onclick = () => {
    const txt = $('#rkTxt').value.trim(); if(!txt) return toast('Type a comment first.');
    R.log.push({ t:Date.now(), txt }); saveR(roll, R); renderMain(); openStudent(roll);
  };
  dlg.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    R.log.splice(Number(b.dataset.del), 1); saveR(roll, R); renderMain(); openStudent(roll, $('#rkTxt').value);
  });
}

/* ---------- login ---------- */
const render = () => authed() ? renderMain() : renderLogin();
function renderLogin(msg){
  compact = false; $('#app').classList.remove('phid', 'compact');
  $('#app').innerHTML = `<div class="login"><h1>JCW Daily Attendance</h1>
    <p>Sign in once while you have internet, with the same username and password as the portal. After that the app works offline.</p>
    <label for="user">Username</label><input id="user" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(store.get('lastUser', ''))}">
    <label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password">
    <div class="err" id="loginErr" role="alert">${esc(msg || '')}</div>
    <button class="btn primary" style="width:100%" id="loginBtn">Sign in</button></div>`;
  $('#loginBtn').onclick = login;
  $('#user').onkeydown = e => { if(e.key === 'Enter') $('#pass').focus(); };
  $('#pass').onkeydown = e => { if(e.key === 'Enter') login(); };
}
async function login(){
  const u = $('#user').value.trim(), p = $('#pass').value;
  if(!u || !p){ $('#loginErr').textContent = 'Enter your username and password.'; return; }
  if(!API || API.startsWith('PASTE')){ $('#loginErr').textContent = 'Not connected yet: set API.'; return; }
  $('#loginErr').textContent = 'Signing in...'; user = u; pass = p;
  try{
    const r = await api({ action:'sheets' });
    if(!r.ok){ user = ''; pass = ''; $('#loginErr').textContent = r.error === 'BAD_LOGIN' ? 'Wrong username or password. Try again.' : 'Could not sign in: ' + r.error; return; }
    const prev = store.get('lastUser', '');
    if(prev && prev.toLowerCase() !== u.toLowerCase()){
      data = {}; queue = []; confirms = {}; sel = { cls:'', sub:'', mon:'', day:0 };
      store.set('data', data); store.set('queue', queue); store.set('confirms', confirms);
    }
    teacher = r.teacher || ''; isAdmin = !!r.admin; sheets = r.sheets || [];
    store.set('user', user); store.set('pass', pass); store.set('lastUser', user); store.set('teacher', teacher); store.set('admin', isAdmin); store.set('sheets', sheets);
    ensureSel(); loadDraft(); render(); refreshAll(); syncRemarks();
  }catch(e){ user = ''; pass = ''; $('#loginErr').textContent = errText(e); }
}
async function signOut(msg){
  if(!msg && queue.length){
    toast('Saving your attendance before signing out...');
    if(navigator.onLine){ await syncQueue(); if(queue.length) await syncQueue(); }
    if(queue.length){ if(!confirm(queue.length + ' record(s) could not be saved to the sheet yet and would be lost. Sign out anyway?')){ renderMain(); return; } }
    else toast('Saved in sheet. Signed out.');
  }
  user = ''; pass = ''; store.set('user', ''); store.set('pass', '');
  if(!msg){ queue = []; data = {}; sheets = []; teacher = ''; isAdmin = false; confirms = {}; ['queue','data','sheets','confirms'].forEach(k => store.set(k, k === 'queue' || k === 'sheets' ? [] : {})); store.set('teacher', ''); store.set('admin', false); }
  renderLogin(msg);
}

/* ---------- attendance stats (this month) ---------- */
function dayMarks(day){
  if(day === sel.day) return draft;
  const d = data[sheetName()], q = queued(day), base = Object.assign({}, (d && d.marks && d.marks[day]) || {});
  if(q) Object.keys(q.marks).forEach(r => { if(q.marks[r] === '') delete base[r]; else base[r] = q.marks[r]; });
  return base;
}
function stats(){
  const d = data[sheetName()]; if(!d) return { lect:0, per:{} };
  const days = d.days && d.days.length ? d.days : Array.from({ length:31 }, (_, i) => i + 1), per = {}; let lect = 0;
  d.students.forEach(s => per[s.roll] = { p:0, a:0, l:0, b:0 });
  days.forEach(day => {
    const m = dayMarks(day); let any = 0;
    Object.keys(m).forEach(r => { const v = m[r]; if(v === 'P' || v === 'A') any = 1; if(per[r] && v && per[r][v.toLowerCase()] != null) per[r][v.toLowerCase()]++; });
    if(any) lect++;
  });
  return { lect, per };
}

}

  dirty = false; { const i = recInfo({ sheet:name, kind:'mt' }); toast(i.who + ' \u00b7 ' + i.what + ' saved on phone. Sending to the sheet...'); } renderMain();

    const head = sheetName() + '\nAttendance: ' + lect + ' lectures' + (T.total ? ' | Monthly test: out of ' + T.total : '') +
      (sumF === 'att' ? '\n(Attendance below ' + LOW + '%)' : sumF === 'mt' ? '\n(Test below 50% or absent)' : '');
    const lines = shown.map(r => r.s.name + ' (' + r.s.roll + ') - Att: ' + (r.p == null ? '-' : r.c.p + '/' + lect + ' = ' + r.p + '%') + (r.t ? ' | Test: ' + r.t.txt : ''));
    const txt = head + '\n' + lines.join('\n');
    Promise.resolve(navigator.share ? navigator.share({ text:txt }) : navigator.clipboard.writeText(txt).then(() => toast('Copied'))).catch(() => {});
  };
}
async function printSheet(){
  const name = sheetName(); if(!name || !data[name]) return toast('This sheet is not on the phone yet');
  if(!navigator.onLine) return toast('Printing needs an internet connection');
  const w = window.open('', '_blank');
  try{
    if(queue.some(q => q.sheet === name)){
      toast('Sending your latest attendance first...'); await syncQueue(); if(queue.some(q => q.sheet === name)) await syncQueue();
      if(queue.some(q => q.sheet === name)) throw new Error('Latest attendance is not in the sheet yet. Try again.');
    }
    toast('Preparing the PDF...');
    const r = await api({ action:'pdf', sheet:name }, 90000); if(!r.ok) throw new Error(r.error || 'Could not create the PDF');
    const bin = atob(r.pdf), arr = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type:'application/pdf' }));
    if(w) w.location.href = url; else { const a = document.createElement('a'); a.href = url; a.download = name + '.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(e){ if(w) w.close(); toast('Could not print: ' + errText(e)); }
}
function openCalendar(){
  const info = dayInfo(), { m, y, n, avail, isCur, today } = info, fd = firstDataDay(n), offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const heads = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(h => `<div class="h ${h === 'Sun' ? 'sun' : ''}">${h}</div>`).join('');
  const cells = Array.from({ length:offset }, () => '<div></div>').join('') + Array.from({ length:n }, (_, i) => {
    const day = i + 1, cls = [day === sel.day ? 'sel' : '', isCur && day === today ? 'today' : '', hasData(day) ? 'has' : (isMissed(day, fd, info) ? 'miss' : ''), noteFor(day) ? 'hasnote' : ''].filter(Boolean).join(' ');
    return `<button class="cell ${cls}" data-pick="${day}" ${avail.includes(day) ? '' : 'disabled'}>${day}</button>`;
  }).join('');
  $('#dlgBody').innerHTML = `<h2>${MONTHS[m]} ${y}</h2><div class="meta">${esc(sheetName())}</div><div class="grid">${heads}${cells}</div>
    <div class="legend"><span>Green dot: marked</span><span>Orange dot: not marked</span><span>Yellow dot: note</span><span>Ring: today</span></div>
    <div class="acts"><button class="btn small grow" id="closeDlg">Close</button></div>`;
  const dlg = $('#dlg'); dlg.showModal(); $('#closeDlg').onclick = () => dlg.close();
  dlg.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { dlg.close(); switchTo(() => { sel.day = Number(b.dataset.pick); }); });
}
function openSync(){
  const dlg = $('#dlg'), when = lastSync ? new Date(lastSync).toLocaleString() : 'never';
  $('#dlgBody').innerHTML = `<h2>Account and sync</h2>
    <div class="meta"><b>${esc(teacher || user)}</b>${isAdmin ? ' (admin)' : ''}<br>${esc(user)}<br>${navigator.onLine ? 'Online' : 'Phone reports no internet. Everything you save stays on this phone.'}<br>Last synced: ${esc(when)}<br>Server ends with: ${esc(API.slice(-12))}${Object.keys(rDirty).length ? '<br>' + Object.keys(rDirty).length + ' student comment(s) waiting to upload' : ''}</div>
    ${queue.length ? queue.map(q => `<div class="q"><div><b>${esc(q.sheet)}</b>, ${q.kind === 'mt' ? 'monthly test' : 'day ' + q.day}<small>${Object.keys(q.marks).length} students${q.note !== undefined ? ' + note' : ''} waiting</small>${q.error ? `<small class="bad">${esc(q.error)}</small>` : ''}</div><button class="btn small danger" data-discard="${esc(q.id)}">Discard</button></div>`).join('') : '<div class="q"><div>Nothing is waiting to sync. Everything is in the sheet.</div></div>'}
    ${lastError && queue.length ? `<div class="diag">${esc(lastError)}</div>` : ''}
    <div class="acts"><button class="btn small primary grow" id="syncNow">Sync now</button><button class="btn small grow" id="pwBtn">Change password</button></div>
    <div class="acts"><button class="btn small danger grow" id="signOutBtn">Sign out</button><button class="btn small grow" id="closeDlg">Close</button></div>`;
  dlg.showModal();
  $('#closeDlg').onclick = () => dlg.close(); $('#pwBtn').onclick = openPassword;
  $('#signOutBtn').onclick = () => { dlg.close(); signOut(); };
  $('#syncNow').onclick = async () => {
    dlg.close(); toast('Syncing...'); await absorbBg(); const ok = await syncQueue();
    if(!ok && queue.length) toast('Not synced: ' + (lastError || 'unknown problem'));
    if(!queue.length) fresh[sheetName()] = 0; refreshAll(); syncRemarks();
  };
  dlg.querySelectorAll('[data-discard]').forEach(b => b.onclick = () => { queue = queue.filter(x => x.id !== b.dataset.discard); store.set('queue', queue); dlg.close(); loadDraft(); renderMain(); });
}
function openPassword(){
  const dlg = $('#dlg');
  $('#dlgBody').innerHTML = `<h2>Change password</h2><div class="meta">This changes the password for the portal as well.</div>
    <label for="pwOld">Current password</label><input id="pwOld" type="password" autocomplete="current-password">
    <label for="pwNew">New password (at least 4 characters)</label><input id="pwNew" type="password" autocomplete="new-password">
    <label for="pwNew2">New password again</label><input id="pwNew2" type="password" autocomplete="new-password">
    <div class="err" id="pwErr" role="alert"></div>
    <div class="acts"><button class="btn small primary grow" id="pwSave">Save password</button><button class="btn small grow" id="pwCancel">Cancel</button></div>`;
  $('#pwCancel').onclick = () => dlg.close();
  $('#pwSave').onclick = async () => {
    const o = $('#pwOld').value, nw = $('#pwNew').value, n2 = $('#pwNew2').value, err = $('#pwErr');
    if(!o || !nw){ err.textContent = 'Fill in all the fields.'; return; }
    if(nw !== n2){ err.textContent = 'The two new passwords do not match.'; return; }
    err.textContent = 'Saving...';
    try{
      const r = await api({ action:'password', oldPass:o, newPass:nw });
      if(r.ok){ pass = nw; store.set('pass', pass); dlg.close(); toast('Password changed'); }
      else err.textContent = r.error === 'WRONG_OLD' ? 'The current password is wrong.' : r.error === 'TOO_SHORT' ? 'The new password must be at least 4 characters.' : (r.error || 'Could not change the password.');
    }catch(e){ err.textContent = errText(e); }
  };
}

/* ---------- status line + chip ---------- */
function updateBadge(){
  const el = $('#sline'); if(!el) return;
  const name = sheetName(), d = data[name], sid = mode === 'mt' ? name + '|MT' : name + '|' + sel.day;
  const q = queue.find(x => x.id === sid), c = confirms[sid]; let cls = '', txt = '', act = '';
  if(q){
    if(q.error){ cls = 'err'; txt = 'Not in the sheet yet: ' + q.error; }
    else if(syncing){ cls = 'wait'; txt = 'Sending to the sheet...'; }
    else { cls = 'wait'; txt = navigator.onLine ? 'Saved on phone, waiting to reach the sheet' : 'Saved on phone, will go to the sheet when online'; }
  } else {
    const items = [], note = mode === 'att' ? noteFor(sel.day) : ''; let okTxt = '';
    if(c){
      const t = new Date(c.at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
      okTxt = c.mt ? '\u2713 Test marks saved at ' + t : c.p == null ? '\u2713 Note saved at ' + t
        : '\u2713 Saved at ' + t + ' (P ' + c.p + ', A ' + c.a + (c.l ? ', L ' + c.l : '') + (c.b ? ', B ' + c.b : '') + ')';
    } else if(mode === 'att'){ const m = d && d.marks && d.marks[sel.day], k = m ? Object.keys(m).length : 0; if(k) okTxt = '\u2713 In the sheet (' + k + ' marked)'; }
    else if(d && d.mt && d.mt.total) okTxt = '\u2713 Test marks in the sheet';
    if(note) items.push('Note: ' + note); if(okTxt) items.push(okTxt); if(lowInfo) items.push(lowInfo);
    txt = items.join(' \u00b7 '); cls = lowInfo ? 'low' : note ? 'note' : okTxt ? 'ok' : '';
    act = mode === 'att' ? (lowInfo ? 'low' : note ? 'note' : '') : '';
  }
  el.className = 'sline ' + cls; el.textContent = txt; el.style.display = txt ? 'block' : 'none';
  if(act) el.dataset.act = act; else el.removeAttribute('data-act');
}
function updateStatus(){
  const chip = $('#statusChip'), txt = $('#statusTxt'); if(!chip) return;
  const on = navigator.onLine, busy = syncing || refreshing;
  chip.classList.toggle('off', !on); chip.classList.toggle('busy', busy); chip.classList.toggle('err', !busy && !!queue.length && !!lastError);
  txt.textContent = syncing ? 'Saving...' : refreshing ? 'Updating...' : queue.length ? queue.length + ' to sync' : on ? 'Synced' : 'Offline';
  updateBadge();
}
let toastTimer;
function toast(msg, action){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  if(action){
    const b = document.createElement('button'); b.className = 'toastBtn'; b.textContent = action.label;
    b.onclick = () => { clearTimeout(toastTimer); t.style.display = 'none'; action.fn(); }; t.appendChild(b);
  }
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', action ? UNDO_MS : 5500);
}

/* ---------- auto-fold the control panel while scrolling ---------- */
const isLandscape = () => window.matchMedia('(orientation:landscape) and (max-height:520px)').matches;
let lastY = 0, lockUntil = 0, upAcc = 0, dnAcc = 0;
function setCompact(on){
  const st = $('.stick'), app = $('#app');
  if(!st || on === compact) return;
  if(on && (panelHidden || isLandscape())) return;
  const before = st.offsetHeight;
  compact = on; app.classList.toggle('compact', on);
  const delta = before - st.offsetHeight;
  if(delta) window.scrollBy(0, -delta);        // keeps the same students under your thumb
  lockUntil = Date.now() + 350; lastY = window.scrollY; upAcc = dnAcc = 0;
  if(!on) centerStrip();
}
window.addEventListener('scroll', () => {
  if(!authed() || panelHidden || isLandscape()) return;
  const y = window.scrollY;
  if(Date.now() < lockUntil){ lastY = y; return; }
  const dy = y - lastY; lastY = y;
  if(y <= 4){ upAcc = dnAcc = 0; setCompact(false); return; }
  if(dy > 0){ dnAcc += dy; upAcc = 0; } else if(dy < 0){ upAcc -= dy; dnAcc = 0; }
  if(!compact && y > 260 && dnAcc > 40) setCompact(true);
  else if(compact && upAcc > 40) setCompact(false);
}, { passive:true });

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target; if(!t.closest) return; let b;
  if((b = t.closest('#list button[data-v]'))){
    const row = b.closest('.row'), roll = row.dataset.roll, v = b.dataset.v;
    if(navigator.vibrate) navigator.vibrate(8);
    if(draft[roll] === v) delete draft[roll]; else draft[roll] = v;
    dirty = true; paintRow(row); updateTally(); return;
  }
  if((b = t.closest('#app .who'))){ const r = b.closest('.row'); if(r) openStudent(r.dataset.roll); return; }
  if((b = t.closest('[data-mode]'))){ if(b.dataset.mode !== mode) switchTo(() => { mode = b.dataset.mode; store.set('mode', mode); }); return; }
  if((b = t.closest('#strip [data-day]'))){ if(!b.disabled) switchTo(() => { sel.day = Number(b.dataset.day); }); return; }
  if((b = t.closest('#fl [data-f]'))){ filterQ = b.dataset.f; paintFilters(); return; }
  if((b = t.closest('#sline'))){ if(b.dataset.act === 'low') return openSummary('att'); if(b.dataset.act === 'note') return openNote(); return; }
  if(t.closest('#miniBar')) return setCompact(false);
  if(t.closest('#calBtn')) return openCalendar();
  if(t.closest('#noteBtn')) return openNote();
  if(t.closest('#sumBtn')) return openSummary('all');
  if(t.closest('#printBtn')) return printSheet();
  if(t.closest('#statusChip')) return openSync();
  if(t.closest('#saveBtn')) return save();
  if(t.closest('#panelBtn')) return togglePanel();
});
document.addEventListener('change', ev => {
  const t = ev.target, id = t && t.id, v = t && t.value;
  if(id === 'selCls') switchTo(() => choose('cls', v));
  else if(id === 'selSub') switchTo(() => choose('sub', v));
  else if(id === 'selMon') switchTo(() => choose('mon', v));
  else if(t && t.dataset && t.dataset.all){
    const d = data[sheetName()]; if(!d) return;
    const val = t.dataset.all, snap = Object.assign({}, draft), was = dirty;
    d.students.forEach(s => { if(t.checked) draft[s.roll] = val; else if(draft[s.roll] === val) delete draft[s.roll]; });
    dirty = true; document.querySelectorAll('#list .row').forEach(paintRow); updateTally();
    toast(t.checked ? 'Marked all ' + val : 'Cleared all ' + val, { label:'Undo', fn:() => { draft = snap; dirty = was; document.querySelectorAll('#list .row').forEach(paintRow); updateTally(); toast('Undone'); } });
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.id === 'sq'){ searchQ = t.value; applySearch(); return; }
  if(t.id === 'mtTotal'){ mtDraft.total = t.value.trim().replace(',', '.'); dirty = true; updateTally(); return; }
  if(t.classList && t.classList.contains('mk')){
    const roll = t.closest('.row').dataset.roll, total = Number(mtDraft.total) || 0;
    const val = t.value.replace(',', '.').toUpperCase().trim(), prev = mtDraft.marks[roll] || '';
    const abs = /^(A|AB|ABS|ABSE|ABSEN|ABSENT)$/.test(val), num = /^\d{0,4}(\.\d{0,2})?$/.test(val);
    if(!abs && !num){ t.value = prev; return toast('Enter marks, or A / AB / Absent.'); }
    if(val !== '' && !total){ t.value = prev; return toast('Enter the total marks first.'); }
    if(num && val !== '' && total > 0 && Number(val) > total){ t.value = prev; return toast('Marks cannot be more than ' + total + '.'); }
    t.value = val; mtDraft.marks[roll] = val; dirty = true; updateTally();
  }
});
window.addEventListener('online', () => { updateStatus(); syncRemarks(); absorbBg().finally(() => syncQueue().then(refreshAll)); });
window.addEventListener('offline', updateStatus);
window.addEventListener('resize', () => { if(isLandscape()) setCompact(false); else centerStrip(); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ absorbBg().finally(syncQueue); centerStrip(); } });
setInterval(syncQueue, 30000); setInterval(syncRemarks, 60000);
if('serviceWorker' in navigator){
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(had && !dirty) location.reload(); });
  navigator.serviceWorker.addEventListener('message', ev => { if(ev.data && ev.data.type === 'bg-synced') absorbBg(); });
}
ensureSel(); initDay(); render();
if(authed()){ mirrorBg(); absorbBg().finally(() => syncQueue().then(refreshAll)); syncRemarks(); }
</script>
