    mons.flatMap(() => ['Present / Held', '%']).concat(['Present / Held', '%'])];
  const body = subs.map(g => [titleCase(g.sub) + (g.off ? ' (left)' : ''), g.teacher || ''].concat(
    mons.flatMap(t => { const m = g.months[t]; return !m ? ['-', ''] : m.off ? ['left', ''] : [m.p + ' / ' + m.d, m.d ? pct1(m.p, m.d) : '-']; }),
    g.off ? ['', '', 'Left subject'] : [g.p + ' / ' + g.d, g.pct == null ? '-' : g.pct, g.pct == null ? '' : g.pct < LOW ? 'SHORTAGE' : 'OK']));
  body.push(['Overall', ''].concat(mons.flatMap(t => { let p = 0, d = 0; live.forEach(g => { const m = g.months[t]; if(m && !m.off){ p += m.p; d += m.d; } }); return d ? [p + ' / ' + d, pct1(p, d)] : ['-', '']; }),
    [gP + ' / ' + gD, gp == null ? '-' : gp, short ? short + ' short' : 'OK']));
  const pctCols = new Set(); mons.forEach((_, i) => pctCols.add(3 + i * 2)); pctCols.add(3 + mons.length * 2);
  P.table(doc, { startY:Y, margin:{ top:P.TOP, left:10, right:10, bottom:16 },
    styles:{ font:'helvetica', fontSize:8, cellPadding:1.4, lineColor:C.LINE, lineWidth:0.15, textColor:C.INK, valign:'middle', halign:'center' },
    head, body, columnStyles:{ 0:{ halign:'left', fontStyle:'bold', cellWidth:38 }, 1:{ halign:'left', cellWidth:36 } },
    didParseCell:h => {
      if(h.section !== 'body') return;
      const v = String(h.cell.raw == null ? '' : h.cell.raw), last = h.row.index === body.length - 1;
      if(last){ h.cell.styles.fontStyle = 'bold'; h.cell.styles.fillColor = [234, 238, 246]; }
      if(pctCols.has(h.column.index) && v !== '' && v !== '-' && Number(v) < LOW){ h.cell.styles.textColor = C.RED; h.cell.styles.fillColor = C.REDBG; h.cell.styles.fontStyle = 'bold'; }
      if(/SHORTAGE|short$/.test(v)){ h.cell.styles.textColor = C.RED; h.cell.styles.fontStyle = 'bold'; }
      if(v === 'OK') h.cell.styles.textColor = C.GREEN;
      if(v === 'left'){ h.cell.styles.textColor = [150, 156, 168]; h.cell.styles.fontStyle = 'italic'; }
    } });
  Y = doc.lastAutoTable.finalY + 3;
  Y = P.smallNote(doc, Y, 'Present = lectures attended, Held = lectures delivered (for a guest: lectures in which she was marked). Only P counts as attended. Minimum required: ' + LOW + '%.' + (scope() ? '' : ' Only the subjects taught by ' + (teacher || user) + ' are included.'));
  P.signatures(doc, Y, ['Class In-charge', 'HOD', 'Principal']);
}
async function buildCards(){
  setProg('Reading the section…', 20);
  const q = { from:zr.from, to:zr.to, cls:zr.cls };
  const S = sortStu(model(await reportRows(q)));
  if(!S.length) throw new Error('No students found for this section.');
  setProg('Making ' + S.length + ' pages…', 80);
  await new Promise(res => setTimeout(res, 30));
  const doc = P.newDoc('landscape'), mons = monthsIn(zr.from, zr.to);
  S.forEach((s, i) => studentSessionPage(doc, s, mons, i === 0, q));
  P.finalize(doc);
  return { doc, title:'Session registers ' + zr.cls, file:'Session-registers_' + P.safe(zr.cls) + '_' + zr.from + '-' + zr.to + '.pdf' };
}

/* ======================= 3) TEST RESULTS ======================= */
const mtTxt = m => !m || m.off || m.mt === '' || m.mt == null || !m.mtT ? '' : m.mt === 'A' ? 'Absent' : m.mt + ' / ' + m.mtT;
const mtPct = m => !m || m.off || m.mt === '' || m.mt == null || !m.mtT ? null : m.mt === 'A' ? 0 : pct1(Number(m.mt) || 0, m.mtT);
/** grand obtained / total of a student over the given subjects */
function grand(s, subs){ let o = 0, t = 0; subs.forEach(x => { const g = s.subs[x]; if(g && !g.off && g.t){ o += g.o; t += g.t; } }); return { o, t, p:t ? pct1(o, t) : null }; }
const testLegend = 'Obtained / Total for each monthly test. Session % = all marks obtained ÷ all total marks of the chosen months (a test marked Absent counts as 0). Red = below ' + TEST_LOW + '% or absent. Tests not entered are left out.';

function subjectResultPage(doc, list, sub, mons, q, first){
  const C = P.C, rk = ranks(list.map(s => ({ k:s.roll, v:s.subs[sub] && !s.subs[sub].off ? s.subs[sub].tp : null })));
  const g0 = list.find(s => s.subs[sub]), teacherName = g0 ? g0.subs[sub].teacher : '';
  if(!first) doc.addPage();
  let Y = P.heading(doc, P.TOP, 'Monthly Test Result  ·  ' + q.cls + '  ·  ' + titleCase(sub), 'Teacher: ' + (teacherName || '-') + '  ·  ' + rangeTxt(q.from, q.to));
  const head = [[{ content:'#', rowSpan:2 }, { content:'Roll No', rowSpan:2 }, { content:'Student Name', rowSpan:2 }].concat(mons.map(t => ({ content:monName(t) + ' test', colSpan:2 })),
    [{ content:'SESSION', colSpan:2 }, { content:'Position', rowSpan:2 }]), mons.flatMap(() => ['Obtained / Total', '%']).concat(['Obtained / Total', '%'])];
  const rows = list.filter(s => s.subs[sub]);
  const body = rows.map((s, i) => { const g = s.subs[sub];
    return [i + 1, s.roll, s.name + (g.off ? ' (left)' : '')].concat(mons.flatMap(t => { const m = g.months[t], p = mtPct(m); return [mtTxt(m) || '-', p == null ? '' : p]; }),
      g.off || !g.t ? ['-', '', ''] : [g.o + ' / ' + g.t, g.tp, rk.pos[s.roll] || '']); });
  const pctCols = new Set(); mons.forEach((_, i) => pctCols.add(4 + i * 2)); pctCols.add(4 + mons.length * 2);
  P.table(doc, { startY:Y, margin:{ top:P.TOP, left:10, right:10, bottom:16 },
    styles:{ font:'helvetica', fontSize:7.6, cellPadding:1.1, lineColor:C.LINE, lineWidth:0.15, textColor:C.INK, valign:'middle', halign:'center' },
    head, body, columnStyles:{ 0:{ cellWidth:8 }, 1:{ cellWidth:24, halign:'left' }, 2:{ cellWidth:44, halign:'left' } },
    didParseCell:h => { if(h.section !== 'body') return; const v = String(h.cell.raw == null ? '' : h.cell.raw);
      if(v === 'Absent' || (pctCols.has(h.column.index) && v !== '' && Number(v) < TEST_LOW)){ h.cell.styles.textColor = C.RED; h.cell.styles.fillColor = C.REDBG; h.cell.styles.fontStyle = 'bold'; }
      if(h.column.index === 5 + mons.length * 2 && v){ h.cell.styles.fontStyle = 'bold'; if(Number(v) <= 3){ h.cell.styles.fillColor = C.GREENBG; h.cell.styles.textColor = C.GREEN; } } } });
  Y = doc.lastAutoTable.finalY + 3;
  const ok = rows.filter(s => s.subs[sub].t && !s.subs[sub].off), low = ok.filter(s => s.subs[sub].tp < TEST_LOW).length;
  Y = P.smallNote(doc, Y, 'Students with marks: ' + ok.length + '  ·  Below ' + TEST_LOW + '%: ' + low + '.  ' + testLegend);
  P.signatures(doc, Y, ['Subject Teacher', 'HOD', 'Principal']);
}
function summaryResultPage(doc, list, subs, q){
  const C = P.C, rk = ranks(list.map(s => ({ k:s.roll, v:grand(s, subs).p })));
  let Y = P.heading(doc, P.TOP, 'Monthly Test Result Summary  ·  ' + q.cls, (scope() ? 'All subjects' : 'Subjects taught by ' + (teacher || user)) + '  ·  ' + rangeTxt(q.from, q.to));
  const head = [['#', 'Roll No', 'Student Name'].concat(subs.map(x => titleCase(x).split(' ').map(w => w.length > 8 ? w.slice(0, 6) + '.' : w).join(' ') + '\n%'), ['Obtained', 'Total', '%', 'Position'])];
  const body = list.map((s, i) => { const G = grand(s, subs);
    return [i + 1, s.roll, s.name].concat(subs.map(x => { const g = s.subs[x]; return !g ? '—' : g.off ? 'left' : g.tp == null ? '' : g.tp; }),
      G.t ? [G.o, G.t, G.p, rk.pos[s.roll] || ''] : ['', '', '', '']); });
  const n = subs.length;
  P.table(doc, { startY:Y, margin:{ top:P.TOP, left:10, right:10, bottom:16 },
    styles:{ font:'helvetica', fontSize:7.2, cellPadding:1, lineColor:C.LINE, lineWidth:0.15, textColor:C.INK, valign:'middle', halign:'center' },
    headStyles:{ fillColor:C.NAVY, textColor:[255, 255, 255], fontStyle:'bold', halign:'center', valign:'middle', fontSize:6.6 },
    head, body, columnStyles:{ 0:{ cellWidth:7 }, 1:{ cellWidth:23, halign:'left' }, 2:{ cellWidth:42, halign:'left' } },
    didParseCell:h => { if(h.section !== 'body') return; const c = h.column.index, v = String(h.cell.raw == null ? '' : h.cell.raw);
      if(((c >= 3 && c < 3 + n) || c === 5 + n) && v !== '' && !isNaN(Number(v)) && Number(v) < TEST_LOW){ h.cell.styles.textColor = C.RED; h.cell.styles.fillColor = C.REDBG; h.cell.styles.fontStyle = 'bold'; }
      if(c === 6 + n && v){ h.cell.styles.fontStyle = 'bold'; if(Number(v) <= 3){ h.cell.styles.fillColor = C.GREENBG; h.cell.styles.textColor = C.GREEN; } }
      if(v === 'left'){ h.cell.styles.textColor = [150, 156, 168]; h.cell.styles.fontStyle = 'italic'; } } });
  Y = doc.lastAutoTable.finalY + 3;
  Y = P.smallNote(doc, Y, 'Subject % = session test % in that subject. Position = by overall % of the subjects shown. — = subject not taken. ' + testLegend);
  P.signatures(doc, Y, ['Class In-charge', 'HOD', 'Principal']);
}
function studentResultPage(doc, s, mons, q, first, place){
  const C = P.C, subs = Object.keys(s.subs).sort(), G = grand(s, subs);
  if(!first) doc.addPage();
  let Y = P.heading(doc, P.TOP, 'Student Monthly Test Report', s.name + '  ·  ' + s.roll + '  ·  ' + s.cls + '  ·  ' + rangeTxt(q.from, q.to));
  Y = P.statBoxes(doc, Y, [
    { l:'Overall test %', v:G.p == null ? '-' : G.p + '%', c:G.p != null && G.p < TEST_LOW ? C.RED : C.GREEN, bg:G.p != null && G.p < TEST_LOW ? C.REDBG : C.GREENBG },
    { l:'Obtained / Total', v:G.t ? G.o + ' / ' + G.t : '-' },
    { l:'Class position', v:place ? place.pos + ' of ' + place.of : '-' }]) + 3;
  const head = [[{ content:'Subject', rowSpan:2 }, { content:'Teacher', rowSpan:2 }].concat(mons.map(t => ({ content:monName(t) + ' test', colSpan:2 })), [{ content:'SESSION', colSpan:2 }]),
    mons.flatMap(() => ['Obtained / Total', '%']).concat(['Obtained / Total', '%'])];
  const body = subs.map(x => { const g = s.subs[x];
    return [titleCase(x) + (g.off ? ' (left)' : ''), g.teacher || ''].concat(mons.flatMap(t => { const m = g.months[t], p = mtPct(m); return [mtTxt(m) || '-', p == null ? '' : p]; }),
      g.off || !g.t ? ['-', ''] : [g.o + ' / ' + g.t, g.tp]); });
  body.push(['Overall', ''].concat(mons.flatMap(t => { let o = 0, tt = 0; subs.forEach(x => { const g = s.subs[x], m = g.months[t]; if(g.off || !m || m.off || !m.mtT || m.mt === '' || m.mt == null) return; tt += m.mtT; if(m.mt !== 'A') o += Number(m.mt) || 0; }); return tt ? [o + ' / ' + tt, pct1(o, tt)] : ['-', '']; }),
    G.t ? [G.o + ' / ' + G.t, G.p] : ['-', '']));
  const pctCols = new Set(); mons.forEach((_, i) => pctCols.add(3 + i * 2)); pctCols.add(3 + mons.length * 2);
  P.table(doc, { startY:Y, margin:{ top:P.TOP, left:10, right:10, bottom:16 },
    styles:{ font:'helvetica', fontSize:8, cellPadding:1.4, lineColor:C.LINE, lineWidth:0.15, textColor:C.INK, valign:'middle', halign:'center' },
    head, body, columnStyles:{ 0:{ halign:'left', fontStyle:'bold', cellWidth:38 }, 1:{ halign:'left', cellWidth:36 } },
    didParseCell:h => { if(h.section !== 'body') return; const v = String(h.cell.raw == null ? '' : h.cell.raw);
      if(h.row.index === body.length - 1){ h.cell.styles.fontStyle = 'bold'; h.cell.styles.fillColor = [234, 238, 246]; }
      if(v === 'Absent' || (pctCols.has(h.column.index) && v !== '' && v !== '-' && Number(v) < TEST_LOW)){ h.cell.styles.textColor = C.RED; h.cell.styles.fillColor = C.REDBG; h.cell.styles.fontStyle = 'bold'; } } });
  Y = doc.lastAutoTable.finalY + 3;
  Y = P.smallNote(doc, Y, testLegend + (place ? ' Position = among the students of ' + s.cls + ', by overall % of ' + (scope() ? 'the subjects of that section.' : 'the subjects shown.') : '') + (scope() ? '' : ' Only the subjects taught by ' + (teacher || user) + ' are included.'));
  P.signatures(doc, Y, ['Class In-charge', 'HOD', 'Principal']);
}
async function buildTests(everyStudent){
  const mons = monthsIn(zr.from, zr.to), doc = P.newDoc('landscape');
  if(zr.who === 'stu'){
    setProg('Reading the student’s tests…', 20);
    const mine = model(await reportRows({ from:zr.from, to:zr.to, roll:zr.roll }))[zr.roll];
    if(!mine) throw new Error('No monthly test data found for this student.');
    setProg('Working out the class position…', 55);
    let place = null;
    try{
      const S = model(await reportRows({ from:zr.from, to:zr.to, cls:mine.cls })), subs = [...new Set(Object.values(S).flatMap(s => Object.keys(s.subs)))];
      const rk = ranks(Object.values(S).map(s => ({ k:s.roll, v:grand(s, subs).p })));
      if(rk.pos[zr.roll]) place = { pos:rk.pos[zr.roll], of:rk.of };
    }catch(e){}
    studentResultPage(doc, mine, mons, { from:zr.from, to:zr.to }, true, place);
    P.finalize(doc);
    return { doc, title:'Test report ' + zr.name, file:'Test-report_' + P.safe(zr.name) + '_' + P.safe(zr.roll) + '_' + zr.from + '-' + zr.to + '.pdf' };
  }
  setProg('Reading the section’s tests…', 20);
  const q = { from:zr.from, to:zr.to, cls:zr.cls };
  const S = sortStu(model(await reportRows(q)));
  if(!S.length) throw new Error('No students found for this section.');
  const subsAll = [...new Set(S.flatMap(s => Object.keys(s.subs)))].sort();
  if(!subsAll.some(x => S.some(s => s.subs[x] && s.subs[x].t))) throw new Error('No monthly test marks are entered for this section in the chosen months.');
  setProg('Making the PDF…', 80);
  await new Promise(res => setTimeout(res, 30));
  if(everyStudent){
    const rk = ranks(S.map(s => ({ k:s.roll, v:grand(s, subsAll).p })));
    S.forEach((s, i) => studentResultPage(doc, s, mons, q, i === 0, rk.pos[s.roll] ? { pos:rk.pos[s.roll], of:rk.of } : null));
    P.finalize(doc);
    return { doc, title:'Test result cards ' + zr.cls, file:'Test-cards_' + P.safe(zr.cls) + '_' + zr.from + '-' + zr.to + '.pdf' };
  }
  if(zr.sub){
    if(!subsAll.includes(zr.sub)) throw new Error('No test data for ' + titleCase(zr.sub) + ' in this section.');
    subjectResultPage(doc, S, zr.sub, mons, q, true);
  } else {
    summaryResultPage(doc, S, subsAll, q);
    subsAll.forEach(x => subjectResultPage(doc, S, x, mons, q, false));
  }
  P.finalize(doc);
  return { doc, title:'Test result ' + zr.cls, file:'Test-result_' + P.safe(zr.cls) + '_' + (zr.sub ? P.safe(titleCase(zr.sub)) : 'All-subjects') + '_' + zr.from + '-' + zr.to + '.pdf' };
}

loadOpts(false);
})();
