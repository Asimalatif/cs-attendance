    <li><b>Double periods</b>: if the timetable gives the class two periods on one day, the lecture bar (1, 2) opens by itself for that day.</li>
    <li><b>My timetable & workload</b> (Home card, or ⋯ More): your week as a grid (days × periods, with section, subject, room; Pr = practical), periods per week, theory and practical, number of classes and free periods, and a <b>PDF</b>.</li>
    <li><b>Admin / principal / HOD</b>: <i>College → Workload</i> lists every teacher's periods per week (theory, practical, per day). Tap a teacher to see her timetable. Share as text or PDF. <i>Today</i> and the "not marked" list count only classes that are in today's timetable.</li></ul>
    <div class="tip">If <b>My timetable</b> is empty, the teacher's name in the Timetable sheet is spelled differently from the Users sheet. Make them match (Ms./Dr. and spaces are ignored).</div>` },

  { id:'free', nav:'Free teachers', title:'Free teachers (admin, principal, HOD, Chief Proctor)', html:`
    <p>Open <b>Free teachers</b> from Home or <b>⋯ More</b>. Choose the <b>day</b>, the <b>shift</b> (morning / evening) and the <b>period</b>; it opens on today and the period going on now. Choose <b>All week</b> to see Monday to Saturday together: every day, every period and the free teachers' names.</p>
    <ul><li><b>Free in this period</b>: teachers who teach in that shift that day but have no class in that period, grouped by department, with <b>Visiting</b> marked, their class <b>before</b> and <b>after</b>, and a <b>Contact</b> button (opens her number privately; see below).</li>
    <li><b>No class that day</b>: teachers with no period in that shift that day (they may not be in college).</li>
    <li><b>Free teachers in the week</b>: how many teachers are free in every period; red = fewer than 3. Tap a number to see the names.</li>
    <li><b>Share as text</b> (WhatsApp), <b>This period PDF</b>, <b>Whole day PDF</b> (every period of the day with the free teachers) and <b>Whole week PDF</b> (a Monday-to-Saturday summary grid, then one page per day with the names).</li>
    <li><b>Best for a duty</b> (default order): first the teachers who do not have to wait. If a teacher has periods 1 and 2 and is free in 3, 4 and 5, she comes first for a duty in period 3, later for period 4 and last for period 5. "Between her classes" = she is in college anyway. Then the teachers with the fewest duties this month, and (if switched on) the teachers who missed a duty. <b>By department</b> shows the old grouping.</li>
    <li><b>Assign</b> next to a free teacher saves a duty (date, the class whose teacher is absent, a note). After the period the Chief Proctor taps <b>Done</b> or <b>Not done</b>.</li>
    <li><b>Fairness report</b>: every teacher's duties this session (given, done, not done, this month), as a list and PDF. <b>Duty settings</b>: most duties per teacher per day, exempt teachers, and whether missed duties come first. The settings are shared by all Chief Proctors.</li></ul>
    <div class="tip">The list comes from the timetable. The app does not know who is on leave or absent today, so confirm before giving a duty. Chief Proctors are the users marked CP in the Users sheet; they always see free teachers of <b>all departments</b>, even when they are also an HOD.</div>
    <h3>Teacher contacts (private)</h3>
    <p>Phone numbers are <b>never</b> printed in any report, PDF or shared text (free teachers, workload, timetables …). Admin, principal and Chief Proctors see every teacher's number, an HOD only her own department (an HOD who is also a Chief Proctor sees everyone); other teachers cannot see them. Open <b>Teacher contacts</b> from Home, <b>⋯ More</b> or the <b>Contacts</b> button under the free list; search a name and tap <b>Call</b> or <b>WhatsApp</b>. In the free list, <b>Contact</b> opens one teacher's number.</p>
    <div class="tip">Numbers come from the Contact (and WhatsApp Link) columns of the Users sheet. They are kept on the phone for offline use and wiped when you sign out.</div>` },

  { id:'home', nav:'Home & overview', title:'Home, student profile and college overview', html:`
    <p>Use the tabs at the top to move between screens: <b>Home</b>, <b>Attendance</b>, <b>Reports</b> and (for admin, principal and HOD) <b>College</b> or <b>Dept.</b> On the Attendance screen the tabs are replaced by a small <b>Home</b> button, to leave more room for students.</p>
    <ul><li><b>Home</b> shows <b>Today</b> (your classes of today in period order: green badge and ✓ = marked, red badge and <b>Mark</b> = still to do; tap a line to open it; see <i>Timetable & workload</i>), each section's percentage this month (with how many students are below 73% this week), <b>Students reported to Chief Proctor</b> (the discipline reports you sent and their status) and your timetable. <b>Low attendance</b> and the <b>Student profile</b> search are in the <b>Reports</b> tab.</li>
    <li><b>Low attendance</b> (Reports tab): switch between <i>This week</i> and <i>This month</i>, tap <b>See all</b> for the full list, and <b>Share PDF</b> to send the weekly low-attendance report on WhatsApp or email.</li>
    <li><b>Change history</b> (bottom of a student's profile): every change or deletion of her saved marks, with the old and new mark, who changed it and when.</li>
    <li><b>Student profile</b>: search in the Reports tab, tap a student in Low attendance, or tap <b>Full profile</b> in a student's window. It shows every month's attendance and test, a day-by-day calendar, your tags and comments and her reports. <b>Share PDF</b> sends the profile as a report.</li>
    <li><b>College / Department overview</b>: <i>Today</i> shows who has and has not marked attendance today (only classes in today's timetable); <b>Remind</b> next to a teacher opens WhatsApp with a ready reminder listing her unmarked classes (her number stays private); admin and principal also find <b>System health check</b>, <b>Student result page</b> (code slips) and <b>UOP portal sync</b> at the bottom of the College screen. <b>Sheets vs strength sheet</b>: <b>Check</b> this month or next month compares every attendance sheet with Transform-ALL-COLLEGE-STRENGTH and lists students missing from a sheet, extra students and students struck off by mistake; nothing changes until you press <b>Add</b>, <b>Remove</b> (row deleted, or struck through if she already has marks that month), <b>Switch on</b> or <b>Fix this sheet</b>. <b>Students who left</b>: <b>Move students who left</b> shows everyone in the strength sheet who is Migrated, Cancelled, Disenrolled or Transfer on the portal (untick anyone who should stay); their rows go to the sheet <b>Left Students</b>. Earlier months of attendance stay as they were, this month her row is struck through and no longer counted, and later months that already have sheets lose her row. <b>List / restore</b> brings back a student moved by mistake. Every Excel file opens with <b>Open / Print</b> as a table you can filter by any column and print. The portal sync brings status, quota, date of birth, photo, contact, matric marks, challans and subjects from portal.uop.edu.pk into the strength sheet, filling only empty cells; the health check then lists students without roll number, cancelled / migrated / disenrolled / transferred students still in attendance, students in two programs, roll numbers out of range, no picture, no date of birth or 01/01/2000, missing matric roll no / marks, no quota, missing subjects, contact or challan, unpaid challans and timetable classes without a room; <i>Workload</i> shows every teacher's periods per week; <i>Sections</i> shows section-wise percentages (tap a section for its subjects); <i>Low attendance</i> lists every student below 73%. Each tab has <b>Share as text</b> and a <b>PDF</b> button. HODs see their own department, admin and principal see the whole college.</li></ul>` },

  { id:'reports', nav:'Reports', title:'Reports: attendance, daily register, tests, shortage', html:`
    <p>Open the <b>Reports</b> tab (or <b>⋯ More → Reports</b>). Everything is in one card, <b>Create a report</b>, in three steps:</p>
    <ol><li><b>What do you need?</b> Tap one of the four tiles.</li><li><b>For whom?</b> One student, one section, or all your sections.</li><li><b>Choose</b> the student or section (and subject), the months, then tap <b>Create PDF</b>.</li></ol>
    <div class="tip"><b>Every PDF and Excel file</b> in the app (reports, absentees, summary, register, timetable, free teachers…) opens a small window with three choices: <b>Share</b> (WhatsApp, Gmail, Drive… on phones), <b>Download</b> (saved in the Downloads folder: Files / My Files app on a phone) and <b>Open / Print</b>.</div>
    <ul><li><b>Attendance</b>: lectures attended / held and % month by month, with the monthly test. <i>One student</i>: every subject of that student. <i>One section</i>: all students in one table (one subject month by month, or all subjects side by side); <b>One page per student</b> gives each student her own session register page. <i>All sections</i>: a section-wise summary, then every section on its own page. Also as <b>Excel (CSV)</b>.</li>
    <li><b>Daily register</b>: P / A / L / B for every date, then Present, Held and %. For a student, a section (one or all subjects) or all sections (admin, principal, HOD: one month at a time).</li>
    <li><b>Test results</b>: Obtained / Total for each monthly test, session % and class position. <b>Result card of every student</b> makes one card per student of the section.</li>
    <li><b>Shortage</b>: everyone below the limit (73% unless you change <b>Below %</b>) in the months you choose. <b>Needed</b> = lectures in a row she must attend to reach the limit. A dot after a name = short in more than one subject.</li>
    <li><b>From / To</b>: any range from September up to this month. September to now = the whole session so far.</li>
    <li><b>Early warning</b>: students already below 73% (with the lectures each must attend in a row) and students <b>at risk</b>, who can miss only 2 more lectures or fewer before falling below 73%. Choose <i>This month</i> or <i>Session so far</i>, then <b>Share on WhatsApp</b> or <b>Early warning PDF</b>. Send it to the HOD or Chief Proctor every week.</li>
    <li><b>Shortcuts</b>: one tap for the session shortage, this month's shortage, and all data for Excel.</li></ul>` },

  { id:'start', nav:'Quick start', title:'Quick start', html:`
    <p>Take attendance in six steps:</p>
    <ol class="st"><li>Open the app and <b>sign in once with internet</b> (same username and password as the portal).</li>
    <li>Choose <b>class, subject and month</b> in the top card.</li>
    <li>Tap the <b>day</b> in the day strip (today is already selected).</li>
    <li>Mark each student <b>P, A, L or B</b>. Tip: tick <b>Mark all P</b> first, then change only the absentees.</li>
    <li>Press <b>Save</b> at the bottom. The status line says <i>saved on phone</i>, then <i>reached the sheet</i>.</li>
    <li>No internet? Nothing is lost. Records wait on the phone and go to the sheet by themselves when internet returns.</li></ol>
    <div class="tip">Not sure what a button does? Tap the <b>?</b> at the top, press <b>Turn on hint mode</b>, then tap any button. On a laptop just hold the mouse over a button for a moment.</div>` },

  { id:'login', nav:'Sign in & offline', title:'Signing in, installing and working offline', html:`
    <p>Sign in with your portal username and password while you have internet. After the first sign in the app remembers you and works offline.</p>
    <ul><li><b>Android (Chrome):</b> menu (three dots) then <i>Install app</i> or <i>Add to Home screen</i>.</li>
    <li><b>iPhone (Safari):</b> Share button then <i>Add to Home Screen</i>.</li>
    <li><b>Laptop (Chrome or Edge):</b> click the install icon at the right end of the address bar.</li></ul>
    <p>For offline use, open the app once with internet so your classes and months download. The app also downloads the other sections in the background while it shows <i>Updating...</i> in the status chip.</p>
    <div class="tip">When you are offline everything you save stays on the phone. The status chip shows <b>Offline</b> or <b>N to sync</b>. Do not clear the browser data or sign out until it says <b>Synced</b>.</div>` },

  { id:'screen', nav:'Attendance screen', title:'The attendance screen', html:`
    <p>The screen you use every day. It is built so that as many students as possible fit on the phone. The numbers match the list below the picture.</p>
    ${shot(head({h:1,1:2,2:3,3:4}) + panel({sel:5,tabs:6,ico:7}, P(8, strip(), 1) + P(9, bar, 1)) +
      '<ul class="list" style="margin-top:10px">' + row(1,'Ayesha Khan','JCW-F26-2301','P',{pin:10}) + row(2,'Bushra Noor','JCW-F26-2302','A') + '</ul>' +
      P(11, '<div style="display:flex;gap:8px;width:100%"><button class="btn primary" style="flex:1" tabindex="-1">Save attendance (7 left)</button><button class="btn" tabindex="-1">Absentees PDF</button></div>', 1),
      'Attendance screen (colours follow your phone theme)')}
    ${leg(['<b>Home</b>: back to Home (today\'s classes, reports).','<b>? Help</b>: this manual and hint mode.','<b>Hide / show controls</b>: folds the top card away.','<b>Status chip</b>: Synced, Saving, Offline or N to sync. Tap it for account, sync and text size.','<b>Class, subject and month</b>.','<b>Attendance / Monthly test</b>.','<b>Calendar</b>, <b>Summary</b> and <b>⋯ More</b> (note, more lectures, guest, print, reports, delete, text size).','<b>Day strip</b>: tap a date.','<b>Live count</b> of P, A, L, B and students left.','<b>Student row</b>: mark on the right, tap the name for details.','<b>Save</b> and <b>Absentees PDF</b>.'])}
    <div class="tip">As soon as you start scrolling the list, the top card folds into one thin line, so the whole screen is used for students. Tap that line (or scroll back to the top) to open it again.</div>` },

  { id:'icons', nav:'More menu', title:'Calendar, Summary and the ⋯ More menu', html:`
    <p>Only three buttons sit beside the Attendance / Monthly test tabs, so the controls take one line. Everything else is in <b>⋯ More</b>, with a clear name and a short explanation.</p>
    ${shot('<div class="pcard"><div style="display:flex;gap:10px;justify-content:center;margin-top:6px">' + P(1, '<span class="ib">' + IC.cal + '</span>') + P(2, '<span class="ib">' + IC.sum + '</span>') + P(3, '<span class="ib">' + MOREI + '</span>') + '</div></div>', 'The three buttons')}
    ${leg(['<b>Calendar</b>: the whole month; tap a date to open it.','<b>Summary</b>: monthly attendance and test summary.','<b>⋯ More</b>: opens the list below. A small yellow dot on it means the day has a note.'])}
    <ul><li><b>Add / Edit day note</b>: college closed, class not held, holiday.</li>
    <li><b>More than one lecture today</b>: adds the lecture bar 1, 2, 3… for this day.</li>
    <li><b>Add guest student</b>: a student of another section who attends here.</li>
    <li><b>Print register</b>: the designed monthly register PDF.</li>
    <li><b>Reports</b>: opens the Reports screen.</li>
    <li><b>Delete attendance</b>: removes the marks of this lecture (or day).</li>
    <li><b>Text size</b>: Normal, Large or Extra large (see <i>Text size</i>).</li></ul>
    <p>In <b>Monthly test</b> mode the buttons are Guest, Summary and Print.</p>` },

  { id:'textsize', nav:'Text size', title:'Text size and seeing more students', html:`
    <p>Open <b>⋯ More</b> (or tap the status chip) and choose a <b>Text size</b>. The phone remembers your choice.</p>
    <ul><li><b>Normal</b>: most students on the screen.</li>
    <li><b>Large</b>: bigger names, roll numbers and P / A / L / B buttons.</li>
    <li><b>Extra large</b>: the name gets its own line in very big letters, with four wide buttons under it that are easy to hit. Best for weak eyesight.</li></ul>
    <div class="tip"><b>More students on screen:</b> scroll a little and the controls fold into one line. Tap the arrow button at the top to hide them completely. Use the filter <b>Unmarked</b> to see only students you have not marked yet.</div>
    <p><b>Holding the phone sideways:</b> the controls and the Save button move to the left, and the whole right side shows students in big rows.</p>` },
  { id:'mark', nav:'Marking', title:'Marking attendance', html:`
    ${shot(allrow.replace('<span class="seg">', '<span class="seg rel"><i class="cn pin">1</i>') + '<ul class="list">' + row(1,'Ayesha Khan','JCW-F26-2301','P',{pin:2}) + row(2,'Bushra Noor','JCW-F26-2302','A') + row(3,'Cheema Iqra','JCW-F26-2303','L') + row(4,'Dua Fatima','JCW-F26-2304','B') + row(5,'Esha Ali','JCW-F26-2305','P',{low:true,pin:3}) + '</ul>', 'Marking students')}
    ${leg(['<b>Mark all</b>: tick P (or A, L, B) to mark everyone at once, untick to clear. An Undo button appears for a few seconds.','Tap <b>P, A, L or B</b> on a student. Tap the same letter again to clear it.','A red <b>Attend: 8/12 = 66.7%</b> pill means the student is below 73%.'])}
    <ul><li><b>P Present</b>: counts towards attendance. <b>A Absent</b>: row turns red. <b>L Leave</b>: approved leave. <b>B Bunk</b>: in college but missed the lecture. Only <b>P</b> is counted as attended.</li>
    <li>A lecture counts as <i>held</i> when at least one student is P or A.</li>
    <li>Everyone must be marked before you can save. The button shows how many are <i>left</i>. Use the filter <b>Unmarked</b> to find them.</li>
    <li>Use the <b>search box</b> to find a student by name or roll number. Filters: <b>All</b>, <b>Unmarked</b>, <b>Absent</b>, <b>Low</b>.</li>
    <li>Grey, struck-through students have <b>changed subject</b> (or a guest was removed). They cannot be marked and are not counted.</li>
    <li>A guest is measured only against the lectures in which she was marked, so she is not punished for lectures before she joined.</li>
    <li>Saved a wrong mark? Open the same day (and lecture), correct it and save again. It overwrites.</li></ul>` },

  { id:'days', nav:'Days & calendar', title:'Days, calendar and Today card', html:`
    ${shot(panel({}, strip([1,2,3,4,5,6])), 'Day strip')}
    ${leg(['<b>Yellow dot</b> (top right): the day has a note.','<b>Orange dot</b>: a past day with no attendance (missed).','<b>Green dot</b>: attendance is saved.','<b>Purple badge</b> (x2): more than one lecture that day.','<b>Greyed</b>: Sunday, or a day with no class.','<b>Blue ring and filled</b>: today and the day you are working on.'])}
    ${shot(D('<h2>October 2026</h2><div class="meta">FCS-1 D2 OCT COMPUTER SCIENCE</div><div class="grid">' + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(h => '<div class="h ' + (h === 'Sun' ? 'sun' : '') + '">' + h + '</div>').join('') + '<div></div><div></div><div></div>' +
      Array.from({length:31}, (_, i) => { const d = i + 1, sunday = [4,11,18,25].includes(d), c = sunday ? '' : d === 26 ? 'sel today' : d > 26 ? '' : d === 8 ? 'miss' : d === 16 ? 'has multi' : 'has';
        return '<button class="cell ' + c + '" tabindex="-1"' + (sunday ? ' disabled' : '') + '>' + d + (d === 16 ? '<i class="mb">\u00d72</i>' : '') + '</button>'; }).join('') + '</div>'), 'Calendar (tap the calendar icon)')}
    <p>Open any date in the calendar to mark or correct it. If you have unsaved marks and change the day, the app asks whether to discard them.</p>
    <p>The <b>Today</b> card (under the status line) lists your sections for the current month. A <b>dark chip</b> is still pending, a <b>tick</b> means already marked. Tap a chip to jump straight to it.</p>` },

  { id:'lectures', nav:'More lectures', title:'More than one lecture in a day', html:`
    <p>Tap <b>⋯ More → More than one lecture today</b>. A lecture bar appears under the days.</p>
    ${shot(panel({}, '<div class="lecbar">' + '<span class="lt">Lecture</span>' + P(1,'<button class="pchip sel done" tabindex="-1">1</button>') + P(2,'<button class="pchip" tabindex="-1">2</button>') + P(3,'<button class="pchip add" tabindex="-1">+</button>') + P(4,'<button class="pchip x" tabindex="-1">\u2715</button>') + '</div>'), 'Lecture bar')}
    ${leg(['Lecture 1, already saved (dot under it).','Lecture 2: tap it, mark the students, press <b>Save lecture 2</b>.','<b>+</b> adds another lecture (up to 8).','<b>\u2715</b> returns to one lecture a day (only while no extra lecture is saved).'])}
    <ul><li>Each lecture is saved separately. The sheet shows <b>2P</b>, <b>3P</b> ... in the day cell: the number of lectures the student attended that day.</li>
    <li>If a student has no P in any lecture that day, the sheet shows A, L or B (with the number of lectures in front).</li>
    <li>Attendance percentage counts every lecture as one.</li></ul>` },

  { id:'note', nav:'Day note', title:'Day note (college closed, class not held)', html:`
    <p>Open <b>⋯ More → Add day note</b>.</p>
    ${shot(D('<h2>Note for 26 Oct</h2><div class="meta">Saved in the sheet as a note on this date (the date header turns yellow).</div><div class="chips">' + P(1,'<span class="chip">College closed</span>') + '<span class="chip">Public holiday</span><span class="chip">Class not held</span></div><textarea tabindex="-1" style="margin-top:8px" placeholder="Type the reason here..."></textarea><div class="acts">' + P(2,'<span class="btn small primary">Save note</span>') + '<span class="btn small danger">Remove note</span><span class="btn small">Cancel</span></div>'), 'Note window')}
    ${leg(['Tap a ready reason to fill the box, or type your own.','<b>Save note</b>. The date shows a yellow dot and the status line shows the note. <b>Remove note</b> deletes it.'])}` },

  { id:'delete', nav:'Delete', title:'Deleting attendance', html:`
    <p><b>⋯ More → Delete attendance</b> deletes the attendance of the <b>selected lecture</b> (or of the day if you take only one lecture). Other lectures of that day stay.</p>
    ${shot(D('<h2>Delete lecture 2?</h2><div class="delwarn"><big>Monday, 26 October 2026</big>FCS-1 D2 \u00b7 Computer Science \u00b7 lecture 2<br>26 marks will be removed (P 22, A 3, L 1, B 0)</div><label>To confirm, type the day number: <b>26</b></label>' + P(1,'<input type="text" tabindex="-1" value="26" style="width:100%">',1) + '<div class="acts">' + P(2,'<span class="btn small danger fill">Delete lecture 2</span>') + '<span class="btn small">Cancel</span></div>'), 'Delete window')}
    ${leg(['Type the day number. Until it matches, the Delete button stays disabled.','<b>Delete</b> removes the marks from the sheet.'])}
    <div class="tip">Deleting needs internet and cannot be undone in the app. If the day still has a save waiting to reach the sheet, wait until the status chip says <b>Synced</b>.</div>` },

  { id:'test', nav:'Monthly test', title:'Monthly test marks', html:`
    <p>Tap the <b>Monthly test</b> tab.</p>
    ${shot('<div class="pcard"><div class="mrow"><div class="tabs2"><button tabindex="-1">Attendance</button><button class="on" tabindex="-1">Monthly test</button></div></div>' + P(1,'<label class="tot"><span>Total marks</span><input type="text" value="20" tabindex="-1"></label>',1) +
      '<div class="cnt">26 students \u00b7 12 entered \u00b7 14 left \u00b7 type A, AB or Absent</div>' + P(2,'<button class="fillA" tabindex="-1">Fill empty with A (absent)</button>',1) + '</div><ul class="list" style="margin-top:10px">' +
      '<li class="row rel"><span class="no">1</span><span class="who"><b>Ayesha Khan</b><small><span>JCW-F26-2301</span><span class="mtp">Test: 17/20 = 85%</span></small></span>' + P(3,'<input class="mk" value="17" tabindex="-1">') + '</li>' +
      '<li class="row rel mtlow"><span class="no">2</span><span class="who"><b>Bushra Noor</b><small><span>JCW-F26-2302</span><span class="mtp lowm">Test: 6/20 = 30%</span></small></span><input class="mk bad-no" value="6" tabindex="-1"></li></ul>' +
      P(4,'<button class="btn primary" style="width:100%;margin-top:6px" tabindex="-1">Save test marks (14 left)</button>',1), 'Monthly test screen')}
    ${leg(['Enter the <b>Total marks</b> first (for example 20).','<b>Fill empty with A</b>: marks every empty row absent (Undo is offered). Enter all present students first.','Type each student\'s marks, or <b>A / AB / Absent</b>. Marks above the total are refused.','<b>Save test marks</b>. All students must have marks or A.'])}
    <p>Rows turn <b>red</b> when the student is absent or below 50%. The test marks are written to the M.T column of the sheet, with the total above it.</p>` },

  { id:'guest', nav:'Guest student', title:'Guest students', html:`
    <p>A guest is a student of another section who attends this subject in your class. Open <b>⋯ More → Add guest student</b>.</p>
    ${shot(D('<h2>Add guest student</h2><div class="meta">FCS-1 D2 \u00b7 Computer Science \u00b7 Oct. Search a student of another section.</div>' + P(1,'<input type="search" tabindex="-1" value="saba" style="width:100%">',1) + '<div class="q"><div><b>Saba Gul</b><small>JCW-F26-3120 \u00b7 FCS-1 D4</small></div>' + P(2,'<span class="btn small primary">Add</span>') + '</div>'), 'Guest search')}
    ${leg(['Type at least 2 letters of the name or roll number.','<b>Add</b> and confirm. She appears in your list with a purple <b>Guest</b> tag, in this month and later months.'])}
    <ul><li>The teacher of her own section whose lecture is at the <b>same period on the same days</b> (from the Timetable sheet: <i>Period</i> and the days in <i>Theory / Practical</i>) sees a red tag on her row, for example <b>Guest in FCS-1 D2 for Computer Science in P2 (Mon-Thu) · your period</b>. She is in the other section at that time, so she will not be in that lecture.</li>
    <li><b>No other teacher</b> of her section sees the tag: she attends all their lectures as usual.</li>
    <li>If the Timetable has no period for one of the two classes, the tag is not shown.</li>

    '<input class="hmSearch" id="hmSearch" type="search" placeholder="Search the manual, e.g. delete, guest, offline" autocomplete="off">' +

  document.body.appendChild(dlg);

  hv();
  document.getElementById('hmClose').onclick = () => dlg.close();

  const hb = document.getElementById('hmHover'); if(hb) hb.onclick = () => { store.set('hhover', !store.get('hhover', true)); hv(); };
  document.getElementById('hmNav').addEventListener('click', ev => { const b = ev.target.closest('[data-go]'); if(b) go(b.dataset.go); });
  document.getElementById('hmSearch').addEventListener('input', ev => {
    const t = ev.target.value.trim().toLowerCase(); let n = 0;
    dlg.querySelectorAll('.hmBody section').forEach(s => { const ok = !t || s.textContent.toLowerCase().indexOf(t) !== -1; s.style.display = ok ? '' : 'none'; if(ok) n++; });
    document.getElementById('hmNone').style.display = n ? 'none' : 'block';
  });
}
function openHelp(sec){
  exitHint(); build();
  const dlg = document.getElementById('helpDlg'); if(!dlg.open) dlg.showModal();

}
window.openHelp = openHelp;

<script>
/* ===== JCW PDF Reports add-on v1.0 =====
   Makes the shared reports professional PDF files instead of plain text:
   - "Share absentees" (bottom button + the button in the toast after saving)  -> Daily Absentee Report PDF
   - Monthly summary "Share PDF"                                              -> Monthly Attendance & Test Summary PDF
   - Chief Proctor report: My reports > WhatsApp > "Share as PDF"            -> Student Incident Report PDF

   Paste this block just before </body>, AFTER the other <script> blocks. */
(function(){
'use strict';

/* ---------- settings ---------- */
const COLLEGE     = 'JINNAH COLLEGE FOR WOMEN';
const COLLEGE_SUB = 'University of Peshawar';
const SYSTEM      = 'JCW Daily Attendance';
const LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'
];
const INK=[15,27,45], NAVY=[15,27,45], ACC=[47,91,234], LINE=[214,220,230], MUTED=[102,112,133], SOFT=[247,249,252],
      RED=[217,45,32], REDBG=[253,236,234], GREEN=[18,128,92], GREENBG=[230,244,238],
      AMB=[183,121,31], AMBBG=[255,244,219], PUR=[91,63,209], PURBG=[238,233,255];

/* ---------- PDF library: loaded once, then cached by the browser ---------- */
/* The PDF tool is kept in the phone's cache storage, so PDFs also work offline after the app was opened online once. */
const PDF_CACHE = 'jcw-pdf-tools-v1';
function addScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = res; s.onerror = () => { s.remove(); rej(new Error('not loaded')); };
    document.head.appendChild(s);
  });
}
async function fromCache(src){
  if(!window.caches) throw new Error('no cache');
  const r = await (await caches.open(PDF_CACHE)).match(src);
  if(!r) throw new Error('not cached');
  const url = URL.createObjectURL(new Blob([await r.text()], { type:'text/javascript' }));
  try{ await addScript(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
}
async function loadScript(src){
  try{ await fromCache(src); return; }catch(e){}
  try{ await addScript(src); }
  catch(e){ throw new Error('PDF tools could not be loaded. Open the app once with internet, then PDFs also work offline.'); }
  try{ if(window.caches) (await caches.open(PDF_CACHE)).add(src).catch(() => {}); }catch(e){}
}
const ready = () => !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
let libP = null;
function libs(){
  if(ready()) return Promise.resolve();
  if(!libP) libP = (window.jspdf ? Promise.resolve() : loadScript(LIBS[0]))
    .then(() => ready() ? null : loadScript(LIBS[1]))

}
const warm = () => { if(navigator.onLine) libs().catch(() => {}); };
setTimeout(warm, 3000); window.addEventListener('online', warm);

/* ---------- drawing helpers ---------- */
const W = doc => doc.internal.pageSize.getWidth(), H = doc => doc.internal.pageSize.getHeight();
const TOP = 30, safe = s => String(s || '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const stampNow = () => new Date().toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });

function newDoc(o){ const doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4', orientation:o || 'portrait' }); doc.setLineHeightFactor(1.4); return doc; }
function need(doc, Y, h){ if(Y + h > H(doc) - 20){ doc.addPage(); return TOP; } return Y; }
function fit(doc, s, w){ s = String(s); if(doc.getTextWidth(s) <= w) return s; while(s.length > 1 && doc.getTextWidth(s + '...') > w) s = s.slice(0, -1); return s + '...'; }

function heading(doc, Y, t, sub){
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(...INK); doc.text(t, 14, Y + 6);
  if(sub){ doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...MUTED); doc.text(sub, 14, Y + 11.5); }
  doc.setDrawColor(...ACC); doc.setLineWidth(0.8); doc.line(14, Y + 14.5, 36, Y + 14.5); doc.setLineWidth(0.2);

}
function sectionTitle(doc, Y, t){
  Y = need(doc, Y, 20);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...ACC); doc.text(t.toUpperCase(), 14, Y + 3);
  return Y + 5.5;
}
function infoGrid(doc, Y, pairs, cols){
  cols = cols || 3; const w = (W(doc) - 28) / cols, h = 12.5;
  Y = need(doc, Y, Math.ceil(pairs.length / cols) * h);
  pairs.forEach((p, i) => {
    const x = 14 + (i % cols) * w, y = Y + Math.floor(i / cols) * h;
    doc.setDrawColor(...LINE); doc.setFillColor(...SOFT); doc.rect(x, y, w, h, 'FD');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(6.8); doc.setTextColor(...MUTED); doc.text(String(p[0]).toUpperCase(), x + 3, y + 4.6);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(fit(doc, p[1] == null || p[1] === '' ? '-' : p[1], w - 6), x + 3, y + 9.9);
  });

}
function statBoxes(doc, Y, items){
  const gap = 3, w = (W(doc) - 28 - gap * (items.length - 1)) / items.length, h = 17;
  Y = need(doc, Y, h);
  items.forEach((it, i) => {
    const x = 14 + i * (w + gap);
    doc.setDrawColor(...LINE); doc.setFillColor(...(it.bg || SOFT)); doc.roundedRect(x, Y, w, h, 2, 2, 'FD');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(...(it.c || INK)); doc.text(String(it.v), x + w / 2, Y + 8.2, { align:'center' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(6.8); doc.setTextColor(...MUTED); doc.text(fit(doc, it.l.toUpperCase(), w - 3), x + w / 2, Y + 13.6, { align:'center' });
  });

}
function notice(doc, Y, text, kind){
  const col = ({ warn:[AMB, AMBBG], ok:[GREEN, GREENBG], bad:[RED, REDBG] })[kind] || [AMB, AMBBG], w = W(doc) - 28;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9);

}
function smallNote(doc, Y, text){
  doc.setFont('helvetica', 'italic'); doc.setFontSize(7.5); doc.setTextColor(...MUTED);
  const lines = doc.splitTextToSize(text, W(doc) - 28); Y = need(doc, Y, lines.length * 3.6 + 2);
  doc.text(lines, 14, Y + 3); return Y + lines.length * 3.6 + 2;
}
function textBox(doc, Y, text, minH){
  const w = W(doc) - 28; doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  const lines = text ? doc.splitTextToSize(String(text), w - 8) : [], lh = 4.95; let i = 0;
  if(!lines.length){
    Y = need(doc, Y, minH || 24);
    doc.setDrawColor(...LINE); doc.setFillColor(255, 255, 255); doc.roundedRect(14, Y, w, minH || 24, 2, 2, 'FD');
    return Y + (minH || 24) + 3;
  }
  while(i < lines.length){
    Y = need(doc, Y, 16);
    const room = Math.max(1, Math.floor((H(doc) - 22 - Y - 6) / lh)), part = lines.slice(i, i + room), h = Math.max(part.length * lh + 6, minH || 0);
    doc.setDrawColor(...LINE); doc.setFillColor(...SOFT); doc.roundedRect(14, Y, w, h, 2, 2, 'FD');
    doc.setTextColor(...INK); doc.text(part, 18, Y + 6.3); Y += h + 3; i += part.length;
  }
  return Y;
}
function signatures(doc, Y, labels){
  Y = need(doc, Y, 30); Y += 20; const w = (W(doc) - 28) / labels.length;
  labels.forEach((l, i) => {
    const x1 = 14 + i * w + 6, x2 = 14 + (i + 1) * w - 6;
    doc.setDrawColor(...MUTED); doc.setLineWidth(0.3); doc.line(x1, Y, x2, Y); doc.setLineWidth(0.2);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTED); doc.text(l, (x1 + x2) / 2, Y + 4.5, { align:'center' });
  });

}
function table(doc, opts){
  doc.autoTable(Object.assign({
    margin:{ top:TOP, left:14, right:14, bottom:18 }, theme:'grid',
    styles:{ font:'helvetica', fontSize:8.8, cellPadding:2, lineColor:LINE, lineWidth:0.2, textColor:INK, valign:'middle' },
    headStyles:{ fillColor:NAVY, textColor:[255, 255, 255], fontStyle:'bold', halign:'center', fontSize:8.3 },
    alternateRowStyles:{ fillColor:SOFT }
  }, opts));

}
/** College band on top and page numbers at the bottom of every page. */
function finalize(doc){
  const n = doc.internal.getNumberOfPages(), w = W(doc), h = H(doc), stamp = stampNow();
  for(let i = 1; i <= n; i++){
    doc.setPage(i);
    doc.setFillColor(...NAVY); doc.rect(0, 0, w, 22, 'F'); doc.setFillColor(...ACC); doc.rect(0, 22, w, 1.2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(255, 255, 255); doc.text(COLLEGE, 14, 10);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(200, 212, 235); doc.text(COLLEGE_SUB, 14, 15.5);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(255, 255, 255); doc.text(SYSTEM, w - 14, 10, { align:'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(200, 212, 235); doc.text(stamp, w - 14, 15.5, { align:'right' });
    doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(14, h - 13, w - 14, h - 13);
    doc.setFontSize(7.5); doc.setTextColor(...MUTED);
    doc.text('Computer-generated report' + (teacher ? ' \u00b7 prepared by ' + teacher : '') + ' \u00b7 ' + stamp, 14, h - 8.5);
    doc.text('Page ' + i + ' of ' + n, w - 14, h - 8.5, { align:'right' });
  }
}

  const list = act.filter(s => WORD[draft[s.roll]]);
  const dateTxt = new Date(y, m, sel.day).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

        if((h.column.index === 5 || h.column.index === 6) && f.low){ h.cell.styles.textColor = RED; h.cell.styles.fontStyle = 'bold'; }

    file:'Absentees_' + safe(sel.cls) + '_' + safe(titleCase(sel.sub)) + '_' + sel.day + '-' + MONTHS[m].slice(0, 3) + '-' + y + (hasMulti() ? '_L' + sel.period : '') + '.pdf' };

  const ps = all.map(r => r.p).filter(p => p != null), avg = ps.length ? Math.round(ps.reduce((a, b) => a + b, 0) / ps.length * 10) / 10 : null;

/* ---------- 4) Monthly Attendance Register (replaces the plain Google-Sheet print) ---------- */
/** Text of one day cell, same rule as the sheet: P, 2P, 3P ... or (no P) L / A / B, with the lecture count in front. */
function dayCell(pm, roll){
  const ps = Object.keys(pm || {}), seen = {}; let p = 0;
  ps.forEach(k => { const v = pm[k][roll]; if(!v) return; if(v === 'P') p++; else seen[v] = 1; });
  if(p) return p === 1 ? 'P' : p + 'P';
  for(const k of ['L', 'A', 'B']) if(seen[k]) return ps.length > 1 ? ps.length + k : k;
  return '';
}
function registerPdf(){
  const d = data[sheetName()], { m, y, n } = dayInfo(), T = mtView(d);
  const days = Array.from({ length:n }, (_, i) => i + 1), PM = {}, isSun = {}, held = {};
  let lect = 0;
  days.forEach(day => {
    PM[day] = pmOf(day);                                   // sheet data + anything still waiting on the phone
    isSun[day] = new Date(y, m, day).getDay() === 0;
    held[day] = Object.keys(PM[day]).filter(p => Object.values(PM[day][p]).some(v => v === 'P' || v === 'A')).length;
    lect += held[day];
  });
  const rows = d.students.map(s => {
    let p = 0, a = 0;
    days.forEach(day => Object.keys(PM[day]).forEach(k => { const v = PM[day][k][s.roll]; if(v === 'P') p++; else if(v === 'A') a++; }));
    const den = s.guest ? p + a : lect, pct = !s.off && den ? Math.round(p / den * 1000) / 10 : null, t = s.off ? null : T.get(s.roll);
    return { s, p, den, pct, t, low:pct != null && pct < LOW, cells:days.map(day => s.off ? '' : dayCell(PM[day], s.roll)) };
  });
  const act = rows.filter(r => !r.s.off), ps = act.map(r => r.pct).filter(v => v != null);
  const avg = ps.length ? Math.round(ps.reduce((a, b) => a + b, 0) / ps.length * 10) / 10 : null;
  const nLow = act.filter(r => r.low).length, nMt = act.filter(r => r.t && r.t.low).length;

  const doc = newDoc('landscape'); let Y = TOP;
  Y = heading(doc, Y, 'Monthly Attendance Register', sel.cls + ' \u00b7 ' + titleCase(sel.sub) + ' \u00b7 ' + MONTHS[m] + ' ' + y);
  Y = infoGrid(doc, Y, [
    ['Class / Section', sel.cls], ['Subject', titleCase(sel.sub)], ['Subject teacher', teacher || user],
    ['Month', MONTHS[m] + ' ' + y], ['Lectures held', lect], ['Students', act.length]
  ], 6) + 3;
  Y = statBoxes(doc, Y, [
    { l:'Avg attendance', v:avg == null ? '-' : avg + '%', c:avg != null && avg < LOW ? RED : GREEN, bg:avg != null && avg < LOW ? REDBG : GREENBG },
    { l:'Students below ' + LOW + '%', v:nLow, c:nLow ? RED : INK, bg:nLow ? REDBG : SOFT },
    { l:'Monthly test total', v:T.total || '-' },
    { l:'Test below 50% / absent', v:T.total ? nMt : '-', c:nMt ? RED : INK, bg:nMt ? REDBG : SOFT }
  ]) + 4;

  const D0 = 3, DN = D0 + n - 1, cAtt = DN + 1, cHeld = DN + 2, cPct = DN + 3, cMt = DN + 4;
  const fixed = 7 + 23 + 42 + 10 + 10 + 12 + 11, dayW = (W(doc) - 20 - fixed) / n;
  const colStyles = { 0:{ cellWidth:7, halign:'center' }, 1:{ cellWidth:23 }, 2:{ cellWidth:42 } };
  days.forEach((_, i) => { colStyles[D0 + i] = { cellWidth:dayW, halign:'center', fontSize:6.2 }; });
  colStyles[cAtt] = { cellWidth:10, halign:'center', fontStyle:'bold' }; colStyles[cHeld] = { cellWidth:10, halign:'center' };
  colStyles[cPct] = { cellWidth:12, halign:'center', fontStyle:'bold' }; colStyles[cMt] = { cellWidth:11, halign:'center' };

  table(doc, {
    startY:Y, margin:{ top:TOP, left:10, right:10, bottom:18 },
    styles:{ font:'helvetica', fontSize:7, cellPadding:0.9, lineColor:LINE, lineWidth:0.15, textColor:INK, valign:'middle', overflow:'ellipsize' },
    headStyles:{ fillColor:NAVY, textColor:[255, 255, 255], fontStyle:'bold', halign:'center', valign:'middle', fontSize:6.2, cellPadding:0.8 },
    head:[['#', 'Roll No', 'Student Name'].concat(days.map(day => day + '\n' + WD[new Date(y, m, day).getDay()].slice(0, 2)),
      ['Att.', 'Held', '%', 'M.T' + (T.total ? '\n/' + T.total : '')])],
    body:rows.map((r, i) => [i + 1, r.s.roll, r.s.name + (r.s.off ? ' (left subject)' : r.s.guest ? ' (Guest)' : '')].concat(r.cells,
      [r.s.off ? '' : r.p, r.s.off ? '' : r.den, r.pct == null ? '-' : r.pct, r.t ? (r.t.abs ? 'A' : r.t.n) : '-'])),
    columnStyles:colStyles,
    didParseCell:h => {
      const c = h.column.index, isDay = c >= D0 && c <= DN, day = c - D0 + 1;
      if(h.section === 'head'){
        if(isDay && isSun[day]) h.cell.styles.fillColor = [90, 100, 118];
        else if(isDay && held[day] > 1) h.cell.styles.fillColor = PUR;
        return;
      }
      const r = rows[h.row.index], st = h.cell.styles;
      if(r.s.off){ st.textColor = [160, 166, 176]; st.fontStyle = 'italic'; st.fillColor = [242, 243, 245]; return; }
      if(isDay){
        const v = String(h.cell.raw || '');

        if(/P$/.test(v)){ st.textColor = GREEN; st.fontStyle = 'bold'; }
        else if(/A$/.test(v)){ st.textColor = RED; st.fillColor = REDBG; st.fontStyle = 'bold'; }
        else if(/L$/.test(v)){ st.textColor = AMB; st.fillColor = AMBBG; st.fontStyle = 'bold'; }
        else if(/B$/.test(v)){ st.textColor = PUR; st.fillColor = PURBG; st.fontStyle = 'bold'; }
      }
      if(c === cPct){ if(r.low){ st.textColor = RED; st.fillColor = REDBG; } else if(r.pct != null) st.textColor = GREEN; }
      if(c === cMt && r.t && r.t.low){ st.textColor = RED; st.fillColor = REDBG; st.fontStyle = 'bold'; }
    }
  });
  Y = doc.lastAutoTable.finalY + 3;
  Y = smallNote(doc, Y, 'P = present (2P = present in 2 lectures that day), A = absent, L = leave, B = bunk. Only P counts as attended. ' +
    'Att. = lectures attended, Held = lectures held (for a guest: lectures in which she was marked). Red = attendance below ' + LOW +
    '% or monthly test below 50% / absent. Grey header = Sunday, purple = more than one lecture.');
  if(queue.some(q => q.sheet === sheetName())) Y = notice(doc, Y, 'Some attendance in this register is saved on the teacher\'s phone and has not reached the college sheet yet.', 'warn');
  signatures(doc, Y, ['Subject Teacher', 'HOD', 'Principal']);
  finalize(doc);
  return { doc, title:'Attendance register ' + sel.cls + ' ' + titleCase(sel.sub),
    file:'Register_' + safe(sel.cls) + '_' + safe(titleCase(sel.sub)) + '_' + MONTHS[m].slice(0, 3) + '-' + y + '.pdf' };
}

/* ---------- share (phone) or download (laptop) ---------- */
function download(blob, name){
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
/** Every finished PDF / Excel file opens this small window: Share (WhatsApp, email...), Download, Open / Print.
 *  Each button is a fresh tap, so phones never block sharing or opening. */
function fileDlg(){
  let d = document.getElementById('fileDlg');
  if(!d){ d = document.createElement('dialog'); d.id = 'fileDlg'; d.innerHTML = '<div class="dlg" id="fileDlgBody"></div>'; document.body.appendChild(d); }
  return d;
}
function offerFile(blob, name, title, preferOpen){
  const d = fileDlg(), isPdf = /\.pdf$/i.test(name), file = new File([blob], name, { type:blob.type || (isPdf ? 'application/pdf' : 'text/csv') });
  const canShare = !!(navigator.canShare && navigator.canShare({ files:[file] })), kb = Math.max(1, Math.round(blob.size / 1024));
  const big = (id, label, sub, primary) => `<button type="button" class="fbtn ${primary ? 'primary' : ''}" id="${id}"><b>${label}</b><small>${sub}</small></button>`;
  const first = preferOpen && isPdf ? 'open' : canShare ? 'share' : 'down';
  document.getElementById('fileDlgBody').innerHTML = `<h2>${isPdf ? 'PDF' : 'Excel file'} ready</h2>
    <div class="meta">${esc(name)} · ${kb} KB</div>
    <div class="fbtns">
      ${canShare ? big('fShare', 'Share', 'WhatsApp, Gmail, Drive…', first === 'share') : ''}
      ${big('fDown', 'Download', 'Save the file on this ' + (/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 'phone' : 'computer'), first === 'down')}
      ${big('fOpen', 'Open / Print', isPdf ? 'View it now, or print it' : 'View as a table, filter, print', first === 'open')}
    </div>
    <div class="acts"><button class="btn small grow" id="fClose">Close</button></div>`;
  if(!d.open) d.showModal();
  const close = () => { if(d.open) d.close(); };
  document.getElementById('fClose').onclick = close;
  const sh = document.getElementById('fShare');
  if(sh) sh.onclick = () => navigator.share({ files:[file], title })
    .then(close).catch(e => { if(!e || e.name !== 'AbortError') toast('Could not share. Use Download, then attach the file.'); });
  document.getElementById('fDown').onclick = () => {
    download(blob, name); close();
    toast('Downloaded: ' + name + '\nYou find it in the Downloads folder' + (isPdf ? ' (Files / My Files app on a phone).' : '. It opens in Excel or Google Sheets.'));
  };
  const op = document.getElementById('fOpen');
  if(op && !isPdf) op.onclick = () => { csvView(blob, name, title); close(); };
  else if(op) op.onclick = () => {
    const u = URL.createObjectURL(blob), w = window.open(u, '_blank');
    if(!w){ download(blob, name); toast('The PDF was downloaded (this browser does not open it directly).'); }
    setTimeout(() => URL.revokeObjectURL(u), 120000); close();
  };
}
async function deliver(r, preferOpen){ offerFile(r.doc.output('blob'), r.file, r.title, preferOpen); }
/** CSV text -> rows (quotes, commas and new lines inside quotes, BOM) */
function parseCsv(t){
  t = String(t || '').replace(/^﻿/, ''); const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true; else if(c === ','){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x !== ''));
}
/** "Open / Print" for an Excel (CSV) file: a table in a new tab with a filter on every column and a Print button. */

    const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${e(title || name)}</title>
<style>body{margin:0;font:13px/1.4 system-ui,Segoe UI,Arial,sans-serif;color:#101828;background:#fff}

/* ---------- small helpers ---------- */
const pct2 = (a, b) => b ? Math.round(a / b * 1000) / 10 : null;

/* ---------- attendance of ANY sheet (not only the one on screen) ---------- */
function sheetPm(name, day){
  const d = data[name], src = (d && d.marks && d.marks[day]) || {}, out = {};

  queue.forEach(q => {
    if(q.sheet !== name || q.day !== day || q.kind === 'mt') return;
    const p = String(q.period || 1), m = out[p] = out[p] || {};
    Object.keys(q.marks).forEach(r => { if(q.marks[r] === '') delete m[r]; else m[r] = q.marks[r]; });
    if(!Object.keys(m).length) delete out[p];
  });
  return out;
}
function sheetNote(name, day){
  const q = queue.find(x => x.sheet === name && x.kind !== 'mt' && x.day === day && x.note !== undefined);
  if(q) return q.note;

/** { lect, per:{ roll:{p,a,l,b,den,pct} }, d }. range = { from, to } days, or all days of the month. */
function sheetStats(name, range){
  const d = data[name]; if(!d) return null;
  const per = {}; let lect = 0;
  d.students.forEach(s => { per[s.roll] = { p:0, a:0, l:0, b:0, g:!!s.guest }; });
  for(let day = 1; day <= 31; day++){
    if(range && (day < range.from || day > range.to)) continue;
    const pm = sheetPm(name, day);
    Object.keys(pm).forEach(k => {
      const m = pm[k]; let any = 0;
      Object.keys(m).forEach(r => { const v = m[r]; if(v === 'P' || v === 'A') any = 1; const c = per[r]; if(c && v && c[v.toLowerCase()] != null) c[v.toLowerCase()]++; });
      if(any) lect++;
    });
  }
  Object.keys(per).forEach(r => { const c = per[r]; c.den = c.g ? c.p + c.a : lect; c.pct = pct2(c.p, c.den); });
  return { lect, per, d };
}
function sheetMY(e){
  const d = data[e.name]; if(d && d.m != null && d.y) return { m:d.m, y:d.y };
  const now = new Date(), m = monIdx(e.mon), start = (now.getMonth() > 7 || (now.getMonth() === 7 && now.getDate() >= 15)) ? now.getFullYear() : now.getFullYear() - 1;
  return { m, y: m >= 7 ? start : start + 1 };
}
function mtOf(name, roll){
  const q = queue.find(x => x.sheet === name && x.kind === 'mt'), d = data[name];
  const src = q ? { total:q.total, marks:q.marks } : ((d && d.mt) || { total:0, marks:{} }), total = Number(src.total) || 0;
  const v = src.marks ? src.marks[roll] : undefined;
  if(v === undefined || v === '' || !total) return null;
  if(String(v).toUpperCase() === 'A') return { abs:true, low:true, txt:'Absent', total };
  const n = Number(v), p = pct2(n, total); return { n, p, low:p < 50, txt:n + '/' + total, total };
}
function cellTxt(pm, roll){
  const ps = Object.keys(pm || {}), seen = {}; let p = 0;
  ps.forEach(k => { const v = pm[k][roll]; if(!v) return; if(v === 'P') p++; else seen[v] = 1; });
  if(p) return p === 1 ? 'P' : p + 'P';
  for(const k of ['L', 'A', 'B']) if(seen[k]) return ps.length > 1 ? ps.length + k : k;
  return '';
}
function secAgg(e, range){
  const st = sheetStats(e.name, range); if(!st) return null;
  let att = 0, pos = 0, low = 0, n = 0;
  st.d.students.forEach(s => { if(s.off) return; n++; const c = st.per[s.roll]; if(!c || !c.den) return; att += c.p; pos += c.den; if(c.pct < LOW) low++; });
  return { e, st, att, pos, pct:pct2(att, pos), low, n };
}
/** Students below LOW in the teacher's current-month sections. mode 'week' or 'month'. Items: { s, e, c (month), w (week) } */
function lowList(mode, list){
  const out = [], wk = weekRange();
  list.forEach(e => {
    const mon = sheetStats(e.name); if(!mon) return;
    const wks = sheetStats(e.name, wk);
    mon.d.students.forEach(s => {
      if(s.off) return;
      const c = mon.per[s.roll], w = wks.per[s.roll], ref = mode === 'week' ? w : c;
      if(!ref || !ref.den || ref.pct >= LOW) return;
      out.push({ s, e, c, w });
    });
  });
  out.sort((x, y) => mode === 'week' ? x.w.pct - y.w.pct : x.c.pct - y.c.pct);
  return out;
}

/** Opens the attendance screen, optionally on another section / day. Unsaved marks are kept unless the section changes. */
function goAttend(e, day){

  if(navigator.onLine && authed() && Date.now() - gtWinAt > 600000){

  }
  const now = Date.now(), n = new Date(), jan = new Date(n.getMonth() >= 7 ? n.getFullYear() + 1 : n.getFullYear(), 0, 1).getTime();
  const w = gtWin || { opens:jan, deadline:null }, adm = scope === 'all';
  const before = w.opens && now < w.opens, after = w.deadline && now > w.deadline, open = !before && !after;

/* ======================= self-update =======================
   A phone or laptop may keep opening an old saved copy of the app after a new index.html is put on GitHub.
   Each time the app opens online it reads the newest index.html (bypassing every cache); when its version
   differs, the saved copies are replaced and the app reloads once with the new version. */
const APP_BUILD = '2026-10-31 v7.8 student search pdf copy';
async function checkUpdate(manual){
  if(!navigator.onLine) return manual && toast('No internet. Try again when online.');
  try{
    const url = location.pathname + (location.pathname.endsWith('/') ? 'index.html' : '');
    const res = await fetch(url + '?nocache=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text(), m = txt.match(/const APP_BUILD = '([^']+)'/), remote = m ? m[1] : '';
    if(!remote || remote === APP_BUILD){ if(manual) toast('You have the latest version (' + APP_BUILD + ').'); return; }
    if(sessionStorage.getItem('jcwUpd') === remote && !manual) return;           // tried once already in this visit: no reload loop
    sessionStorage.setItem('jcwUpd', remote);
    if(queue.length && !manual) return toast('A new version of the app is ready. It installs after your records are synced.');
    toast('Installing the new version…');
    try{ for(const k of await caches.keys()) if(k !== 'jcw-pdf-tools-v1') await caches.delete(k); }catch(e){}
    try{ const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.update().catch(() => {}))); }catch(e){}
    try{ const c = await caches.open('jcw-shell-latest'); await c.put(url, new Response(txt, { headers:{ 'Content-Type':'text/html; charset=utf-8' } })); }catch(e){}
    setTimeout(() => location.reload(), 800);
  }catch(e){ if(manual) toast('Could not check for an update: ' + errText(e)); }
}
setTimeout(() => checkUpdate(false), 4000);
window.addEventListener('online', () => setTimeout(() => checkUpdate(false), 3000));

function oneStudent(S, roll){

  const home = list.find(s => !s.guest && !/optional/i.test(s.cls)) || list[0], m = Object.assign({}, home, { subs:Object.assign({}, home.subs) });
  list.forEach(s => { if(s !== home) Object.keys(s.subs).forEach(k => { if(!m.subs[k]) m.subs[k] = s.subs[k]; }); });
  const live = Object.values(m.subs).filter(g => !g.off);
  m.p = live.reduce((a, g) => a + g.p, 0); m.d = live.reduce((a, g) => a + g.d, 0); m.pct = pct2(m.p, m.d);
  m.ms = live.reduce((a, g) => a + g.ms, 0); m.mtT = live.reduce((a, g) => a + g.mtT, 0); m.tp = m.mtT ? pct2(m.ms, m.mtT) : null;

/* ======================= TOPPERS (monthly test, grand test, detention) and 100% ATTENDANCE =======================
   Toppers: marks of every section sheet of the exam workbook (server, kept 20 min), ranked here by subject, section,
   program, class and whole college, morning and evening separately (evening sections = timetable settings).
   Equal marks share a position (1, 1, 2 ...). Overall % only for students with marks in all their subjects of the exam.
   100% attendance: every lecture of every subject attended (leave is not attendance), from the attendance records. */
let tp = Object.assign({ kind:'tp', exam:'mt', mon:SEAS[seasNow()], n:3, from:'SEPT', to:SEAS[seasNow()] }, store.get('tp', {})), tpBusy = false;
const tpMarks = {};
const TP_EXAMS = [['mt', 'Monthly test'], ['gt', 'Grand test'], ['dt', 'Detention']];
const tpExamName = () => tp.exam === 'mt' ? monName(tp.mon) + ' Monthly Test' : tp.exam === 'gt' ? 'Grand Test' : 'Detention Exam';
const clsU = c => String(c || '').toUpperCase().replace(/\s+/g, '');
const clsProg = c => { const u = clsU(c); return /^FCS/.test(u) ? 'FCS' : /^PRE-?ENG/.test(u) ? 'Pre-Engineering' : /^F\.?A-?\d/.test(u) ? 'F.A' : /^[A-Z]\d$/.test(u) ? 'Pre-Medical' : 'Other'; };
const clsYear = c => { const m = clsU(c).match(/^(?:FCS|PRE-?ENG|F\.?A)-?(\d)/) || clsU(c).match(/^[A-Z](\d)$/); return m ? (m[1] === '1' ? '1st Year' : '2nd Year') : 'Other'; };
const SHIFTS = [['M', 'Morning'], ['E', 'Evening']];
function shiftMap(){ const m = {}; [].concat((ttAll && ttAll.rows) || [], (tt && tt.rows) || []).forEach(r => { if(r && r.cls && shR(r) === 'E') m[normC(r.cls)] = 'E'; }); return m; }
const SUBK_ALIAS = { PASHTO:'PUSHTO', ISLAMIYATELECTIVE:'ISLAMIYATELE' };
const subK = x => { const k = String(x || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return SUBK_ALIAS[k] || k; };
const r2 = v => Math.round(v * 100) / 100;
function tpModel(list){
  const sm = shiftMap();
  const S = list.map(x => {
    const subs = Object.keys(x[3] || {}).map(k => { const v = x[3][k][0], max = Number(x[3][k][1]) || 0, o = v === 'A' ? 0 : Number(v) || 0; return { sub:k, v, o, max, pct:max ? r2(o / max * 100) : 0 }; }).filter(g => g.max > 0 && g.o <= g.max);   // marks above the total = typing mistake, left out
    return { roll:x[0], name:x[1], cls:x[2], sh:sm[normC(x[2])] || 'M', prog:clsProg(x[2]), yr:clsYear(x[2]), subs, takes:(x[4] || []).map(subK) };
  });
  const secSubs = {}; S.forEach(s => s.subs.forEach(g => { (secSubs[s.cls] = secSubs[s.cls] || new Set()).add(subK(g.sub)); }));
  S.forEach(s => {
    const have = new Set(s.subs.map(g => subK(g.sub)));
    s.missing = [...(secSubs[s.cls] || [])].filter(k => (!s.takes.length || s.takes.includes(k)) && !have.has(k));
    s.obt = s.subs.reduce((a, g) => a + g.o, 0); s.max = s.subs.reduce((a, g) => a + g.max, 0);
    s.pct = s.max ? r2(s.obt / s.max * 100) : 0; s.ok = s.subs.length > 0 && !s.missing.length && s.obt > 0;

}
/** positions 1..n, equal values share a position */
function rankTop(arr, val, n){
  const a = arr.filter(x => val(x) > 0).sort((x, y) => val(y) - val(x)), out = []; let pos = 0, last = null;
  for(const x of a){ const v = val(x); if(v !== last){ pos++; last = v; } if(pos > n) break; out.push({ pos, x, v }); }
  return out;
}
const ordN = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
const byNum = (a, b) => a.localeCompare(b, undefined, { numeric:true });
/** every table of the toppers report for one shift: [{ title, head, rows:[{ cells, pos }] }] */
function tpTables(S, n){
  const ok = S.filter(s => s.ok), T = [];
  const studRow = (g, r, extra) => ({ pos:r.pos, cells:[].concat(g, [ordN(r.pos), r.x.roll, r.x.name], extra ? [r.x.cls] : [], [r.x.obt + ' / ' + r.x.max, r.x.pct + '%']) });
  const grp = (title, label, keys, pick, extra) => {
    const rows = [];
    keys.forEach(k => rankTop(ok.filter(s => pick(s) === k), s => s.pct, n).forEach((r, i) => rows.push(studRow(i ? [''] : [k], r, extra))));
    if(rows.length) T.push({ title, head:[label, 'Pos', 'Roll No', 'Student name'].concat(extra ? ['Section'] : [], ['Marks', '%']), rows });
  };
  const college = rankTop(ok, s => s.pct, n).map(r => studRow([], r, true));
  if(college.length) T.push({ title:'Whole college', head:['Pos', 'Roll No', 'Student name', 'Section', 'Marks', '%'], rows:college });
  const yrs = [...new Set(S.map(s => s.yr))].sort(), progs = [...new Set(S.map(s => s.prog))].sort(), secs = [...new Set(S.map(s => s.cls))].sort(byNum);
  grp('Each class', 'Class', yrs, s => s.yr, true);
  grp('Each program (both years)', 'Program', progs, s => s.prog, true);
  grp('Each program and class', 'Program · class', [...new Set(S.map(s => s.prog + ' · ' + s.yr))].sort(), s => s.prog + ' · ' + s.yr, true);
  grp('Each section', 'Section', secs, s => s.cls, false);
  // subjects: class-wise (1st year Physics and 2nd year Physics are different papers)
  const subRows = [];
  yrs.forEach(y => {
    const inY = S.filter(s => s.yr === y), subs = [...new Set(inY.flatMap(s => s.subs.map(g => g.sub)))].sort();
    subs.forEach(sub => {
      const xs = inY.map(s => ({ s, g:s.subs.find(g => g.sub === sub) })).filter(z => z.g);
      rankTop(xs, z => z.g.pct, n).forEach((r, i) => subRows.push({ pos:r.pos, cells:[i ? '' : y, i ? '' : titleCase(sub), ordN(r.pos), r.x.s.roll, r.x.s.name, r.x.s.cls, r.x.g.o + ' / ' + r.x.g.max, r.x.g.pct + '%'] }));
    });
  });
  if(subRows.length) T.push({ title:'Each subject (class-wise)', head:['Class', 'Subject', 'Pos', 'Roll No', 'Student name', 'Section', 'Marks', '%'], rows:subRows });
  const secSub = [];
  secs.forEach(c => {
    const inC = S.filter(s => s.cls === c), subs = [...new Set(inC.flatMap(s => s.subs.map(g => g.sub)))].sort(); let first = true;
    subs.forEach(sub => {
      const xs = inC.map(s => ({ s, g:s.subs.find(g => g.sub === sub) })).filter(z => z.g), top = rankTop(xs, z => z.g.pct, 1);
      if(!top.length) return;
      secSub.push({ pos:1, cells:[first ? c : '', titleCase(sub), top.map(r => r.x.s.name + ' (' + r.x.s.roll + ')').join(', '), top[0].x.g.o + ' / ' + top[0].x.g.max] }); first = false;
    });
  });
  if(secSub.length) T.push({ title:'Subject toppers of each section', head:['Section', 'Subject', 'Topper(s)', 'Marks'], rows:secSub });
  return T;
}
const MEDAL = { 1:[255, 215, 0], 2:[205, 205, 205], 3:[222, 160, 100] };

const seasonTxt = () => { const y = new Date().getMonth() >= 7 ? new Date().getFullYear() : new Date().getFullYear() - 1; return y + '-' + String(y + 1).slice(-2); };
/* ----- 100% attendance ----- */
function hundredModel(rows, mons){
  const by = {};
  aggregate(rows).forEach(s => {
    const b = by[s.roll] = by[s.roll] || { roll:s.roll, name:s.name, cls:'', p:0, d:0, months:{} };
    if(!b.cls || (!s.guest && !/optional/i.test(s.cls) && b.weak)){ b.cls = s.cls; b.weak = !!s.guest || /optional/i.test(s.cls); }
    Object.values(s.subs).forEach(g => { if(g.off) return; b.p += g.p; b.d += g.d;
      Object.keys(g.months).forEach(m => { const x = g.months[m]; if(x.off) return; const mm = b.months[m] = b.months[m] || { p:0, d:0 }; mm.p += x.p; mm.d += x.d; }); });
  });
  const sm = shiftMap(), H = Object.values(by).filter(b => b.d > 0);
  const empty = mons.filter(m => !H.some(b => b.months[m] && b.months[m].d > 0)), live = mons.filter(m => !empty.includes(m));
  H.forEach(b => Object.assign(b, { sh:sm[normC(b.cls)] || 'M',
    full:live.length > 0 && live.every(m => b.months[m] && b.months[m].d > 0 && b.months[m].p >= b.months[m].d),
    some:Object.values(b.months).some(m => m.d > 0 && m.p >= m.d) }));
  H.sort((a, b) => (a.sh === 'E') - (b.sh === 'E') || byNum(a.cls, b.cls) || enrollN(a.roll) - enrollN(b.roll));
  return { H, empty };
}

function ssFind(v){

  if(!navigator.onLine){ ssv.err = 'Student search needs internet.'; ssPaintList(); return; }
  ssv.busy = true; ssPaintList();
  ssv.t = setTimeout(async () => {
    try{
      const r = await api({ action:'st_find', q }, 45000);
      if(ssv.q.trim() !== q) return;
      if(!r.ok) throw new Error(r.error === 'UNKNOWN_ACTION' ? 'The server is not updated yet (StudentSearch).' : r.error);
      ssv.list = r.list || []; ssv.full = !!r.full; ssv.err = '';

function slotRange(p, sh){ const t = timeOf(p, sh); return t ? { s:toM(t.start), e:toM(t.end) } : null; }
/** every teacher in the loaded college timetable: { key, name, dept, info, rows } */
function freeTeachers(){
  const m = {}, info = (ttAll && ttAll.info) || {};

    const k = normalizeKey(r.teacher);

/** this teacher's classes on weekday d: [{ p, sh, s, e, r, kind }] sorted by start time */
function dayClasses(t, d){
  const out = [];
  t.rows.forEach(r => r.ps.forEach(p => {
    const kind = r.pr.includes(d) ? 'Pr' : r.th.includes(d) ? 'Th' : ''; if(!kind) return;
    const sh = r.sh || 'M', rg = slotRange(p, sh) || { s:Number(p) * 100, e:Number(p) * 100 + 60 };
    out.push({ p, sh, s:rg.s, e:rg.e, r, kind });

  const sh = fr.sh, slot = slotRange(fr.p, sh) || { s:Number(fr.p) * 100, e:Number(fr.p) * 100 + 60 };

/** week PDF: a summary grid (number free per day x period), then one page per day with the names */
/** table of one day: each name on its own line, set in columns inside the Permanent / Visiting cells */
function freeNamesTable(doc, y, rows){
  const C = P.C, pw = doc.internal.pageSize.getWidth(), W0 = 26, W = pw - 20 - W0, LH = 4.1, FS = 8;
  const n1 = Math.max(1, ...rows.map(x => pvSplit(x.free).perm.length)), n2 = Math.max(0, ...rows.map(x => pvSplit(x.free).vis.length));
  const W1 = n2 ? Math.round(W * Math.min(0.72, Math.max(0.45, n1 / (n1 + n2)))) : W, W2 = W - W1;
  const cols = w => Math.max(1, Math.floor((w - 4) / 52));
  const grid = (xs, w) => { const c = cols(w), r = Math.ceil(xs.length / c); return { c, r, cw:(w - 4) / c }; };
  const body = rows.map(x => { const g = pvSplit(x.free); return ['P' + x.t.p + '\n' + fmtT(toM(x.t.start)) + '–' + fmtT(toM(x.t.end)) + '\n' + x.free.length + ' free', g.perm, g.vis]; });
  P.table(doc, { startY:y, margin:{ top:P.TOP, left:10, right:10, bottom:16 }, rowPageBreak:'avoid',
    head:[['Period', 'Permanent faculty', 'Visiting faculty']],
    body:body.map(r => [r[0], '', '']),
    styles:{ font:'helvetica', fontSize:FS, cellPadding:2, lineColor:C.LINE, lineWidth:0.2, textColor:C.INK, valign:'top' },
    headStyles:{ fillColor:C.NAVY, textColor:[255, 255, 255], fontStyle:'bold', halign:'left' },
    columnStyles:{ 0:{ cellWidth:W0, halign:'center', fontStyle:'bold' }, 1:{ cellWidth:W1 }, 2:{ cellWidth:W2 } },
    didParseCell:h2 => {
      if(h2.section === 'head' && h2.column.index === 2 && !n2) h2.cell.text = [''];
      if(h2.section !== 'body') return;
      const r = body[h2.row.index], k = h2.column.index;
      if(k === 0){ if(r[1].length + r[2].length < 3){ h2.cell.styles.textColor = C.RED; } h2.cell.styles.fillColor = [240, 243, 250]; return; }
      const xs = r[k], g = grid(xs, k === 1 ? W1 : W2);
      h2.cell.styles.minCellHeight = Math.max(9, g.r * LH + 4);
      if(k === 2 && xs.length) h2.cell.styles.fillColor = [255, 249, 235];
    },
    didDrawCell:h2 => {
      if(h2.section !== 'body' || h2.column.index === 0) return;
      const xs = body[h2.row.index][h2.column.index], g = grid(xs, h2.cell.width);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(FS); doc.setTextColor(...C.INK);
      if(!xs.length){ doc.setTextColor(150, 156, 168); doc.text('-', h2.cell.x + 2, h2.cell.y + 5); return; }
      xs.forEach((t, i) => {
        const col = Math.floor(i / g.r), row = i % g.r;                          // fill down each column, then across
        const txt = doc.splitTextToSize((i + 1) + '. ' + niceName(t.name), g.cw - 2)[0];
        doc.text(txt, h2.cell.x + 2 + col * g.cw, h2.cell.y + 5 + row * LH);
      });
    } });
  return doc.lastAutoTable.finalY + 4;
}

<script>
/* ===== JCW Approved-leave add-on v1.2 ===== */
(function(){
'use strict';
const css = document.createElement('style');
css.textContent = '.rtag.lv{background:var(--leave-bg);color:var(--leave);font-weight:800}.rtag.lv.clash{background:var(--absent-bg);color:var(--absent)}';
document.head.appendChild(css);

/* 1) keep the leaves that the server sends with each sheet */
const lvIn = {};
const baseApi = window.api;
window.api = async function(payload, ms){
  const r = await baseApi.apply(this, arguments);
  try{
    if(payload && payload.action === 'sheet' && r && r.ok && !r.missing){
      lvIn[payload.sheet] = r.lv || {};
      store.set('lvSrv', r.lv === undefined ? 'old' : 'ok');      // 'old' = Code.gs edit not deployed
    }
  }catch(e){}
  return r;
};
const baseLoadSheet = window.loadSheet;
window.loadSheet = function(e){
  return baseLoadSheet.apply(this, arguments).then(res => {
    if(e && data[e.name] && lvIn[e.name]){ data[e.name].lv = lvIn[e.name]; delete lvIn[e.name]; store.set('data', data); if(!dirty){ loadDraft(); } }
    return res;
  });
};

/** { roll: 'Leave type' } for a day of the sheet on screen */
function leavesOn(day){
  const d = data[sheetName()];
  return (d && d.lv && d.lv[String(day)]) || {};
}
window.leavesOn = leavesOn;

/* 2) pre-mark L for students on approved leave who have no mark yet in this lecture */
const lvToday = () => new Date().toDateString();
const toasted = (o => o && o.d === lvToday() ? o.k : {})(store.get('lvToast', null));   // shown once a day per lecture, also after refresh
function fillLeaves(){
  if(mode !== 'att') return 0;
  const d = data[sheetName()]; if(!d) return 0;
  const lv = leavesOn(sel.day); let n = 0;
  d.students.forEach(s => { if(!s.off && lv[s.roll] && !draft[s.roll]){ draft[s.roll] = 'L'; n++; } });
  if(n){
    const k = sheetName() + '|' + sel.day + '|' + sel.period;
    if(!toasted[k]){ toasted[k] = 1; store.set('lvToast', { d:lvToday(), k:toasted }); setTimeout(() => toast(n + ' student' + (n > 1 ? 's are' : ' is') + ' on approved leave today and marked L. You can still change it.'), 300); }
  }
  return n;
}
const baseLoadDraft = window.loadDraft;
window.loadDraft = function(){
  const r = baseLoadDraft.apply(this, arguments);
  try{ fillLeaves(); }catch(e){}
  return r;
};

/* 3) tag on the student row */
const baseTag = window.tagHtml;
window.tagHtml = function(roll){
  let h = baseTag.apply(this, arguments);
  try{
    const d = data[sheetName()], st = d && d.students.find(x => x.roll === roll);
    const t = mode === 'att' && !(st && st.off) ? leavesOn(sel.day)[roll] : null;
    if(t) h = `<span class="rtag lv ${draft[roll] === 'A' ? 'clash' : ''}" title="Approved by the Leave In-Charge">Leave:${esc(t)}</span>` + h;
    else if(!(st && st.off) && d && d.lv && d.lv._u && d.lv._u[roll]){      // leave without dates: only a tag, never an automatic L
      const u = d.lv._u[roll], n = String(u[0] || '').trim();
      h = `<span class="rtag lv" title="The Leave In-Charge entered this leave without dates, so the days are not known">${n ? '' + esc(n) + ' day' + (n === '1' ? '' : 's') : ''} · ${esc(u[1])} (no dates)</span>` + h;
    }
  }catch(e){}
  return h;
};

/* 4) "Mark all P / A / B" keeps students on approved leave as L */
document.addEventListener('change', ev => {
  const t = ev.target;
  if(!t || !t.dataset || !t.dataset.all || !t.checked || t.dataset.all === 'L') return;
  const d = data[sheetName()]; if(!d) return;
  const lv = leavesOn(sel.day); let n = 0;
  d.students.forEach(s => { if(!s.off && lv[s.roll] && draft[s.roll] === t.dataset.all){ draft[s.roll] = 'L'; n++; } });
  if(n){ document.querySelectorAll('#list .row').forEach(paintRow); updateTally(); }
});

/* 5) check line in "Account and sync" (tap the status chip) */
const baseOpenSync = window.openSync;
window.openSync = function(){
  baseOpenSync.apply(this, arguments);
  try{
    const m = document.querySelector('#dlgBody .meta'); if(!m) return;
    const d = data[sheetName()], lv = (d && d.lv) || null, srv = store.get('lvSrv', '');
    let txt;
    if(srv === 'old') txt = 'Approved leaves: the server does not send them yet (Code.gs edit not deployed as a New version).';
    else if(!lv) txt = 'Approved leaves: not loaded for this sheet yet. Open it once with internet.';
    else {
      const days = Object.keys(lv).filter(x => x !== '_u').map(Number).sort((a, b) => a - b), n = new Set(days.flatMap(x => Object.keys(lv[x]))).size;
      const u = Object.keys(lv._u || {}).length;
      txt = 'Approved leaves in this sheet: ' + (days.length ? n + ' student(s) on day(s) ' + days.join(', ') : 'none with dates this month') +
        (u ? '; ' + u + ' student(s) with leave but no dates (shown as a tag only)' : '');
    }
    m.insertAdjacentHTML('beforeend', '<br><span style="color:var(--leave);font-weight:700">' + esc(txt) + '</span> <small>(leave add-on 1.2)</small>');
  }catch(e){}
};

/* 6) when a teacher marks A on a student with approved leave, the tag turns red at once */
document.addEventListener('click', ev => {
  const b = ev.target && ev.target.closest && ev.target.closest('#list button[data-v]'); if(!b) return;
  setTimeout(() => {
    const row = b.closest('.row'); if(!row) return;
    const tag = row.querySelector('.rtag.lv'); if(tag) tag.classList.toggle('clash', draft[row.dataset.roll] === 'A');
  }, 0);
});
})();
</script>

/* ---------- server ---------- */
async function call(payload, ms){
  if(!navigator.onLine) throw new Error('This needs internet.');
  const r = await api(payload, ms || 120000);
  if(r && r.error === 'BAD_LOGIN'){ signOut('Your username or password was changed. Sign in again.'); throw new Error('Sign in again.'); }
  if(r && !r.ok && r.error === 'UNKNOWN_ACTION') throw new Error('The server is not updated yet: deploy Code.gs v6.6 as a New version.');
  if(!r || !r.ok) throw new Error((r && r.error) || 'Server error');
  return r;
}
async function loadOpts(force){
  if(optsBusy || (!force && opts && Date.now() - optsAt < 600000)) return;
  if(!navigator.onLine){ if(!opts) optsFromSheets(); return; }
  optsBusy = true; let changed = false;
  try{ const r = await call({ action:'reg_opts' }, 60000); opts = r.sections; changed = true; }
  catch(e){ if(!opts) optsFromSheets(); }
  finally{
    optsBusy = false; optsAt = Date.now();                                 // also after an error: no retry loop
    const ae = document.activeElement;
    if(changed && document.body.dataset.screen === 'reports' && !(ae && ae.id === 'rpQ')) window.renderMain();   // new sections in the list
  }
}
function optsFromSheets(){
  const m = {};
  sheets.forEach(e => { (m[e.cls] = m[e.cls] || new Set()).add(e.sub); });
  opts = Object.keys(m).sort((a, b) => a.localeCompare(b, undefined, { numeric:true })).map(c => ({ cls:c, subs:[...m[c]].sort() }));
}

/* ---------- create ---------- */
async function create(everyStudent){
  if(busy) return;
  if(zr.who === 'stu' && !zr.roll) return toast('Search and choose a student first.');
  if(zr.who === 'sec' && !zr.cls) return toast('Choose a section first.');
  if(zr.kind === 'daily' && zr.cls === '*' && scope() && zr.who === 'sec' && zr.from !== zr.to) return toast('All sections: choose ONE month.');
  busy = true; setProg('Starting…', 1);
  try{
    await P.libs();
    let r;
    if(zr.kind === 'daily') r = await buildDaily();
    else if(zr.kind === 'cards') r = await buildCards();
    else r = await buildTests(everyStudent);
    setProg('Making the PDF…', 100);
    await new Promise(res => setTimeout(res, 30));
    await P.deliver(r, true);
  }catch(e){ toast('Report not made: ' + (e && e.message || e)); }
  finally{ busy = false; setProg(null); }
}

/* ======================= 1) DAILY REGISTER ======================= */
async function fetchDays(list, roll){
  const out = [], queue = [];
  for(let i = 0; i < list.length; i += CHUNK) queue.push(list.slice(i, i + CHUNK));
  let done = 0, skipped = [];
  while(queue.length){
    const part = queue.shift();
    setProg('Reading attendance sheets… ' + done + ' of ' + list.length, Math.round(done / list.length * 95));
    let r;
    try{ r = await call({ action:'reg_days', names:part.map(x => x.name), roll:roll || '' }, 180000); }
    catch(e){
      if(/Sign in|internet|not updated/i.test(e.message)) throw e;
      if(part.length > 1){ const h = Math.ceil(part.length / 2); queue.unshift(part.slice(0, h), part.slice(h)); continue; }
      skipped.push(part[0].name); done++; continue;
    }
    (r.sheets || []).forEach(x => { if(x.missing) skipped.push(x.name); else out.push(x); });
    done += part.length;
  }
  if(skipped.length) toast(skipped.length + ' sheet(s) could not be read and are left out.');
  return out;
}
const cellRe = /^(\d*)([PALB])$/;
function counts(cells){ let p = 0, l = 0, g = 0; cells.forEach(c => { const m = cellRe.exec(c || ''); if(!m) return; const k = Number(m[1] || 1); if(m[2] === 'P'){ p += k; g += k; } else if(m[2] === 'A'){ g += k; } else if(m[2] === 'L') l += k; }); return { p, l, g }; }
function styleCell(h, v, C){
  if(/P$/.test(v)){ h.cell.styles.textColor = C.GREEN; h.cell.styles.fontStyle = 'bold'; }
  else if(/A$/.test(v)){ h.cell.styles.textColor = C.RED; h.cell.styles.fillColor = C.REDBG; h.cell.styles.fontStyle = 'bold'; }
  else if(/L$/.test(v)){ h.cell.styles.textColor = C.AMB; h.cell.styles.fillColor = C.AMBBG; h.cell.styles.fontStyle = 'bold'; }
  else if(/B$/.test(v)){ h.cell.styles.textColor = C.PUR; h.cell.styles.fillColor = C.PURBG; h.cell.styles.fontStyle = 'bold'; }
}
const dayLegend = 'P = present (2P = present in 2 lectures that day), A = absent, L = leave, B = bunk. Only P counts as attended. Present = lectures attended, Held = lectures delivered (for a guest: lectures in which she was marked). Red % = below ' + LOW + '%. Grey = Sunday, purple = more than one lecture.';

  }).sort((a, b) => enrollN(a.roll) - enrollN(b.roll));

async function buildDaily(){
  setProg('Finding the attendance sheets…', 2);
  const stu = zr.who === 'stu';
  const plan = await call({ action:'reg_plan', from:zr.from, to:zr.to, cls:stu ? '' : zr.cls, sub:stu ? '' : zr.sub, roll:stu ? zr.roll : '' }, 90000);
  const list = plan.sheets || [];
  if(!list.length) throw new Error('No attendance sheets found for this choice.');
  if(list.length > 120 && !confirm(list.length + ' attendance sheets will be put in one PDF. This can take several minutes. Continue?')) throw new Error('Cancelled.');
  const got = await fetchDays(list, stu ? zr.roll : '');
  if(!got.length) throw new Error('No attendance could be read.');
  setProg('Making the PDF…', 97);
  await new Promise(res => setTimeout(res, 30));
  const doc = P.newDoc('landscape'); let Y = P.TOP;
  doc.setLineHeightFactor(1.12);                                       // tighter rows: a 45-student section fits on one page
  if(stu){
    const byMon = {};
    got.filter(x => x.st && x.st.length).forEach(x => { (byMon[x.mon] = byMon[x.mon] || []).push(x); });
    const mons = SEAS.filter(t => byMon[t]);
    if(!mons.length) throw new Error('No daily attendance found for this student.');
    mons.forEach((t, i) => { Y = dailyStudentPage(doc, t, byMon[t], i === 0); });
  } else {
    got.forEach((x, i) => { Y = dailySectionPage(doc, x, i === 0); });
  }
  Y = P.smallNote(doc, Y, dayLegend + (scope() ? '' : ' Only the subjects taught by ' + (teacher || user) + ' are included.'));
  P.signatures(doc, Y, stu ? ['Class In-charge', 'HOD', 'Principal'] : ['Subject Teacher', 'HOD', 'Principal']);
  P.finalize(doc);
  const what = stu ? zr.name + '_' + zr.roll : zr.cls === '*' ? allLabel() : zr.cls + (zr.sub ? '_' + titleCase(zr.sub) : '_All-subjects');
  return { doc, title:'Daily register ' + (stu ? zr.name : zr.cls === '*' ? allLabel() : zr.cls), file:'Daily-register_' + P.safe(what) + '_' + zr.from + '-' + zr.to + '.pdf' };
}

/** rows -> { roll: { roll, name, cls, guest, subs:{ SUB:{ sub, teacher, cls, months:{ MON:{ p, d, mt, mtT, off } } } } } } */
function model(rows){
  const S = {};
  rows.forEach(r => (r.st || []).forEach(x => {
    const s = S[x[0]] = S[x[0]] || { roll:x[0], name:x[1], cls:r.cls, guest:'', subs:{} };
    if(x[6]) s.guest = x[6];
    if(!/optional/i.test(r.cls) && /optional/i.test(s.cls)) s.cls = r.cls;
    const g = s.subs[r.sub] = s.subs[r.sub] || { sub:r.sub, teacher:r.teacher, cls:r.cls, months:{} };
    g.months[r.mon] = { p:Number(x[2]) || 0, d:Number(x[3]) || 0, mt:x[4], mtT:Number(r.mt) || 0, off:!!x[5] };
  }));
  Object.values(S).forEach(s => Object.values(s.subs).forEach(g => {
    const ms = Object.keys(g.months).sort((a, b) => SEAS.indexOf(b) - SEAS.indexOf(a));
    g.off = !!(ms[0] && g.months[ms[0]].off);
    let p = 0, d = 0, o = 0, t = 0, n = 0;
    Object.values(g.months).forEach(m => {
      if(m.off) return; p += m.p; d += m.d;
      if(m.mtT && m.mt !== '' && m.mt != null){ t += m.mtT; n++; if(m.mt !== 'A') o += Number(m.mt) || 0; }
    });
    Object.assign(g, { p, d, pct:pct1(p, d), o, t, n, tp:t ? pct1(o, t) : null });
  }));
  return S;
}
const sortStu = S => Object.values(S).sort((a, b) => a.cls.localeCompare(b.cls, undefined, { numeric:true }) || enrollN(a.roll) - enrollN(b.roll));
/** ranks by % (higher first), ties share the place */
function ranks(list){ const s = list.filter(x => x.v != null).sort((a, b) => b.v - a.v), out = {}; let last = null, r = 0;
  s.forEach((x, i) => { const k = Math.round(x.v * 100); if(k !== last){ r = i + 1; last = k; } out[x.k] = r; }); return { pos:out, of:s.length }; }
