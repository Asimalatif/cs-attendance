<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="inksaver.js"></script><script src="jcwout.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JCW Admissions</title>
<style>
:root{--bg:#F2F5FA;--surface:#fff;--surface2:#F7F8FB;--ink:#0F1B2D;--muted:#667085;--line:#E3E7EE;--accent:#0F1B2D;--on-accent:#fff;--ring:#2F5BEA;
--good:#12805C;--good-bg:#E6F4EE;--bad:#D92D20;--bad-bg:#FDECEA;--mid:#B7791F;--mid-bg:#FFF4DB;--info:#1C4A7E;--info-bg:#E4EEFA;--hero:#0F1B2D;--hero2:#1C3158;
--shadow:0 1px 2px rgba(15,27,45,.06),0 2px 8px rgba(15,27,45,.05);--r:14px;--sab:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--surface:#141E31;--surface2:#18233A;--ink:#EAF0FA;--muted:#9AA9C0;--line:#25324A;--accent:#EAF0FA;--on-accent:#0B1220;--ring:#7AA2FF;
--good:#3CC38A;--good-bg:#12302A;--bad:#F26B60;--bad-bg:#3A1C1F;--mid:#E8B04A;--mid-bg:#3A2F14;--info:#8EB4F0;--info-bg:#17294A;--hero:#16233D;--hero2:#233B68;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(90px + var(--sab))}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
header{background:linear-gradient(160deg,var(--hero),var(--hero2));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
.hin{max-width:820px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px}
.back{color:#BFD2FF;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
h1{margin:6px 0 2px;font-size:21px;line-height:1.2}
.hsub{color:rgba(255,255,255,.75);font-size:12.5px}
.net{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.14);white-space:nowrap}
.net.off{background:#7A2E2A}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:transparent;border:0;color:rgba(255,255,255,.75);font-weight:700;padding:10px 14px;border-radius:12px 12px 0 0;font-size:14px}
nav button[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;line-height:18px;margin-left:4px;text-align:center}
main{max-width:820px;margin:0 auto;padding:14px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 8px;font-size:16px}
.card h3{margin:0 0 6px;font-size:15px}
.sub{color:var(--muted);font-size:13px}
label{display:block;font-size:12px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
input,select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:var(--surface2)}
textarea{padding:10px 12px;min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ring)}
input[readonly]{opacity:.75}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:420px){.g3{grid-template-columns:1fr 1fr}}
.rowi{display:flex;gap:8px;align-items:stretch}
.rowi input{flex:1;min-width:0}
.btn{min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:750;font-size:15px;padding:0 16px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{min-height:38px;font-size:13.5px;padding:0 12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.seg button{flex:1;min-height:46px;border:0;background:transparent;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.seat{margin-top:6px;font-size:13px;font-weight:650;padding:7px 10px;border-radius:10px;background:var(--surface2)}
.seat.ok{background:var(--good-bg);color:var(--good)}.seat.near{background:var(--mid-bg);color:var(--mid)}
.seat.full,.seat.over{background:var(--bad-bg);color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.near{background:var(--mid-bg);color:var(--mid)}
.pill.full,.pill.over{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.editbar{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-weight:650;font-size:14px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.editbar span{flex:1}
.done{background:var(--good-bg);color:var(--good);border-radius:12px;padding:12px;margin-bottom:12px;font-weight:650}
.done big{display:block;font-size:22px;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.subs input{min-height:44px;font-size:14px;padding:0 10px;text-transform:uppercase}
.agg{font-size:14px;font-weight:700;margin-top:8px}
details{margin-top:6px}
summary{cursor:pointer;font-weight:750;padding:10px 0;color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--sab));z-index:10}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:10px}
.bar .btn{flex:1}
.bar .btn.primary{flex:2}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.it .who{flex:1;min-width:0}
.it b{display:block;font-size:15px}
.it small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.it img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--surface2);flex:0 0 40px}
.av{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;color:var(--muted);flex:0 0 40px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
th{color:var(--muted);font-weight:700;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.iss{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.iss li{padding:8px 10px;border-radius:10px;font-size:14px;background:var(--surface2)}
.iss .danger,.iss .error{background:var(--bad-bg);color:var(--bad);font-weight:650}
.iss .warn,.iss .note{background:var(--mid-bg);color:var(--mid)}
.iss .good{background:var(--good-bg);color:var(--good)}
.iss .info{background:var(--info-bg);color:var(--info)}
dialog{border:0;border-radius:18px;padding:0;max-width:min(560px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,25,.55)}
.dlg{padding:18px}
.dlg h2{margin:0 0 6px;font-size:18px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%) translateY(20px);background:#101828;color:#fff;padding:10px 16px;border-radius:12px;font-weight:650;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px;font-weight:650;margin-bottom:12px}
.req{color:var(--bad)}
.hidden{display:none!important}
.pn{padding:12px}
.pn.off{opacity:.55}
.pn .hd{display:flex;gap:10px;align-items:flex-start}
.pn .hd input[type=checkbox]{width:22px;height:22px;min-height:0;flex:0 0 22px;margin-top:2px;accent-color:var(--brown)}
.pn .hd .who{flex:1;min-width:0}
.pn .hd b{font-size:15px}
.pn .g2 label,.pn .g3 label{margin-top:8px}
.pn select,.pn input[type=text]{min-height:42px;font-size:14.5px}
.pn .warnp{color:var(--mid);font-weight:700;font-size:12.5px}
.stickbar{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:8px 0;margin-bottom:8px}
.stickbar .acts{margin-top:0}
.pn .ph{width:76px;height:92px;border-radius:12px;object-fit:cover;flex:0 0 76px;background:var(--surface2);border:1.5px solid var(--line);cursor:zoom-in}
.pn .phx{width:76px;height:92px;border-radius:12px;flex:0 0 76px;display:grid;place-items:center;font-size:28px;font-weight:800;background:var(--tea2);color:var(--brown)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.facts div{background:var(--surface2);border-radius:10px;padding:6px 9px;font-size:13px;min-width:0}
.facts small{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.facts b{display:block;overflow-wrap:anywhere}
.fee{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.fee .pill{font-variant-numeric:tabular-nums}
.feew{margin-top:6px;padding:8px 10px;border:2px solid var(--bad);border-radius:10px;color:var(--bad);font-weight:800;font-size:13px}
.ml-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ml-b{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left}.ml-b.on{background:var(--brown,#6B3423);color:#fff;border-color:var(--brown,#6B3423)}.ml-b small{font-weight:600;opacity:.85}
table.ml{font-size:12.5px;border-collapse:collapse;width:100%}table.ml th,table.ml td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:middle;text-align:left}table.ml th{position:sticky;top:0;background:var(--surface);z-index:1}
table.ml img{width:72px;height:96px;cursor:zoom-in;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
table.ml tr.next td{background:#DCEBFF}table.ml tr.bad td{background:#FDE0DD}table.ml tr.surplus td{background:#FFE9CC}
.ml-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:10px}.ml-g{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.ml-gh{background:var(--surface2,#FBEDEA);font-weight:800;padding:6px 10px;font-size:13px}table.mlq{width:100%;border-collapse:collapse;font-size:12.5px}
table.mlq td{padding:5px 8px;border-top:1px solid var(--line);cursor:pointer}table.mlq tr:hover td{background:#f6efe9}table.mlq tr.on td{outline:2px solid var(--brown,#6B3423);outline-offset:-2px;font-weight:800}
table.mlq tr.less td{background:#E3F4EC}table.mlq tr.surplus td{background:#FFE9CC}table.mlq tr.bad td{background:#FDE0DD}
.pill.sur{background:#FFD8A8;color:#8A4B00}.pill.lessp{background:#C8EBD8;color:#0E6B47}.mlk.sur{background:#FFE9CC}.mlk.less{background:#E3F4EC}table.ml tr.cut td{border-bottom:3px solid var(--brown,#6B3423)}
.mlk{padding:0 6px;border-radius:6px}.mlk.next{background:#DCEBFF}.mlk.bad{background:#FDE0DD}
.seatlink{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer;font-weight:800}
.bigpic{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:var(--surface2)}
.dtab td:first-child{color:var(--muted);font-weight:700;width:40%}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== JCW uniform theme: brown, tea pink and white (keep this block last in the <style>) ===== */
:root{--brown:#6B3423;--brown2:#8A4A35;--brown3:#A86A52;--tea:#E7B7AE;--tea2:#F4D6D0;--tea3:#FBEDEA;
--bg:#FBF3F1;--surface:#FFFFFF;--surface2:#FBEDEA;--ink:#2B1912;--muted:#7C6159;--line:#E2C0B8;--accent:#6B3423;--on-accent:#FFFFFF;--ring:#A9553F;
--hero:#4A2418;--hero2:#8A4A35;--navy:#4A2418;--acc:#8A4A35;
--tabbg:#F8E3DF;--tabline:#E2B2A8;--tabink:#6B3423;--tabon:#6B3423;--tabonink:#FFFFFF;
--shadow:0 1px 0 rgba(107,52,35,.07),0 10px 24px -14px rgba(107,52,35,.42);--shadow2:0 18px 38px -18px rgba(74,36,24,.6);--glass:rgba(251,243,241,.88);
--c1:#6B3423;--c2:#C2766A;--c3:#A86A52;--c4:#9C4F5E;--c5:#B88645;--c6:#7D5A4F;
--t1:#F1E3DE;--t2:#FBE7E3;--t3:#F6E6DF;--t4:#F6E1E5;--t5:#F8EEDF;--t6:#F0E7E4}
@media(prefers-color-scheme:dark){:root{--brown:#E7B7AE;--brown2:#E7B7AE;--tea3:#3A2520;
--bg:#1A110F;--surface:#271915;--surface2:#33211C;--ink:#F7E9E5;--muted:#C9A99F;--line:#4B3029;--accent:#E7B7AE;--on-accent:#2A1712;--ring:#E7B7AE;
--hero:#341A12;--hero2:#6B3423;--navy:#341A12;--acc:#E7B7AE;
--tabbg:#33211C;--tabline:#5C3A31;--tabink:#F1CFC8;--tabon:#E7B7AE;--tabonink:#2A1712;--glass:rgba(26,17,15,.88);
--shadow:0 1px 0 rgba(0,0,0,.45),0 12px 26px -14px rgba(0,0,0,.85);--shadow2:0 18px 38px -18px rgba(0,0,0,.9);
--c1:#E7B7AE;--c2:#E39A8C;--c3:#D59A7E;--c4:#D88A9A;--c5:#E0B26E;--c6:#C8A79C;
--t1:#3A2621;--t2:#3D2420;--t3:#3A2620;--t4:#3B2327;--t5:#3A2C1F;--t6:#352825}}
html{background:var(--bg)}
body{min-height:100vh;background-color:var(--bg);background-image:radial-gradient(900px 460px at 105% -8%,rgba(231,183,174,.6),transparent 62%),radial-gradient(760px 420px at -12% 108%,rgba(168,106,82,.16),transparent 60%),linear-gradient(180deg,#FFF9F7 0%,#FBF3F1 45%,#F6E4E0 100%);background-attachment:fixed}
@media(prefers-color-scheme:dark){body{background-image:radial-gradient(900px 460px at 105% -8%,rgba(138,74,53,.45),transparent 62%),radial-gradient(760px 420px at -12% 108%,rgba(231,183,174,.08),transparent 60%),linear-gradient(180deg,#22150F 0%,#1A110F 50%,#160E0C 100%)}}
/* cards: clear edge, deeper shadow, a coloured top edge and a soft tint; every card in a row gets its own colour */
.card{--c:var(--c1);--t:var(--t1);border:1.5px solid var(--line);border-top:5px solid var(--c);border-radius:20px;box-shadow:var(--shadow);
background:var(--surface);background-image:linear-gradient(180deg,var(--t) 0,var(--surface) 120px)}
.card:nth-of-type(6n+2){--c:var(--c2);--t:var(--t2)}.card:nth-of-type(6n+3){--c:var(--c3);--t:var(--t3)}.card:nth-of-type(6n+4){--c:var(--c4);--t:var(--t4)}.card:nth-of-type(6n+5){--c:var(--c5);--t:var(--t5)}.card:nth-of-type(6n){--c:var(--c6);--t:var(--t6)}
.card h3{color:var(--ink)}.card h3 svg{color:var(--c)}
.card h3 .ct{color:var(--c)}
.kpi{--c:var(--c1);--t:var(--t1);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:16px;box-shadow:var(--shadow);background:linear-gradient(135deg,var(--t),var(--surface) 70%)}
.kpi:nth-child(4n+2){--c:var(--c2);--t:var(--t2)}.kpi:nth-child(4n+3){--c:var(--c3);--t:var(--t3)}.kpi:nth-child(4n){--c:var(--c4);--t:var(--t4)}
/* big coloured header of a screen (profile, attendance) */
.hero,.pcard{background:radial-gradient(120% 150% at 0% 0%,#A0573F 0%,#6B3423 45%,#3E1C12 100%)!important;border:1px solid rgba(231,183,174,.35);box-shadow:var(--shadow2)}
.hero::after{background:radial-gradient(closest-side,rgba(244,214,208,.35),transparent)!important}
.ring::before{background:#4A2418!important}
@media(prefers-color-scheme:dark){.hero,.pcard{background:radial-gradient(120% 150% at 0% 0%,#7A3F2C 0%,#4A2418 50%,#2A140D 100%)!important}.ring::before{background:#341A12!important}}
/* buttons, tabs, lists */
.btn{border:1.5px solid var(--line);background:var(--surface)}
.btn:hover:not(:disabled){border-color:var(--tea)}
.btn.primary{background:linear-gradient(180deg,var(--brown2),var(--brown));border-color:var(--brown);color:#fff;box-shadow:0 10px 20px -12px var(--brown)}
@media(prefers-color-scheme:dark){.btn.primary{background:linear-gradient(180deg,#F1CFC8,#E7B7AE);border-color:#E7B7AE;color:#2A1712}}
.btn.danger{border-color:#E9A79C}
.vtabs button:not(.on):hover,.seg2 button:not(.on):hover,.tabs2 button:not(.on):hover{background:rgba(107,52,35,.08)!important}
.vtabs button.on,.seg2 button.on,.tabs2 button.on{box-shadow:0 6px 14px -7px var(--tabon)!important}
.li:hover{background:var(--tea3)}
.pill{background:var(--tea3);color:var(--brown)}
.pill.solid{background:var(--brown);color:#fff}
.oml-c{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}.oml-c.ok{border-left:5px solid var(--good)}.oml-c.wait,.oml-c.no{border-left:5px solid var(--bad)}.oml-c.claim,.oml-c.check{border-left:5px solid var(--mid)}
table.oms td{vertical-align:top}.omm{font-weight:800}.omm.ok{color:var(--good)}.omm.warn{color:var(--mid)}.omm.bad{color:var(--bad)}.omm.info{color:var(--info)}
.omf{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.omf button.on{background:var(--brown,#6B3423);color:#fff}
.av{background:var(--tea2)!important;color:var(--brown)!important}
.more{color:var(--brown)!important;border-color:var(--tea)!important}
.stick,.stick2{background:var(--glass);box-shadow:0 1px 0 var(--line),0 8px 18px -16px rgba(107,52,35,.6)}
.ttl h1{color:var(--brown)}
@media(prefers-color-scheme:dark){.ttl h1{color:var(--ink)}}
.day.today{border-color:var(--tea)!important}.day.sel{box-shadow:0 0 0 3px rgba(231,183,174,.6)!important}
.sq,select,input[type=search],input[type=text],input[type=number],textarea{border-color:var(--line)}
.sq:focus,select:focus,input:focus,textarea:focus{border-color:var(--tea);box-shadow:0 0 0 3px rgba(231,183,174,.45);outline:none}
dialog{border:1.5px solid var(--line);box-shadow:var(--shadow2)}
::selection{background:rgba(231,183,174,.6)}
</style>
<script src="spinner.js"></script>
</head>
<body>
<header><div class="hin">
  <div class="top"><a class="back" href="./">&#8249; Attendance</a><span class="net" id="net">…</span></div>
  <h1>Admissions</h1>
  <div class="hsub">New students and changes go straight into Transform-ALL-COLLEGE-STRENGTH. Works without internet.</div>
  <nav role="tablist">
    <button role="tab" data-tab="form" aria-selected="true">New</button>
    <button role="tab" data-tab="pnew" aria-selected="false">From portal<span class="badge hidden" id="pb">0</span></button>

</div></div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<datalist id="subList"></datalist>
<datalist id="boardList"><option>BISE Peshawar</option><option>BISE Mardan</option><option>BISE Malakand</option><option>BISE Swat</option><option>BISE Kohat</option><option>BISE Bannu</option><option>BISE Abbottabad</option><option>FBISE Islamabad</option><option>Cambridge (O-Level)</option></datalist>
<script>
'use strict';
/* Same server as the attendance app (index.html). Change both together. */
const API = 'https://script.google.com/macros/s/AKfycbzl-DwgASIhf-pIGYi9D3M-CGOm7d7-UKg0W-OoWAiuRBHe4mjlRgMQXIHuLm6zi--i/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d){ try{ const v = localStorage.getItem('csa2_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('csa2_' + k, JSON.stringify(v)); }catch(e){} }
};
/* login is shared with the attendance app */
const user = ls.get('user', ''), pass = ls.get('pass', '');

/* ---------- big student list lives in IndexedDB (about 1 MB) ---------- */
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('csa_adm', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try{ const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }catch(e){ return null; } }
async function idbSet(k, v){ try{ const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }catch(e){} }

let init = ls.get('adm_init', null);          // programs, sections, seats, subjects, rooms (from the server)
let idx = null;                               // { cols, rows, at }
let queue = ls.get('adm_q', []);              // saves waiting for the server
let tab = 'form', form = null, lastDone = null, syncing = false, nextRoll = {}, searchQ = '', fatal = '';
let pnew = ls.get('adm_pnew', null);          // students Enrolled on the portal but not yet in Transform (adm_new)
let pnSel = ls.get('adm_pn_sel', {});         // portal ID -> { on, program, year, section, rollNo, quota, rollManual, secManual }
let pnHide = ls.get('adm_pn_hide', []);       // portal IDs you chose to hide
let pnShowHidden = false, pnLoading = false, pnBusy = false;
let rfAns = {}, rfAll = {}, rfCol = '';   // 'row|field' -> accepted value ('' = keep) · field -> accept the whole column
let rf = null, rfBusy = false, rfFields = ls.get('adm_rf_fields', ['portal', 'hq', 'aggregate', 'merit', 'room']).map(f => f === 'quota' ? 'portal' : f), rfShow = '';
const RF = { portal:'Every column vs portal (ask me)', hq:'HQ (Hafiz-e-Quran)', aggregate:'Aggregate', merit:'MeritNo', room:'Room (timetable)' };
const RFN = { portal:'Accepted from portal', hq:'HQ', aggregate:'Aggregate', merit:'MeritNo', room:'Room', agewise:'Age-wise', feepaid:'FEE PAID DATE' };
const saveQ = () => { ls.set('adm_q', queue); paintBadge(); };

async function api(payload, ms = 60000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(API, { method:'POST', body:JSON.stringify({ username:user, password:pass, ...payload }), signal:ctl.signal, redirect:'follow' });
    const txt = await r.text();
    let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('The server sent a web page instead of data. Check the deployment.'); }
    if(j && j.error === 'UNKNOWN_ACTION') throw Object.assign(new Error('The server does not know Admissions yet: add Admissions.gs and the doPost line, then deploy a new version.'), { fatal:true });
    if(j && j.error === 'ADM_NO_ACCESS') throw Object.assign(new Error('Your login cannot add admissions. Ask the admin to add your username to ADM_USERS.'), { fatal:true });
    if(j && j.error === 'BAD_LOGIN') throw Object.assign(new Error('Your saved login was refused. Open the attendance app, log out and sign in again.'), { fatal:true });
    return j;
  } catch(e){
    if(e.name === 'AbortError') throw new Error('The server took too long. Try again.');
    if(e instanceof TypeError) throw Object.assign(new Error('No internet'), { net:true });
    throw e;
  } finally { clearTimeout(t); }
}
let toastT;
function toast(msg, ms = 3200){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
function dlgOpen(html){ $('#toast').classList.remove('show'); $('#dlgBody').innerHTML = html; const d = $('#dlg'); if(!d.open) d.showModal(); }
function dlgClose(){ const d = $('#dlg'); if(d.open) d.close(); }
const online = () => navigator.onLine !== false;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const nrm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z؀-ۿ\s]/g, ' ').split(/\s+/).filter(Boolean).sort().join(' ');
const nroll = s => { const m = String(s || '').trim().toUpperCase().match(/^(.*?)(\d+)$/); return m ? m[1] + parseInt(m[2], 10) : String(s || '').trim().toUpperCase(); };
const qk = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
const prog = k => (init && init.programs.find(p => p.key === k)) || null;
const isMig = y => y === '2nd Year';

/* ---------- index helpers ---------- */
function recOf(row){ const o = {}; idx.cols.forEach((c, i) => o[c] = row[i]); return o; }
function putRec(row, ctx){
  if(!idx || !row) return;
  const o = recOf(row), was = ctx ? { roll:ctx.roll, sno:ctx.sno } : o;
  const i = idx.rows.findIndex(r => (was.roll && nroll(r[1]) === nroll(was.roll)) || (!was.roll && r[0] === was.sno));
  if(i >= 0) idx.rows[i] = row; else idx.rows.push(row);
  idbSet('index', idx);
}
function dFromRec(o){
  return { program:o.key, year:o.year || '1st Year', section:o.pcs, quota:o.quota, rollNo:o.roll, name:o.name, father:o.father, id:o.id,
    subjects:[o.s1,o.s2,o.s3,o.s4,o.s5,o.s6,o.s7].map(x => x || ''), metric:o.metric, total:o.total, hq:o.hq, room:o.room,
    dob:o.dob, contact:o.contact, email:o.email, board:o.board, passYear:o.passYear, matricRoll:o.matricRoll, challan:o.challan, pic:o.pic, groupOnly:o.groupOnly || '', meritNo:o.meritNo || '', batch:o.batch || '', migratedFrom:'' };
}

/* ---------- form state ---------- */
function blankForm(keep){
  const k = keep || {};
  const p = k.program || (init && init.programs[0] && init.programs[0].key) || '';
  const year = k.year || '1st Year';
  const f = { program:p, year, section:k.section || '', quota:k.quota || 'Open Quota', rollNo:'', rollManual:false,
    name:'', father:'', id:'', subjects:compulsory(p, year).concat(groupsOf(p, year).length === 1 ? groupsOf(p, year)[0].subjects : ['', '', '']), metric:'', total:'', hq:'No', room:'',
    dob:'', contact:'', email:'', board:'', passYear:'', matricRoll:'', challan:'', pic:'', groupOnly:'', meritNo:'', batch:'', migratedFrom:'', group:'', ctx:null, qid:null, pq:'' };
  if(!f.section) f.section = sectionsOf(p, year)[0] || '';
  f.room = roomOf(f.section);
  if(isMig(year)) f.quota = init ? init.cfg.mig.QUOTA : 'Open Quota';
  return f;
}
function compulsory(p, year){ const s = init && init.subjects[p] && init.subjects[p][year]; return s ? s.compulsory.slice() : ['ENGLISH','URDU', isMig(year) ? 'PAK-STUDIES' : 'ISLAMIYAT','MUTALIA QURAN']; }
function groupsOf(p, year){ const s = init && init.subjects[p] && init.subjects[p][year]; return s ? s.groups : []; }
function sectionsOf(p, year){ return (init && init.sections[p] && init.sections[p][year]) || []; }
function roomOf(pcs){ return (init && init.rooms && init.rooms[pcs]) || ''; }
function quotasOf(p){
  const pr = prog(p); if(!init) return ['Open Quota'];
  return pr && pr.only ? pr.only : init.quotas;
}
function mapYear(subj, p, year){
  const s = String(subj || '').trim().toUpperCase(), pr = prog(p);
  if(!isMig(year)) return s;
  if(s === 'ISLAMIYAT') return 'PAK-STUDIES';
  if(s === 'BOTANY' && pr && pr.classProgram === 'Pre-Medical') return 'ZOOLOGY';
  return s;
}
function toD(f){
  const d = {}; ['program','year','section','quota','name','father','id','metric','total','hq','room','dob','contact','email','board','passYear','matricRoll','challan','pic','groupOnly','meritNo','batch','migratedFrom'].forEach(k => d[k] = String(f[k] == null ? '' : f[k]).trim());
  d.subjects = f.subjects.map(x => String(x || '').trim().toUpperCase());
  d.rollNo = f.ctx || f.rollManual ? String(f.rollNo || '').trim() : '';
  if(f.ctx && d.hq === 'No' && f.ctx.orig.hq !== 'Yes') d.hq = f.ctx.orig.hq;   // a blank HQ cell stays blank unless she is Hafiz-e-Quran   // new + not typed: the server gives the next free number at save time
  return d;
}

/* ---------- seats (from the last server state) ---------- */
function seatFor(p, quota){
  if(!init || !init.seats) return null;
  const pr = init.seats.programs.find(x => x.key === p); if(!pr) return null;
  return pr.quotas.find(q => qk(q.name) === qk(quota)) || { name:quota, seats:'', filled:0, status:'unset' };
}
function pendingFor(p, quota){ return queue.filter(q => !q.d.ctx && q.d.d.program === p && qk(q.d.d.quota) === qk(quota) && !isMig(q.d.d.year)).length; }
function seatText(p, quota, year){
  if(isMig(year)) return { cls:'', t:'2nd Year migration: always Open Quota, not counted against the 1st-year seats.' };
  const s = seatFor(p, quota); if(!s) return { cls:'', t:'' };
  const pend = pendingFor(p, quota), extra = pend ? ' · ' + pend + ' more waiting on this phone' : '';
  if(s.seats === '' || s.seats == null) return { cls:'', t:s.filled + ' admitted · no seat limit set' + extra };
  const left = s.seats - s.filled;
  return { cls:s.status, t:s.filled + ' of ' + s.seats + ' taken' + (s.pooled ? ' (shared pool)' : '') + ' · ' + (left > 0 ? left + ' left' : left === 0 ? 'FULL' : (-left) + ' over the limit') + extra };
}

/* ---------- rendering ---------- */
function paintNet(){
  const n = $('#net'), w = queue.length;
  n.textContent = (online() ? 'Online' : 'Offline') + (w ? ' · ' + w + ' waiting' : '');
  n.classList.toggle('off', !online());
}
function paintBadge(){ const b = $('#qb'); b.textContent = queue.length; b.classList.toggle('hidden', !queue.length);
  const n = pnList().length, p = $('#pb'); p.textContent = n; p.classList.toggle('hidden', !n); paintNet(); }
function setTab(t){
  tab = t;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t ? 'true' : 'false'));
  if(t === 'form' && !form) form = blankForm();
  render();
}
function render(){
  paintBadge();
  $('#bar').classList.toggle('hidden', tab !== 'form' || !init);
  const m = $('#main');
  if(!user || !pass){ m.innerHTML = `<div class="card"><h2>Sign in first</h2><div class="sub">Open the attendance app, sign in with your admin login, then come back to this page.</div><p><a class="btn primary" href="./" style="display:inline-flex;align-items:center;text-decoration:none">Open the attendance app</a></p></div>`; return; }
  if(ls.get('admin', false) !== true){ m.innerHTML = `<div class="card"><h2>Admin only</h2><div class="sub">Admissions are made by the admin. You are signed in as ${esc(user)}, which is not the admin login.</div><p><a class="btn primary" href="./" style="display:inline-flex;align-items:center;text-decoration:none">Back to the attendance app</a></p></div>`; return; }
  if(!init){ m.innerHTML = fatal ? `<div class="err">${esc(fatal)}</div>` : `<div class="card"><h2>Getting ready…</h2><div class="sub">${online() ? 'Downloading programs, sections, seats and the student list. This happens once; after that the page works without internet.' : 'This phone has not downloaded the admission lists yet. Connect to the internet once, then it works offline.'}</div></div>`; return; }
  const top = fatal ? `<div class="err">${esc(fatal)}</div>` : '';
  if(tab === 'form') m.innerHTML = top + formHtml();
  else if(tab === 'find') m.innerHTML = top + findHtml();
  else if(tab === 'pnew') m.innerHTML = top + pnHtml() + rfHtml();
  else if(tab === 'seats') m.innerHTML = top + seatsHtml();
  else if(tab === 'merit') m.innerHTML = top + mlHtml();
  else if(tab === 'oml') m.innerHTML = top + omlHtml();
  else m.innerHTML = top + waitHtml();
  if(tab === 'form') wireForm();
  if(tab === 'find') wireFind();
  if(tab === 'pnew'){ wirePn(); wireRf(); }
  if(tab === 'wait') wireWait();
  if(tab === 'seats') wireSeats();
  if(tab === 'merit') wireMl();
  if(tab === 'oml') wireOml();
}
const opt = (v, cur, label) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(label == null ? v : label)}</option>`;

function formHtml(){
  const f = form, pr = prog(f.program), mig = isMig(f.year), secs = sectionsOf(f.program, f.year);
  const st = seatText(f.program, f.quota, f.year), groups = groupsOf(f.program, f.year);
  const nr = nextRoll[f.program + '|' + f.year];
  const rollHint = f.ctx ? 'Changing an Enroll# also changes it on her attendance rows only after "Sheets vs strength sheet".'
    : f.rollManual ? 'You typed this number. Clear the box to let the app give the next free number.'
    : (nr && nr.roll ? 'Next free: <b>' + esc(nr.roll) + '</b>. The number is fixed when you save, so two phones never get the same one.' : online() ? 'The next free number is given when you save.' : 'Offline: the number is given when this phone is back online.');
  const m = Number(f.metric), t = Number(f.total);
  const agg = f.metric !== '' && t ? Math.round(((m + (f.hq === 'Yes' ? 20 : 0)) / t) * 100) : '';
  const secList = secs.indexOf(f.section) < 0 && f.section ? secs.concat([f.section]) : secs;
  return `
  ${lastDone && !f.ctx ? `<div class="done">Saved: ${esc(lastDone.name)}<big>${esc(lastDone.roll || 'Roll No on upload')}</big>${esc(lastDone.where)}</div>` : ''}
  ${f.ctx ? `<div class="editbar"><span>Editing <b>${esc(f.ctx.origName)}</b> · ${esc(f.ctx.roll || 'no Enroll#')}<br><small>Only what you change is written; the portal-sync columns stay as they are.</small></span><button class="btn small" type="button" id="xEditOff">Stop editing</button></div>` : ''}
  ${f.qid ? `<div class="editbar"><span>Fixing a save that is waiting on this phone.</span></div>` : ''}
  <section class="card">
    <h2>Class</h2>
    <label for="fProg">Program</label>
    <select id="fProg">${init.programs.map(p => opt(p.key, f.program, p.label + (p.fee === 'non' ? ' · non-subsidized' : ''))).join('')}</select>
    <label>Year</label>
    <div class="seg" role="group"><button type="button" data-year="1st Year" aria-pressed="${!mig}">1st Year</button><button type="button" data-year="2nd Year" aria-pressed="${mig}">2nd Year (migration)</button></div>
    <div class="g2">
      <div><label for="fSec">Section</label><select id="fSec">${secList.length ? secList.map(s => opt(s, f.section)).join('') : '<option value="">No sections</option>'}</select></div>
      <div><label for="fRoom">Room</label><input id="fRoom" value="${esc(f.room)}" autocomplete="off"></div>
    </div>
    <label for="fQuota">Quota</label>
    <select id="fQuota" ${mig ? 'disabled' : ''}>${quotasOf(f.program).map(q => opt(q, f.quota)).join('')}${quotasOf(f.program).some(q => qk(q) === qk(f.quota)) ? '' : opt(f.quota, f.quota)}</select>
    ${st.t ? `<div class="seat ${esc(st.cls)}">${esc(st.t)}</div>` : ''}
    <label for="fRoll">Roll No / Enroll#</label>
    <div class="rowi"><input id="fRoll" value="${esc(f.ctx || f.rollManual ? f.rollNo : '')}" placeholder="${esc(nr && nr.roll ? nr.roll + ' (automatic)' : 'Automatic')}" autocomplete="off" autocapitalize="characters">${f.ctx && pr && f.ctx.orig.program !== f.program ? '<button class="btn small" type="button" id="xNewRoll">New number for this program</button>' : ''}</div>
    <div class="hint">${rollHint}</div>
  </section>
  <section class="card">
    <h2>Student</h2>
    <label for="fPq">Search the portal</label>
    <div class="rowi"><input id="fPq" value="${esc(f.pq || '')}" placeholder="Her name, or name + father name" autocomplete="off" autocapitalize="words" enterkeyhint="search"><button class="btn small" type="button" id="xPortal" ${online() ? '' : 'disabled'}>Search</button></div>
    <div class="hint">Pick her from the list to fill name, father, portal ID, marks, DOB, contact, photo, challan, batch and subjects from the portal copy (Portal Data sheet). Needs internet.</div>

    <label for="fId">Portal Student ID</label><input id="fId" value="${esc(f.id)}" inputmode="numeric" autocomplete="off">
    <div class="g3">
      <div><label for="fMetric">Matric marks</label><input id="fMetric" value="${esc(f.metric)}" inputmode="numeric"></div>
      <div><label for="fTotal">Total marks</label><input id="fTotal" value="${esc(f.total)}" inputmode="numeric" placeholder="1200"></div>
      <div><label for="fHq">Hafiz-e-Quran</label><select id="fHq">${opt('No', f.hq === 'Yes' ? '' : 'No')}${opt('Yes', f.hq)}</select></div>
    </div>
    <div class="agg">Aggregate: ${agg === '' ? '–' : agg + '%'}</div>
  </section>
  <section class="card">
    <h2>Subjects</h2>
    ${groups.length > 1 ? `<label for="fGroup">Subject group</label><select id="fGroup"><option value="">Choose a group…</option>${groups.map((g, i) => opt(i, f.group, g.name + ' — ' + g.subjects.join(', '))).join('')}</select>` : ''}
    <div class="subs" style="margin-top:10px">${f.subjects.map((s, i) => `<input data-sub="${i}" value="${esc(s)}" list="subList" aria-label="Subject ${i + 1}" placeholder="Subject ${i + 1}${i < 4 ? ' (compulsory)' : ''}">`).join('')}</div>
    ${groups.length === 1 ? '' : '<div class="hint">Choose a group to fill subjects 5 to 7, or type them.</div>'}
  </section>
  <section class="card">
    <details ${f.ctx || f.dob || f.contact ? 'open' : ''}><summary>More details (DOB, contact, board, challan, photo, batch, merit no)</summary>
      <div class="g2">

      </div>
      <label for="fEmail">Email</label><input id="fEmail" value="${esc(f.email)}" inputmode="email" autocapitalize="off">
      <div class="g3">
        <div><label for="fBoard">Board</label><input id="fBoard" value="${esc(f.board)}" list="boardList"></div>
        <div><label for="fPass">Passing year</label><input id="fPass" value="${esc(f.passYear)}" inputmode="numeric"></div>
        <div><label for="fMroll">Matric roll no</label><input id="fMroll" value="${esc(f.matricRoll)}" inputmode="numeric"></div>
      </div>
      <label for="fChallan">Challan details</label><input id="fChallan" value="${esc(f.challan)}" placeholder="P-2600.00, P-60000.00">
      <div class="g3">
        <div><label for="fBatch">Batch</label><input id="fBatch" value="${esc(f.batch)}" placeholder="2026-27"></div>
        <div><label for="fMerit">Merit no</label><input id="fMerit" value="${esc(f.meritNo)}" inputmode="numeric"></div>
        <div><label for="fGonly">Group</label><input id="fGonly" value="${esc(f.groupOnly)}" placeholder="F.A only" list="gonlyList"></div>
      </div>
      <datalist id="gonlyList"><option>Economics Group 1</option><option>Economics Group 2</option><option>Geography Group 1</option><option>Geography Group 2</option></datalist>
      <label for="fPic">Picture URL (also written as PHOTO)</label><input id="fPic" value="${esc(f.pic)}" inputmode="url" autocapitalize="off">
      ${mig ? `<label for="fMigFrom">Migrated from (college)</label><input id="fMigFrom" value="${esc(f.migratedFrom)}">` : ''}
    </details>
  </section>`;
}
function readForm(){
  const v = id => { const e = $(id); return e ? e.value : undefined; };
  const f = form;
  [['#fRoom','room'],['#fName','name'],['#fFather','father'],['#fId','id'],['#fMetric','metric'],['#fTotal','total'],['#fHq','hq'],
   ['#fDob','dob'],['#fContact','contact'],['#fEmail','email'],['#fBoard','board'],['#fPass','passYear'],['#fMroll','matricRoll'],
   ['#fChallan','challan'],['#fPic','pic'],['#fMigFrom','migratedFrom'],['#fBatch','batch'],['#fMerit','meritNo'],['#fGonly','groupOnly'],['#fPq','pq']].forEach(([id, k]) => { const x = v(id); if(x !== undefined) f[k] = x; });
  const q = v('#fQuota'); if(q !== undefined && !isMig(f.year)) f.quota = q;
  const r = v('#fRoll'); if(r !== undefined){ if(f.ctx) f.rollNo = r.trim(); else { f.rollManual = !!r.trim(); f.rollNo = r.trim(); } }
  document.querySelectorAll('[data-sub]').forEach(e => f.subjects[+e.dataset.sub] = e.value.toUpperCase());
}
function wireForm(){

  const fs = d.subjects.filter(Boolean), dup = fs.find((x, i) => fs.indexOf(x) !== i);
  if(dup) issues.push({ level:'danger', text:'The subject ' + dup + ' is listed more than once.' });
  if(d.dob && !/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(d.dob)) issues.push({ level:'note', text:'Date of birth should look like 18/01/2011.' });
  if(idx){
    const me = ctx ? (ctx.roll ? nroll(ctx.roll) : '#' + ctx.sno) : null;
    const others = idx.rows.map(recOf).filter(o => !me || (o.roll ? nroll(o.roll) : '#' + o.sno) !== me);
    if(d.rollNo){ const r = others.find(o => nroll(o.roll) === nroll(d.rollNo)); if(r) errors.push('Roll No ' + d.rollNo + ' is already used by ' + r.name + ' (' + r.pcs + ').'); }
    if(d.id){ const r = others.find(o => o.id === d.id); if(r) issues.push({ level:'danger', text:'Portal ID ' + d.id + ' already belongs to ' + r.name + ' (' + (r.roll || r.pcs) + ').' }); }
    const nn = nrm(d.name), nf = nrm(d.father);
    others.forEach(o => { if(nrm(o.name) !== nn || !nn) return; const same = nf && nrm(o.father) === nf;

      else if(!nf || !nrm(o.father)) issues.push({ level:'note', text:'Another ' + o.name + ' is in ' + o.pcs + '. Check she is a different girl.' }); });
  }
  queue.filter(q => q.qid !== form.qid && !q.d.ctx && nrm(q.d.d.name) === nrm(d.name) && nrm(q.d.d.father) === nrm(d.father))

}

/* ---------- send waiting saves ---------- */
async function sync(){
  if(syncing || !online() || !queue.length || !user) return;
  syncing = true;
  try{
    for(const item of queue.slice()){
      if(item.state === 'problem' || item.state === 'error') continue;
      let r;
      try{ r = await api({ action:'adm_save', d:item.d.d, ctx:item.d.ctx, override:item.override, cid:item.cid }); }
      catch(e){ if(e.fatal){ fatal = e.message; } else if(!e.net){ item.state = 'error'; item.errors = [e.message]; saveQ(); } break; }
      if(r && r.ok){
        queue = queue.filter(q => q.qid !== item.qid); saveQ();
        if(r.rec) putRec(r.rec, item.d.ctx);
        if(r.seats && init){ init.seats = r.seats; ls.set('adm_init', init); }
        if(r.next && r.next.roll) nextRoll[item.d.d.program + '|' + item.d.d.year] = { roll:r.next.roll, t:Date.now() };
        if(lastDone && lastDone.name === item.d.d.name && !item.d.ctx) lastDone.roll = r.roll;
        toast(r.nothing ? 'No change to save for ' + item.d.d.name : (item.d.ctx ? 'Updated: ' : 'Admitted: ') + item.d.d.name + ' · ' + (r.roll || ''), 4500);
      } else if(r){
        item.state = r.error ? 'error' : 'problem';
        item.errors = r.errors || (r.error ? [r.error] : []); item.issues = r.issues || []; item.blocked = !!r.blocked;
        saveQ();
        toast('Needs your decision: ' + item.d.d.name + ' (Waiting tab)', 5000);
        if(lastDone && lastDone.name === item.d.d.name) lastDone.roll = 'not saved, see Waiting';
      }
    }
  } finally { syncing = false; render(); }
}

function pnEntry(s){

  if(!e){
    e = pnSel[s.id] = { on:true, program:s.program || '', year:s.year || '1st Year', section:'', rollNo:'', quota:s.quotaGuess || 'Open Quota', rollManual:false, secManual:false };
    // v7.8: the official merit list decides program (subsidized / non-subsidized) and quota, not the early portal copy
    const v = !isMig(e.year) ? omlVerdict(omlFind(s.name, s.father, s.metric, s.total), (prog(s.program) || {}).classProgram) : null;
    if(v){ e.oml = v; if(v.key) e.program = v.key; if(v.quota) e.quota = v.quota; if(v.state !== 'ok') e.on = false; }

/** gives every ticked student a Roll No (next free numbers of her program, in portal order) and the section with fewest students */
function pnSuggest(){
  if(!pnew || !pnew.list) return;
  const used = new Set(), cnt = {}, ptr = {};
  const pool = e => pnew.pools[e.program + '|' + e.year];
  const counts = k => cnt[k] || (cnt[k] = Object.fromEntries((pnew.pools[k] ? pnew.pools[k].secs : []).map(x => [x.name, x.count])));
  const act = pnew.list.filter(s => !pnHide.includes(s.id)).map(s => [s, pnEntry(s)]);
  if(idx) idx.rows.forEach(r => { if(r[1]) used.add(nroll(r[1])); });
  // what you typed or chose yourself is kept and reserved first
  act.forEach(([s, e]) => {
    if(!e.on) return;
    if(e.rollManual && e.rollNo) used.add(nroll(e.rollNo));
    if(e.secManual && e.section) { const c = counts(e.program + '|' + e.year); c[e.section] = (c[e.section] || 0) + 1; }
  });
  act.forEach(([s, e]) => {
    if(isMig(e.year)) e.quota = init ? init.cfg.mig.QUOTA : 'Open Quota';
    if(!e.on){ if(!e.rollManual) e.rollNo = ''; if(!e.secManual) e.section = ''; return; }
    const k = e.program + '|' + e.year, pl = pool(e);
    if(!pl){ if(!e.rollManual) e.rollNo = ''; if(!e.secManual) e.section = ''; return; }
    if(!e.secManual){
      const c = counts(k), cand = pl.secs.filter(x => !/optional/i.test(x.name)), list = cand.length ? cand : pl.secs;
      let best = ''; list.forEach(x => { if(!best || (c[x.name] || 0) < (c[best] || 0)) best = x.name; });
      e.section = best; if(best) c[best] = (c[best] || 0) + 1;
    }
    if(!e.rollManual){
      if(s.rollFromPortal && s.program === e.program && s.year === e.year && !used.has(nroll(s.rollFromPortal))) e.rollNo = s.rollFromPortal;
      else { let i = ptr[k] || 0; while(i < pl.free.length && used.has(nroll(pl.free[i]))) i++; e.rollNo = pl.free[i] || ''; ptr[k] = i + 1; }
      if(e.rollNo) used.add(nroll(e.rollNo));

}

/** "P-5000.00, U-1200.00" -> [{paid, amount}] */

async function rfRun(apply){
  rfBusy = true; render();
  try{
    const accept = {}; if(apply){ Object.keys(rfAns).forEach(k => { if(rfAns[k]) accept[k] = rfAns[k]; }); Object.keys(rfAll).forEach(f => { if(rfAll[f]) accept['*|' + f] = 'yes'; }); }

      rf = null;

/** v7.6: every quota across all programs: where its seats went (with lists) */
function quotaWise(){
  const Q = new Map();
  (idx ? idx.rows.map(recOf) : []).filter(o => !isMig(o.year) && String(o.quota || '').trim()).forEach(o => {
    const k = qk(o.quota); if(!Q.has(k)) Q.set(k, { name:o.quota, by:new Map(), n:0 });
    const q = Q.get(k), lab = (prog(o.key) || {}).label || o.key || 'No program'; q.n++;
    if(!q.by.has(lab)) q.by.set(lab, []); q.by.get(lab).push(o);
  });
  return [...Q.values()].sort((a, b) => a.name.localeCompare(b.name));
}

/* ---------- v7.7: merit lists, 1st Year, every quota of every program, on the seats ----------
   A subsidized program (fee 'sub', e.g. Pre-Medical Open (S)) takes the top students of a quota from ALL its class's programs
   (Open (S) + Self Morning + Evening): Aggregate, then age (older first). The rest belong in the non-subsidized programs.
   Blue = next in line when a seat empties (left / cancelled / migrated). Red = a wrong place in the strength sheet. */
let mlKey = '', mlQ = '';
const mlGone = o => /left|cancel|migrat|struck|disenrol|drop|expel|withdraw/i.test(o.status || '');
const mlAgg = o => { const a = Number(String(o.aggregate || '').replace(/[^0-9.]/g, '')); if(a) return a;
  const m = Number(String(o.metric || '').replace(/,/g, '')), t = Number(String(o.total || '').replace(/,/g, '')); return m && t ? Math.round((m + (/^y/i.test(o.hq || '') ? 20 : 0)) * 10000 / t) / 100 : 0; };
const mlDob = o => { const m = String(o.dob || '').match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); return m ? m[3] + m[2].padStart(2, '0') + m[1].padStart(2, '0') : '99999999'; };
const mlSort = (a, b) => Math.round(mlAgg(b) * 100) - Math.round(mlAgg(a) * 100) || mlDob(a).localeCompare(mlDob(b)) || String(a.name).localeCompare(String(b.name));
const mlPic = u => { u = String(u || ''); const d = u.match(/\/d\/([\w-]{20,})/) || u.match(/[?&]id=([\w-]{20,})/); return d ? 'https://drive.google.com/thumbnail?id=' + d[1] + '&sz=w120' : /^https?:/.test(u) ? u : ''; };
/** fee of each program = the most common paid challan above Rs 3,000 (worked out once per student list) */
let ML = null;
const mlLast = () => (init && init.cfg && init.cfg.lastDate) || '';                                   // cache: { at, fees, lists }
function mlFees(all){
  const c = {};
  all.forEach(o => feeOf(o.challan).forEach(x => { if(x.amount > REG_FEE_MAX){ const k = c[o.key] = c[o.key] || {}; k[x.amount] = (k[x.amount] || 0) + 1; } }));
  const f = {}; Object.keys(c).forEach(k => { const t = Object.entries(c[k]).sort((a, b) => b[1] - a[1])[0]; f[k] = t ? Number(t[0]) : 0; });

      <div style="margin-top:4px"><b>${esc(r.quota || '-')}</b> · ${esc(r.pos || '-')}${v ? ` → <b>${esc(v.text)}</b>` : ''}</div>
      ${v && v.key ? `<div style="margin-top:2px">Admit as: <b>${esc(lab(v.key))} · ${esc(v.quota)}</b></div>` : ''}
      ${(() => { const x = omlStu(r, S, new Map((pnew && pnew.list || []).map(z => [omlK(z.name, z.father), z]))); return `<div class="omm ${x.lvl}" style="margin-top:4px">${esc(x.msg)}</div><div class="sub omm ${x.fee.lvl === 'ok' ? '' : x.fee.lvl}" style="font-weight:600">${esc(x.feeT)}</div>`; })()}
      ${t ? `<div class="${wrong ? 'warnp' : 'sub'}" style="margin-top:4px${wrong ? ';color:var(--bad)' : ''}">${wrong ? '⚠ ' : '✓ '}In the strength sheet: <b>${esc(t.roll || 'no Enroll#')}</b> · ${esc(lab(t.key))} · ${esc(t.pcs || '')} · ${esc(t.quota || '')}${wrong ? ' — the official list says ' + esc(lab(v.key)) + ' · ' + esc(v.quota) : ''}</div>` : '<div class="sub" style="margin-top:4px">Not in the strength sheet yet.</div>'}
      <div class="acts" style="margin-top:6px">
        ${v && v.state === 'claim' ? `<button class="btn primary" data-oc="${esc(r.list)}|${esc(r.form)}|1">Proof seen: confirm employee</button><button class="btn" data-oc="${esc(r.list)}|${esc(r.form)}|0">Not an employee</button>` : ''}
        ${!t && v && (v.state === 'ok' || v.state === 'check') ? `<button class="btn primary" data-oa="${esc(r.list)}|${esc(r.form)}">Admit: Roll No and section…</button>` : ''}
        ${t && wrong ? `<button class="btn" data-oe="${esc(t.roll || '')}">Open her record to correct</button>` : ''}
      </div></div>`; };
  const st = rows.reduce((a, r) => { const v = omlVerdict([r]) || {}; a[v.state || 'x'] = (a[v.state || 'x'] || 0) + 1; return a; }, {});
  return `<section class="card"><h3>Orientation desk</h3>
    <div class="sub">Type her name, father name or Form#. The official merit list says if she was selected, in which quota and subsidized or not; the portal copy is often still "Open Quota" in the first days.</div>
    <input id="omlQ" value="${esc(omlQ)}" placeholder="Name, father name or Form#" style="width:100%;height:46px;margin-top:8px" autocomplete="off">
    ${omlBusy ? `<div class="sub" id="omlBusy" style="margin-top:6px">${esc(omlBusy)}</div>` : ''}
    <div style="margin-top:8px">${omlQ.trim() ? (hits.map(card).join('') || '<div class="warnp">Not in the official lists. Check the spelling, the Form# on her admission letter, or whether her program\'s list is uploaded.</div>') : ''}</div></section>
  <section class="card"><h3>Official merit lists</h3>
    <div class="sub">Upload the final merit list PDFs of the Directorate of Admissions (Pre-Medical, F.A, FCS, Pre-Engineering, and the UoP Employee Quota list). Read on this device and kept for every device; uploading a list again replaces it (confirmations stay).</div>
    ${lists.length ? `<table class="ml" style="margin-top:8px"><thead><tr><th>List</th><th>Program</th><th class="n">Rows</th><th class="n">Selected</th><th class="n">Waiting</th><th class="n">Employee to confirm</th></tr></thead><tbody>
      ${lists.map(l => { const R = rows.filter(r => r.list === l); return `<tr><td>${esc(l)}</td><td>${esc([...new Set(R.map(r => r.program))].join(', '))}</td><td class="n">${R.length}</td><td class="n">${R.filter(r => /Selected/i.test(r.pos)).length}</td><td class="n">${R.filter(r => /Waiting/i.test(r.pos)).length}</td><td class="n">${R.filter(r => omlEmp(r) && !r.confirmed).length}</td></tr>`; }).join('')}</tbody></table>` : '<div class="sub" style="margin-top:6px">No list uploaded yet.</div>'}
    <div class="acts"><label class="btn primary" style="display:inline-flex;align-items:center;cursor:pointer">Upload PDF lists<input type="file" id="omlF" accept="application/pdf" multiple hidden></label>
      <button class="btn" type="button" id="omlChk" ${rows.length && idx ? '' : 'disabled'}>Check the strength sheet against the lists</button></div>
    ${omlMsg ? `<div class="hint" style="margin-top:6px">${omlMsg}</div>` : ''}
    <div class="sub" style="margin-top:6px">${Object.entries(st).map(([k, n]) => ({ ok:'selected', wait:'waiting', claim:'employee claims to confirm', no:'employee not confirmed', check:'to check (O-Level / unclear)', x:'?' }[k] + ' ' + n)).join(' · ')}</div></section>
  ${rows.length ? omlStuHtml(rows, lists, S) : ''}`;
}
const OMF = { act:'Need action', ok:'Admitted ✓', sel:'Selected, not admitted', fee:'Fee not paid / due', emp:'Employee claims', wait:'Waiting list', all:'All' };
function omlStuList(rows, S){
  const PN = new Map(); (pnew && pnew.list || []).forEach(s => PN.set(omlK(s.name, s.father), s));
  const R = rows.filter(r => !omlL || r.list === omlL).map(r => omlStu(r, S, PN));
  const is = { act:x => x.lvl === 'bad' || x.lvl === 'warn', ok:x => x.lvl === 'ok', sel:x => x.v && x.v.state === 'ok' && !x.t, fee:x => x.v && x.v.state !== 'wait' && x.fee.lvl !== 'ok', emp:x => x.v && (x.v.state === 'claim' || x.v.state === 'no'), wait:x => x.v && x.v.state === 'wait', all:() => true };
  return { R, is };
}
function omlStuHtml(rows, lists, S){
  const { R, is } = omlStuList(rows, S), cur = R.filter(is[omlF] || is.all);
  return `<section class="card"><h3>Students of the official lists</h3>
    <div class="sub">One line per student: what the official list decided, her fee from the portal challans, and her record in the strength sheet. <b>Selected</b> = she gets admission in that quota once her fee is paid. Pre-Medical subsidized fee (every quota) is half of the non-subsidized fee.</div>
    <div class="omf"><select id="omlL"><option value="">All lists</option>${lists.map(l => `<option ${l === omlL ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      ${Object.entries(OMF).map(([k, t]) => `<button class="btn ${k === omlF ? 'on' : ''}" type="button" data-omf="${k}">${t} (${R.filter(is[k]).length})</button>`).join('')}</div>
    <div class="acts"><button class="btn" type="button" id="omlOut">Open / print / share this list</button></div>
    <div style="overflow:auto"><table class="ml oms" style="margin-top:6px"><thead><tr><th>S#</th><th>Student</th><th>Official list</th><th>What to do</th><th></th></tr></thead><tbody>
    ${cur.slice(0, omlN).map(x => { const r = x.r; return `<tr><td class="n">${esc(r.sno)}</td>
      <td><b>${esc(r.name)}</b><div class="sub">d/o ${esc(r.father)} · Form# ${esc(r.form)} · AGG ${esc(r.agg)}${/^y/i.test(r.hq) ? ' · HQ' : ''}</div></td>
      <td>${esc(r.program)} · <b>${esc(r.quota || 'Open')}</b><div class="sub">${esc(r.pos || '-')}</div></td>
      <td><div class="omm ${x.lvl}">${esc(x.msg)}</div><div class="sub omm ${x.fee.lvl === 'ok' ? '' : x.fee.lvl}" style="font-weight:600">${esc(x.feeT)}</div></td>
      <td class="nw">${x.v && x.v.state === 'claim' ? `<button class="btn primary" data-oc="${esc(r.list)}|${esc(r.form)}|1">Confirm employee</button> <button class="btn" data-oc="${esc(r.list)}|${esc(r.form)}|0">Not employee</button>` : ''}
        ${!x.t && x.v && (x.v.state === 'ok' || x.v.state === 'check') ? `<button class="btn primary" data-oa="${esc(r.list)}|${esc(r.form)}">Admit…</button>` : ''}
        ${x.t && (x.wrong || x.lvl === 'bad') ? `<button class="btn" data-oe="${esc(x.t.roll || '')}">Open record</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="5" class="sub">Nobody here.</td></tr>'}
    </tbody></table></div>
    ${cur.length > omlN ? `<div class="acts"><button class="btn" type="button" id="omlMore">Show more (${cur.length - omlN} left)</button></div>` : ''}</section>`;
}
function omlAdmit(r){
  const v = omlVerdict([r]); if(!v) return;
  form = Object.assign(blankForm({ program:v.key || (init.programs.find(p => p.classProgram === v.cls) || {}).key, year:'1st Year', quota:v.quota || 'Open Quota' }),
    { name:r.name, father:r.father, metric:r.obt, total:r.total, hq:/^y/i.test(r.hq) ? 'Yes' : 'No' });
  lastDone = null; setTab('form'); window.scrollTo({ top:0 });
  toast('Program and quota from the official list. Fill the rest (or use From portal when she is on the portal).');
}
function omlCheck(){
  const S = omlStrength(), lab = k => (prog(k) || {}).label || k, out = [];
  idx.rows.forEach(row => { const o = recOf(row); if(isMig(o.year) || mlGone(o)) return;
    const R = omlFind(o.name, o.father, o.metric, o.total), v = omlVerdict(R, (prog(o.key) || {}).classProgram);
    let p = '';
    if(!v) p = 'Not in the official lists';
    else if(v.state === 'wait') p = 'Official list: waiting, not selected';
    else if(v.state === 'claim') p = 'UoP Employee claim not confirmed yet';
    else if(v.state === 'no') p = 'UoP Employee claim not confirmed';
    else if(v.key && o.key !== v.key) p = 'Program: strength sheet ' + lab(o.key) + ', official ' + lab(v.key);
    if(v && v.quota && qk(o.quota) !== qk(v.quota)) p = (p ? p + ' · ' : '') + 'Quota: strength sheet ' + (o.quota || '-') + ', official ' + v.quota;
    if(p) out.push([o.roll || '', o.name, o.father || '', lab(o.key), o.pcs || '', o.quota || '', v ? v.row.quota + ' · ' + v.row.pos : '', v ? v.row.agg : '', p]); });
  if(!out.length){ omlMsg = 'Every 1st Year student in the strength sheet matches the official lists.'; return render(); }
  JCWOUT.list({ title:'Strength sheet vs official merit lists (' + out.length + ')', head:['Enroll#', 'Student Name', 'Father Name', 'Program now', 'Section', 'Quota now', 'Official list', 'AGG', 'Problem'], rows:out });
}
function wireOml(){
  document.querySelectorAll('[data-omf]').forEach(b => b.onclick = () => { omlF = b.dataset.omf; omlN = 60; render(); });
  const ll = $('#omlL'); if(ll) ll.onchange = () => { omlL = ll.value; omlN = 60; render(); };
  const mo = $('#omlMore'); if(mo) mo.onclick = () => { omlN += 200; render(); };
  const oo = $('#omlOut'); if(oo) oo.onclick = () => { if(!window.JCWOUT || !oml) return;
    const { R, is } = omlStuList(oml.rows, omlStrength()), cur = R.filter(is[omlF] || is.all);
    JCWOUT.list({ title:'Official lists · ' + OMF[omlF] + (omlL ? ' · ' + omlL : ''), sub:cur.length + ' students',
      head:['S#', 'Form#', 'Student Name', 'Father Name', 'AGG', 'Program', 'Quota', 'Official status', 'Enroll#', 'What to do', 'Fee'],
      rows:cur.map(x => [x.r.sno, x.r.form, x.r.name, x.r.father, x.r.agg, x.r.program, x.r.quota || 'Open', x.r.pos, x.t ? x.t.roll || '' : '', x.msg, x.feeT.replace(/^Fee: /, '')]) }); };
  const i = $('#omlQ'); let t;
  if(i) i.oninput = () => { clearTimeout(t); t = setTimeout(() => { omlQ = i.value; const pos = i.selectionStart; render(); const j = $('#omlQ'); j.focus(); try{ j.setSelectionRange(pos, pos); }catch(e){} }, 200); };
  const f = $('#omlF'); if(f) f.onchange = async () => {
    const files = [...f.files]; omlMsg = '';
    for(const file of files){
      try{ omlBusy = 'Reading ' + file.name + '…'; render();
        const r = await omlRead(file);
        if(!r.rows.length) throw new Error('no students found (is it a Directorate of Admissions merit list?)');
        omlBusy = 'Saving ' + r.rows.length + ' rows of ' + file.name + '…'; render();
        const s = await api({ action:'adm_oml_save', list:file.name.replace(/\.pdf$/i, ''), rows:r.rows }, 300000);
        if(!s.ok) throw new Error(s.error === 'UNKNOWN_ACTION' ? 'Paste the new Admissions.gs and deploy a New version first.' : s.error);
        omlMsg += esc(file.name) + ': ' + r.rows.length + ' students (' + esc(r.title) + ') saved.<br>';
      }catch(e){ omlMsg += '<b style="color:var(--bad)">' + esc(file.name) + ': ' + esc(e.message || e) + '</b><br>'; }
    }
    omlBusy = ''; await omlLoad(true); Object.keys(pnSel).forEach(k => { if(!pnSel[k].rollManual && !pnSel[k].secManual) delete pnSel[k]; }); render();
  };
  const c = $('#omlChk'); if(c) c.onclick = omlCheck;
  document.querySelectorAll('[data-oa]').forEach(b => b.onclick = () => { const [l, fm] = b.dataset.oa.split('|'); const r = oml.rows.find(x => x.list === l && x.form === fm); if(r) omlAdmit(r); });
  document.querySelectorAll('[data-oe]').forEach(b => b.onclick = () => { searchQ = b.dataset.oe; setTab('find'); });
  document.querySelectorAll('[data-oc]').forEach(b => b.onclick = async () => {
    const [l, fm, y] = b.dataset.oc.split('|'), note = y === '1' ? prompt('What did you see? (e.g. father\'s UoP employee card no.)', '') : prompt('Why not? (optional)', '');
    if(note === null) return;
    try{ const me = oml.rows.find(x => x.list === l && x.form === fm);   // v7.9: same girl on the employee list for 2 programs (2 Form#s): one proof answers both
      const both = me ? oml.rows.filter(x => omlEmp(x) && omlK(x.name, x.father) === omlK(me.name, me.father)) : [{ list:l, form:fm }];
      for(const row of both){ const r = await api({ action:'adm_oml_confirm', list:row.list, form:row.form, yes:y === '1', note });
        if(!r.ok) throw new Error(r.error === 'UNKNOWN_ACTION' ? 'Paste the new Admissions.gs and deploy a New version first.' : r.error);
        if(row.name){ row.confirmed = r.confirmed; row.confirmedBy = r.by; row.confirmedOn = r.on; row.note = note; } }
      idbSet('oml', oml);
      Object.keys(pnSel).forEach(k => { if(!pnSel[k].rollManual && !pnSel[k].secManual) delete pnSel[k]; }); toast(y === '1' ? 'Confirmed: UoP Employee Quota (subsidized)' : 'Marked: not an employee'); render(); }catch(e){ toast(e.message); } });
}

/* ---------- waiting ---------- */
function waitHtml(){
  if(!queue.length) return `<div class="card"><h2>Nothing waiting</h2><div class="sub">Every admission and change made on this phone has reached the strength sheet.</div></div>`;
  return `<div class="acts" style="margin:0 0 12px"><button class="btn primary" type="button" id="xSend" ${online() ? '' : 'disabled'}>${online() ? 'Send now' : 'Offline: sends when internet returns'}</button></div>
  ${queue.map(q => `<section class="card"><h3>${esc(q.d.d.name || '(no name)')} <span class="pill ${q.state === 'wait' ? 'info' : 'full'}">${q.state === 'wait' ? 'waiting' : 'needs attention'}</span></h3>
    <div class="sub">${q.d.ctx ? 'Change to ' + esc(q.d.ctx.roll || q.d.ctx.origName) : 'New admission'} · ${esc(q.label)} · ${esc(q.d.d.quota)} · kept ${esc(new Date(q.at).toLocaleString())}</div>
    ${q.state !== 'wait' ? issuesHtml(q.errors, q.issues) : ''}
    <div class="acts">${q.state !== 'wait' ? `<button class="btn small" type="button" data-qopen="${esc(q.qid)}">Open and fix</button>` : ''}
      ${q.state === 'problem' && !q.errors.length ? `<button class="btn small danger" type="button" data-qforce="${esc(q.qid)}">Save anyway</button>` : ''}
      ${q.state === 'error' ? `<button class="btn small" type="button" data-qretry="${esc(q.qid)}">Try again</button>` : ''}
      <button class="btn small" type="button" data-qdel="${esc(q.qid)}">Delete</button></div></section>`).join('')}`;
}
function wireWait(){
  const s = $('#xSend'); if(s) s.onclick = () => { queue.forEach(q => { if(q.state === 'error') q.state = 'wait'; }); saveQ(); sync(); };
  document.querySelectorAll('[data-qdel]').forEach(b => b.onclick = () => {
    const q = queue.find(x => x.qid === b.dataset.qdel);
    dlgOpen(`<h2>Delete this save?</h2><div class="sub">${esc(q.d.d.name)} will not reach the strength sheet.</div><div class="acts"><button class="btn" id="dBack">Keep</button><button class="btn danger" id="dGo">Delete</button></div>`);
    $('#dBack').onclick = dlgClose; $('#dGo').onclick = () => { queue = queue.filter(x => x.qid !== q.qid); saveQ(); dlgClose(); render(); };
  });
  document.querySelectorAll('[data-qforce]').forEach(b => b.onclick = () => { const q = queue.find(x => x.qid === b.dataset.qforce); q.override = true; q.state = 'wait'; q.cid = uid(); saveQ(); sync(); render(); });
  document.querySelectorAll('[data-qretry]').forEach(b => b.onclick = () => { const q = queue.find(x => x.qid === b.dataset.qretry); q.state = 'wait'; saveQ(); sync(); render(); });
  document.querySelectorAll('[data-qopen]').forEach(b => b.onclick = () => {
    const q = queue.find(x => x.qid === b.dataset.qopen), d = q.d.d;
    form = Object.assign(blankForm(), d, { rollManual:!!d.rollNo, ctx:q.d.ctx, qid:q.qid, group:'', subjects:d.subjects.slice() });
    lastDone = null; setTab('form');
  });
}

/* ---------- loading ---------- */
async function refreshInit(show){
  if(!online() || !user) return;
  try{
    const r = await api({ action:'adm_init' }, 90000);
    if(!r.ok) throw new Error(r.error || 'Could not load');
    init = r; ls.set('adm_init', init); fatal = '';
    if(!form) form = blankForm();
    if(show) toast('Seats and lists updated');
  } catch(e){ if(e.fatal || !init) fatal = e.message; if(show) toast(e.message); }
  render();
}
async function loadIndex(force){
  if(!idx) idx = await idbGet('index');
  if(!online() || !user) return;
  if(!force && idx && Date.now() - (idx.t || 0) < 10 * 60000) return;
  try{ const r = await api({ action:'adm_index' }, 120000); if(r.ok){ idx = { cols:r.cols, rows:r.rows, at:r.at, t:Date.now() }; idbSet('index', idx); if(force) toast(idx.rows.length + ' students downloaded'); } }
  catch(e){ if(force) toast(e.message); }
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { if(tab === 'form' && form) readForm(); setTab(b.dataset.tab); });
$('#bSave').onclick = onSave;
$('#bClear').onclick = () => {
  dlgOpen(`<h2>Clear the form?</h2><div class="sub">${form && form.ctx ? 'Your unsaved changes to ' + esc(form.ctx.origName) + ' are dropped.' : 'Everything typed is removed. Program, year, section and quota stay.'}</div><div class="acts"><button class="btn" id="dBack">Back</button><button class="btn danger" id="dGo">Clear</button></div>`);
  $('#dBack').onclick = dlgClose; $('#dGo').onclick = () => { dlgClose(); readForm(); form = blankForm(form.ctx ? null : form); lastDone = null; render(); };
};
$('#dlg').addEventListener('click', e => { if(e.target.id === 'dlg') dlgClose(); });
window.addEventListener('online', () => { paintNet(); sync(); refreshInit(); pnLoad(false); render(); });
window.addEventListener('offline', () => { paintNet(); render(); });
window.addEventListener('beforeunload', () => { if(tab === 'form' && form) { readForm(); ls.set('adm_draft', form); } });
setInterval(() => { if(queue.some(q => q.state === 'wait')) sync(); }, 60000);
setInterval(() => { if(!pnBusy && document.visibilityState === 'visible') pnLoad(false); }, 5 * 60000);   // new portal admissions show up by themselves
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

(async function start(){
  const draft = ls.get('adm_draft', null); ls.set('adm_draft', null);
  if(init) form = draft && draft.program ? Object.assign(blankForm(), draft) : blankForm();
  render();
  idx = await idbGet('index');
  if(online() && user){ await refreshInit(); await loadIndex(false); await omlLoad(false); sync(); if(tab === 'find') render(); pnLoad(false); }
})();
</script>
</body>
</html>
