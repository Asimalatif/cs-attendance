<title>JCW Admissions</title>
<style>
:root{--bg:#F2F5FA;--surface:#fff;--surface2:#F7F8FB;--ink:#0F1B2D;--muted:#667085;--line:#E3E7EE;--accent:#0F1B2D;--on-accent:#fff;--ring:#2F5BEA;
--good:#12805C;--good-bg:#E6F4EE;--bad:#D92D20;--bad-bg:#FDECEA;--mid:#B7791F;--mid-bg:#FFF4DB;--info:#1C4A7E;--info-bg:#E4EEFA;--hero:#0F1B2D;--hero2:#1C3158;
--shadow:0 1px 2px rgba(15,27,45,.06),0 2px 8px rgba(15,27,45,.05);--r:14px;--sab:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--surface:#141E31;--surface2:#18233A;--ink:#EAF0FA;--muted:#9AA9C0;--line:#25324A;--accent:#EAF0FA;--on-accent:#0B1220;--ring:#7AA2FF;
--good:#3CC38A;--good-bg:#12302A;--bad:#F26B60;--bad-bg:#3A1C1F;--mid:#E8B04A;--mid-bg:#3A2F14;--info:#8EB4F0;--info-bg:#17294A;--hero:#16233D;--hero2:#233B68;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(90px + var(--sab))}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
header{background:linear-gradient(160deg,var(--hero),var(--hero2));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
.hin{max-width:820px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px}
.back{color:#BFD2FF;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
h1{margin:6px 0 2px;font-size:21px;line-height:1.2}
.hsub{color:rgba(255,255,255,.75);font-size:12.5px}
.net{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.14);white-space:nowrap}
.net.off{background:#7A2E2A}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:transparent;border:0;color:rgba(255,255,255,.75);font-weight:700;padding:10px 14px;border-radius:12px 12px 0 0;font-size:14px}
nav button[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;line-height:18px;margin-left:4px;text-align:center}
main{max-width:820px;margin:0 auto;padding:14px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 8px;font-size:16px}
.card h3{margin:0 0 6px;font-size:15px}
.sub{color:var(--muted);font-size:13px}
label{display:block;font-size:12px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
input,select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:var(--surface2)}
textarea{padding:10px 12px;min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ring)}
input[readonly]{opacity:.75}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:420px){.g3{grid-template-columns:1fr 1fr}}
.rowi{display:flex;gap:8px;align-items:stretch}
.rowi input{flex:1;min-width:0}
.btn{min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:750;font-size:15px;padding:0 16px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{min-height:38px;font-size:13.5px;padding:0 12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.seg button{flex:1;min-height:46px;border:0;background:transparent;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.seat{margin-top:6px;font-size:13px;font-weight:650;padding:7px 10px;border-radius:10px;background:var(--surface2)}
.seat.ok{background:var(--good-bg);color:var(--good)}.seat.near{background:var(--mid-bg);color:var(--mid)}
.seat.full,.seat.over{background:var(--bad-bg);color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.near{background:var(--mid-bg);color:var(--mid)}
.pill.full,.pill.over{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.editbar{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-weight:650;font-size:14px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.editbar span{flex:1}
.done{background:var(--good-bg);color:var(--good);border-radius:12px;padding:12px;margin-bottom:12px;font-weight:650}
.done big{display:block;font-size:22px;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.subs input{min-height:44px;font-size:14px;padding:0 10px;text-transform:uppercase}
.agg{font-size:14px;font-weight:700;margin-top:8px}
details{margin-top:6px}
summary{cursor:pointer;font-weight:750;padding:10px 0;color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--sab));z-index:10}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:10px}
.bar .btn{flex:1}
.bar .btn.primary{flex:2}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.it .who{flex:1;min-width:0}
.it b{display:block;font-size:15px}
.it small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.it img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--surface2);flex:0 0 40px}
.av{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;color:var(--muted);flex:0 0 40px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
th{color:var(--muted);font-weight:700;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.iss{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.iss li{padding:8px 10px;border-radius:10px;font-size:14px;background:var(--surface2)}
.iss .danger,.iss .error{background:var(--bad-bg);color:var(--bad);font-weight:650}
.iss .warn,.iss .note{background:var(--mid-bg);color:var(--mid)}
.iss .good{background:var(--good-bg);color:var(--good)}
.iss .info{background:var(--info-bg);color:var(--info)}
dialog{border:0;border-radius:18px;padding:0;max-width:min(560px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,25,.55)}
.dlg{padding:18px}
.dlg h2{margin:0 0 6px;font-size:18px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%) translateY(20px);background:#101828;color:#fff;padding:10px 16px;border-radius:12px;font-weight:650;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px;font-weight:650;margin-bottom:12px}
.req{color:var(--bad)}
.hidden{display:none!important}
.pn{padding:12px}
.pn.off{opacity:.55}
.pn .hd{display:flex;gap:10px;align-items:flex-start}
.pn .hd input[type=checkbox]{width:22px;height:22px;min-height:0;flex:0 0 22px;margin-top:2px;accent-color:var(--brown)}
.pn .hd .who{flex:1;min-width:0}
.pn .hd b{font-size:15px}
.pn .g2 label,.pn .g3 label{margin-top:8px}
.pn select,.pn input[type=text]{min-height:42px;font-size:14.5px}
.pn .warnp{color:var(--mid);font-weight:700;font-size:12.5px}
.stickbar{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:8px 0;margin-bottom:8px}
.stickbar .acts{margin-top:0}
.pn .ph{width:76px;height:92px;border-radius:12px;object-fit:cover;flex:0 0 76px;background:var(--surface2);border:1.5px solid var(--line);cursor:zoom-in}
.pn .phx{width:76px;height:92px;border-radius:12px;flex:0 0 76px;display:grid;place-items:center;font-size:28px;font-weight:800;background:var(--tea2);color:var(--brown)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.facts div{background:var(--surface2);border-radius:10px;padding:6px 9px;font-size:13px;min-width:0}
.facts small{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.facts b{display:block;overflow-wrap:anywhere}
.fee{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.fee .pill{font-variant-numeric:tabular-nums}
.feew{margin-top:6px;padding:8px 10px;border:2px solid var(--bad);border-radius:10px;color:var(--bad);font-weight:800;font-size:13px}
.seatlink{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer;font-weight:800}
.bigpic{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:var(--surface2)}
.dtab td:first-child{color:var(--muted);font-weight:700;width:40%}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* cards: clear edge, deeper shadow, a coloured top edge and a soft tint; every card in a row gets its own colour */

<body>
<header><div class="hin">
  <div class="top"><a class="back" href="./">&#8249; Attendance</a><span class="net" id="net">…</span></div>
  <h1>Admissions</h1>
  <div class="hsub">New students and changes go straight into Transform-ALL-COLLEGE-STRENGTH. Works without internet.</div>
  <nav role="tablist">
    <button role="tab" data-tab="form" aria-selected="true">New</button>
    <button role="tab" data-tab="pnew" aria-selected="false">From portal<span class="badge hidden" id="pb">0</span></button>
    <button role="tab" data-tab="find" aria-selected="false">Find &amp; edit</button>
    <button role="tab" data-tab="seats" aria-selected="false">Seats</button>
    <button role="tab" data-tab="wait" aria-selected="false">Waiting<span class="badge hidden" id="qb">0</span></button>
  </nav>
</div></header>
<main id="main"></main>
<div class="bar hidden" id="bar"><div class="in">
  <button class="btn" type="button" id="bClear">Clear</button>
  <button class="btn primary" type="button" id="bSave">Save</button>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<datalist id="subList"></datalist>
<datalist id="boardList"><option>BISE Peshawar</option><option>BISE Mardan</option><option>BISE Malakand</option><option>BISE Swat</option><option>BISE Kohat</option><option>BISE Bannu</option><option>BISE Abbottabad</option><option>FBISE Islamabad</option><option>Cambridge (O-Level)</option></datalist>
<script>
'use strict';
/* Same server as the attendance app (index.html). Change both together. */
const API = 'https://script.google.com/macros/s/AKfycbzl-DwgASIhf-pIGYi9D3M-CGOm7d7-UKg0W-OoWAiuRBHe4mjlRgMQXIHuLm6zi--i/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d){ try{ const v = localStorage.getItem('csa2_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('csa2_' + k, JSON.stringify(v)); }catch(e){} }
};
/* login is shared with the attendance app */
const user = ls.get('user', ''), pass = ls.get('pass', '');

/* ---------- big student list lives in IndexedDB (about 1 MB) ---------- */
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('csa_adm', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try{ const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }catch(e){ return null; } }
async function idbSet(k, v){ try{ const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }catch(e){} }

let init = ls.get('adm_init', null);          // programs, sections, seats, subjects, rooms (from the server)
let idx = null;                               // { cols, rows, at }

async function api(payload, ms = 60000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(API, { method:'POST', body:JSON.stringify({ username:user, password:pass, ...payload }), signal:ctl.signal, redirect:'follow' });
    const txt = await r.text();
    let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('The server sent a web page instead of data. Check the deployment.'); }
    if(j && j.error === 'UNKNOWN_ACTION') throw Object.assign(new Error('The server does not know Admissions yet: add Admissions.gs and the doPost line, then deploy a new version.'), { fatal:true });
    if(j && j.error === 'ADM_NO_ACCESS') throw Object.assign(new Error('Your login cannot add admissions. Ask the admin to add your username to ADM_USERS.'), { fatal:true });
    if(j && j.error === 'BAD_LOGIN') throw Object.assign(new Error('Your saved login was refused. Open the attendance app, log out and sign in again.'), { fatal:true });
    return j;
  } catch(e){
    if(e.name === 'AbortError') throw new Error('The server took too long. Try again.');
    if(e instanceof TypeError) throw Object.assign(new Error('No internet'), { net:true });
    throw e;
  } finally { clearTimeout(t); }
}

function compulsory(p, year){ const s = init && init.subjects[p] && init.subjects[p][year]; return s ? s.compulsory.slice() : ['ENGLISH','URDU', isMig(year) ? 'PAK-STUDIES' : 'ISLAMIYAT','MUTALIA QURAN']; }

function roomOf(pcs){ return (init && init.rooms && init.rooms[pcs]) || ''; }

function mapYear(subj, p, year){
  const s = String(subj || '').trim().toUpperCase(), pr = prog(p);

/* ---------- seats (from the last server state) ---------- */
function seatFor(p, quota){
  if(!init || !init.seats) return null;
  const pr = init.seats.programs.find(x => x.key === p); if(!pr) return null;
  return pr.quotas.find(q => qk(q.name) === qk(quota)) || { name:quota, seats:'', filled:0, status:'unset' };
}
function pendingFor(p, quota){ return queue.filter(q => !q.d.ctx && q.d.d.program === p && qk(q.d.d.quota) === qk(quota) && !isMig(q.d.d.year)).length; }
function seatText(p, quota, year){
  if(isMig(year)) return { cls:'', t:'2nd Year migration: always Open Quota, not counted against the 1st-year seats.' };
  const s = seatFor(p, quota); if(!s) return { cls:'', t:'' };
  const pend = pendingFor(p, quota), extra = pend ? ' · ' + pend + ' more waiting on this phone' : '';
  if(s.seats === '' || s.seats == null) return { cls:'', t:s.filled + ' admitted · no seat limit set' + extra };
  const left = s.seats - s.filled;
  return { cls:s.status, t:s.filled + ' of ' + s.seats + ' taken' + (s.pooled ? ' (shared pool)' : '') + ' · ' + (left > 0 ? left + ' left' : left === 0 ? 'FULL' : (-left) + ' over the limit') + extra };
}

function readForm(){
  const v = id => { const e = $(id); return e ? e.value : undefined; };
  const f = form;
  [['#fRoom','room'],['#fName','name'],['#fFather','father'],['#fId','id'],['#fMetric','metric'],['#fTotal','total'],['#fHq','hq'],
   ['#fDob','dob'],['#fContact','contact'],['#fEmail','email'],['#fBoard','board'],['#fPass','passYear'],['#fMroll','matricRoll'],
   ['#fChallan','challan'],['#fPic','pic'],['#fMigFrom','migratedFrom'],['#fBatch','batch'],['#fMerit','meritNo'],['#fGonly','groupOnly'],['#fPq','pq']].forEach(([id, k]) => { const x = v(id); if(x !== undefined) f[k] = x; });
  const q = v('#fQuota'); if(q !== undefined && !isMig(f.year)) f.quota = q;
  const r = v('#fRoll'); if(r !== undefined){ if(f.ctx) f.rollNo = r.trim(); else { f.rollManual = !!r.trim(); f.rollNo = r.trim(); } }
  document.querySelectorAll('[data-sub]').forEach(e => f.subjects[+e.dataset.sub] = e.value.toUpperCase());
}
function wireForm(){
  const sl = $('#subList'); const all = new Set();
  Object.values(init.subjects).forEach(y => Object.values(y).forEach(s => { s.compulsory.forEach(x => all.add(x)); s.groups.forEach(g => g.subjects.forEach(x => all.add(x))); }));
  sl.innerHTML = [...all].sort().map(x => `<option value="${esc(x)}">`).join('');
  $('#fProg').onchange = e => {
    readForm(); const old = form.program; form.program = e.target.value;
    form.section = sectionsOf(form.program, form.year)[0] || ''; form.room = roomOf(form.section);
    if(!quotasOf(form.program).some(q => qk(q) === qk(form.quota))) form.quota = quotasOf(form.program)[0];
    const og = groupsOf(old, form.year).map(g => g.subjects.join('|')), cur = form.subjects.slice(4).join('|');
    if(!form.ctx || og.indexOf(cur) >= 0 || !cur.replace(/\|/g, '')) { const g = groupsOf(form.program, form.year); form.subjects = compulsory(form.program, form.year).concat(g.length === 1 ? g[0].subjects : ['', '', '']); form.group = ''; }
    fetchNext(); render();
  };
  document.querySelectorAll('[data-year]').forEach(b => b.onclick = () => {
    readForm(); const y = b.dataset.year; if(y === form.year) return;
    form.year = y; form.section = sectionsOf(form.program, y)[0] || ''; form.room = roomOf(form.section);
    form.subjects = form.subjects.map(s => mapYear(s, form.program, y));
    if(!isMig(y)) form.subjects = form.subjects.map(s => s === 'PAK-STUDIES' ? 'ISLAMIYAT' : s);
    form.subjects.splice(0, 4, ...compulsory(form.program, y));
    if(isMig(y)) form.quota = init.cfg.mig.QUOTA;
    fetchNext(); render();
  });
  $('#fSec').onchange = e => { readForm(); const auto = form.room === roomOf(form.section) || !form.room; form.section = e.target.value; if(auto) form.room = roomOf(form.section); render(); };
  $('#fQuota').onchange = () => { readForm(); render(); };
  ['#fMetric','#fTotal','#fHq'].forEach(id => $(id).onchange = () => { readForm(); render(); });
  const g = $('#fGroup'); if(g) g.onchange = () => { readForm(); const gr = groupsOf(form.program, form.year)[+g.value]; form.group = g.value; if(gr) form.subjects.splice(4, 3, ...gr.subjects); render(); };
  const off = $('#xEditOff'); if(off) off.onclick = () => { form = blankForm(form); lastDone = null; render(); };
  const nr = $('#xNewRoll'); if(nr) nr.onclick = async () => {
    readForm(); nr.disabled = true;
    try{ const r = await api({ action:'adm_next_roll', program:form.program, year:form.year }); if(r.roll){ form.rollNo = r.roll; render(); toast('New number ' + r.roll + ' (saved only when you press Save)'); } else toast(r.error || 'No number'); }
    catch(e){ toast(e.message); nr.disabled = false; }
  };
  $('#xPortal').onclick = portalSearch;
  $('#fPq').onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); portalSearch(); } };

}

function applyPortal(p){

function localCheck(d, ctx){
  const errors = [], issues = [];
  if(!d.name) errors.push('Student name is required.');
  if(!d.quota) errors.push('Please choose a quota.');
  if(!d.section) errors.push('Please choose a section.');
  if(ctx && !d.rollNo) errors.push('Roll No is required.');
  if(d.subjects.slice(0, 4).filter(Boolean).length < 4) issues.push({ level:'danger', text:'The 4 compulsory subjects are not all filled in.' });
  const fs = d.subjects.filter(Boolean), dup = fs.find((x, i) => fs.indexOf(x) !== i);
  if(dup) issues.push({ level:'danger', text:'The subject ' + dup + ' is listed more than once.' });
  if(d.dob && !/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(d.dob)) issues.push({ level:'note', text:'Date of birth should look like 18/01/2011.' });
  if(idx){
    const me = ctx ? (ctx.roll ? nroll(ctx.roll) : '#' + ctx.sno) : null;
    const others = idx.rows.map(recOf).filter(o => !me || (o.roll ? nroll(o.roll) : '#' + o.sno) !== me);
    if(d.rollNo){ const r = others.find(o => nroll(o.roll) === nroll(d.rollNo)); if(r) errors.push('Roll No ' + d.rollNo + ' is already used by ' + r.name + ' (' + r.pcs + ').'); }
    if(d.id){ const r = others.find(o => o.id === d.id); if(r) issues.push({ level:'danger', text:'Portal ID ' + d.id + ' already belongs to ' + r.name + ' (' + (r.roll || r.pcs) + ').' }); }
    const nn = nrm(d.name), nf = nrm(d.father);
    others.forEach(o => { if(nrm(o.name) !== nn || !nn) return; const same = nf && nrm(o.father) === nf;
      if(same) issues.push({ level:'danger', text:'Possible duplicate: ' + o.name + ' (father ' + o.father + ') is already in ' + o.pcs + ', ' + (o.roll || 'no roll no') + '.' });
      else if(!nf || !nrm(o.father)) issues.push({ level:'note', text:'Another ' + o.name + ' is in ' + o.pcs + '. Check she is a different girl.' }); });
  }
  queue.filter(q => q.qid !== form.qid && !q.d.ctx && nrm(q.d.d.name) === nrm(d.name) && nrm(q.d.d.father) === nrm(d.father))
    .forEach(() => issues.push({ level:'danger', text:'The same name and father are already waiting on this phone (Waiting tab).' }));
  if(!ctx && !isMig(d.year)){ const s = seatFor(d.program, d.quota), pend = pendingFor(d.program, d.quota);
    if(s && s.seats !== '' && s.filled + pend >= s.seats) issues.push({ level:'danger', text:'"' + d.quota + '" looked full when this phone last checked: ' + (s.filled + pend) + ' of ' + s.seats + ' (incl. waiting).' }); }
  return { errors, issues };
}
function issuesHtml(errors, issues){

}

function enqueue(d, ctx, override){
  const f = form, pr = prog(d.program);
  const item = { qid:f.qid || uid(), cid:uid(), d:{ d, ctx }, override:!!override, at:Date.now(), state:'wait', errors:[], issues:[], label:(pr ? pr.label : d.program) + ' · ' + d.year + ' · ' + d.section };
  const i = queue.findIndex(q => q.qid === item.qid);
  if(i >= 0) queue[i] = item; else queue.push(item);
  saveQ();
  lastDone = { name:d.name, roll:d.rollNo || (online() ? 'sending…' : ''), where:item.label + ' · ' + d.quota + (online() ? '' : ' · waiting for internet') };
  const keep = { program:d.program, year:d.year, section:d.section, quota:d.quota };
  form = blankForm(ctx ? null : keep);
  if(ctx){ lastDone = null; toast(online() ? 'Saving changes…' : 'Changes kept on this phone'); setTab(online() ? 'find' : 'wait'); }
  else { render(); window.scrollTo({ top:0, behavior:'smooth' }); }
  sync();

/* ---------- send waiting saves ---------- */
async function sync(){
  if(syncing || !online() || !queue.length || !user) return;
  syncing = true;
  try{
    for(const item of queue.slice()){
      if(item.state === 'problem' || item.state === 'error') continue;
      let r;
      try{ r = await api({ action:'adm_save', d:item.d.d, ctx:item.d.ctx, override:item.override, cid:item.cid }); }
      catch(e){ if(e.fatal){ fatal = e.message; } else if(!e.net){ item.state = 'error'; item.errors = [e.message]; saveQ(); } break; }
      if(r && r.ok){
        queue = queue.filter(q => q.qid !== item.qid); saveQ();
        if(r.rec) putRec(r.rec, item.d.ctx);
        if(r.seats && init){ init.seats = r.seats; ls.set('adm_init', init); }
        if(r.next && r.next.roll) nextRoll[item.d.d.program + '|' + item.d.d.year] = { roll:r.next.roll, t:Date.now() };
        if(lastDone && lastDone.name === item.d.d.name && !item.d.ctx) lastDone.roll = r.roll;
        toast(r.nothing ? 'No change to save for ' + item.d.d.name : (item.d.ctx ? 'Updated: ' : 'Admitted: ') + item.d.d.name + ' · ' + (r.roll || ''), 4500);
      } else if(r){
        item.state = r.error ? 'error' : 'problem';
        item.errors = r.errors || (r.error ? [r.error] : []); item.issues = r.issues || []; item.blocked = !!r.blocked;
        saveQ();
        toast('Needs your decision: ' + item.d.d.name + ' (Waiting tab)', 5000);
        if(lastDone && lastDone.name === item.d.d.name) lastDone.roll = 'not saved, see Waiting';
      }
    }
  } finally { syncing = false; render(); }
}

const pnList = () => pnew && pnew.list ? pnew.list.filter(s => pnShowHidden || !pnHide.includes(s.id)) : [];
const pnSave = () => { ls.set('adm_pn_sel', pnSel); ls.set('adm_pn_hide', pnHide); };
function pnEntry(s){
  let e = pnSel[s.id];
  if(!e){
    e = pnSel[s.id] = { on:true, program:s.program || '', year:s.year || '1st Year', section:'', rollNo:'', quota:s.quotaGuess || 'Open Quota', rollManual:false, secManual:false };
  }
  return e;
}
/** gives every ticked student a Roll No (next free numbers of her program, in portal order) and the section with fewest students */
function pnSuggest(){
  if(!pnew || !pnew.list) return;
  const used = new Set(), cnt = {}, ptr = {};
  const pool = e => pnew.pools[e.program + '|' + e.year];
  const counts = k => cnt[k] || (cnt[k] = Object.fromEntries((pnew.pools[k] ? pnew.pools[k].secs : []).map(x => [x.name, x.count])));
  const act = pnew.list.filter(s => !pnHide.includes(s.id)).map(s => [s, pnEntry(s)]);
  if(idx) idx.rows.forEach(r => { if(r[1]) used.add(nroll(r[1])); });
  // what you typed or chose yourself is kept and reserved first
  act.forEach(([s, e]) => {
    if(!e.on) return;
    if(e.rollManual && e.rollNo) used.add(nroll(e.rollNo));
    if(e.secManual && e.section) { const c = counts(e.program + '|' + e.year); c[e.section] = (c[e.section] || 0) + 1; }
  });
  act.forEach(([s, e]) => {
    if(isMig(e.year)) e.quota = init ? init.cfg.mig.QUOTA : 'Open Quota';
    if(!e.on){ if(!e.rollManual) e.rollNo = ''; if(!e.secManual) e.section = ''; return; }
    const k = e.program + '|' + e.year, pl = pool(e);
    if(!pl){ if(!e.rollManual) e.rollNo = ''; if(!e.secManual) e.section = ''; return; }
    if(!e.secManual){
      const c = counts(k), cand = pl.secs.filter(x => !/optional/i.test(x.name)), list = cand.length ? cand : pl.secs;
      let best = ''; list.forEach(x => { if(!best || (c[x.name] || 0) < (c[best] || 0)) best = x.name; });
      e.section = best; if(best) c[best] = (c[best] || 0) + 1;
    }
    if(!e.rollManual){
      if(s.rollFromPortal && s.program === e.program && s.year === e.year && !used.has(nroll(s.rollFromPortal))) e.rollNo = s.rollFromPortal;
      else { let i = ptr[k] || 0; while(i < pl.free.length && used.has(nroll(pl.free[i]))) i++; e.rollNo = pl.free[i] || ''; ptr[k] = i + 1; }
      if(e.rollNo) used.add(nroll(e.rollNo));
    }
  });
  pnSave();
}
async function pnLoad(show){

}

  rfBusy = true; render();
  try{
    const accept = {}; if(apply){ Object.keys(rfAns).forEach(k => { if(rfAns[k]) accept[k] = rfAns[k]; }); Object.keys(rfAll).forEach(f => { if(rfAll[f]) accept['*|' + f] = 'yes'; }); }
    const r = await api({ action:'adm_refresh', fields:rfFields, apply, accept }, 300000);
    if(!r.ok) throw new Error(r.error || 'Could not update');
    if(!r.ask || (rfFields.includes('portal') && !(r.fields || []).includes('portal'))){
      rf = null;
      dlgOpen(`<h2>The server needs the new Admissions.gs</h2><div class="sub">The Apps Script project is still running an older Admissions.gs, so it cannot compare every column with the portal.</div>
        <ol style="margin:10px 0 0 18px;line-height:1.6"><li>Open the attendance Apps Script project.</li><li>Replace everything in <b>Admissions.gs</b> with the newest file from GitHub (Asimalatif/cs-attendance → Admissions.gs → Raw → copy all).</li><li><b>Deploy → Manage deployments → Edit (pencil) → Version: New version → Deploy.</b></li><li>Come back and press Preview changes again.</li></ol>
        <div class="acts"><button class="btn primary" id="dOk">OK</button></div>`);
      $('#dOk').onclick = dlgClose;
      return;
    }
    rf = r; rfAns = {}; rfAll = {};
    if(apply){ if(r.seats && init){ init.seats = r.seats; ls.set('adm_init', init); } toast('Strength sheet updated', 4000); loadIndex(true); }
  } catch(e){ if(e.fatal) fatal = e.message; else toast(e.message, 6000); }
  finally { rfBusy = false; render(); }
}

/* ---------- find ---------- */
function findHtml(){
  const q = searchQ.trim().toLowerCase();
  let res = [];
  if(idx && q.length >= 2){
    const words = q.split(/\s+/);
    for(const row of idx.rows){
      const hay = (row[1] + ' ' + row[2] + ' ' + row[3] + ' ' + row[4] + ' ' + row[7]).toLowerCase();
      if(words.every(w => hay.indexOf(w) >= 0)){ res.push(row); if(res.length >= 60) break; }
    }
  }
  const lbl = k => { const p = prog(k); return p ? p.label : k || 'No program'; };
  return `<section class="card">
    <label for="fq" style="margin-top:0">Search by name, father, roll no, portal ID or section</label>
    <input id="fq" value="${esc(searchQ)}" placeholder="e.g. ayesha khan, 2384, FCS-1 D3" autocomplete="off" autofocus>
    <div class="hint">${idx ? idx.rows.length + ' students · list from ' + esc(idx.at) : 'Student list not downloaded yet.'} <button class="btn small" type="button" id="xRef" ${online() ? '' : 'disabled'} style="margin-left:6px">Refresh list</button></div>
  </section>
  <div class="list">${q.length < 2 ? '<div class="empty">Type at least 2 letters.</div>' : res.length ? res.map(row => { const o = recOf(row);
    return `<button class="it" type="button" data-roll="${esc(o.roll)}" data-sno="${esc(o.sno)}">${o.pic ? `<img src="${esc(o.pic)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'av',textContent:'${esc((o.name || '?').charAt(0).toUpperCase())}'}))">` : `<span class="av">${esc((o.name || '?').charAt(0).toUpperCase())}</span>`}
      <span class="who"><b>${esc(o.name)}</b><small>${esc(o.father ? 'd/o ' + o.father : '')}</small><small>${esc(o.roll || 'no Enroll#')} · ${esc(lbl(o.key))} · ${esc(o.year)} · ${esc(o.pcs)} · ${esc(o.quota)}</small></span><span class="pill">Edit</span></button>`; }).join('') : '<div class="empty">No student found.</div>'}</div>`;
}
function wireFind(){
  const i = $('#fq'); let t;
  i.oninput = () => { clearTimeout(t); t = setTimeout(() => { searchQ = i.value; const pos = i.selectionStart; render(); const j = $('#fq'); j.focus(); try{ j.setSelectionRange(pos, pos); }catch(e){} }, 150); };
  $('#xRef').onclick = async () => { $('#xRef').disabled = true; await loadIndex(true); render(); };
  document.querySelectorAll('[data-sno]').forEach(b => b.onclick = () => {
    const row = idx.rows.find(r => (b.dataset.roll && r[1] === b.dataset.roll) || (!b.dataset.roll && r[0] === b.dataset.sno));
    if(!row) return;
    const o = recOf(row), d = dFromRec(o);
    form = Object.assign(blankForm(), d, { rollManual:true, group:'', qid:null,
      ctx:{ roll:o.roll, sno:o.sno, origName:o.name, orig:JSON.parse(JSON.stringify(Object.assign({}, d, { rollNo:o.roll }))) } });
    form.rollNo = o.roll; lastDone = null;
    setTab('form'); window.scrollTo({ top:0 });
  });
}

/* ---------- seats ---------- */
function seatsHtml(){
  const s = init.seats;
  const row = q => { const left = q.seats === '' ? '' : q.seats - q.filled;
    return `<tr><td>${esc(q.name)}${q.pooled ? ' <span class="pill info">pool</span>' : ''}</td><td class="n"><button type="button" class="seatlink" data-seat="${esc(q._k)}" data-q="${esc(q.name)}" title="Show who took these seats">${q.filled}</button>${q.pooled && q.own !== q.filled ? ' <small class="sub">(' + q.own + ' here)</small>' : ''}</td><td class="n">${q.seats === '' ? '–' : q.seats}</td><td class="n">${left === '' ? '' : `<span class="pill ${esc(q.status)}">${left < 0 ? (-left) + ' over' : left === 0 ? 'full' : left + ' left'}</span>`}</td></tr>`; };
  const wf = wrongFee();
  return `${wf.length ? `<section class="card" style="border:2px solid var(--bad)"><h3>⚠ ${wf.length} Pre-Medical student${wf.length === 1 ? '' : 's'} with a Rs ${SUB_FEE.toLocaleString('en-PK')} challan in a non-subsidized program</h3><div class="sub">Rs ${SUB_FEE.toLocaleString('en-PK')} is the subsidized fee: they should probably be in <b>Pre-Medical Open (S)</b>.</div><div class="acts"><button class="btn primary" type="button" id="wfList">Show the list</button></div></section>` : `<div class="sub" style="margin-bottom:6px">Fee check: no Pre-Medical student with a Rs ${SUB_FEE.toLocaleString('en-PK')} challan in a non-subsidized program.</div>`}
  <div class="sub" style="margin-bottom:10px">Tap a <u>Taken</u> number to see who took those seats. 1st Year only, counted from Transform-ALL-COLLEGE-STRENGTH · ${esc(s.at)}${queue.length ? ' · ' + queue.length + ' save(s) still waiting on this phone are not counted yet' : ''}. Seat limits come from "Quota Settings" in the admissions workbook.</div>
  ${s.programs.map(p => { const pr = prog(p.key); p.quotas.forEach(q => { q._k = q.pooled ? 'pool:' + ((s.pools.find(pl => qk(pl.quota) === qk(q.name)) || { members:[{ key:p.key }] }).members.map(m => m.key).join('|')) : p.key; });
    return `<section class="card"><h3>${esc(pr ? pr.label : p.key)} <span class="pill ${pr && pr.fee === 'non' ? 'near' : 'ok'}">${pr && pr.fee === 'non' ? 'non-subsidized' : 'subsidized'}</span></h3>
      <div class="sub">${p.filled} admitted${p.total !== '' ? ' of ' + p.total : ''}${p.noQuota ? ' · ' + p.noQuota + ' without quota' : ''}</div>
      <table><thead><tr><th>Quota</th><th class="n">Taken</th><th class="n">Seats</th><th class="n">Left</th></tr></thead><tbody>${p.quotas.map(row).join('')}</tbody></table></section>`; }).join('')}
  <section class="card"><h3>Shared seat pools</h3><table><thead><tr><th>Quota</th><th>Used by</th><th class="n">Taken</th><th class="n">Seats</th></tr></thead><tbody>
    ${s.pools.map(pl => `<tr><td>${esc(pl.quota)}</td><td class="sub">${pl.members.filter(m => m.filled).map(m => esc((prog(m.key) || {}).label || m.key) + ' ' + m.filled).join(', ') || '–'}</td><td class="n"><button type="button" class="seatlink" data-seat="${esc('pool:' + pl.members.map(m => m.key).join('|'))}" data-q="${esc(pl.quota)}">${pl.filled}</button></td><td class="n"><span class="pill ${esc(pl.status)}">${pl.seats === '' ? '–' : pl.seats}</span></td></tr>`).join('')}</tbody></table></section>
  <div class="acts"><button class="btn" type="button" onclick="refreshInit(true)" ${online() ? '' : 'disabled'}>Refresh seats</button></div>`;
}

const SUB_FEE = 60000;
/** Pre-Medical students in a non-subsidized program whose challan is Rs 60,000 (the subsidized fee) */
function wrongFee(){
  if(!idx) return [];
  return idx.rows.map(recOf).filter(o => { const pr = prog(o.key); return pr && pr.classProgram === 'Pre-Medical' && pr.fee === 'non' && feeOf(o.challan).some(x => Math.round(x.amount) === SUB_FEE); })
    .sort((a, b) => String(a.pcs).localeCompare(String(b.pcs)) || String(a.name).localeCompare(String(b.name)));
}
function stuTable(list, extra){
  return `<div style="max-height:55vh;overflow:auto;margin-top:8px"><table><thead><tr><th>#</th><th>Enroll#</th><th>Student</th><th>Section</th>${extra ? '<th>' + extra.h + '</th>' : ''}<th>Fee</th></tr></thead><tbody>
    ${list.map((o, i) => { const f = feeOf(o.challan); return `<tr><td>${i + 1}</td><td class="nw">${esc(o.roll || '–')}</td><td>${esc(o.name)}<div class="sub">d/o ${esc(o.father || '-')}</div></td><td class="nw">${esc(o.pcs)}</td>${extra ? '<td>' + esc(extra.v(o)) + '</td>' : ''}<td class="sub">${f.length ? f.map(x => (x.paid ? 'Paid ' : 'Unpaid ') + money(x.amount)).join(', ') : '–'}</td></tr>`; }).join('') || '<tr><td colspan="6" class="sub">Nobody.</td></tr>'}</tbody></table></div>`;
}
function listText(title, list){ return title + '\n\n' + list.map((o, i) => (i + 1) + '. ' + (o.roll || '-') + ' ' + o.name + ' d/o ' + (o.father || '-') + ' (' + o.pcs + ')').join('\n'); }
function listDlg(title, sub, list, extra){
  dlgOpen(`<h2>${esc(title)}</h2><div class="sub">${sub}</div>${stuTable(list, extra)}
    <div class="acts"><button class="btn" id="dCopy">Copy / share list</button><button class="btn primary" id="dOk">Close</button></div>`);
  $('#dOk').onclick = dlgClose;
  $('#dCopy').onclick = async () => { const t = listText(title, list);
    try{ if(navigator.share){ await navigator.share({ title, text:t }); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
    try{ await navigator.clipboard.writeText(t); toast('List copied'); }catch(e){ toast('Could not copy'); } };
}
function seatList(keyStr, quota){
  const keys = keyStr.startsWith('pool:') ? keyStr.slice(5).split('|') : [keyStr];
  const list = idx ? idx.rows.map(recOf).filter(o => keys.includes(o.key) && !isMig(o.year) && qk(o.quota) === qk(quota)).sort((a, b) => String(a.roll).localeCompare(String(b.roll), undefined, { numeric:true })) : [];
  const lbl = keys.map(k => (prog(k) || {}).label || k).join(', ');
  listDlg(quota + ' · ' + lbl, list.length + ' student' + (list.length === 1 ? '' : 's') + ' (1st Year) from this phone\'s copy of the strength sheet' + (keys.length > 1 ? ' · shared pool' : '') + '.', list, keys.length > 1 ? { h:'Program', v:o => (prog(o.key) || {}).label || o.key } : null);
}
function wireSeats(){
  document.querySelectorAll('[data-seat]').forEach(b => b.onclick = () => seatList(b.dataset.seat, b.dataset.q));
  const w = $('#wfList'); if(w) w.onclick = () => { const L = wrongFee(); listDlg('Rs ' + SUB_FEE.toLocaleString('en-PK') + ' fee in a non-subsidized Pre-Medical program', 'These students have a Rs ' + SUB_FEE.toLocaleString('en-PK') + ' (subsidized) challan but are in a non-subsidized program. Move them to <b>Pre-Medical Open (S)</b> with Find &amp; edit if that is right.', L, { h:'Program now', v:o => (prog(o.key) || {}).label || o.key }); };
}

/* ---------- waiting ---------- */
function waitHtml(){
  if(!queue.length) return `<div class="card"><h2>Nothing waiting</h2><div class="sub">Every admission and change made on this phone has reached the strength sheet.</div></div>`;
  return `<div class="acts" style="margin:0 0 12px"><button class="btn primary" type="button" id="xSend" ${online() ? '' : 'disabled'}>${online() ? 'Send now' : 'Offline: sends when internet returns'}</button></div>
  ${queue.map(q => `<section class="card"><h3>${esc(q.d.d.name || '(no name)')} <span class="pill ${q.state === 'wait' ? 'info' : 'full'}">${q.state === 'wait' ? 'waiting' : 'needs attention'}</span></h3>
    <div class="sub">${q.d.ctx ? 'Change to ' + esc(q.d.ctx.roll || q.d.ctx.origName) : 'New admission'} · ${esc(q.label)} · ${esc(q.d.d.quota)} · kept ${esc(new Date(q.at).toLocaleString())}</div>
    ${q.state !== 'wait' ? issuesHtml(q.errors, q.issues) : ''}
    <div class="acts">${q.state !== 'wait' ? `<button class="btn small" type="button" data-qopen="${esc(q.qid)}">Open and fix</button>` : ''}
      ${q.state === 'problem' && !q.errors.length ? `<button class="btn small danger" type="button" data-qforce="${esc(q.qid)}">Save anyway</button>` : ''}
      ${q.state === 'error' ? `<button class="btn small" type="button" data-qretry="${esc(q.qid)}">Try again</button>` : ''}
      <button class="btn small" type="button" data-qdel="${esc(q.qid)}">Delete</button></div></section>`).join('')}`;
}
function wireWait(){
  const s = $('#xSend'); if(s) s.onclick = () => { queue.forEach(q => { if(q.state === 'error') q.state = 'wait'; }); saveQ(); sync(); };
  document.querySelectorAll('[data-qdel]').forEach(b => b.onclick = () => {
    const q = queue.find(x => x.qid === b.dataset.qdel);
    dlgOpen(`<h2>Delete this save?</h2><div class="sub">${esc(q.d.d.name)} will not reach the strength sheet.</div><div class="acts"><button class="btn" id="dBack">Keep</button><button class="btn danger" id="dGo">Delete</button></div>`);
    $('#dBack').onclick = dlgClose; $('#dGo').onclick = () => { queue = queue.filter(x => x.qid !== q.qid); saveQ(); dlgClose(); render(); };
  });
  document.querySelectorAll('[data-qforce]').forEach(b => b.onclick = () => { const q = queue.find(x => x.qid === b.dataset.qforce); q.override = true; q.state = 'wait'; q.cid = uid(); saveQ(); sync(); render(); });
  document.querySelectorAll('[data-qretry]').forEach(b => b.onclick = () => { const q = queue.find(x => x.qid === b.dataset.qretry); q.state = 'wait'; saveQ(); sync(); render(); });
  document.querySelectorAll('[data-qopen]').forEach(b => b.onclick = () => {
    const q = queue.find(x => x.qid === b.dataset.qopen), d = q.d.d;
    form = Object.assign(blankForm(), d, { rollManual:!!d.rollNo, ctx:q.d.ctx, qid:q.qid, group:'', subjects:d.subjects.slice() });
    lastDone = null; setTab('form');
  });
}

/* ---------- loading ---------- */
async function refreshInit(show){
  if(!online() || !user) return;
  try{
    const r = await api({ action:'adm_init' }, 90000);
    if(!r.ok) throw new Error(r.error || 'Could not load');
    init = r; ls.set('adm_init', init); fatal = '';
    if(!form) form = blankForm();
    if(show) toast('Seats and lists updated');
  } catch(e){ if(e.fatal || !init) fatal = e.message; if(show) toast(e.message); }
  render();
}
async function loadIndex(force){
  if(!idx) idx = await idbGet('index');
  if(!online() || !user) return;
  if(!force && idx && Date.now() - (idx.t || 0) < 10 * 60000) return;
  try{ const r = await api({ action:'adm_index' }, 120000); if(r.ok){ idx = { cols:r.cols, rows:r.rows, at:r.at, t:Date.now() }; idbSet('index', idx); if(force) toast(idx.rows.length + ' students downloaded'); } }
  catch(e){ if(force) toast(e.message); }
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { if(tab === 'form' && form) readForm(); setTab(b.dataset.tab); });
$('#bSave').onclick = onSave;
$('#bClear').onclick = () => {
  dlgOpen(`<h2>Clear the form?</h2><div class="sub">${form && form.ctx ? 'Your unsaved changes to ' + esc(form.ctx.origName) + ' are dropped.' : 'Everything typed is removed. Program, year, section and quota stay.'}</div><div class="acts"><button class="btn" id="dBack">Back</button><button class="btn danger" id="dGo">Clear</button></div>`);
  $('#dBack').onclick = dlgClose; $('#dGo').onclick = () => { dlgClose(); readForm(); form = blankForm(form.ctx ? null : form); lastDone = null; render(); };
};
$('#dlg').addEventListener('click', e => { if(e.target.id === 'dlg') dlgClose(); });
window.addEventListener('online', () => { paintNet(); sync(); refreshInit(); pnLoad(false); render(); });
window.addEventListener('offline', () => { paintNet(); render(); });
window.addEventListener('beforeunload', () => { if(tab === 'form' && form) { readForm(); ls.set('adm_draft', form); } });
setInterval(() => { if(queue.some(q => q.state === 'wait')) sync(); }, 60000);
setInterval(() => { if(!pnBusy && document.visibilityState === 'visible') pnLoad(false); }, 5 * 60000);   // new portal admissions show up by themselves
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

(async function start(){
  const draft = ls.get('adm_draft', null); ls.set('adm_draft', null);
  if(init) form = draft && draft.program ? Object.assign(blankForm(), draft) : blankForm();
  render();
  idx = await idbGet('index');
  if(online() && user){ await refreshInit(); await loadIndex(false); sync(); if(tab === 'find') render(); pnLoad(false); }
})();
</script>
</body>
</html>
