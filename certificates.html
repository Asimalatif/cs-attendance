<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B3423">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>JCW Provisional Certificates</title>
<style>
:root{--bg:#F7EDEA;--surface:#fff;--surface2:#FBEDEA;--ink:#2B1912;--muted:#7C6159;--line:#E2C0B8;--brown:#6B3423;--tea:#E7B7AE;--good:#0E8A5F;--good-bg:#E3F4EC;--bad:#C0392B;--bad-bg:#FDE3E1;--mid:#B4740E;--mid-bg:#FFF2D6;--blue:#1F4E8C;--blue-bg:#E4ECF8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A110F;--surface:#261915;--surface2:#30201B;--ink:#F6E9E5;--muted:#C4A8A0;--line:#4A3029;--tea:#8A5A50;--good-bg:#14302A;--bad-bg:#3A1C1F;--mid-bg:#3A2F14;--blue-bg:#18243A}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:60px}
button,select,input{font:inherit;color:inherit}
header{background:linear-gradient(120deg,#4A2418,#8A4A35);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px}
header .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:50%;background:#fff;padding:3px;flex:none}
header h1{margin:0;font-size:19px;line-height:1.2}
header small{display:block;opacity:.85;font-size:12.5px;font-weight:400}
header a{margin-left:auto;color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1.5px solid var(--line);border-top:5px solid var(--c,var(--brown));border-radius:20px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:17px;color:var(--brown)}
@media(prefers-color-scheme:dark){.card h2{color:var(--tea)}}
.sub{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
label.f input,label.f select{height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);font-size:15px;font-weight:600;color:var(--ink);width:100%;min-width:0}
.btn{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;padding:0 14px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:linear-gradient(180deg,#8A4A35,#6B3423);border-color:#6B3423;color:#fff}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.red{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(120px,46%),1fr));gap:8px;margin-top:12px}
.stats button{background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer}
.stats button.on{border-color:var(--brown);box-shadow:0 0 0 2px var(--tea)}
.stats b{display:block;font-size:22px;color:var(--brown)}
@media(prefers-color-scheme:dark){.stats b{color:var(--tea)}}
.stats span{font-size:12px;color:var(--muted)}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.note.ok{background:var(--good-bg);color:var(--good)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.mid{background:var(--mid-bg);color:var(--mid)}
.search{height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);width:100%;font-size:15px;margin-top:12px}
.list{margin-top:10px}
.it{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:7px;cursor:pointer}
.it:hover{border-color:var(--tea)}
.it .tx{flex:1;min-width:0}
.it b{display:block;font-size:15.5px}
.it small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.it.struck b,.it.struck small{text-decoration:line-through;opacity:.7}
.tag{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.t-ready{background:var(--good-bg);color:var(--good)}.t-match{background:var(--mid-bg);color:var(--mid)}.t-fail{background:var(--bad-bg);color:var(--bad)}.t-left{background:#555;color:#fff}.t-warn{background:var(--blue-bg);color:var(--blue)}
.bar{height:10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#C2766A,#6B3423);transition:width .3s}
/* edit panel */
#ed{position:fixed;inset:0;background:rgba(30,15,10,.45);display:flex;justify-content:flex-end;z-index:20}
#ed .pn{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding:16px 16px 80px;box-shadow:-10px 0 30px rgba(0,0,0,.25)}
#ed h3{margin:0;font-size:18px;color:var(--brown)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cand{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-top:6px;background:var(--surface2)}
.cand .tx{flex:1;min-width:0;font-size:13.5px}
.pct{font-weight:800;font-size:12px;padding:2px 8px;border-radius:999px;color:#fff;background:#757575}
.pct.hi{background:var(--good)}.pct.md{background:#C99712}
.sec{margin-top:16px;font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hidden{display:none!important}
/* certificate pages (preview and print) */
.cert{background:#fff;color:#000;font:15px "Times New Roman",serif;padding:20px 40px;width:100%;max-width:760px;margin:0 auto}
.cert .t{text-align:center}
.cert table{width:100%;border-collapse:collapse;margin-top:16px}
.cert td.l{white-space:nowrap;padding:0 6px 0 0}
.cert td.v{border-bottom:1px solid #000;text-align:center;font-weight:bold}
.cert.fail{background:#FFC0CB;color:#D50000}
#prev{border:1px solid var(--line);border-radius:12px;overflow:auto;margin-top:10px;background:#fff}
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0}
  header,main,#ed{display:none!important}
  #print{display:block}
  #print .cert{page-break-after:always;max-width:none;padding:0 10mm}
  #print .cert:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<header><div class="in"><img src="jcw-logo.png" alt=""><h1>Provisional certificates<small>Gazette → matched students → certificates</small></h1><a href="./">← App</a></div></header>
<main id="main"></main>
<div id="ed" class="hidden"></div>
<div id="print"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzl-DwgASIhf-pIGYi9D3M-CGOm7d7-UKg0W-OoWAiuRBHe4mjlRgMQXIHuLm6zi--i/exec';
const PASS = ['A1', 'A', 'B', 'C', 'D', 'E'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ls = { get(k, d){ try{ const v = localStorage.getItem('csa2_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem('csa2_' + k, JSON.stringify(v)); }catch(e){} } };
const user = ls.get('user', ''), pass = ls.get('pass', '');
const qs = new URLSearchParams(location.search);
let S = { sheets:null, sheet:qs.get('sheet') || ls.get('pc_sheet', ''), strength:ls.get('pc_strength', ''), data:null, stats:null, busy:'', err:'', msg:'', filter:qs.get('filter') || 'all', q:'', auto:null, assets:ls.get('pc_assets', null), pdf:null };

async function api(payload, ms = 330000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(API, { method:'POST', body:JSON.stringify({ username:user, password:pass, strength:S.strength || undefined, ...payload }), signal:ctl.signal, redirect:'follow' });
    const txt = await r.text(); let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('The server sent a web page instead of data. Check the deployment.'); }
    if(j && j.error === 'UNKNOWN_ACTION') throw new Error('The server does not know certificates yet: add Certificates.gs and its doPost line, then deploy a new version.');
    if(j && j.error === 'BAD_LOGIN') throw new Error('Your saved login was refused. Open the app, sign out and sign in again.');
    if(j && j.ok === false) throw new Error(j.error || 'Failed');
    return j;
  }catch(e){ if(e.name === 'AbortError') throw new Error('The server took too long. Try again.'); if(e instanceof TypeError) throw new Error(navigator.onLine ? 'The internet works, but the Apps Script server did not answer. In Apps Script: run the function pcAuthorize once and press Allow, then Deploy → Manage deployments → Edit → New version. Also check that Certificates.gs saved without a red error.' : 'No internet.'); throw e; }
  finally{ clearTimeout(t); }
}

/* ---------- similarity (same as the Name Fixer / HSSC Fill) ---------- */
const tokens = s => String(s || '').toUpperCase().replace(/[^A-Z ]/g, ' ').split(' ').filter(x => x);
function lev(a, b){ const m = a.length, n = b.length; if(!m) return n; if(!n) return m; let p = [], c = []; for(let j = 0; j <= n; j++) p[j] = j; for(let i = 1; i <= m; i++){ c = [i]; for(let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
const ratio = (a, b) => { const L = Math.max(a.length, b.length); return L ? 1 - lev(a, b) / L : 1; };
const collapse = s => s.replace(/(.)\1+/g, '$1');
const skel = s => collapse(s[0] + s.slice(1).replace(/[AEIOUY]/g, ''));
function tokSim(a, b){ if(a === b) return 1; let r = ratio(collapse(a), collapse(b)); const sa = skel(a), sb = skel(b); if(sa.length > 1 && sb.length > 1) r = Math.max(r, .8 * ratio(sa, sb)); if((a.length === 1 || b.length === 1) && a[0] === b[0]) r = Math.max(r, .75); return r; }
function dirSim(A, B){ let t = 0, w = 0; A.forEach(x => { let best = 0; B.forEach(y => { const v = tokSim(x, y); if(v > best) best = v; }); t += best * x.length; w += x.length; }); return t / w; }
function textSim(A, B){ if(!A.length || !B.length) return null; return Math.max((dirSim(A, B) + dirSim(B, A)) / 2, ratio(collapse(A.join('')), collapse(B.join('')))); }
function score(t, s){ const ns = textSim(t.nt, s.nt), fs = textSim(t.ft, s.ft); if(ns === null) return { sc:0, ns:0, fs }; return { sc:fs === null ? ns * .85 : .6 * ns + .4 * fs, ns, fs }; }
const sortedJoin = a => collapse(a.slice().sort().join(''));

/* ---------- status of a row ---------- */
function status(r){
  if(r.struck || /^LEFT STUDENT|^Left \//.test(r.how)) return 'left';
  if(!r.roll || PASS.indexOf(String(r.grade).toUpperCase()) < 0) return 'fail';
  if(!r.enroll) return 'match';
  return 'ready';
}
const hintText = h => !h ? '' : typeof h === 'string' ? h : h.name + ' D/o ' + h.father + (h.enroll ? ' · ' + h.enroll : '') + (h.status ? ' · ' + h.status : '') + ' (' + h.pct + '%) — not struck: ' + h.why;
/** suggestions for Distinctions won: NIL, her board position, and anything already typed for other students */
function ordinal(n){ const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function distSuggest(r){
  const out = ['NIL'], p = r && Number(r.pos);
  if(p >= 1) out.push(ordinal(p) + ' Position in BISE Peshawar');
  (S.data ? S.data.rows : []).forEach(x => { if(x.dist && !/^NIL$/i.test(x.dist) && !out.includes(x.dist)) out.push(x.dist); });
  return out.slice(0, 40);
}
const hasDist = r => r.dist && !/^NIL$/i.test(r.dist);
/** why she gets no certificate (shown in the list and the editor) */
function whyNot(r){
  const g = String(r.grade || '').toUpperCase(), why = [];
  if(!r.roll) why.push('no Roll No');
  if(!g) why.push('no grade');
  else if(PASS.indexOf(g) < 0) why.push('grade ' + g + (g === 'F' ? ' (failed)' : ' (not a pass grade)'));
  if(r.marks === '' || r.marks === '0' || r.marks === 0) why.push('marks ' + (r.marks === '' ? 'missing' : '0'));
  if(r.remarks) why.push('Remarks: ' + r.remarks);
  return why.join(' · ');
}
const canPrint = r => !r.struck && r.roll && PASS.indexOf(String(r.grade).toUpperCase()) >= 0;
function counts(){
  const R = S.data.rows, c = { all:R.length, ready:0, match:0, fail:0, left:0, nodob:0, print:0, hint:0, dist:0, open:0 };
  R.forEach(r => { if(!r.struck && !r.enroll) c.open++; c[status(r)]++; if(r.leftHint) c.hint++; if(!r.struck && (hasDist(r) || (Number(r.pos) >= 1 && Number(r.pos) <= 20))) c.dist++; if(canPrint(r)){ c.print++; if(!r.dob) c.nodob++; } });
  return c;
}
function prep(){
  const R = S.data.rows, used = {};
  R.forEach(r => { r.nt = tokens(r.name); r.ft = tokens(r.father); if(r.enroll && !r.struck) used[r.enroll.toUpperCase()] = r; });
  S.used = used;
  S.src = S.data.source.map(a => { const o = { id:a[0], enroll:/#\d+$/.test(a[0]) ? '' : a[0], name:a[1], father:a[2], cls:a[3], pcs:a[4], cur:a[5] }; o.nt = tokens(o.name); o.ft = tokens(o.father); o.sj = sortedJoin(o.nt); return o; });
  S.byId = {}; S.src.forEach(o => { S.byId[o.id.toUpperCase()] = o; });
  // possible left students: Left Students records with a slightly different spelling (exact ones are struck by Prepare)
  const L = (S.data.left || []).map(a => { const o = { name:a[0], father:a[1], enroll:a[2], status:a[3] }; o.nt = tokens(o.name); o.ft = tokens(o.father); return o; });
  R.forEach(r => {
    r.leftHint = null; if(r.struck || !r.nt.length) return;
    let best = null; L.forEach(l => { const x = score(r, l); if(x.sc >= .8 && (!best || x.sc > best.sc)) best = { l, ...x }; });
    if(best) r.leftHint = { name:best.l.name, father:best.l.father, enroll:best.l.enroll, status:best.l.status, pct:Math.round(best.sc * 100), why:best.sc >= .999 ? 'the same name is still in the current student list' : 'name ' + Math.round(best.ns * 100) + '% / father ' + Math.round((best.fs || 0) * 100) + '% alike' };
  });
}
function candidates(r, q){
  const out = [];
  S.src.forEach(s => {
    if(q){ const hay = (s.name + ' ' + s.father + ' ' + s.enroll + ' ' + s.pcs).toLowerCase(); if(!q.split(/\s+/).every(w => hay.includes(w))) return; }
    const x = score(r, s); if(q || x.sc >= .55) out.push({ s, ...x });
  });
  return out.sort((a, b) => b.sc - a.sc).slice(0, q ? 20 : 6);
}
function findAuto(){
  const open = S.data.rows.filter(r => status(r) === 'match' && r.nt.length), pairs = [];
  open.forEach(r => {
    const tj = sortedJoin(r.nt); let best = null, second = 0;
    S.src.forEach(s => { const u = S.used[(s.enroll || s.id).toUpperCase()]; if(u && u !== r) return; if(ratio(tj, s.sj) < .7) return; const x = score(r, s); if(!best || x.sc > best.sc){ if(best) second = best.sc; best = { s, sc:x.sc }; } else if(x.sc > second) second = x.sc; });
    if(best && best.sc >= .96 && best.sc - second >= .02) pairs.push({ r, s:best.s, sc:best.sc });
  });
  const claims = {}; pairs.forEach(p => claims[p.s.id] = (claims[p.s.id] || 0) + 1);
  S.auto = pairs.filter(p => claims[p.s.id] === 1);
}

/* ---------- screen ---------- */
function render(){
  const m = $('#main');
  if(!user || !pass){ m.innerHTML = `<div class="card"><h2>Sign in first</h2><div class="sub">Open the attendance app and sign in with the admin login, then come back.</div><div class="acts"><a class="btn pri" href="./">Open the app</a></div></div>`; return; }
  if(ls.get('admin', false) !== true){ m.innerHTML = `<div class="card"><h2>Admin only</h2><div class="sub">Certificates are made by the admin.</div><div class="acts"><a class="btn pri" href="./">Back to the app</a></div></div>`; return; }
  const D = S.data, c = D ? counts() : null;
  m.innerHTML = `
  <section class="card"><h2>Result sheet</h2>
    <div class="sub">Upload the gazette PDF in <a href="board.html">Board results</a> first; it opens this page and prepares everything by itself. Only Jinnah College rows are used.</div>
    <div class="grid">
      <label class="f">Result sheet<select id="cSheet">${(S.sheets || (S.sheet ? [S.sheet] : [])).map(n => `<option ${n === S.sheet ? 'selected' : ''}>${esc(n)}</option>`).join('') || '<option value="">Loading…</option>'}</select></label>
      <label class="f">Student list (Users workbook)<input id="cStrength" placeholder="Empty = current + older Transform sheets" value="${esc(S.strength)}"></label>
    </div>
    <div class="acts">
      <button class="btn pri" id="cPrep" ${S.busy || !S.sheet ? 'disabled' : ''}>${S.busy === 'prep' ? 'Preparing… (1-3 min)' : 'Prepare all certificates (one go)'}</button>
      <button class="btn" id="cLoad" ${S.busy || !S.sheet ? 'disabled' : ''}>${S.busy === 'load' ? 'Loading…' : 'Reload'}</button>
      ${D ? `<a class="btn" href="${esc(D.url)}" target="_blank" rel="noopener">Open the sheet</a>` : ''}
    </div>
    <div class="sub" style="margin-top:8px">One go = Left Students struck through · Enroll#, Program, Class, Section, PCS, Group from the student list · DOB from Portal backup · Grade (gazette, or worked out from marks) · Session · board position 1-20 as distinction. Values you typed are never overwritten.</div>
    ${S.busy ? '<div class="bar"><i style="width:60%"></i></div>' : ''}
    ${S.err ? `<div class="note bad">${esc(S.err)}</div>` : ''}${S.msg ? `<div class="note ok">${S.msg}</div>` : ''}
  </section>
  ${D ? `
  <section class="card" style="--c:#0E8A5F"><h2>Certificates</h2>
    <div class="stats">
      ${[['all', c.all, 'JCW students'], ['ready', c.print, 'ready to print'], ['match', c.match, 'ready but no Enroll#'], ['fail', c.fail, 'fail / no grade / no roll no'], ['left', c.left, 'left / struck'], ['hint', c.hint, 'possible left — check'], ['dist', c.dist, 'top 20 / distinctions'], ['nodob', c.nodob, 'ready but no DOB']].map(x => `<button data-f="${x[0]}" class="${S.filter === x[0] ? 'on' : ''}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}
    </div>
    <div class="sub" style="margin-top:8px"><b>Ready · no Enroll#</b> = she passed and her certificate can print, but she is not yet linked to a student in Transform, so her DOB and left-student status could not be checked. Tap her and choose the right student. <b>Not eligible</b> shows the reason on each row.</div>
    ${c.open ? `<div class="note mid">${c.open} students were not matched 100% (${(S.auto || []).length} of them 96%+). Nothing is saved until you tick them. <button class="btn sm ok" id="cAuto" ${S.busy ? 'disabled' : ''}>Check and fill ${c.open}</button></div>` : ''}
    ${c.hint ? `<div class="note mid">${c.hint} students look like Left Students with a slightly different spelling. They are NOT struck yet. <button class="btn sm" id="cLeftRev" ${S.busy ? 'disabled' : ''}>Review ${c.hint} possible left</button></div>` : ''}
    <div class="acts">
      <button class="btn pri" id="cPrintAll" ${!c.print ? 'disabled' : ''}>Print / save PDF — all ${c.print} ready</button>
      <button class="btn" id="cDrive" ${S.busy || !c.print ? 'disabled' : ''}>${S.busy === 'pdf' ? 'Making PDF…' : 'One PDF to Google Drive'}</button>
      <button class="btn" id="cNew">+ Student not in gazette</button>
    </div>
    ${S.pdf ? `<div class="note ok">PDF with ${S.pdf.n} certificate${S.pdf.n > 1 ? 's' : ''} saved in Drive “Certificates (all)”. <a href="${esc(S.pdf.url)}" target="_blank" rel="noopener">Open PDF</a></div>` : ''}
    <input class="search" id="cQ" placeholder="Search name, father name, roll no or Enroll#" value="${esc(S.q)}" autocomplete="off">
    <div class="list" id="cList"></div>
  </section>` : ''}`;
  if(D) paintList();
}
function filtered(){
  const q = S.q.trim().toLowerCase(), words = q ? q.split(/\s+/) : [];
  return S.data.rows.filter(r => {
    const st = status(r);
    if(!words.length){
      if(S.filter === 'ready' && !canPrint(r)) return false;
      if(S.filter === 'nodob' && !(canPrint(r) && !r.dob)) return false;
      if(['match', 'fail', 'left'].includes(S.filter) && st !== S.filter) return false;
      if(S.filter === 'hint' && !r.leftHint) return false;
      if(S.filter === 'dist' && (r.struck || !(hasDist(r) || (Number(r.pos) >= 1 && Number(r.pos) <= 20)))) return false;
    }
    const hay = (r.name + ' ' + r.father + ' ' + r.roll + ' ' + r.enroll + ' ' + r.reg).toLowerCase();
    return words.every(w => hay.includes(w));
  }).sort((a, b) => (Number(a.roll) || 9e9) - (Number(b.roll) || 9e9));
}

  else if(t.id === 'eSave') saveEd();
  else if(t.id === 'eStrike') strikeEd();
  else if(t.id === 'ePrint'){ readEd(); await assets(); $('#print').innerHTML = certHtml(E.v); window.print(); }
  else if(t.id === 'eDrive'){ const p = await drive([E.r]); if(p){ E.msg = 'PDF saved in Drive.'; paintEd(); window.open(p.url, '_blank'); } else { E.err = S.err; paintEd(); } }
  else if(t.dataset.link){ readEd(); E.pick = S.byId[t.dataset.link.toUpperCase()] || null; E.msg = ''; paintEd(); }
  else if(t.id === 'eUnlink'){ readEd(); E.pick = null; paintEd(); }
  else if(t.id === 'ePickUndo'){ readEd(); E.pick = undefined; paintEd(); }
  else if(t.dataset.rpick !== undefined){ /* handled on change */ }
  else if(t.id === 'rT96'){ E.tick = new Set(E.items.map((x, i) => i).filter(i => (E.items[i].opts[E.items[i].sel] || {}).pct >= 96)); paintEd(); }
});
$('#ed').addEventListener('click', e => { if(e.target.id === 'ed'){ E = null; paintEd(); paintStats(); } });
render();
if(user && pass && ls.get('admin', false) === true){ loadSheets(); if(S.sheet) run(qs.get('prepare') === '1' ? 'prep' : 'load'); }
</script>
</body>
