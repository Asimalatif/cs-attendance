<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B3423">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Open+Sans:wght@700&display=swap" rel="stylesheet">
<title>JCW Student ID Cards</title>
<style>
:root{--bg:#F7EDEA;--surface:#fff;--surface2:#FBEDEA;--ink:#2B1912;--muted:#7C6159;--line:#E2C0B8;--brown:#6B3423;--tea:#E7B7AE;--good:#0E8A5F;--good-bg:#E3F4EC;--bad:#C0392B;--bad-bg:#FDE3E1;--mid:#B4740E;--mid-bg:#FFF2D6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A110F;--surface:#261915;--surface2:#30201B;--ink:#F6E9E5;--muted:#C4A8A0;--line:#4A3029;--tea:#8A5A50;--good-bg:#14302A;--bad-bg:#3A1C1F;--mid-bg:#3A2F14}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:40px}
button,select,input{font:inherit;color:inherit}
header{background:linear-gradient(120deg,#4A2418,#8A4A35);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px}
header .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:50%;background:#fff;padding:3px;flex:none}
header h1{margin:0;font-size:19px;line-height:1.2}
header small{display:block;opacity:.85;font-size:12.5px;font-weight:400}
header a{margin-left:auto;color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1.5px solid var(--line);border-top:5px solid var(--brown);border-radius:20px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:17px;color:var(--brown)}
@media(prefers-color-scheme:dark){.card h2{color:var(--tea)}}
.sub{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
label.f input,label.f select{height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;background:var(--surface);font-size:15px;font-weight:600;color:var(--ink);width:100%}
label.c{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.btn{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;padding:0 14px;cursor:pointer;color:var(--ink)}
.btn.pri{background:linear-gradient(180deg,#8A4A35,#6B3423);border-color:#6B3423;color:#fff}
.btn.sm{height:34px;padding:0 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.bar{height:10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#C2766A,#6B3423);transition:width .2s}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.note.ok{background:var(--good-bg);color:var(--good)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.mid{background:var(--mid-bg);color:var(--mid)}
.tw{overflow:auto;max-height:420px;margin-top:10px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#6B3423;color:#fff;text-align:left;padding:7px 8px;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:5px 8px;border-top:1px solid var(--line);white-space:nowrap}
tr:nth-child(even) td{background:var(--surface2)}
td.tag span{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--good-bg);color:var(--good)}
.prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px;margin-top:12px}
.prev .pair{display:flex;flex-direction:column;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px}
.prev svg{width:100%;height:auto;display:block;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer}
.prev .who{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700}
dialog{border:none;border-radius:18px;padding:0;max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .in{padding:16px}
textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--surface);color:var(--ink);font:inherit}
.hidden{display:none!important}
@font-face{font-family:'JCWCalibri';font-weight:700;src:local('Calibri Bold'),local('Calibri-Bold'),url(idcard/Carlito-Bold.woff2) format('woff2')}
</style>
<style>@page{size:7.2in 11.2in;margin:0}</style>
</head>
<body>
<header><div class="in"><img src="jcw-logo.png" alt=""><h1>Student ID cards · 1st year<small>From Transform-ALL-COLLEGE-STRENGTH · same design as the printed cards</small></h1><a href="./">← App</a></div></header>
<main id="main"></main>
<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzl-DwgASIhf-pIGYi9D3M-CGOm7d7-UKg0W-OoWAiuRBHe4mjlRgMQXIHuLm6zi--i/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ls = { get(k, d){ try{ const v = localStorage.getItem('csa2_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem('csa2_' + k, JSON.stringify(v)); }catch(e){} } };
const user = ls.get('user', ''), pass = ls.get('pass', '');

/* ---------- card settings (admin can change them under "Card settings") ---------- */
const DEF = {
  phone: '091-5610909', year: 0, valid: {},          // year = session start (2026 -> 2026-28); valid = { '2026': '31-08-2028' }
  rules: ['Student must display this card while in college.', 'This card is non-transferable.', 'If this card is lost, report to the college office immediately.'],
  map: {   // Program column of Transform (without "(JCW)") -> Class and Group printed on the card
    'Pre-Medical':     { cls: 'FSC', group: 'Pre-Medical' },
    'Pre-Engineering': { cls: 'FSC', group: 'Pre-Engineering' },
    'FCS':             { cls: 'FSC', group: 'GENERAL / COMPUTER SCIENCE' },
    'F.A':             { cls: 'F.A', group: 'Humanities' }
  }
};
function mergeCfg(c){ c = c || {}; const o = Object.assign({}, DEF, c); o.map = Object.assign({}, DEF.map, c.map || {}); o.valid = Object.assign({}, c.valid || {}); if(!Array.isArray(o.rules) || !o.rules.length) o.rules = DEF.rules.slice(); return o; }
let CFG = mergeCfg(ls.get('idc_cfg', {}));
let SIGNS = {};                              // { '2026': dataURL } principal sign + stamp of each session, from Drive
let EDIT = ls.get('idc_edit', {});           // per student changes for the card only: { roll: { name, father, cls, section, group, photo } }

let S = { list: null, loading: false, err: '', f: ls.get('idc_f', { year: '', program: '', section: '', q: '', notPrinted: false, status: 'enrolled' }),
  sel: new Set(), photos: {}, busy: '', prog: 0, layout: ls.get('idc_layout', 'sheet'), lastPrinted: null, show: 24, detected: 0 };

async function api(payload, ms = 300000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(API, { method:'POST', body:JSON.stringify({ username:user, password:pass, ...payload }), signal:ctl.signal, redirect:'follow' });
    const txt = await r.text(); let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('The server sent a web page instead of data. Check the deployment.'); }
    if(j && j.error === 'UNKNOWN_ACTION') throw new Error('The server does not know ID cards yet: add IdCards.gs and its doPost line, then deploy a new version.');
    if(j && j.error === 'BAD_LOGIN') throw new Error('Your saved login was refused. Open the app, sign out and sign in again.');
    if(j && j.ok === false) throw new Error(j.error || 'Server error');
    return j;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('The server took too long. Try again.');
    if(e instanceof TypeError) throw new Error(navigator.onLine ? 'The Apps Script server did not answer. In Apps Script run idcAuthorize once and press Allow, then deploy a new version.' : 'No internet.');
    throw e;
  }finally{ clearTimeout(t); }
}

/* ---------- what goes on a card ---------- */
const progKey = p => String(p || '').replace(/\(.*?\)/g, '').trim();
/* session year of this year's 1st year: the Enroll# prefix most students have (JCW-F26-… -> 2026) */
function detectYear(list){
  const n = {}; (list || []).forEach(st => { const m = String(st.roll).match(/-F(\d{2})-/i); if(m) n[m[1]] = (n[m[1]] || 0) + 1; });
  const k = Object.keys(n).sort((a, b) => n[b] - n[a])[0];
  if(k) return 2000 + Number(k);
  const d = new Date(); return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1;
}
const year = () => Number(CFG.year) || S.detected || detectYear(S.list);
const validOf = y => CFG.valid[y] || ('31-08-' + (Number(y) + 2));
const signOf = y => SIGNS[y] || (String(y) === '2026' ? 'idcard/principal-sign.png' : '');   // principal-sign.png = the picture on the shop's cards
function sessionOf(){ const y = year(); return { label: y + '-' + String(y + 2).slice(-2), valid: validOf(y) }; }
function cardData(st){
  const e = EDIT[st.roll] || {}, mp = CFG.map[progKey(st.program)] || {};
  let sec = st.section || st.pcs || '';
  if(/\s/.test(sec)) sec = sec.trim().split(/\s+/).pop();
  const ses = sessionOf(st);
  return {
    roll: st.roll, name: (e.name || st.name || '').toUpperCase(), father: (e.father || st.father || '').toUpperCase(),
    cls: e.cls || mp.cls || progKey(st.program), section: e.section || sec,
    group: e.group || mp.group || (st.group && !/^null$/i.test(st.group) ? st.group : progKey(st.program)),
    photo: e.photo || S.photos[st.roll] || '', session: e.session || ses.label, valid: e.valid || ses.valid, sign: signOf(year())
  };
}

/* ---------- drawing: an exact copy of the shop's sheet (Section E.cdr) ----------
   idcard/sheet.svg = page 1 of the shop's PDF (518.4 x 806.4 pt = 7.2 x 11.2 in) with only the student details,
   photos and signatures taken out. Everything else (cards, edges, logos, colours, labels) is the shop's own drawing.
   The details are written back at the same points (pt) with the same font (Calibri Bold; Carlito where Calibri is missing). */
const PAGE_W = 518.4, PAGE_H = 806.4, FRONT_X = 0.131, BACK_X = 273.4, CARD_W = 244.8, CARD_H = 158.4;
const ROW_Y = [0.02, 158.42, 316.82, 475.22, 633.61];
const GEO = [{"base": [92.2637, 102.9547, 113.6456, 124.3362, 135.0271, 145.718], "photo": [174.9529, 59.3018, 45.5139, 66.0289], "frame": [175.2653, 59.6166, 220.1545, 125.0155], "signBox": [173.3034, 129.2252, 48.8134, 12.2975], "signClip": [170.6757, 129.4067, 224.7443, 141.3411], "sess": [[28.2447, 90.5604, 33.9012, 118.8794], [301.089, 90.5604, 306.7455, 118.8794]], "valid": [312.9491, 104.6907], "vbbox": [312.9491, 98.4897, 389.3215, 106.7577]}, {"base": [250.8797, 261.5706, 272.2615, 282.9521, 293.6431, 304.334], "photo": [174.9529, 217.9175, 45.5139, 66.0289], "frame": [175.2653, 218.2326, 220.1545, 283.6315], "signBox": [173.3034, 287.8412, 48.8134, 12.2975], "signClip": [170.6757, 288.0227, 224.7443, 299.9571], "sess": [[28.2447, 249.1765, 33.9012, 277.4954], [301.089, 248.9604, 306.7455, 277.2794]], "valid": [312.9491, 263.0906], "vbbox": [312.9491, 256.8896, 389.3215, 265.1576]}, {"base": [409.4957, 420.1866, 430.8775, 441.5681, 452.259, 462.9499], "photo": [174.9529, 376.5337, 45.5139, 66.0289], "frame": [175.2653, 376.8486, 220.1545, 442.2475], "signBox": [173.3034, 446.4572, 48.8134, 12.2975], "signClip": [170.6757, 446.6387, 224.7443, 458.5731], "sess": [[28.2447, 407.7924, 33.9012, 436.1114], [301.089, 407.3604, 306.7455, 435.6794]], "valid": [312.9491, 421.4906], "vbbox": [312.9491, 415.2896, 389.3215, 423.5576]}, {"base": [568.1117, 578.8026, 589.4935, 600.1841, 610.875, 621.5659], "photo": [174.9529, 535.1497, 45.5139, 66.0289], "frame": [175.2653, 535.4646, 220.1545, 600.8635], "signBox": [173.3034, 605.0731, 48.8134, 12.2975], "signClip": [170.6757, 605.2548, 224.7443, 617.1891], "sess": [[28.2447, 566.4084, 33.9012, 594.7274], [301.089, 565.7604, 306.7455, 594.0794]], "valid": [312.9491, 579.8906], "vbbox": [312.9491, 573.6896, 389.3215, 581.9576]}, {"base": [726.7277, 737.4186, 748.1095, 758.8001, 769.491, 780.1819], "photo": [174.9529, 693.7657, 45.5139, 66.0289], "frame": [175.2653, 694.0806, 220.1545, 759.4795], "signBox": [173.3034, 763.6891, 48.8134, 12.2975], "signClip": [170.6757, 763.8707, 224.7443, 775.8051], "sess": [[28.2447, 725.0244, 33.9012, 753.3434], [301.089, 724.1604, 306.7455, 752.4794]], "valid": [312.9491, 738.2906], "vbbox": [312.9491, 732.0897, 389.3215, 740.3577]}];
const TPL_SESSION = '2026-28', TPL_VALID = '31-08-2028', VALUE_X = 71.1196, VALUE_MAX = 102, DATE_DX = 39.344;
const FONT_B = "'JCWCalibri',Calibri,Carlito,sans-serif";
const cvs = document.createElement('canvas').getContext('2d');
function fit(text, size, max){ cvs.font = `700 ${size}px ${FONT_B}`; return cvs.measureText(text).width > max ? ` textLength="${max}" lengthAdjust="spacingAndGlyphs"` : ''; }
let uid = 0;
/* the student's details on card slot k (0-4) of a page, front and back */
function slot(k, d){
  const g = GEO[k], id = 'k' + (++uid), F = g.frame, P = g.photo, SC = g.signClip, SB = g.signBox, r0 = 1.8335;
  const vals = [d.name, d.father, d.cls, d.roll, d.section, d.group];
  let o = `<g font-family="${FONT_B}" font-weight="700" font-size="7.982" fill="#fff" style="font-kerning:normal">` +
    vals.map((v, i) => `<text x="${VALUE_X}" y="${g.base[i]}"${fit(v, 7.982, VALUE_MAX)}>${esc(v)}</text>`).join('') + '</g>';
  const rr = `M${F[0] + r0} ${F[1]}H${F[2] - r0}A${r0} ${r0} 0 0 1 ${F[2]} ${F[1] + r0}V${F[3] - r0}A${r0} ${r0} 0 0 1 ${F[2] - r0} ${F[3]}H${F[0] + r0}A${r0} ${r0} 0 0 1 ${F[0]} ${F[3] - r0}V${F[1] + r0}A${r0} ${r0} 0 0 1 ${F[0] + r0} ${F[1]}Z`;
  if(d.photo) o += `<clipPath id="p${id}"><path d="${rr}"/></clipPath><image href="${esc(d.photo)}" x="${P[0]}" y="${P[1]}" width="${P[2]}" height="${P[3]}" preserveAspectRatio="xMidYMid slice" clip-path="url(#p${id})"/><path d="${rr}" fill="none" stroke="#231F20" stroke-width=".5"/>`;
  if(d.sign) o += `<clipPath id="s${id}"><rect x="${SC[0]}" y="${SC[1]}" width="${SC[2] - SC[0]}" height="${SC[3] - SC[1]}"/></clipPath><image href="${esc(d.sign)}" x="${SB[0]}" y="${SB[1]}" width="${SB[2]}" height="${SB[3]}" preserveAspectRatio="xMidYMid meet" clip-path="url(#s${id})"/>`;
  if(d.session !== TPL_SESSION) g.sess.forEach(r => {
    o += `<rect x="${r[0] - .3}" y="${r[1] - .4}" width="${r[2] - r[0] + .6}" height="${r[3] - r[1] + .8}" fill="#fff"/>` +
      `<text transform="translate(${r[2] - .06} ${r[3] + .17}) rotate(-90)" font-family="${FONT_B}" font-weight="700" font-size="8.11" fill="#000" textLength="28.87" lengthAdjust="spacingAndGlyphs">${esc(d.session)}</text>`;
  });
  if(d.valid !== TPL_VALID){
    const x = g.valid[0] + DATE_DX, y = g.valid[1], b = g.vbbox;
    o += `<rect x="${x - .3}" y="${b[1] - .2}" width="${b[2] - x + .55}" height="${b[3] - b[1] + .4}" fill="#fff"/>` +
      `<text transform="translate(${x} ${y}) scale(.9594 1)" font-family="${FONT_B}" font-weight="700" font-size="8.268" fill="#000">${esc(d.valid)}</text>`;
  }
  return o;
}
/* screen preview of one card (front or back), cut out of row 1 of the sheet */
function cardView(d, backSide){
  const x = (backSide ? BACK_X : FRONT_X) - .2;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${ROW_Y[0] - .2} ${CARD_W + .4} ${CARD_H + .2}"><rect x="${x}" y="-1" width="${CARD_W + 1}" height="${CARD_H + 2}" fill="#fff"/><image href="idcard/sheet.svg" width="${PAGE_W}" height="${PAGE_H}"/>${slot(0, d)}</svg>`;
}
const front = d => cardView(d, false), back = d => cardView(d, true);

/* ---------- students ---------- */
async function load(){
  S.loading = true; S.err = ''; render();
  try{
    const j = await api({ action:'idc_list' }); S.list = j.list || []; SIGNS = j.signs || {};
    CFG = mergeCfg(j.cfg && Object.keys(j.cfg).length ? j.cfg : ls.get('idc_cfg', {})); ls.set('idc_cfg', CFG);
    ls.set('idc_cache', { at: j.at, list: S.list });
  }
  catch(e){ S.err = e.message; const c = ls.get('idc_cache', null); if(c && !S.list) S.list = c.list; }
  S.detected = detectYear(S.list);
  if(Number(CFG.year) && Number(CFG.year) < S.detected) CFG.year = 0;     // a new session has started: move to it by itself
  S.loading = false; render();
}
function filtered(){
  if(!S.list) return [];
  const f = S.f, q = f.q.trim().toLowerCase();
  return S.list.filter(st =>
    (!f.program || st.program === f.program) && (!f.section || (st.pcs || st.section) === f.section) &&
    (f.status !== 'enrolled' || !st.status || /enrol/i.test(st.status)) && (!f.notPrinted || !st.printed) &&
    (!q || (st.roll + ' ' + st.name + ' ' + st.father).toLowerCase().includes(q)));
}
const uniq = (arr, key) => [...new Set(arr.map(x => x[key]).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { numeric:true }));
const chosen = () => S.list ? S.list.filter(st => S.sel.has(st.roll)) : [];

/* photos: fetched from the server 8 at a time and made smaller on this device */
function shrink(src){
  return new Promise(res => { if(!src) return res(''); const im = new Image(); im.onload = () => {
      const W = 376, H = 546, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
      const r = Math.max(W / im.width, H / im.height), w = im.width * r, h = im.height * r;
      x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
      try{ res(c.toDataURL('image/jpeg', .9)); }catch(e){ res(src); } };
    im.onerror = () => res(''); im.src = src; });
}
async function getPhotos(sts){
  const need = sts.filter(st => !(st.roll in S.photos) && !(EDIT[st.roll] || {}).photo && st.pic);
  for(let i = 0; i < need.length; i += 8){
    S.busy = `Photos ${Math.min(i + 8, need.length)} of ${need.length}…`; S.prog = (i + 8) / need.length; paintBusy();
    try{
      const j = await api({ action:'idc_photos', items: need.slice(i, i + 8).map(st => ({ roll: st.roll, pic: st.pic })) }, 120000);
      for(const roll of Object.keys(j.photos || {})) S.photos[roll] = await shrink(j.photos[roll]);
    }catch(e){ need.slice(i, i + 8).forEach(st => { if(!(st.roll in S.photos)) S.photos[st.roll] = ''; }); S.err = 'Some photos did not load: ' + e.message; }
  }
  S.busy = ''; S.prog = 0;
}

/* ---------- PDF: the shop's own page (vector, exact 518.4 x 806.4 pt) + the students' details ---------- */
const PDFLIB = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js', FONTKIT = 'https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js';
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src.split('/').pop() + ' (internet needed the first time).')); document.head.appendChild(s); });
async function makePdf(){
  const sts = chosen(); if(!sts.length) return;
  S.err = ''; S.msg = '';
  try{
    await getPhotos(sts);
    S.busy = 'Making the PDF…'; S.prog = 0; render();
    if(!window.PDFLib) await loadScript(PDFLIB);
    if(!window.fontkit) await loadScript(FONTKIT);
    const { PDFDocument, cmyk, pushGraphicsState, popGraphicsState, concatTransformationMatrix, moveTo, lineTo, appendBezierCurve, closePath, clip, endPath, rectangle, stroke, setLineWidth, setStrokingCmykColor } = PDFLib;
    const [tplBytes, fontBytes] = await Promise.all(['idcard/sheet-template.pdf', 'idcard/Carlito-Bold.ttf'].map(u => fetch(u).then(r => { if(!r.ok) throw new Error(u + ' missing'); return r.arrayBuffer(); })));
    const doc = await PDFDocument.create(); doc.registerFontkit(window.fontkit);
    const font = await doc.embedFont(fontBytes, { subset: true }), chars = new Set(font.getCharacterSet());
    const clean = t => [...String(t || '')].map(c => chars.has(c.codePointAt(0)) ? c : '?').join('');
    const [tpl] = await doc.embedPdf(tplBytes, [0]);
    /* text with the font's kerning (CorelDRAW kerns too): one glyph at a time at its kerned place */
    const fk = font.embedder && font.embedder.font;
    const runOf = (t, size) => { try{ const r = fk.layout(t), k = size / fk.unitsPerEm; let x = 0;
        const parts = r.glyphs.map((g, i) => { const p = { c: String.fromCodePoint(...g.codePoints), x }; x += r.positions[i].xAdvance * k; return p; });
        return parts.every(p => [...p.c].length === 1) ? { parts, w: x } : null; }catch(e){ return null; } };
    const widthOf = (t, size) => { const r = runOf(t, size); return r ? r.w : font.widthOfTextAtSize(t, size); };
    const say = (page, t, size, color) => { const r = runOf(t, size);
      if(!r) return page.drawText(t, { x: 0, y: 0, size, font, color });
      r.parts.forEach(p => { if(p.c.trim()) page.drawText(p.c, { x: p.x, y: 0, size, font, color }); }); };
    const WHITE = cmyk(0, 0, 0, 0), BLACK = cmyk(1, 1, 1, 1), Y = t => PAGE_H - t, cache = {};
    async function img(src){
      if(!src) return null; if(cache[src]) return cache[src];
      const b = new Uint8Array(await fetch(src).then(r => r.arrayBuffer()));
      return cache[src] = (b[0] === 0x89 ? await doc.embedPng(b) : await doc.embedJpg(b));
    }
    const rr = (F, r0) => { const x0 = F[0], x1 = F[2], y0 = Y(F[3]), y1 = Y(F[1]), k = r0 * 0.5523;
      return [moveTo(x0 + r0, y0), lineTo(x1 - r0, y0), appendBezierCurve(x1 - r0 + k, y0, x1, y0 + r0 - k, x1, y0 + r0), lineTo(x1, y1 - r0),
        appendBezierCurve(x1, y1 - r0 + k, x1 - r0 + k, y1, x1 - r0, y1), lineTo(x0 + r0, y1), appendBezierCurve(x0 + r0 - k, y1, x0, y1 - r0 + k, x0, y1 - r0),
        lineTo(x0, y0 + r0), appendBezierCurve(x0, y0 + r0 - k, x0 + r0 - k, y0, x0 + r0, y0), closePath()]; };
    const D = sts.map(cardData);
    for(let i = 0; i < D.length; i += 5){
      const part = D.slice(i, i + 5), page = doc.addPage([PAGE_W, PAGE_H]);
      page.drawPage(tpl, { x: 0, y: 0, width: PAGE_W, height: PAGE_H });
      if(part.length < 5) page.drawRectangle({ x: 0, y: 0, width: PAGE_W, height: Y(ROW_Y[part.length] + .12), color: WHITE });
      for(let k = 0; k < part.length; k++){
        const d = part[k], g = GEO[k];
        [d.name, d.father, d.cls, d.roll, d.section, d.group].forEach((v, n) => {
          v = clean(v); const w = widthOf(v, 7.982), sx = w > VALUE_MAX ? VALUE_MAX / w : 1;
          page.pushOperators(pushGraphicsState(), concatTransformationMatrix(sx, 0, 0, 1, VALUE_X, Y(g.base[n])));
          say(page, v, 7.982, WHITE);
          page.pushOperators(popGraphicsState());
        });
        const ph = await img(d.photo).catch(() => null);
        if(ph){
          const P = g.photo;
          page.pushOperators(pushGraphicsState(), ...rr(g.frame, 1.8335), clip(), endPath());
          page.drawImage(ph, { x: P[0], y: Y(P[1] + P[3]), width: P[2], height: P[3] });
          page.pushOperators(popGraphicsState(), pushGraphicsState(), setStrokingCmykColor(0, 0, 0, 1), setLineWidth(.5), ...rr(g.frame, 1.8335), stroke(), popGraphicsState());
        }
        const sg = await img(d.sign).catch(() => null);
        if(sg){
          const C = g.signClip, B = g.signBox, r = Math.min(B[2] / sg.width, B[3] / sg.height), w = sg.width * r, h = sg.height * r;
          page.pushOperators(pushGraphicsState(), rectangle(C[0], Y(C[3]), C[2] - C[0], C[3] - C[1]), clip(), endPath());
          page.drawImage(sg, { x: B[0] + (B[2] - w) / 2, y: Y(B[1] + B[3]) + (B[3] - h) / 2, width: w, height: h });
          page.pushOperators(popGraphicsState());
        }
        if(d.session !== TPL_SESSION) g.sess.forEach(r => {
          const t = clean(d.session), sx = 28.87 / widthOf(t, 8.11);
          page.drawRectangle({ x: r[0] - .3, y: Y(r[3] + .4), width: r[2] - r[0] + .6, height: r[3] - r[1] + .8, color: WHITE });
          page.pushOperators(pushGraphicsState(), concatTransformationMatrix(0, sx, -1, 0, r[2] - .06, Y(r[3] + .17)));
          say(page, t, 8.11, BLACK);
          page.pushOperators(popGraphicsState());
        });
        if(d.valid !== TPL_VALID){
          const x = g.valid[0] + DATE_DX, b = g.vbbox;
          page.drawRectangle({ x: x - .3, y: Y(b[3] + .2), width: b[2] - x + .55, height: b[3] - b[1] + .4, color: WHITE });
          page.pushOperators(pushGraphicsState(), concatTransformationMatrix(.9594, 0, 0, 1, x, Y(g.valid[1])));
          say(page, clean(d.valid), 8.268, BLACK);
          page.pushOperators(popGraphicsState());
        }
      }
      S.prog = (i + 5) / D.length; paintBusy();
    }
    doc.setTitle('JCW Student ID Cards'); doc.setCreator('JCW attendance app');
    const blob = new Blob([await doc.save()], { type: 'application/pdf' }), url = URL.createObjectURL(blob);
    const f = S.f, name = 'ID cards ' + (f.section || f.program || 'students').replace(/[^\w .-]+/g, ' ').trim() + ' (' + sts.length + ').pdf';
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    S.lastPrinted = sts.map(st => st.roll);
    S.msg = name + ' is ready (' + Math.ceil(sts.length / 5) + ' page' + (sts.length > 5 ? 's' : '') + '). Print it at Actual size / 100%, or send it to the card shop.';
  }catch(e){ S.err = 'PDF not made: ' + e.message; }
  S.busy = ''; S.prog = 0; render();
}
async function markPrinted(){
  const rolls = S.lastPrinted || []; if(!rolls.length) return;
  S.busy = 'Saving…'; render();
  try{ const j = await api({ action:'idc_mark', rolls }); S.list.forEach(st => { if(rolls.includes(st.roll)) st.printed = j.at; }); S.lastPrinted = null; S.msg = rolls.length + ' cards marked as printed in “ID Cards Printed”.'; }
  catch(e){ S.err = e.message; }
  S.busy = ''; render();
}

/* ---------- edit one card (only the card, the sheet is not changed) ---------- */
function openEdit(roll){
  const st = S.list.find(x => x.roll === roll); if(!st) return;
  const d = cardData(st), e = EDIT[roll] || {};
  $('#dlgIn').innerHTML = `<h2 style="margin:0 0 4px;color:var(--brown);font-size:17px">${esc(st.roll)} · ${esc(st.name)}</h2>
    <div class="sub">Changes here are for the card only. To fix the student's record use Admissions.</div>
    <div class="grid">${[['name','Name'],['father','Father name'],['cls','Class'],['section','Section'],['group','Group'],['session','Session (side)'],['valid','Valid up to']].map(([k, l]) =>
      `<label class="f">${l}<input data-k="${k}" value="${esc(e[k] || '')}" placeholder="${esc(d[k])}"></label>`).join('')}
      <label class="f">Photo from this device<input type="file" id="ePic" accept="image/*"></label></div>
    <div class="acts"><button class="btn pri" id="eSave">Save</button>${Object.keys(e).length ? '<button class="btn" id="eReset">Undo all changes</button>' : ''}<button class="btn" id="eClose">Close</button></div>`;
  const dlg = $('#dlg'); dlg.showModal();
  let pic = e.photo || '';
  $('#ePic').onchange = ev => { const f = ev.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = async () => { pic = await shrink(r.result); }; r.readAsDataURL(f); };
  $('#eClose').onclick = () => dlg.close();
  if($('#eReset')) $('#eReset').onclick = () => { delete EDIT[roll]; ls.set('idc_edit', EDIT); dlg.close(); render(); };
  $('#eSave').onclick = () => {
    const n = {}; document.querySelectorAll('#dlgIn input[data-k]').forEach(i => { if(i.value.trim()) n[i.dataset.k] = i.value.trim(); });
    if(pic) n.photo = pic;
    if(Object.keys(n).length) EDIT[roll] = n; else delete EDIT[roll];
    ls.set('idc_edit', EDIT); dlg.close(); render();
  };
}

/* ---------- screen ---------- */
function paintBusy(){ const b = $('#busy'); if(b){ b.classList.toggle('hidden', !S.busy); b.querySelector('span').textContent = S.busy; b.querySelector('i').style.width = Math.round(Math.min(1, S.prog) * 100) + '%'; } }
function render(){
  const m = $('#main');
  if(!user || !pass){ m.innerHTML = `<div class="card"><h2>Sign in first</h2><div class="sub">Open the attendance app and sign in with the admin login, then come back.</div><div class="acts"><a class="btn pri" href="./" style="display:inline-flex;align-items:center;text-decoration:none">Open the app</a></div></div>`; return; }
  if(ls.get('admin', false) !== true){ m.innerHTML = `<div class="card"><h2>Admin only</h2><div class="sub">Student ID cards are made by the admin.</div></div>`; return; }
  if(!S.list){ m.innerHTML = `<div class="card"><h2>Loading students…</h2><div class="sub">${S.loading ? 'Reading Transform-ALL-COLLEGE-STRENGTH.' : ''}</div>${S.err ? `<div class="note bad">${esc(S.err)}</div><div class="acts"><button class="btn pri" id="re">Try again</button></div>` : ''}</div>`; if($('#re')) $('#re').onclick = load; return; }
  const f = S.f, all = S.list, list = filtered(), sel = chosen(), shown = list.slice(0, 600);
  const secs = uniq(all.filter(st => (!f.program || st.program === f.program)).map(st => ({ s: st.pcs || st.section })), 's');
  const opt = (arr, v, none) => `<option value="">${none}</option>` + arr.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const prevList = (sel.length ? sel : list).slice(0, S.show), Y = year(), ses = sessionOf(), sign = signOf(Y);
  m.innerHTML = `
  <section class="card"><h2>Session ${esc(ses.label)} · valid up to ${esc(ses.valid)}</h2>
    <div class="sub">Set these once every year before printing. The principal's sign and stamp go under the student's photo.</div>
    <div class="grid">
      <label class="f">Session start year<input id="yY" inputmode="numeric" maxlength="4" value="${esc(S.dY || Y)}"></label>
      <label class="f">Valid up to (dd-mm-yyyy)<input id="yV" value="${esc(S.dV || ses.valid)}"></label>
      <label class="f">Principal sign + stamp (picture)<input type="file" id="ySign" accept="image/*"></label>
    </div>
    <div class="acts" style="align-items:center"><button class="btn pri" id="ySave">Save session</button>
      ${sign ? `<span class="sub">Now on the cards:</span><img src="${esc(sign)}" alt="" style="height:44px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px">` : ''}</div>
    ${!SIGNS[Y] ? `<div class="note ${sign ? 'mid' : 'bad'}">${sign ? 'Using the signature copied from the shop’s cards. Upload this year’s principal sign and stamp (cut close, white background) to be sure.' : `No principal sign and stamp for ${Y} yet. Upload it above; until then the box under the photo stays empty.`}</div>` : ''}
    ${Y < S.detected ? `<div class="note mid">Most 1st year Enroll# are JCW-F${String(S.detected).slice(-2)}-…, but the session is set to ${Y}.</div>` : ''}
  </section>
  <section class="card"><h2>1. Choose students</h2>
    <div class="sub">${all.length} 1st year students in the strength sheet (2nd year is not listed). Tick the students (or a whole section) whose cards you want to print.</div>
    <div class="grid">
      <label class="f">Program<select id="fProg">${opt(uniq(all, 'program'), f.program, 'All programs')}</select></label>
      <label class="f">Section<select id="fSec">${opt(secs, f.section, 'All sections')}</select></label>
      <label class="f">Search<input id="fQ" value="${esc(f.q)}" placeholder="Name, father or Enroll#"></label>
    </div>
    <div class="acts"><label class="c"><input type="checkbox" id="fNP" ${f.notPrinted ? 'checked' : ''}> Not printed yet only</label>
      <label class="c"><input type="checkbox" id="fEn" ${f.status === 'enrolled' ? 'checked' : ''}> Enrolled only</label>
      <button class="btn sm" id="selAll">Tick all ${list.length}</button><button class="btn sm" id="selNone" ${sel.length ? '' : 'disabled'}>Untick all</button>
      <button class="btn sm" id="reload">Reload sheet</button></div>
    ${S.err ? `<div class="note bad">${esc(S.err)}</div>` : ''}${S.msg ? `<div class="note ok">${esc(S.msg)}</div>` : ''}
    <div class="tw"><table><thead><tr><th></th><th>Enroll#</th><th>Name</th><th>Father</th><th>Class</th><th>Section</th><th>Photo</th><th>Printed</th><th></th></tr></thead><tbody>
      ${shown.map(st => `<tr><td><input type="checkbox" data-r="${esc(st.roll)}" ${S.sel.has(st.roll) ? 'checked' : ''}></td><td>${esc(st.roll)}</td><td>${esc(st.name)}${EDIT[st.roll] ? ' ✎' : ''}</td><td>${esc(st.father)}</td><td>${esc(st.cls)}</td><td>${esc(st.pcs || st.section)}</td><td>${st.pic || (EDIT[st.roll] || {}).photo ? '✓' : '<span style="color:var(--bad)">none</span>'}</td><td class="tag">${st.printed ? `<span>${esc(st.printed)}</span>` : ''}</td><td><button class="btn sm" data-e="${esc(st.roll)}">Edit</button></td></tr>`).join('')}
    </tbody></table></div>${list.length > shown.length ? `<div class="sub" style="margin-top:6px">Showing the first ${shown.length} of ${list.length}; use the filters.</div>` : ''}
  </section>
  <section class="card"><h2>2. Print</h2>
    <div class="sub"><b>${sel.length}</b> card${sel.length === 1 ? '' : 's'} ticked. The PDF downloads to this device; send it to the card shop or print it.</div>
    <div class="note mid">The PDF is the shop’s own Section E page: 7.2 × 11.2 in (518.4 × 806.4 pt), 5 cards per page, front left and back right, same card size, positions and edges. Only the student details, photo, principal’s sign and (when changed) session and valid date are written on it. Print it at <b>Actual size / 100%</b>, never “Fit to page”.</div>
    <div class="acts"><button class="btn pri" id="go" ${sel.length && !S.busy ? '' : 'disabled'}>Make PDF of ${sel.length || ''} card${sel.length === 1 ? '' : 's'}</button>
      ${S.lastPrinted ? `<button class="btn" id="mark">Mark these ${S.lastPrinted.length} as printed</button>` : ''}</div>
    <div id="busy" class="${S.busy ? '' : 'hidden'}"><div class="bar"><i style="width:${Math.round(S.prog * 100)}%"></i></div><span class="sub">${esc(S.busy)}</span></div>
  </section>
  <section class="card"><h2>Preview</h2>
    <div class="sub">${sel.length ? 'Ticked students' : 'First students of the list'}. Tap a card to change what is printed on it. Photos load when you press <b>Load photos</b> or Print.</div>
    <div class="acts"><button class="btn sm" id="lp" ${S.busy ? 'disabled' : ''}>Load photos</button></div>
    <div class="prev">${prevList.map(st => { const d = cardData(st); return `<div class="pair"><div class="who"><span>${esc(st.roll)}</span><span>${esc(st.pcs || st.section)}</span></div><div data-e="${esc(st.roll)}">${front(d)}</div><div data-e="${esc(st.roll)}">${back(d)}</div></div>`; }).join('')}</div>
    ${(sel.length ? sel : list).length > S.show ? `<div class="acts"><button class="btn sm" id="more">Show more</button></div>` : ''}
  </section>
  <section class="card"><details><summary style="font-weight:800;color:var(--brown);cursor:pointer">Card settings</summary>
    <div class="grid"><label class="f">Phone (back)<input id="cPh" value="${esc(CFG.phone)}"></label></div>
    <label class="f" style="margin-top:10px">Back lines (one per line)<textarea id="cRu">${esc(CFG.rules.join('\n'))}</textarea></label>
    <div class="tw" style="max-height:none"><table><thead><tr><th>Program (sheet)</th><th>Class on card</th><th>Group on card</th></tr></thead><tbody>
      ${uniq(all.map(st => ({ p: progKey(st.program) })), 'p').concat(Object.keys(CFG.map)).filter((v, i, a) => a.indexOf(v) === i).map(p => { const v = CFG.map[p] || {}; return `<tr><td>${esc(p)}</td><td><input data-mc="${esc(p)}" value="${esc(v.cls || '')}" style="width:100%;height:32px"></td><td><input data-mg="${esc(p)}" value="${esc(v.group || '')}" style="width:100%;height:32px"></td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="acts"><button class="btn pri" id="cSave">Save settings</button><button class="btn" id="cDef">Back to the original</button></div>
  </details></section>`;

  const setF = (k, v) => { S.f[k] = v; ls.set('idc_f', S.f); S.show = 24; render(); };
  $('#yV').onchange = e => { S.dV = e.target.value.trim(); };
  $('#yY').onchange = e => { const y = Number(e.target.value); S.dY = e.target.value.trim(); if(y > 2000) $('#yV').value = S.dV = validOf(y); };
  $('#ySign').onchange = ev => { const fl = ev.target.files[0]; if(!fl) return; const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 900 / im.width), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); S.newSign = c.toDataURL('image/png'); S.msg = 'Picture ready: press Save session.'; render(); }; im.src = r.result; }; r.readAsDataURL(fl); };
  $('#ySave').onclick = async () => {
    const y = Number($('#yY').value), v = $('#yV').value.trim();
    if(!(y > 2000 && y < 2100)) { S.err = 'Session start year looks wrong.'; return render(); }
    if(!/^\d{2}-\d{2}-\d{4}$/.test(v)) { S.err = 'Valid up to must look like 31-08-' + (y + 2) + '.'; return render(); }
    CFG.year = y === S.detected ? 0 : y; CFG.valid[y] = v; ls.set('idc_cfg', CFG);
    S.busy = 'Saving session…'; S.err = ''; render();
    try{
      await api({ action:'idc_settings', cfg: CFG });
      if(S.newSign){ await api({ action:'idc_sign', year: y, data: S.newSign }); SIGNS[y] = S.newSign; S.newSign = ''; }
      S.dY = S.dV = '';
      S.msg = 'Session ' + y + ' saved' + (SIGNS[y] ? ' with the principal sign and stamp.' : '.');
    }catch(e){ S.err = e.message; }
    S.busy = ''; render();
  };
  $('#fProg').onchange = e => { S.f.section = ''; setF('program', e.target.value); };
  $('#fSec').onchange = e => setF('section', e.target.value);
  $('#fQ').onchange = e => setF('q', e.target.value);
  $('#fNP').onchange = e => setF('notPrinted', e.target.checked);
  $('#fEn').onchange = e => setF('status', e.target.checked ? 'enrolled' : 'all');
  $('#selAll').onclick = () => { list.forEach(st => S.sel.add(st.roll)); render(); };
  $('#selNone').onclick = () => { S.sel.clear(); render(); };
  $('#reload').onclick = () => { S.msg = ''; load(); };
  m.querySelectorAll('input[data-r]').forEach(c => c.onchange = () => { c.checked ? S.sel.add(c.dataset.r) : S.sel.delete(c.dataset.r); render(); });
  m.querySelectorAll('[data-e]').forEach(b => b.onclick = () => openEdit(b.dataset.e));
  $('#go').onclick = makePdf;
  if($('#mark')) $('#mark').onclick = markPrinted;
  $('#lp').onclick = async () => { await getPhotos(prevList); render(); };
  if($('#more')) $('#more').onclick = () => { S.show += 24; render(); };
  $('#cSave').onclick = () => {
    const map = {}; m.querySelectorAll('input[data-mc]').forEach(i => { const p = i.dataset.mc, g = m.querySelector(`input[data-mg="${CSS.escape(p)}"]`).value.trim(); if(i.value.trim() || g) map[p] = { cls: i.value.trim(), group: g }; });
    CFG = mergeCfg(Object.assign({}, CFG, { phone: $('#cPh').value.trim(), rules: $('#cRu').value.split('\n').map(s => s.trim()).filter(Boolean), map }));
    ls.set('idc_cfg', CFG); render();
    api({ action:'idc_settings', cfg: CFG }).catch(e => { S.err = 'Saved on this device only: ' + e.message; render(); });
  };
  $('#cDef').onclick = () => { CFG = mergeCfg({ year: CFG.year, valid: CFG.valid }); ls.set('idc_cfg', CFG); api({ action:'idc_settings', cfg: CFG }).catch(() => {}); render(); };
}
render(); if(user && pass && ls.get('admin', false) === true){ const c = ls.get('idc_cache', null); if(c) S.list = c.list; load(); }
</script>
