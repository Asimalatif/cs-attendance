<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B3423">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>JCW Student ID Cards</title>
<style>
:root{--bg:#F7EDEA;--surface:#fff;--surface2:#FBEDEA;--ink:#2B1912;--muted:#7C6159;--line:#E2C0B8;--brown:#6B3423;--tea:#E7B7AE;--good:#0E8A5F;--good-bg:#E3F4EC;--bad:#C0392B;--bad-bg:#FDE3E1;--mid:#B4740E;--mid-bg:#FFF2D6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A110F;--surface:#261915;--surface2:#30201B;--ink:#F6E9E5;--muted:#C4A8A0;--line:#4A3029;--tea:#8A5A50;--good-bg:#14302A;--bad-bg:#3A1C1F;--mid-bg:#3A2F14}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:40px}
button,select,input{font:inherit;color:inherit}
header{background:linear-gradient(120deg,#4A2418,#8A4A35);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px}
header .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:50%;background:#fff;padding:3px;flex:none}
header h1{margin:0;font-size:19px;line-height:1.2}
header small{display:block;opacity:.85;font-size:12.5px;font-weight:400}
header a{margin-left:auto;color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1.5px solid var(--line);border-top:5px solid var(--brown);border-radius:20px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:17px;color:var(--brown)}
@media(prefers-color-scheme:dark){.card h2{color:var(--tea)}}
.sub{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
label.f input,label.f select{height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;background:var(--surface);font-size:15px;font-weight:600;color:var(--ink);width:100%}
label.c{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.btn{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;padding:0 14px;cursor:pointer;color:var(--ink)}
.btn.pri{background:linear-gradient(180deg,#8A4A35,#6B3423);border-color:#6B3423;color:#fff}
.btn.sm{height:34px;padding:0 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.bar{height:10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#C2766A,#6B3423);transition:width .2s}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.note.ok{background:var(--good-bg);color:var(--good)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.mid{background:var(--mid-bg);color:var(--mid)}
.tw{overflow:auto;max-height:420px;margin-top:10px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#6B3423;color:#fff;text-align:left;padding:7px 8px;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:5px 8px;border-top:1px solid var(--line);white-space:nowrap}
tr:nth-child(even) td{background:var(--surface2)}
td.tag span{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--good-bg);color:var(--good)}
.prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px;margin-top:12px}
.prev .pair{display:flex;flex-direction:column;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px}
.prev svg{width:100%;height:auto;display:block;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer}
.prev .who{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700}
dialog{border:none;border-radius:18px;padding:0;max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .in{padding:16px}
textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--surface);color:var(--ink);font:inherit}
.hidden{display:none!important}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--surface2);font-size:13px;font-weight:700;min-width:110px}
.chip b{display:block;font-size:20px}
.chip.bad b{color:var(--bad)}.chip.good b{color:var(--good)}.chip.mid b{color:var(--mid)}
.ed{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.ed canvas{width:240px;height:348px;border-radius:10px;border:2px solid #231F20;touch-action:none;cursor:grab;background:#eee}
.ed .side{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px}
.designs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px;margin-top:10px}
.designs button{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:6px;cursor:pointer;text-align:left;font-weight:700;font-size:13px;color:var(--ink)}
.designs button.on{border-color:var(--brown);box-shadow:0 0 0 3px var(--tea)}
.designs svg{width:100%;height:auto;display:block;border-radius:6px;margin-bottom:4px}
.themes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.themes button{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;background:var(--surface);padding:5px 10px 5px 6px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ink)}
.themes button.on{border-color:var(--brown);box-shadow:0 0 0 3px var(--tea)}
.themes i{width:22px;height:22px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px #0002}
td .bad{color:var(--bad);font-weight:700}td .mid{color:var(--mid);font-weight:700}
@font-face{font-family:'JCWCalibri';font-weight:700;src:local('Calibri Bold'),local('Calibri-Bold'),url(idcard/Carlito-Bold.woff2) format('woff2')}
</style>
<style>@page{size:7.2in 11.2in;margin:0}</style>

<body>
<header><div class="in"><img src="jcw-logo.png" alt=""><h1>Student ID cards · 1st year<small>From Transform-ALL-COLLEGE-STRENGTH · same design as the printed cards</small></h1><a href="./">← App</a></div></header>
<main id="main"></main>
<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzl-DwgASIhf-pIGYi9D3M-CGOm7d7-UKg0W-OoWAiuRBHe4mjlRgMQXIHuLm6zi--i/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ls = { get(k, d){ try{ const v = localStorage.getItem('csa2_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem('csa2_' + k, JSON.stringify(v)); return true; }catch(e){ return false; } } };
const user = ls.get('user', ''), pass = ls.get('pass', '');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LIST_FRESH_H = 12;            // the student list is read from the sheet at most every 12 hours (or on "Reload sheet")
const PHOTO_BATCH = 12;             // photos per server call (one call at a time)
const PDF_PART = 200;               // cards per PDF file (40 pages), so phones do not run out of memory

/* ---------- card settings ---------- */
const DEF = {
  phone: '091-5610909', year: 0, valid: {},
  rules: ['Student must display this card while in college.', 'This card is non-transferable.', 'If this card is lost, report to the college office immediately.'],
  map: {
    'Pre-Medical':     { cls: 'FSC', group: 'Pre-Medical' },
    'Pre-Engineering': { cls: 'FSC', group: 'Pre-Engineering' },
    'FCS':             { cls: 'FSC', group: 'GENERAL / COMPUTER SCIENCE' },
    'F.A':             { cls: 'F.A', group: 'Humanities' }
  }
};
function mergeCfg(c){ c = c || {}; const o = Object.assign({}, DEF, c); o.map = Object.assign({}, DEF.map, c.map || {}); o.valid = Object.assign({}, c.valid || {}); if(!Array.isArray(o.rules) || !o.rules.length) o.rules = DEF.rules.slice(); return o; }
let CFG = mergeCfg(ls.get('idc_cfg', {}));
let SIGNS = {};
let EDIT = ls.get('idc_edit', {});
let S = { list: null, at: '', loading: false, err: '', msg: '', f: Object.assign({ program: '', section: '', q: '', notPrinted: false, status: 'enrolled', photo: '', ticked: false }, ls.get('idc_f', {})),
  sel: new Set(), busy: '', prog: 0, cancel: false, lastPrinted: null, show: 12, detected: 0, parts: null,
  design: Object.assign({ id: 'original', theme: 'maroon' }, ls.get('idc_design', {})) };

async function api(payload, ms = 300000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(API, { method:'POST', body:JSON.stringify({ username:user, password:pass, ...payload }), signal:ctl.signal, redirect:'follow' });
    const txt = await r.text(); let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('The server sent a web page instead of data. Check the deployment.'); }
    if(j && j.error === 'UNKNOWN_ACTION') throw new Error('The server does not know this yet: paste the new IdCards.gs and deploy a new version.');
    if(j && j.error === 'BAD_LOGIN') throw new Error('Your saved login was refused. Open the app, sign out and sign in again.');
    if(j && j.ok === false) throw new Error(j.error || 'Server error');
    return j;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('The server took too long. Try again.');
    if(e instanceof TypeError) throw new Error(navigator.onLine ? 'The Apps Script server did not answer. Try again in a minute.' : 'No internet.');
    throw e;
  }finally{ clearTimeout(t); }
}

/* ---------- photos kept on this device (IndexedDB): each photo is read from Drive only once ---------- */
const DB = {
  db: null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { const q = indexedDB.open('jcw-idcards', 1);
    q.onupgradeneeded = () => { const d = q.result; d.createObjectStore('raw', { keyPath: 'roll' }); d.createObjectStore('meta', { keyPath: 'roll' }); };
    q.onsuccess = () => res(this.db = q.result); q.onerror = () => rej(q.error); }); },
  async tx(store, mode, fn){ const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction(store, mode), s = t.objectStore(store); const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  get(store, roll){ return this.tx(store, 'readonly', s => s.get(roll)); },
  put(store, rec){ return this.tx(store, 'readwrite', s => s.put(rec)); },
  all(store){ return this.tx(store, 'readonly', s => s.getAll()); },
  clear(){ return Promise.all(['raw', 'meta'].map(n => this.tx(n, 'readwrite', s => s.clear()))); }
};
let META = {};                 // roll -> { key, ok }   (ok false = the link gave no photo)
const picKey = st => (st.pic || '') + '|' + (st.own || '');
function photoState(st){
  if((EDIT[st.roll] || {}).photo) return 'ready';
  if(!st.pic || /^(null|n\/?a|-|0)$/i.test(st.pic)) return 'none';
  const m = META[st.roll]; if(!m || m.key !== picKey(st)) return 'pending';
  return m.ok ? 'ready' : 'failed';
}
const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('bad image')); im.src = src; });
async function toRaw(src){            // any photo -> JPEG of at most 640 px (kept on the device)
  const im = await loadImg(src), k = Math.min(1, 640 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .88);
}
const FRAME_AR = 45.5139 / 66.0289;   // photo frame of the shop's card
async function coverJpeg(src, W = 376, H = Math.round(376 / FRAME_AR)){
  const im = await loadImg(src), c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), r = Math.max(W / im.naturalWidth, H / im.naturalHeight), w = im.naturalWidth * r, h = im.naturalHeight * r;
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
  return c.toDataURL('image/jpeg', .9);
}
const CARDPIC = new Map();            // small cache of finished card photos for the preview
async function cardPhoto(st){
  const e = EDIT[st.roll] || {};
  if(e.photo) return e.photo;
  if(photoState(st) !== 'ready') return '';
  const k = st.roll + '|' + picKey(st); if(CARDPIC.has(k)) return CARDPIC.get(k);
  const r = await DB.get('raw', st.roll).catch(() => null); if(!r || !r.data) return '';
  const p = await coverJpeg(r.data).catch(() => '');
  if(CARDPIC.size > 80) CARDPIC.delete(CARDPIC.keys().next().value);
  CARDPIC.set(k, p); return p;
}
async function fetchPhotos(sts, retryFailed){
  const need = sts.filter(st => { const p = photoState(st); return p === 'pending' || (retryFailed && p === 'failed'); });
  if(!need.length) return 0;
  S.cancel = false; let done = 0;
  for(let i = 0; i < need.length && !S.cancel; i += PHOTO_BATCH){
    const part = need.slice(i, i + PHOTO_BATCH);
    S.busy = `Reading photos from Drive: ${Math.min(i + PHOTO_BATCH, need.length)} of ${need.length} (each photo only once; stop any time)`; S.prog = i / need.length; paintBusy();
    let j = null;
    for(let t = 0; t < 2 && !j; t++){ try{ j = await api({ action:'idc_photos', items: part.map(st => ({ roll: st.roll, pic: st.pic })) }, 180000); }catch(e){ if(t) { S.err = 'Photos stopped: ' + e.message; S.cancel = true; } else await sleep(4000); } }
    if(!j) break;
    for(const st of part){
      const src = (j.photos || {})[st.roll]; let raw = '';
      if(src) raw = await toRaw(src).catch(() => '');
      const m = { roll: st.roll, key: picKey(st), ok: !!raw };
      if(raw) await DB.put('raw', { roll: st.roll, data: raw }).catch(() => {});
      await DB.put('meta', m).catch(() => {}); META[st.roll] = m; done++;
    }
    await sleep(150);
  }
  S.busy = ''; S.prog = 0;
  return done;
}

/* ---------- what goes on a card ---------- */
const progKey = p => String(p || '').replace(/\(.*?\)/g, '').trim();
const secOf = st => { const t = String(st.pcs || '').trim().split(/\s+/).pop() || ''; return /^[A-Za-z]{0,3}\d{1,2}$/.test(t) ? t.toUpperCase() : (st.section || t); };
function detectYear(list){
  const n = {}; (list || []).forEach(st => { const m = String(st.roll).match(/-F(\d{2})-/i); if(m) n[m[1]] = (n[m[1]] || 0) + 1; });
  const k = Object.keys(n).sort((a, b) => n[b] - n[a])[0];
  if(k) return 2000 + Number(k);
  const d = new Date(); return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1;
}
const year = () => Number(CFG.year) || S.detected || detectYear(S.list);
const validOf = y => CFG.valid[y] || ('31-08-' + (Number(y) + 2));
const signOf = y => SIGNS[y] || (String(y) === '2026' ? 'idcard/principal-sign.png' : '');
function sessionOf(){ const y = year(); return { label: y + '-' + String(y + 2).slice(-2), valid: validOf(y) }; }
function cardData(st, photo){
  const e = EDIT[st.roll] || {}, mp = CFG.map[progKey(st.program)] || {}, ses = sessionOf();
  return {
    roll: st.roll, name: (e.name || st.name || '').toUpperCase(), father: (e.father || st.father || '').toUpperCase(),
    cls: e.cls || mp.cls || progKey(st.program), section: e.section || secOf(st),
    group: e.group || mp.group || (st.group && !/^null$/i.test(st.group) ? st.group : progKey(st.program)),
    photo: photo || '', session: ses.label, valid: ses.valid, sign: signOf(year())
  };
}

/* ---------- design 1: the shop's Section E card, exact (template = their page 1, details written back at the same points) ---------- */
const PAGE_W = 518.4, PAGE_H = 806.4, FRONT_X = 0.131, BACK_X = 273.4, CARD_W = 244.8, CARD_H = 158.4;
const ROW_Y = [0.02, 158.42, 316.82, 475.22, 633.61];
const GEO = [{"base": [92.2637, 102.9547, 113.6456, 124.3362, 135.0271, 145.718], "photo": [174.9529, 59.3018, 45.5139, 66.0289], "frame": [175.2653, 59.6166, 220.1545, 125.0155], "signBox": [173.3034, 129.2252, 48.8134, 12.2975], "signClip": [170.6757, 129.4067, 224.7443, 141.3411], "sess": [[28.2447, 90.5604, 33.9012, 118.8794], [301.089, 90.5604, 306.7455, 118.8794]], "valid": [312.9491, 104.6907], "vbbox": [312.9491, 98.4897, 389.3215, 106.7577]}, {"base": [250.8797, 261.5706, 272.2615, 282.9521, 293.6431, 304.334], "photo": [174.9529, 217.9175, 45.5139, 66.0289], "frame": [175.2653, 218.2326, 220.1545, 283.6315], "signBox": [173.3034, 287.8412, 48.8134, 12.2975], "signClip": [170.6757, 288.0227, 224.7443, 299.9571], "sess": [[28.2447, 249.1765, 33.9012, 277.4954], [301.089, 248.9604, 306.7455, 277.2794]], "valid": [312.9491, 263.0906], "vbbox": [312.9491, 256.8896, 389.3215, 265.1576]}, {"base": [409.4957, 420.1866, 430.8775, 441.5681, 452.259, 462.9499], "photo": [174.9529, 376.5337, 45.5139, 66.0289], "frame": [175.2653, 376.8486, 220.1545, 442.2475], "signBox": [173.3034, 446.4572, 48.8134, 12.2975], "signClip": [170.6757, 446.6387, 224.7443, 458.5731], "sess": [[28.2447, 407.7924, 33.9012, 436.1114], [301.089, 407.3604, 306.7455, 435.6794]], "valid": [312.9491, 421.4906], "vbbox": [312.9491, 415.2896, 389.3215, 423.5576]}, {"base": [568.1117, 578.8026, 589.4935, 600.1841, 610.875, 621.5659], "photo": [174.9529, 535.1497, 45.5139, 66.0289], "frame": [175.2653, 535.4646, 220.1545, 600.8635], "signBox": [173.3034, 605.0731, 48.8134, 12.2975], "signClip": [170.6757, 605.2548, 224.7443, 617.1891], "sess": [[28.2447, 566.4084, 33.9012, 594.7274], [301.089, 565.7604, 306.7455, 594.0794]], "valid": [312.9491, 579.8906], "vbbox": [312.9491, 573.6896, 389.3215, 581.9576]}, {"base": [726.7277, 737.4186, 748.1095, 758.8001, 769.491, 780.1819], "photo": [174.9529, 693.7657, 45.5139, 66.0289], "frame": [175.2653, 694.0806, 220.1545, 759.4795], "signBox": [173.3034, 763.6891, 48.8134, 12.2975], "signClip": [170.6757, 763.8707, 224.7443, 775.8051], "sess": [[28.2447, 725.0244, 33.9012, 753.3434], [301.089, 724.1604, 306.7455, 752.4794]], "valid": [312.9491, 738.2906], "vbbox": [312.9491, 732.0897, 389.3215, 740.3577]}];
const TPL_SESSION = '2026-28', TPL_VALID = '31-08-2028', VALUE_X = 71.1196, VALUE_MAX = 102, DATE_DX = 39.344;
const FONT_B = "'JCWCalibri',Calibri,Carlito,sans-serif";
const cvs = document.createElement('canvas').getContext('2d');
const textW = (t, size) => { cvs.font = `700 ${size}px ${FONT_B}`; return cvs.measureText(t).width; };
function fit(text, size, max){ return textW(text, size) > max ? ` textLength="${max}" lengthAdjust="spacingAndGlyphs"` : ''; }
let uid = 0;
function slot(k, d){
  const g = GEO[k], id = 'k' + (++uid), F = g.frame, P = g.photo, SC = g.signClip, SB = g.signBox, r0 = 1.8335;
  const vals = [d.name, d.father, d.cls, d.roll, d.section, d.group];
  let o = `<g font-family="${FONT_B}" font-weight="700" font-size="7.982" fill="#fff" style="font-kerning:normal">` +
    vals.map((v, i) => `<text x="${VALUE_X}" y="${g.base[i]}"${fit(v, 7.982, VALUE_MAX)}>${esc(v)}</text>`).join('') + '</g>';
  const rr = `M${F[0] + r0} ${F[1]}H${F[2] - r0}A${r0} ${r0} 0 0 1 ${F[2]} ${F[1] + r0}V${F[3] - r0}A${r0} ${r0} 0 0 1 ${F[2] - r0} ${F[3]}H${F[0] + r0}A${r0} ${r0} 0 0 1 ${F[0]} ${F[3] - r0}V${F[1] + r0}A${r0} ${r0} 0 0 1 ${F[0] + r0} ${F[1]}Z`;
  if(!d.photo) o += `<path d="${rr}" fill="#fff" stroke="#231F20" stroke-width=".5"/>`;

/* find many students at once: Enroll# (or its last digits) or names, one per line or separated by commas */
function findMany(text){
  const toks = String(text || '').split(/[\n,;]+/).map(s => s.trim()).filter(Boolean), miss = [], hit = new Set();
  for(const t of toks){
    let m = [];
    if(/\d/.test(t)){ const d = t.replace(/\D+/g, ''); m = S.list.filter(st => { const r = st.roll.replace(/\D+/g, ''); return st.roll.toUpperCase() === t.toUpperCase() || r === d || r.endsWith(d.length >= 3 ? d : '#'); }); if(m.length > 1){ const ex = m.filter(st => st.roll.split('-').pop() === t.split('-').pop()); if(ex.length) m = ex; } }
    else { const n = norm(t); m = S.list.filter(st => norm(st.name) === n); if(!m.length) m = S.list.filter(st => norm(st.name).includes(n)); }
    if(m.length) m.forEach(st => hit.add(st.roll)); else miss.push(t);

        const d = cardData(part[k], await cardPhoto(part[k])), g = GEO[k];
        if(!tpl){ await drawPrims(page, designPrims(id, false, d, th), FRONT_X, ROW_Y[k]); await drawPrims(page, designPrims(id, true, d, th), BACK_X, ROW_Y[k]); continue; }
        [d.name, d.father, d.cls, d.roll, d.section, d.group].forEach((v, n) => {
          v = clean(v); const w = widthOf(v, 7.982), sx = w > VALUE_MAX ? VALUE_MAX / w : 1;
          page.pushOperators(pushGraphicsState(), concatTransformationMatrix(sx, 0, 0, 1, VALUE_X, Y(g.base[n])));
          say(page, v, 7.982, WHITE);
          page.pushOperators(popGraphicsState());
        });
        const ph = await img(d.photo).catch(() => null);
        if(!ph){
          page.pushOperators(pushGraphicsState(), L.setFillingCmykColor(0, 0, 0, 0), ...rr(g.frame, 1.8335), L.fill(), popGraphicsState(),
            pushGraphicsState(), setStrokingCmykColor(0, 0, 0, 1), setLineWidth(.5), ...rr(g.frame, 1.8335), stroke(), popGraphicsState());
        } else {
          const P = g.photo;
          page.pushOperators(pushGraphicsState(), ...rr(g.frame, 1.8335), clip(), endPath());
          page.drawImage(ph, { x: P[0], y: Y(P[1] + P[3]), width: P[2], height: P[3] });
          page.pushOperators(popGraphicsState(), pushGraphicsState(), setStrokingCmykColor(0, 0, 0, 1), setLineWidth(.5), ...rr(g.frame, 1.8335), stroke(), popGraphicsState());
        }
        const sg = await img(d.sign).catch(() => null);
        if(sg){
          const C = g.signClip, B = g.signBox, r = Math.min(B[2] / sg.width, B[3] / sg.height), w = sg.width * r, h = sg.height * r;
          page.pushOperators(pushGraphicsState(), rectangle(C[0], Y(C[3]), C[2] - C[0], C[3] - C[1]), clip(), endPath());
          page.drawImage(sg, { x: B[0] + (B[2] - w) / 2, y: Y(B[1] + B[3]) + (B[3] - h) / 2, width: w, height: h });
          page.pushOperators(popGraphicsState());
        }
        if(d.session !== TPL_SESSION) g.sess.forEach(r => {
          const t = clean(d.session), sx = 28.87 / widthOf(t, 8.11);
          page.drawRectangle({ x: r[0] - .3, y: Y(r[3] + .4), width: r[2] - r[0] + .6, height: r[3] - r[1] + .8, color: WHITE });
          page.pushOperators(pushGraphicsState(), concatTransformationMatrix(0, sx, -1, 0, r[2] - .06, Y(r[3] + .17)));
          say(page, t, 8.11, BLACK);
          page.pushOperators(popGraphicsState());
        });
        if(d.valid !== TPL_VALID){
          const x = g.valid[0] + DATE_DX, b = g.vbbox;
          page.drawRectangle({ x: x - .3, y: Y(b[3] + .2), width: b[2] - x + .55, height: b[3] - b[1] + .4, color: WHITE });
          page.pushOperators(pushGraphicsState(), concatTransformationMatrix(.9594, 0, 0, 1, x, Y(g.valid[1])));
          say(page, clean(d.valid), 8.268, BLACK);
          page.pushOperators(popGraphicsState());
        }
      }
      S.prog = (i + 5) / sts.length; S.busy = `Making the PDF: page ${i / 5 + 1} of ${Math.ceil(sts.length / 5)}…`; paintBusy();
      await sleep(0);
    }
    doc.setTitle('JCW Student ID Cards'); doc.setCreator('JCW attendance app');
    const blob = new Blob([await doc.save()], { type: 'application/pdf' }), url = URL.createObjectURL(blob);
    const f = S.f, name = 'ID cards ' + (label || f.section || f.program || 'students').replace(/[^\w .-]+/g, ' ').trim() + ' (' + sts.length + ').pdf';
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 120000);
    S.lastPrinted = sts.map(st => st.roll);
    const miss = sts.filter(st => photoState(st) !== 'ready').length;
    S.msg = name + ' is ready (' + Math.ceil(sts.length / 5) + ' page' + (sts.length > 5 ? 's' : '') + ').' + (miss ? ' ' + miss + ' card' + (miss > 1 ? 's have' : ' has') + ' no photo.' : '') + ' Print at Actual size / 100%.';
  }catch(e){ S.err = e.message === 'stopped' ? 'Stopped.' : 'PDF not made: ' + e.message; }
  S.busy = ''; S.prog = 0; render();
}
function startPdf(){

  if(sts.length <= PDF_PART){ S.parts = null; return makePdf(sts); }
  S.parts = []; for(let i = 0; i < sts.length; i += PDF_PART) S.parts.push([i, Math.min(i + PDF_PART, sts.length)]);

/* ---------- photo: rotate, trim (zoom + move), or a new one from the phone; saved to Drive for every device ---------- */
async function openPhoto(roll){
  const st = S.list.find(x => x.roll === roll); if(!st) return;
  const dlg = $('#dlg'), ps = photoState(st);
  $('#dlgIn').innerHTML = `<h2 style="margin:0 0 4px;color:var(--brown);font-size:17px">Photo · ${esc(st.roll)} · ${esc(st.name)}</h2>
    <div class="sub">Rotate, then drag the photo and zoom so the face fills the frame (that trims the edges). Or take/choose a new photo. <b>Save</b> keeps it in Drive (“JCW ID Cards/Student photos”) for every device.</div>
    <div class="ed" style="margin-top:10px"><canvas id="pc" width="376" height="${Math.round(376 / FRAME_AR)}"></canvas>
      <div class="side">
        <div class="acts" style="margin:0"><button class="btn sm" id="pL">⟲ Rotate</button><button class="btn sm" id="pR">Rotate ⟳</button><button class="btn sm" id="pReset">Reset</button></div>
        <label class="f">Zoom (trim edges)<input type="range" id="pZ" min="1" max="4" step="0.01" value="1" style="height:32px;padding:0"></label>
        <label class="f">New photo (camera or gallery)<input type="file" id="pF" accept="image/*"></label>
        <div id="pMsg" class="sub">${ps === 'none' ? 'No photo link in the sheet: choose or take one.' : ps === 'failed' ? 'The photo link in the sheet gave no picture: choose or take one.' : ''}</div>
        <div class="acts" style="margin:0"><button class="btn pri" id="pSave" disabled>Save photo</button><button class="btn" id="pClose">Close</button></div>
      </div></div>`;
  dlg.showModal();
  const cv = $('#pc'), x = cv.getContext('2d'), E = { im: null, rot: 0, z: 1, px: 0, py: 0 };
  function draw(){
    x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
    if(!E.im){ x.fillStyle = '#999'; x.font = '700 28px sans-serif'; x.textAlign = 'center'; x.fillText('PHOTO', cv.width / 2, cv.height / 2); return; }
    const sw = E.rot % 180 ? E.im.naturalHeight : E.im.naturalWidth, sh = E.rot % 180 ? E.im.naturalWidth : E.im.naturalHeight;
    const k = Math.max(cv.width / sw, cv.height / sh) * E.z;
    x.save(); x.translate(cv.width / 2 + E.px, cv.height / 2 + E.py); x.rotate(E.rot * Math.PI / 180); x.scale(k, k);
    x.drawImage(E.im, -E.im.naturalWidth / 2, -E.im.naturalHeight / 2); x.restore();
  }
  async function use(src, fresh){ try{ E.im = await loadImg(src); E.rot = 0; E.z = 1; E.px = E.py = 0; $('#pZ').value = 1; draw(); if(fresh) $('#pSave').disabled = false; }catch(e){ $('#pMsg').textContent = 'That picture could not be opened.'; } }
  const r = (EDIT[roll] || {}).photo ? { data: EDIT[roll].photo } : (ps === 'ready' ? await DB.get('raw', roll).catch(() => null) : null);
  if(r && r.data) await use(r.data); else draw();
  const changed = () => { $('#pSave').disabled = !E.im; draw(); };
  $('#pL').onclick = () => { E.rot = (E.rot + 270) % 360; E.px = E.py = 0; changed(); };
  $('#pR').onclick = () => { E.rot = (E.rot + 90) % 360; E.px = E.py = 0; changed(); };
  $('#pReset').onclick = () => { E.rot = 0; E.z = 1; E.px = E.py = 0; $('#pZ').value = 1; changed(); };
  $('#pZ').oninput = e => { E.z = Number(e.target.value); changed(); };
  let drag = null;
  cv.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, px: E.px, py: E.py }; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if(!drag) return; const s = cv.width / cv.getBoundingClientRect().width; E.px = drag.px + (e.clientX - drag.x) * s; E.py = drag.py + (e.clientY - drag.y) * s; changed(); };
  cv.onpointerup = cv.onpointercancel = () => { drag = null; };
  cv.onwheel = e => { e.preventDefault(); E.z = Math.min(4, Math.max(1, E.z * (e.deltaY < 0 ? 1.06 : 1 / 1.06))); $('#pZ').value = E.z; changed(); };
  $('#pF').onchange = ev => { const f = ev.target.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = async () => use(await toRaw(rd.result).catch(() => rd.result), true); rd.readAsDataURL(f); };
  $('#pClose').onclick = () => dlg.close();
  $('#pSave').onclick = async () => {
    const data = cv.toDataURL('image/jpeg', .9);
    $('#pSave').disabled = true; $('#pMsg').textContent = 'Saving to Drive…';
    try{
      const j = await api({ action:'idc_photo_save', roll, data });
      st.pic = 'https://drive.google.com/file/d/' + j.id + '/view';
      st.own = j.at;
      const m = { roll, key: picKey(st), ok: true };
      await DB.put('raw', { roll, data }); await DB.put('meta', m); META[roll] = m;
      if(EDIT[roll] && EDIT[roll].photo){ delete EDIT[roll].photo; ls.set('idc_edit', EDIT); }
      ls.set('idc_cache', Object.assign(ls.get('idc_cache', {}), { list: S.list }));
      dlg.close(); S.msg = 'Photo of ' + st.name + ' saved.'; render();
    }catch(e){ $('#pMsg').textContent = 'Not saved: ' + e.message; $('#pSave').disabled = false; }
  };
}

    <div class="acts"><button class="btn pri" id="go" ${sel.length && !S.busy ? '' : 'disabled'}>Make PDF of ${sel.length || ''} card${sel.length === 1 ? '' : 's'}</button>
      ${S.busy ? '<button class="btn" id="stop">Stop</button>' : ''}
      ${S.lastPrinted ? `<button class="btn" id="mark">Mark these ${S.lastPrinted.length} as printed</button>` : ''}</div>
    ${S.parts ? `<div class="acts">${S.parts.map(([a, b], i) => `<button class="btn sm" data-part="${i}" ${S.busy ? 'disabled' : ''}>File ${i + 1}: cards ${a + 1}–${b}</button>`).join('')}</div>` : ''}
    <div id="busy" class="${S.busy ? '' : 'hidden'}"><div class="bar"><i style="width:${Math.round(S.prog * 100)}%"></i></div><span class="sub">${esc(S.busy)}</span></div>
  </section>
  <section class="card"><h2>Preview</h2>
    <div class="sub">${sel.length ? 'Ticked students' : 'First students of the list'}. Tap a card to change its photo.</div>
    <div class="prev">${prevList.map(st => `<div class="pair" data-pv="${esc(st.roll)}"><div class="who"><span>${esc(st.roll)}</span><span>${esc(st.pcs || st.section)}</span></div><div class="fr" data-p="${esc(st.roll)}"></div><div class="bk" data-e="${esc(st.roll)}"></div></div>`).join('')}</div>
    ${(sel.length ? sel : list).length > S.show ? `<div class="acts"><button class="btn sm" id="more">Show more</button></div>` : ''}
  </section>
  <section class="card"><details><summary style="font-weight:800;color:var(--brown);cursor:pointer">Card settings</summary>
    <div class="grid"><label class="f">Phone (back)<input id="cPh" value="${esc(CFG.phone)}"></label></div>
    <label class="f" style="margin-top:10px">Back lines (one per line)<textarea id="cRu">${esc(CFG.rules.join('\n'))}</textarea></label>
    <div class="tw" style="max-height:none"><table><thead><tr><th>Program (sheet)</th><th>Class on card</th><th>Group on card</th></tr></thead><tbody>
      ${uniq(all.map(st => ({ p: progKey(st.program) })), 'p').concat(Object.keys(CFG.map)).filter((v, i, a) => a.indexOf(v) === i).map(p => { const v = CFG.map[p] || {}; return `<tr><td>${esc(p)}</td><td><input data-mc="${esc(p)}" value="${esc(v.cls || '')}" style="width:100%;height:32px"></td><td><input data-mg="${esc(p)}" value="${esc(v.group || '')}" style="width:100%;height:32px"></td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="acts"><button class="btn pri" id="cSave">Save settings</button><button class="btn" id="cDef">Back to the original</button><button class="btn" id="cClr">Forget photos on this device</button></div>
  </details></section>`;

  const setF = (k, v) => { S.f[k] = v; ls.set('idc_f', S.f); S.show = 12; render(); };
  $('#fProg').onchange = e => { S.f.section = ''; setF('program', e.target.value); };
  $('#fSec').onchange = e => setF('section', e.target.value);
  $('#fPh').onchange = e => setF('photo', e.target.value);
  $('#fQ').onchange = e => setF('q', e.target.value);
  $('#fTk').onchange = e => setF('ticked', e.target.checked);
  $('#fNP').onchange = e => setF('notPrinted', e.target.checked);
  $('#fEn').onchange = e => setF('status', e.target.checked ? 'enrolled' : 'all');
  $('#findMany').onclick = openFind;
  $('#selAll').onclick = () => { list.forEach(st => S.sel.add(st.roll)); render(); };
  $('#selNone').onclick = () => { S.sel.clear(); S.parts = null; if(S.f.ticked) S.f.ticked = false; render(); };
  $('#reload').onclick = () => { S.msg = ''; load(true); };
  m.querySelectorAll('input[data-r]').forEach(c => c.onchange = () => { c.checked ? S.sel.add(c.dataset.r) : S.sel.delete(c.dataset.r); S.parts = null; render(); });
  m.querySelectorAll('[data-e]').forEach(b => b.onclick = () => openEdit(b.dataset.e));
  m.querySelectorAll('[data-p]').forEach(b => b.onclick = () => openPhoto(b.dataset.p));
  m.querySelectorAll('[data-ds]').forEach(b => b.onclick = () => { S.design.id = b.dataset.ds; ls.set('idc_design', S.design); render(); });
  m.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { S.design.theme = b.dataset.th; ls.set('idc_design', S.design); render(); });
  m.querySelectorAll('[data-part]').forEach(b => b.onclick = () => { const [a, z] = S.parts[Number(b.dataset.part)]; makePdf(chosen().slice(a, z), `part ${Number(b.dataset.part) + 1}`); });
  $('#go').onclick = startPdf;
  if($('#stop')) $('#stop').onclick = () => { S.cancel = true; };
  if($('#mark')) $('#mark').onclick = markPrinted;
  if($('#more')) $('#more').onclick = () => { S.show += 12; render(); };
  const missing = () => all.filter(st => ['none', 'failed'].includes(photoState(st)));
  $('#phMiss').onclick = () => { S.f.photo = 'missing'; S.f.ticked = false; ls.set('idc_f', S.f); render(); };
  $('#phCsv').onclick = () => csvDownload([['Enroll#', 'Student Name', 'Father Name', 'Section', 'Program', 'Problem']].concat(missing().sort((a, b) => (a.pcs || '').localeCompare(b.pcs || '') || a.roll.localeCompare(b.roll, undefined, { numeric: true })).map(st => [st.roll, st.name, st.father, st.pcs || st.section, progKey(st.program), photoState(st) === 'none' ? 'No photo link' : 'Link gives no picture'])), 'Students without photo.csv');
  $('#phAll').onclick = async () => { S.err = ''; await fetchPhotos(all); render(); };
  $('#phRetry').onclick = async () => { S.err = ''; await fetchPhotos(all.filter(st => photoState(st) === 'failed'), true); render(); };
  $('#yV').onchange = e => { S.dV = e.target.value.trim(); };
  $('#yY').onchange = e => { const y = Number(e.target.value); S.dY = e.target.value.trim(); if(y > 2000) $('#yV').value = S.dV = validOf(y); };
  $('#ySign').onchange = ev => { const fl = ev.target.files[0]; if(!fl) return; const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 900 / im.width), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); S.newSign = c.toDataURL('image/png'); S.msg = 'Picture ready: press Save session.'; render(); }; im.src = r.result; }; r.readAsDataURL(fl); };
  $('#ySave').onclick = async () => {
    const y = Number($('#yY').value), v = $('#yV').value.trim();
    if(!(y > 2000 && y < 2100)) { S.err = 'Session start year looks wrong.'; return render(); }
    if(!/^\d{2}-\d{2}-\d{4}$/.test(v)) { S.err = 'Valid up to must look like 31-08-' + (y + 2) + '.'; return render(); }
    CFG.year = y === S.detected ? 0 : y; CFG.valid[y] = v; ls.set('idc_cfg', CFG);
    S.busy = 'Saving session…'; S.err = ''; render();
    try{
      await api({ action:'idc_settings', cfg: CFG });
      if(S.newSign){ await api({ action:'idc_sign', year: y, data: S.newSign }); SIGNS[y] = S.newSign; S.newSign = ''; }
      ls.set('idc_cache', Object.assign(ls.get('idc_cache', {}), { cfg: CFG, signs: SIGNS }));
      S.dY = S.dV = '';
      S.msg = 'Session ' + y + ' saved' + (SIGNS[y] ? ' with the principal sign and stamp.' : '.');
    }catch(e){ S.err = e.message; }
    S.busy = ''; render();
  };
  $('#cSave').onclick = () => {
    const map = {}; m.querySelectorAll('input[data-mc]').forEach(i => { const p = i.dataset.mc, g = m.querySelector(`input[data-mg="${CSS.escape(p)}"]`).value.trim(); if(i.value.trim() || g) map[p] = { cls: i.value.trim(), group: g }; });
    CFG = mergeCfg(Object.assign({}, CFG, { phone: $('#cPh').value.trim(), rules: $('#cRu').value.split('\n').map(s => s.trim()).filter(Boolean), map }));
    ls.set('idc_cfg', CFG); render();
    api({ action:'idc_settings', cfg: CFG }).catch(e => { S.err = 'Saved on this device only: ' + e.message; render(); });
  };
  $('#cDef').onclick = () => { CFG = mergeCfg({ year: CFG.year, valid: CFG.valid }); ls.set('idc_cfg', CFG); api({ action:'idc_settings', cfg: CFG }).catch(() => {}); render(); };
  $('#cClr').onclick = async () => { if(!confirm('Forget all photos kept on this device? They will be read from Drive again when needed.')) return; await DB.clear().catch(() => {}); META = {}; CARDPIC.clear(); render(); };
  fillPreviews();
}
render(); if(user && pass && ls.get('admin', false) === true) load(false);
</script>
</body>
</html>
