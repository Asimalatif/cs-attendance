name: Push backend to Apps Script

on:
  push:
    branches: [main]
    paths:
      - '*.gs'
      - 'appsscript.json'
      - '.claspignore'
      - '.clasp.json'
      - '.github/workflows/apps-script.yml'
  workflow_dispatch:

concurrency:
  group: apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Log in to Google
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ]; then echo "::error::CLASPRC_JSON secret is missing"; exit 1; fi
          printf '%s' "$CLASPRC" > ~/.clasprc.json

      - name: Safety check (never delete files that exist only in Apps Script)
        run: |
          SCRIPT_ID=$(node -p "require('./.clasp.json').scriptId")
          REPO=$PWD
          mkdir -p /tmp/live && cd /tmp/live
          clasp clone "$SCRIPT_ID" --rootDir . > /dev/null
          # Keep the live manifest (time zone, scopes, web app settings) if the repo has none
          if [ ! -f "$REPO/appsscript.json" ]; then cp appsscript.json "$REPO/appsscript.json"; fi
          missing=0
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            case "$rel" in .clasp.json|appsscript.json) continue ;; esac
            name="${rel%.*}"
            if [ ! -f "$REPO/$name.gs" ] || [ "$name" = "backend-patch" ]; then
              echo "::error::'$rel' exists in Apps Script but not in the repo. Add it to the repo (as $name.gs) or delete it in the editor, then re-run."
              missing=1
            fi
          done < <(find . -type f -print0)
          exit $missing

      - name: Push code
        run: clasp push --force

      - name: Update live web app deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::warning::DEPLOYMENT_ID secret not set - code pushed, but the live /exec URL was not updated."
            exit 0
          fi
          clasp deploy -i "$DEPLOYMENT_ID" -d "Auto: ${GITHUB_SHA::7}"
