name: diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g @google/clasp@2.4.2 > /dev/null 2>&1
      - env: { CLASPRC: "${{ secrets.CLASPRC_JSON }}" }
        run: printf '%s' "$CLASPRC" > ~/.clasprc.json
      - run: |
          mkdir /tmp/l && cd /tmp/l && clasp clone "$(node -p "require('$GITHUB_WORKSPACE/.clasp.json').scriptId")" --rootDir . >/dev/null
          echo "== load simulation in clasp order"
          ls *.js | LC_ALL=C sort | tr '\n' '|'; echo
          IFS=$'\n'; node $GITHUB_WORKSPACE/.github/sim.js $(ls *.js | LC_ALL=C sort)
          echo "== Dialog head"; head -c 1500 "Dialog box- sync attend MT.js"
          echo; echo "== top-level non-function lines in kept files"
          for f in "ALL SHEETS LINK.js" "API_URL.js" "College Reports.js" "MOVE OCTOBER SHEETS.js" "add new admissions.js" "Dialog box- sync attend MT.js" "Certificate.js"; do echo "--- $f"; grep -nE '^[A-Za-z_$]' "$f" | grep -vE '^[0-9]+:(function|var [A-Za-z_$]+ *= *(\x27|"|[0-9{\[]))' | head -15; done
