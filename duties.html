<html lang="en">
<head>

<style>
:root{--bg:#F7EDEA;--surface:#fff;--surface2:#FBEDEA;--ink:#2B1912;--muted:#7C6159;--line:#E2C0B8;--brown:#6B3423;--tea:#E7B7AE;--good:#0E8A5F;--good-bg:#E3F4EC;--bad:#C0392B;--bad-bg:#FDE3E1;--mid:#B4740E;--mid-bg:#FFF2D6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A110F;--surface:#261915;--surface2:#30201B;--ink:#F6E9E5;--muted:#C4A8A0;--line:#4A3029;--tea:#8A5A50;--good-bg:#14302A;--bad-bg:#3A1C1F;--mid-bg:#3A2F14}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:40px}
button,select,input{font:inherit;color:inherit}
header{background:linear-gradient(120deg,#4A2418,#8A4A35);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px}
header .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:50%;background:#fff;padding:3px;flex:none}
header h1{margin:0;font-size:19px;line-height:1.2}
header small{display:block;opacity:.85;font-size:12.5px;font-weight:400}
header a{margin-left:auto;color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1.5px solid var(--line);border-top:5px solid var(--brown);border-radius:20px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:17px;color:var(--brown)}
.card h3{margin:0 0 6px;font-size:15.5px;color:var(--brown)}
@media(prefers-color-scheme:dark){.card h2,.card h3{color:var(--tea)}}
.sub{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
label.f input,label.f select,input.sq,select.sq{height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;background:var(--surface);font-size:15px;font-weight:600;color:var(--ink);width:100%}
label.c{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.btn{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;padding:0 14px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:linear-gradient(180deg,#8A4A35,#6B3423);border-color:#6B3423;color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.sm{height:34px;padding:0 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.note.ok{background:var(--good-bg);color:var(--good)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.mid{background:var(--mid-bg);color:var(--mid)}
.tw{overflow:auto;max-height:70vh;margin-top:10px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:#6B3423;color:#fff;text-align:left;padding:7px 8px;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--surface2)}
td.n{text-align:center;font-weight:800;white-space:nowrap}
td.nw{white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--surface2);font-size:13px;font-weight:700;min-width:100px}
.chip b{display:block;font-size:20px}
.chip.bad b{color:var(--bad)}.chip.good b{color:var(--good)}.chip.mid b{color:var(--mid)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px;position:sticky;top:0;z-index:3;background:var(--bg);padding:8px 0}
.tab{height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;padding:0 14px;cursor:pointer}
.tab.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.tab .ct{font-size:11.5px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 6px;margin-left:4px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:18px 14px;text-align:center;background:var(--surface2);min-height:96px;outline:none;color:var(--muted);font-weight:700;cursor:text;overflow:hidden;max-height:140px}
.drop:focus{border-color:var(--brown)}
.dc{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 7px;margin:2px 4px 2px 0;font-size:12.5px;background:var(--surface);white-space:nowrap}
.dc.x{border-color:var(--bad);color:var(--bad);background:var(--bad-bg);font-weight:800}
.lnk{background:none;border:none;padding:0;color:inherit;font-weight:800;text-decoration:underline;text-decoration-color:var(--tea);cursor:pointer;text-align:left}
.x{color:var(--bad);font-weight:800}
.ok{color:var(--good);font-weight:800}
.muted{color:var(--muted)}
input.cell{border:1px solid transparent;background:transparent;padding:4px 5px;border-radius:7px;width:100%;min-width:80px;font-size:13px;color:var(--ink)}
input.cell:focus{border-color:var(--brown);background:var(--surface);outline:none}
input.cell.wide{min-width:220px}
input.nm{height:36px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;background:var(--surface);width:100%;min-width:170px;font-weight:600}
.rm{margin-top:14px}
.rm h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
dialog{border:none;border-radius:18px;padding:0;max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .in{padding:16px}
textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--surface);color:var(--ink);font:13px/1.4 inherit}

.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}

<body>
<header><div class="in"><img src="jcw-logo.png" alt=""><h1>Exam duty lists<small>Teacher-wise · room-wise · day-wise, from the Word duty table</small></h1><a href="./">← App</a></div></header>
<main id="main"></main>
<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<input type="file" id="fDoc" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="hidden">
<script>
const API = 'https://script.google.com/macros/s/AKfycbzl-DwgASIhf-pIGYi9D3M-CGOm7d7-UKg0W-OoWAiuRBHe4mjlRgMQXIHuLm6zi--i/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ls = { get(k, d){ try{ const v = localStorage.getItem('csa2_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem('csa2_' + k, JSON.stringify(v)); return true; }catch(e){ return false; } } };
const user = ls.get('user', ''), pass = ls.get('pass', ''), me = ls.get('teacher', '') || user, isAdm = !!ls.get('admin', false);

/* ---------- state (kept on this phone, works without internet) ---------- */
let EX = ls.get('dut_cur', null);          // { id, title, rows:[{dt, iso, day, time, cls, sub, room, staff}], saved, sheet }
let PAIRS = ls.get('dut_names', []);       // [[name as written, standard name]] — same idea as the old "names" sheet
let CTS = (c => c && c.user === user ? c : null)(ls.get('dut_cts', null));   // app teachers (names + WhatsApp) from the server
let V = { tab: ls.get('dut_tab', 'teachers'), q: '', sort: 'name', daysOnly: false, roomPage: true, msg: '', err: '', busy: '' };
let C = null;                              // worked-out lists (built from EX)

function saveLocal(){ if(EX) EX.saved = false; ls.set('dut_cur', EX); C = null; }
const newId = () => 'D' + Date.now().toString(36).toUpperCase();

async function api(payload, ms = 120000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(API, { method:'POST', body:JSON.stringify({ username:user, password:pass, ...payload }), signal:ctl.signal, redirect:'follow' });
    const txt = await r.text(); let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('The server sent a web page instead of data. Check the deployment.'); }
    if(j && j.error === 'UNKNOWN_ACTION') throw new Error('The server does not know this yet: paste Duties.gs, add the dut_ line in doPost and deploy a new version.');
    if(j && j.error === 'BAD_LOGIN') throw new Error('Your saved login was refused. Open the app, sign out and sign in again.');
    if(j && j.ok === false) throw new Error(j.error || 'Server error');
    return j;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('The server took too long. Try again.');
    if(e instanceof TypeError) throw new Error(navigator.onLine ? 'The Apps Script server did not answer. Try again in a minute.' : 'No internet. Everything else on this page works offline.');
    throw e;
  }finally{ clearTimeout(t); }
}

/* =====================================================================
   1) READING THE WORD TABLE  (pasted HTML, .docx file, or tab text from a sheet)
   Merged cells are copied into every cell they cover — same as the old optimizeExpandMergedCells.
   ===================================================================== */
function cellText(el){
  const c = el.cloneNode(true);
  c.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
  c.querySelectorAll('p,div,li,h1,h2,h3,h4,h5,h6').forEach(p => p.append('\n'));
  return tidy(c.textContent);
}
const tidy = s => String(s || '').replace(/\u00a0/g, ' ').split(/\r?\n/).map(l => l.replace(/[ \t]+/g, ' ').trim()).filter(Boolean).join('\n');

function htmlGrids(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const tables = [...doc.querySelectorAll('table')].filter(t => !t.parentElement.closest('table'));
  let title = '';
  for(const p of doc.body.querySelectorAll('p,h1,h2,h3')){ if(p.closest('table')) break; const t = tidy(p.textContent); if(t){ title = t.split('\n')[0]; break; } }
  const grids = tables.map(t => {
    const g = [], rows = [...t.rows];
    rows.forEach((tr, r) => {
      g[r] = g[r] || []; let c = 0;
      [...tr.cells].forEach(td => {
        while(g[r][c] !== undefined) c++;
        const rs = Math.max(1, td.rowSpan || 1), cs = Math.max(1, td.colSpan || 1), v = cellText(td);
        for(let i = 0; i < rs && r + i < rows.length; i++){ g[r + i] = g[r + i] || []; for(let j = 0; j < cs; j++) g[r + i][c + j] = v; }
        c += cs;
      });
    });
    return g.map(row => Array.from(row, v => v || ''));
  });
  return { grids, title };
}

/* .docx = a zip; the browser itself unpacks word/document.xml (no library, works offline) */
async function unzipText(buf, name){
  const dv = new DataView(buf); let e = buf.byteLength - 22;
  while(e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if(e < 0) throw new Error('This is not a .docx file. In Word use File > Save As > Word Document (.docx), or copy the table and paste it.');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const dec = new TextDecoder();
  for(let i = 0; i < n; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const fname = dec.decode(new Uint8Array(buf, p + 46, nl));
    if(fname === name){
      const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true), data = new Uint8Array(buf, start, size);
      if(method === 0) return dec.decode(data);
      if(typeof DecompressionStream === 'undefined') throw new Error('This browser cannot open .docx files. Update Chrome, or copy the table in Word and paste it here.');
      return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    }
    p += 46 + nl + el + cl;
  }
  throw new Error('No Word text found in this file.');
}
async function docxGrids(file){
  const xml = await unzipText(await file.arrayBuffer(), 'word/document.xml');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const kids = (el, tag) => [...el.childNodes].filter(k => k.nodeName === tag);
  const val = (el, tag) => { const pr = kids(el, tag.split('/')[0])[0]; if(!pr) return null; const x = kids(pr, tag.split('/')[1])[0]; return x ? (x.getAttribute('w:val') || '') : null; };
  const paraText = p => { let s = ''; p.querySelectorAll('*').forEach(n => { if(n.nodeName === 'w:t') s += n.textContent; else if(n.nodeName === 'w:tab') s += ' '; else if(n.nodeName === 'w:br' || n.nodeName === 'w:cr') s += '\n'; }); return s; };
  const cellTxt = tc => tidy([...tc.getElementsByTagName('w:p')].filter(p => p.parentNode.closest ? true : true).map(paraText).join('\n'));
  const body = doc.getElementsByTagName('w:body')[0];
  let title = '';
  for(const n of body.childNodes){ if(n.nodeName === 'w:tbl') break; if(n.nodeName === 'w:p'){ const t = tidy(paraText(n)); if(t){ title = t.split('\n')[0]; break; } } }
  const tables = [...doc.getElementsByTagName('w:tbl')].filter(t => { let p = t.parentNode; while(p){ if(p.nodeName === 'w:tbl') return false; p = p.parentNode; } return true; });
  const grids = tables.map(t => {
    const g = [];
    kids(t, 'w:tr').forEach((tr, r) => {
      const row = []; let c = Number(val(tr, 'w:trPr/w:gridBefore')) || 0;
      for(let k = 0; k < c; k++) row[k] = '';
      const cells = []; tr.childNodes.forEach(n => { if(n.nodeName === 'w:tc') cells.push(n); else if(n.nodeName === 'w:sdt'){ n.getElementsByTagName('w:tc').length && cells.push(...n.getElementsByTagName('w:tc')); } });
      cells.forEach(tc => {
        const span = Number(val(tc, 'w:tcPr/w:gridSpan')) || 1, vm = val(tc, 'w:tcPr/w:vMerge');
        const v = vm !== null && vm !== 'restart' ? ((g[r - 1] || [])[c] || '') : cellTxt(tc);   // vMerge "continue" = same as the cell above
        for(let j = 0; j < span; j++) row[c + j] = v;
        c += span;
      });
      g[r] = Array.from(row, v => v || '');
    });
    return g;
  });
  return { grids, title };
}

/* tab text (copied from Google Sheets / Excel). Cells with line breaks come in "quotes". */
function tsvGrid(text){
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; continue; }
    if(ch === '"' && cur === '') q = true;
    else if(ch === '\t'){ row.push(tidy(cur)); cur = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; row.push(tidy(cur)); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if(cur || row.length){ row.push(tidy(cur)); rows.push(row); }
  return rows;
}

/* ---------- dates: "12/02/2026 Thursday", "Thursday 12-02-2026", "12 Feb 2026" … (day first, as in Pakistan) ---------- */
const MON = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pad = n => String(n).padStart(2, '0');
function parseDate(s){
  const t = String(s || '').replace(/\s+/g, ' ');
  let d, m, y, r;
  if((r = t.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/))){ d = +r[1]; m = +r[2]; y = +r[3]; if(m > 12 && d <= 12) [d, m] = [m, d]; }
  else if((r = t.match(/(\d{1,2})(?:st|nd|rd|th)?[\s\-,]*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?[\s,\-]*(\d{4})?/i))){ d = +r[1]; m = MON.indexOf(r[2].toLowerCase()) + 1; y = +(r[3] || new Date().getFullYear()); }
  else if((r = t.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?/i))){ d = +r[2]; m = MON.indexOf(r[1].toLowerCase()) + 1; y = +(r[3] || new Date().getFullYear()); }
  const dm = t.match(/\b(mon|tues?|wed(?:nes)?|thu(?:rs)?|fri|sat(?:ur)?|sun)(?:day)?\b/i);
  const tm = t.match(/(morning|evening|afternoon|(?:1st|2nd|first|second)\s*shift|\d{1,2}[:.]\d{2}\s*(?:am|pm)?(?:\s*(?:-|to)\s*\d{1,2}[:.]\d{2}\s*(?:am|pm)?)?)/i);
  const out = { iso:'', dt:'', day: dm ? DAYS.find(x => x.toLowerCase().startsWith(dm[1].toLowerCase().slice(0, 3))) : '', time: tm ? tm[1] : '' };
  if(d && m){
    if(y < 100) y += 2000;
    const D = new Date(y, m - 1, d);
    if(D.getMonth() === m - 1 && D.getDate() === d){ out.iso = y + '-' + pad(m) + '-' + pad(d); out.dt = pad(d) + '/' + pad(m) + '/' + y; out.day = DAYS[D.getDay()]; }
  }
  return out;
}

/* ---------- columns: found from the header row (Date/Day, Class, Subject, Room, Staff on Duty …) ---------- */
const HEAD_RX = /^(date\s*[\/&-]?\s*day|day\s*[\/&-]?\s*date|date|day|class(es)?|class\s*[\/&-]\s*section|programs?|sections?|subjects?|papers?|rooms?(\s*no\.?)?|room\s*#|halls?|venue|staff(\s*on\s*duty)?|invigilators?|invigilation(\s*staff)?|duty(\s*staff)?|teachers?(\s*on\s*duty)?|supervisors?|time|timing|shift|session|s\.?\s*no\.?|sr\.?\s*(no\.?)?|#)$/i;
const isHeader = cells => cells.filter(c => HEAD_RX.test(String(c).trim())).length >= 2;
function headerCols(cells){
  const col = {};
  cells.forEach((c, i) => {
    const t = String(c).toLowerCase().trim(); if(!t) return;
    const put = f => { if(col[f] === undefined) col[f] = i; };
    if(/date|day/.test(t)) put('date');
    else if(/class|program|section/.test(t)) put('cls');
    else if(/subject|paper/.test(t)) put('sub');
    else if(/room|hall|venue/.test(t)) put('room');
    else if(/staff|invigil|duty|teacher|supervis/.test(t)) put('staff');
    else if(/time|shift|session/.test(t)) put('time');
  });
  return col;
}
const DEF_COLS = { date:0, cls:1, sub:2, room:3, staff:4 };

function gridsToRows(grids){
  const out = []; let col = null, cur = { dt:'', iso:'', day:'', time:'' }, block = 0, title = '';
  const backfill = () => { for(let k = block; k < out.length; k++) if(!out[k].iso){ out[k].iso = cur.iso; out[k].dt = cur.dt; out[k].day = cur.day; if(!out[k].time) out[k].time = cur.time; } };
  grids.forEach(g => g.forEach(cells => {
    cells = cells.map(c => String(c || '').trim());
    const filled = cells.filter(Boolean); if(!filled.length) return;
    if(isHeader(cells)){ col = headerCols(cells); cur = { dt:'', iso:'', day:'', time:'' }; block = out.length; return; }   // new Date/Day block
    if(new Set(filled).size === 1 && (filled.length > 1 || cells.length === 1 || !col)){         // a line across the whole table: title or a date line
      const p = parseDate(filled[0]);
      if(p.iso){ cur = p; backfill(); } else if(!title && !out.length) title = filled[0].split('\n')[0];
      return;
    }
    const c = col || DEF_COLS, v = f => c[f] === undefined ? '' : (cells[c[f]] || '');
    const dcell = v('date');
    if(dcell){ const p = parseDate(dcell); if(p.iso && p.iso !== cur.iso){ cur = p; backfill(); } else if(!p.iso && p.day && !cur.iso) cur.day = p.day; }
    const row = { dt:cur.dt, iso:cur.iso, day:cur.day, time:v('time') || cur.time, cls:v('cls'), sub:v('sub'), room:v('room'), staff:v('staff') };
    if(!(row.cls || row.sub || row.room || row.staff)) return;                                      // only the date column filled
    out.push(row);
  }));
  // a block whose date came after its first rows: fill those too (the old fillDateDayAnywhereComplete)
  let last = null; for(let k = out.length - 1; k >= 0; k--){ if(out[k].iso) last = out[k]; else if(last){ out[k].iso = last.iso; out[k].dt = last.dt; out[k].day = last.day; } }
  return { rows: out, title };
}

/* =====================================================================
   2) TEACHER NAMES  (the old extractTeachers + formatTeacherNames + replaceTeacherNames)
   ===================================================================== */
const TITLE_SPLIT = /(?=\b(?:ms|mrs|miss|dr|mr|prof|madam)\b\.?\s*[a-z])/i;
const nkey = s => String(s || '').toLowerCase().replace(/\b(ms|mrs|miss|dr|mr|prof|madam)\b\.?/g, ' ').replace(/[^a-z]/g, '');
function cleanName(raw){
  let s = String(raw || '').replace(/\(.*?\)/g, ' ').replace(/^[\s\d.)\-–:*•#]+/, '').replace(/[\s\d.(\-–:*•#]+$/, '').replace(/\s+/g, ' ').trim();
  s = s.replace(/^(ms|mrs|dr|mr|prof)\b\.?\s*/i, (m, t) => t[0].toUpperCase() + t.slice(1).toLowerCase() + '. ').replace(/^(miss|madam)\b\.?\s*/i, (m, t) => t[0].toUpperCase() + t.slice(1).toLowerCase() + ' ');
  const tm = s.match(/^((?:Ms|Mrs|Dr|Mr|Prof)\. |Miss |Madam )?(.*)$/), body = tm[2];
  const fixed = (body === body.toUpperCase() ? body.toLowerCase() : body).replace(/(^|[\s\-])([a-z])/g, (m, p, l) => p + l.toUpperCase());
  return ((tm[1] || '') + fixed).replace(/\.\s*\./g, '.').trim();
}
function splitStaff(raw){
  let s = String(raw || '').replace(/\u00a0/g, ' ').replace(/([a-z])(Ms|Mrs|Miss|Dr|Prof)\b\.?/g, '$1 $2 ');   // "dr.HamidaMs Fazeela" -> "dr.Hamida Ms Fazeela"
  let parts;
  if(/\b(ms|mrs|miss|dr|mr|prof|madam)\b\.?\s*[a-z]/i.test(s)){
    s = s.replace(/[\n,;&\/|+]+/g, ' ').replace(/\band\b/gi, ' ');
    parts = s.split(TITLE_SPLIT);
    if(parts.length && !TITLE_SPLIT.test(parts[0]) && !/^(ms|mrs|miss|dr|mr|prof|madam)\b/i.test(parts[0].trim())){   // words before the first Ms./Dr.
      const pre = parts[0].replace(/[^a-z ]/gi, ' ').trim();
      if(pre.length < 3 || /:|staff|duty|invigil/i.test(parts[0])) parts.shift();
    }
  } else parts = s.split(/[\n,;&\/|+]+|\band\b/i);
  const seen = new Set();
  return parts.map(cleanName).filter(n => { const k = nkey(n); if(k.length < 2 || seen.has(k) || /^(staff|onduty|duty|invigilators?|nil|none|na)$/.test(k)) return false; seen.add(k); return true; });
}
let _ix = null, _ixAt = -1;
function nameIndex(){
  const at = (CTS && CTS.at || 0) + ':' + PAIRS.length + ':' + JSON.stringify(PAIRS).length;
  if(_ix && _ixAt === at) return _ix;
  const map = {}, ct = {};
  PAIRS.forEach(p => { const k = nkey(p[0]); if(k && String(p[1] || '').trim()) map[k] = String(p[1]).trim(); });
  ((CTS && CTS.list) || []).forEach(c => { const k = nkey(c.name); if(k && !ct[k]) ct[k] = c; });
  _ixAt = at; return (_ix = { map, ct });
}
function stdName(n){
  const I = nameIndex(), k = nkey(n);
  if(I.map[k]) return I.map[k];
  if(I.ct[k]) return I.ct[k].name;
  return n;
}
const contactOf = name => nameIndex().ct[nkey(name)] || null;


/* =====================================================================
   3) THE LISTS — teacher / room / date / class / subject wise.
   One duty = teacher + date + time + room (two classes in one room = one duty).
   ===================================================================== */
const ncmp = (a, b) => String(a).localeCompare(String(b), undefined, { numeric:true, sensitivity:'base' });
const dayShort = d => String(d || '').slice(0, 3);
const roomLbl = r => !r ? '—' : /^(room|hall|lab|library|auditorium|mini|s\.?h|chem|bio|phy|comp)/i.test(r) ? r : 'Room# ' + r;
const fmtIso = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
const hasTime = () => !!(EX && EX.rows.some(r => r.time));
const TITLED = /^(Ms|Mrs|Dr|Mr|Prof)\. |^Miss /;
const bySlot = (a, b) => ncmp(a.iso || '9', b.iso || '9') || ncmp(a.time || '', b.time || '');
const KINDS = {
  teacher: { tab:'Teacher-wise', file:'TEACHER_WISE_DUTY_LIST', cols:['date', 'room', 'cls', 'sub', 'staff'] },
  room:    { tab:'Room-wise',    file:'ROOM_WISE_DUTY_LIST',    cols:['date', 'cls', 'sub', 'staff'] },
  date:    { tab:'Date-wise',    file:'DATE_WISE_DUTY_LIST',    cols:['room', 'cls', 'sub', 'staff'] },
  class:   { tab:'Class-wise',   file:'CLASS_WISE_DUTY_LIST',   cols:['room', 'date', 'sub', 'staff'] },
  subject: { tab:'Subject-wise', file:'SUBJECT_WISE_DUTY_LIST', cols:['room', 'date', 'cls', 'staff'] }
};
const COLNAME = { date:'DATE/DAY', time:'TIME', room:'ROOM', cls:'CLASS', sub:'SUBJECT', staff:'STAFF ON DUTY' };
function colsOf(kind){ const c = KINDS[kind].cols.slice(); if(hasTime() && kind !== 'date'){ const i = c.indexOf('date'); c.splice(i + 1, 0, 'time'); } return c; }
const cellOf = (it, c) => c === 'date' ? (it.dt || '?') + (it.day ? ' ' + it.day : '') : c === 'time' ? it.time || '' : c === 'room' ? it.room || '—' : c === 'cls' ? it.cls.join(', ') : c === 'sub' ? it.sub.join(', ') : it.staff.join(', ');

function merge(list, keyFn){
  const m = {};
  list.forEach(r => {
    const k = keyFn(r), it = (m[k] = m[k] || { iso:r.iso, dt:r.dt, day:r.day, time:r.time, room:r.room, cls:[], sub:[], staff:[], x:false });
    if(r.cls && !it.cls.includes(r.cls)) it.cls.push(r.cls);
    if(r.sub && !it.sub.includes(r.sub)) it.sub.push(r.sub);
    r.staff.forEach(n => { if(!it.staff.some(z => nkey(z) === nkey(n))) it.staff.push(n); });
  });
  return Object.values(m).sort((a, b) => bySlot(a, b) || ncmp(a.room || 'zzz', b.room || 'zzz'));
}
function compute(){
  if(C) return C;
  const rows = EX ? EX.rows : [], check = { noRoom:[], noStaff:[], noDate:[] }, variants = {};
  const recs = rows.map((r, i) => {
    const seen = new Set(), staff = [];
    splitStaff(r.staff).forEach(n => {
      const k = nkey(n); (variants[k] = variants[k] || { k, names:new Set(), n:0 }).names.add(n); variants[k].n++;
      const s = stdName(n), sk = nkey(s) || s; if(seen.has(sk)) return; seen.add(sk); staff.push(s);
    });
    if(r.staff && !r.room) check.noRoom.push(i);
    if(!r.staff && (r.room || r.cls)) check.noStaff.push(i);
    if(!r.iso) check.noDate.push(i);
    return { iso:r.iso, dt:r.dt, day:r.day, time:r.time || '', room:r.room || '', cls:r.cls || '', sub:r.sub || '', staff };
  });
  const slot = r => (r.iso || '?') + '|' + r.time, rkey = s => String(s || '').toUpperCase().replace(/\s+/g, '').replace(/^ROOM#?/, '');
  const grp = (keyFn, labelFn, mergeKey) => {
    const g = {};
    recs.forEach(r => { const k = keyFn(r); if(k == null) return; (g[k] = g[k] || { key:k, label:labelFn(r), recs:[] }).recs.push(r); });
    return Object.values(g).map(x => ({ key:x.key, label:x.label, items:merge(x.recs, mergeKey) }));
  };
  // teacher-wise (a teacher appears in every row she is written in)
  const T = {};
  recs.forEach(r => r.staff.forEach(n => { const k = nkey(n) || n; const t = (T[k] = T[k] || { key:k, label:n, recs:[] }); if(!TITLED.test(t.label) && TITLED.test(n)) t.label = n; t.recs.push(r); }));
  const teacher = Object.values(T).map(t => {
    const items = merge(t.recs, r => slot(r) + '|' + rkey(r.room)), cnt = {};
    items.forEach(d => { const k = slot(d); cnt[k] = (cnt[k] || 0) + 1; });
    items.forEach(d => { d.x = !!d.iso && cnt[slot(d)] > 1; });            // same day & time in two rooms = clash
    return { key:t.key, label:t.label, items, clash:items.filter(d => d.x).length };
  });
  const L = {
    teacher,
    room: grp(r => rkey(r.room) || '—', r => r.room ? roomLbl(r.room) : 'No room', r => slot(r)).sort((a, b) => ncmp(a.key, b.key)),
    date: grp(r => slot(r), r => (r.dt ? r.dt + ' ' + r.day : 'No date') + (r.time ? ' · ' + r.time : ''), r => rkey(r.room)).sort((a, b) => ncmp(a.key, b.key)),
    class: grp(r => r.cls ? r.cls.toUpperCase().replace(/\s+/g, '') : null, r => r.cls, r => slot(r) + '|' + rkey(r.room)).sort((a, b) => ncmp(a.label, b.label)),
    subject: grp(r => r.sub ? r.sub.toUpperCase().replace(/[^A-Z0-9]/g, '') : null, r => r.sub, r => slot(r) + '|' + rkey(r.room)).sort((a, b) => ncmp(a.label, b.label))
  };
  L.date.forEach(g => g.items.sort((a, b) => ncmp(a.room || 'zzz', b.room || 'zzz')));
  const dates = [...new Set(recs.map(r => r.iso).filter(Boolean))].sort();
  let missing = [], unknown = [];
  if(CTS && CTS.list && CTS.list.length){
    const have = new Set(teacher.map(t => nkey(t.label)));
    missing = CTS.list.filter(c => !have.has(nkey(c.name)) && !/visit/i.test(c.status || '')).map(c => c.name).sort(ncmp);
    unknown = teacher.filter(t => !contactOf(t.label)).map(t => t.label).sort(ncmp);
  }
  return (C = { L, recs, dates, check, variants:Object.values(variants), missing, unknown, clashes:teacher.filter(t => t.clash), duties:teacher.reduce((s, t) => s + t.items.length, 0) });
}
const tSort = (a, b) => V.sort === 'few' ? a.items.length - b.items.length || ncmp(nkey(a.label), nkey(b.label)) : V.sort === 'many' ? b.items.length - a.items.length || ncmp(nkey(a.label), nkey(b.label)) : ncmp(nkey(a.label), nkey(b.label));
function groups(kind){ const g = compute().L[kind].slice(); return kind === 'teacher' ? g.sort(tSort) : g; }
/* the two short lists of the old sheets */
const dateDay = d => (d.dt || '?') + (d.day ? ' ' + d.day : '');
function summaryDates(){ return groups('teacher').slice().sort((a, b) => ncmp(nkey(a.label), nkey(b.label))).map(t => [t.label, t.items.map(dateDay).join(',  ')]); }   // Teacher | DAY/DATE
function summaryCount(){ return groups('teacher').slice().sort((a, b) => a.items.length - b.items.length || ncmp(nkey(a.label), nkey(b.label))).map(t => [t.label, t.items.map(d => d.iso ? d.iso.slice(8) : '?').join(', '), t.items.length]); }   // Teacher | Duties | Total Duties
const dutyFull = d => `${dateDay(d)}${d.time ? ' (' + d.time + ')' : ''} · ${roomLbl(d.room)}${d.cls.length ? ' · ' + d.cls.join(', ') : ''}${d.sub.length ? ' (' + d.sub.join(', ') + ')' : ''}`;

function lev(a, b){ if(Math.abs(a.length - b.length) > 3) return 9; const d = Array.from({ length:a.length + 1 }, (_, i) => [i]); for(let j = 1; j <= b.length; j++) d[0][j] = j; for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }
function suggest(k){
  let best = null, bd = 9;
  (CTS.list || []).forEach(c => { const ck = nkey(c.name); if(!ck) return; let d = lev(k, ck); if(d > 2 && k.length >= 4 && (ck.startsWith(k) || k.startsWith(ck) || ck.endsWith(k))) d = 2; if(d < bd){ bd = d; best = c.name; } });
  return bd <= 2 ? best : null;
}

/* ---------- reading ---------- */
function useParsed(res, how){
  const { rows, title } = res;
  if(!rows.length){ V.err = 'No duty rows found. Copy the whole table (with the Date/Day · Class · Subject · Room · Staff on Duty heading) and try again.'; V.msg = ''; return render(); }
  const ti = ($('#iTitle') || {}).value;
  EX = { id:newId(), title:(ti && ti.trim()) || title || 'Duty list', rows, saved:false, timing:(EX && EX.timing) || '08:30-12:30 PM (morning)' };
  if(title && /duty|detention|exam|test/i.test(title) && (!ti || /^Detention Exam \d{4}$/.test(ti))) EX.title = title;
  ls.set('dut_cur', EX); C = null;
  const c = compute();
  V.err = ''; V.busy = ''; V.msg = `Read ${rows.length} rows ${how}: ${c.L.teacher.length} teachers, ${c.L.room.length} rooms, ${c.dates.length} days.` + (c.clashes.length ? ` ${c.clashes.length} clash(es) — see Check.` : '');
  V.tab = 'teacher'; render();
  if(!CTS && navigator.onLine) loadCts(true);
}
function readPasted(html, text){
  try{
    if(html && /<table/i.test(html)){ const g = htmlGrids(html); const r = gridsToRows(g.grids); r.title = r.title || g.title; return useParsed(r, 'from the pasted table'); }
    if(text && /\t/.test(text)){ return useParsed(gridsToRows([tsvGrid(text)]), 'from the pasted sheet'); }
    V.err = 'The pasted text has no table. In Word click inside the table, use the little square at its top-left corner to select all of it, copy, then paste here. Or open the .docx file.'; render();
  }catch(e){ V.err = 'Could not read the table: ' + e.message; render(); }
}
$('#fDoc').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  if(/\.doc$/i.test(f.name)){ V.err = 'Old .doc files cannot be opened. In Word use File > Save As > Word Document (.docx), or copy the table and paste it.'; return render(); }
  V.busy = 'Reading ' + f.name + '…'; V.err = V.msg = ''; render();
  try{ const g = await docxGrids(f); const r = gridsToRows(g.grids); r.title = r.title || g.title; useParsed(r, 'from ' + f.name); }
  catch(err){ V.busy = ''; V.err = err.message; render(); }
};

function waLink(c){
  if(!c) return '';
  if(/^https?:/i.test(c.wa || '')) return c.wa;
  let d = String(c.wa || '').replace(/\D/g, '') || String(c.phone || '').replace(/\D/g, '');
  if(/^0\d{10}$/.test(d)) d = '92' + d.slice(1); else if(/^3\d{9}$/.test(d)) d = '92' + d;
  return d ? 'https://wa.me/' + d : '';
}

/* =====================================================================
   5) PDF + EXCEL  — real files named with today's date, e.g. TEACHER_WISE_DUTY_LIST_07-11-2026.pdf
   Same PDF/Excel tools and offline cache as the attendance app.

const PDF_CACHE = 'jcw-pdf-tools-v1';
const LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'];
const XLSX_LIB = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js';
function addScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => { s.remove(); rej(new Error('not loaded')); }; document.head.appendChild(s); }); }
async function loadScript(src){
  try{ const r = window.caches && await (await caches.open(PDF_CACHE)).match(src); if(r){ const u = URL.createObjectURL(new Blob([await r.text()], { type:'text/javascript' })); try{ await addScript(u); return; } finally { setTimeout(() => URL.revokeObjectURL(u), 5000); } } }catch(e){}
  try{ await addScript(src); }catch(e){ throw new Error('The PDF/Excel tools could not be loaded. Open this page once with internet, then they also work offline.'); }
  try{ window.caches && (await caches.open(PDF_CACHE)).add(src).catch(() => {}); }catch(e){}
}
const pdfReady = () => !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable);
let libP = null;
function pdfLibs(){ if(pdfReady()) return Promise.resolve(); if(!libP) libP = (window.jspdf ? Promise.resolve() : loadScript(LIBS[0])).then(() => pdfReady() ? null : loadScript(LIBS[1])).catch(e => { libP = null; throw e; }); return libP; }
function xlsxLib(){ return window.XLSX && window.XLSX.utils ? Promise.resolve() : loadScript(XLSX_LIB); }
let LOGO = null;

const stamp = () => { const d = new Date(); return pad(d.getDate()) + '-' + pad(d.getMonth() + 1) + '-' + d.getFullYear(); };
const fileName = (kind, ext) => (KINDS[kind] ? KINDS[kind].file : kind === 'sumdates' ? 'TEACHER_DAY_DATE_LIST' : kind === 'sumcount' ? 'TEACHER_TOTAL_DUTIES' : 'DUTY_LISTS') + '_' + stamp() + '.' + ext;
const longDate = () => new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
const BROWN = [107, 52, 35], BR2 = [138, 74, 53], TEA = [231, 183, 174], SOFT = [251, 237, 234], INK = [43, 25, 18], LINE = [226, 192, 184], RED = [200, 30, 30], MUT = [124, 97, 89], GOLD = [201, 151, 63];

/* page band (every page) */
function band(doc, kindTitle){
  const W = doc.internal.pageSize.getWidth();
  doc.setFillColor(...BROWN); doc.rect(0, 0, W, 24, 'F');
  doc.setFillColor(...BR2); doc.triangle(W - 90, 0, W, 0, W, 24, 'F');
  doc.setFillColor(...GOLD); doc.rect(0, 24, W, 1.2, 'F');
  if(LOGO){ doc.setFillColor(255, 255, 255); doc.circle(19, 12, 9.2, 'F'); try{ doc.addImage(LOGO, 'PNG', 11, 4, 16, 16, 'jcwlogo', 'FAST'); }catch(e){} }
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.text('JINNAH COLLEGE FOR WOMEN', 33, 11.5);
  doc.setFontSize(10.5); doc.setTextColor(...TEA); doc.text('FACULTY DUTY LIST  ·  ' + kindTitle.toUpperCase(), 33, 18.5);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(255, 255, 255);
  doc.text(doc.splitTextToSize(EX.title || '', 80)[0] || '', W - 10, 11.5, { align:'right' });
  doc.setFontSize(8.5); doc.text('University of Peshawar', W - 10, 18.5, { align:'right' });
}
function footers(doc){
  const n = doc.getNumberOfPages(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), d = longDate();
  for(let i = 1; i <= n; i++){
    doc.setPage(i);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(10, H - 10, W - 10, H - 10);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...MUT);
    doc.text(d, 10, H - 5.5); doc.text('Page ' + i + ' of ' + n, W - 10, H - 5.5, { align:'right' });
    doc.text('Chief Proctor  ·  Jinnah College for Women', W / 2, H - 5.5, { align:'center' });
  }
}
/* group heading: name in a tea-pink pill, Duty Timings on the right (like the old Access reports) */
function gHead(doc, y, label, sub){
  const W = doc.internal.pageSize.getWidth();
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
  const w = Math.min(doc.getTextWidth(label) + 14, W - 130);
  doc.setFillColor(...SOFT); doc.setDrawColor(...TEA); doc.setLineWidth(0.6); doc.roundedRect(10, y, w, 11, 3, 3, 'FD');
  doc.setFillColor(...BROWN); doc.rect(10, y + 1.5, 1.6, 8, 'F');
  doc.setTextColor(...BROWN); doc.text(doc.splitTextToSize(label, w - 8)[0], 15, y + 7.8);
  if(sub){ doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...MUT); doc.text(sub, 10 + w + 4, y + 7.5); }
  const tm = EX.timing || '';
  if(tm){
    doc.setFontSize(10); doc.setFont('helvetica', 'bold'); const tw = doc.getTextWidth(tm);
    doc.setTextColor(...RED); doc.text(tm, W - 10, y + 7.5, { align:'right' });
    doc.setTextColor(...INK); doc.text('Duty Timings  ', W - 10 - tw, y + 7.5, { align:'right' });
  }
  return y + 14;
}
const tableStyle = (extra) => Object.assign({
  theme:'grid', margin:{ left:10, right:10, top:30, bottom:14 },
  styles:{ font:'helvetica', fontSize:9.5, cellPadding:{ top:2.2, bottom:2.2, left:2.5, right:2.5 }, textColor:INK, lineColor:LINE, lineWidth:0.25, valign:'middle', overflow:'linebreak' },
  headStyles:{ fillColor:BROWN, textColor:[255, 255, 255], fontStyle:'bold', fontSize:9.5, halign:'left', lineColor:BROWN },
  alternateRowStyles:{ fillColor:SOFT }, bodyStyles:{ fillColor:[255, 255, 255] }
}, extra);
const WIDTH = { '#':9, date:44, time:30, room:24, cls:34, sub:52 };      // staff takes the rest

async function buildPdf(kind, only){
  await pdfLibs(); await logo();
  const doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4', orientation:'landscape' }), H = doc.internal.pageSize.getHeight();
  const kt = KINDS[kind] ? KINDS[kind].tab + ' duty list' : kind === 'sumdates' ? 'Teacher · Day/Date' : 'Teacher · Total duties';
  doc.setProperties({ title:(EX.title || '') + ' — ' + kt, author:'Jinnah College for Women', creator:'JCW attendance app' });
  const hook = { didDrawPage:() => band(doc, kt) };
  band(doc, kt);
  let y = 30;
  if(KINDS[kind]){
    const G = only || groups(kind), cols = colsOf(kind);
    const colStyles = { 0:{ cellWidth:WIDTH['#'], halign:'center', fontStyle:'bold', textColor:BROWN } };
    cols.forEach((c, i) => { if(WIDTH[c]) colStyles[i + 1] = { cellWidth:WIDTH[c] }; if(c === 'room' || c === 'date') colStyles[i + 1] = Object.assign(colStyles[i + 1] || {}, { fontStyle:'bold' }); });
    G.forEach((g, gi) => {
      if(gi > 0){ if(V.newPage || y > H - 45){ doc.addPage(); band(doc, kt); y = 30; } else y += 6; }
      const sub = g.items.length + (kind === 'teacher' ? ' dut' + (g.items.length === 1 ? 'y' : 'ies') + (g.clash ? '  ·  clash shown in red' : '') : ' paper' + (g.items.length === 1 ? '' : 's'));
      y = gHead(doc, y, g.label, sub);
      doc.autoTable(tableStyle({
        startY:y, head:[['#', ...cols.map(c => COLNAME[c])]],
        body:g.items.map((it, i) => [i + 1, ...cols.map(c => cellOf(it, c))]),
        columnStyles:colStyles, ...hook,
        didParseCell:h => { if(h.section === 'body' && g.items[h.row.index] && g.items[h.row.index].x){ h.cell.styles.textColor = RED; h.cell.styles.fontStyle = 'bold'; } }
      }));
      y = doc.lastAutoTable.finalY;
    });
  } else {
    const W = doc.internal.pageSize.getWidth();
    if(kind === 'sumdates'){
      const rows = summaryDates();
      y = gHead(doc, y, 'Teacher-wise duty dates', rows.length + ' teachers');
      doc.autoTable(tableStyle({ startY:y, head:[['#', 'Teacher', 'DAY/DATE']], body:rows.map((r, i) => [i + 1, r[0], r[1]]), columnStyles:{ 0:{ cellWidth:9, halign:'center', fontStyle:'bold', textColor:BROWN }, 1:{ cellWidth:55, fontStyle:'bold' } }, ...hook }));
    } else {
      const rows = summaryCount(), max = Math.max(1, ...rows.map(r => r[2]));
      y = gHead(doc, y, 'Teachers by number of duties', rows.length + ' teachers  ·  fewest first');
      doc.autoTable(tableStyle({ startY:y, head:[['#', 'Teacher', 'Duties (dates)', 'Total Duties']], body:rows.map((r, i) => [i + 1, r[0], r[1], r[2]]),
        columnStyles:{ 0:{ cellWidth:9, halign:'center', fontStyle:'bold', textColor:BROWN }, 1:{ cellWidth:62, fontStyle:'bold' }, 3:{ cellWidth:60, halign:'right', fontStyle:'bold' } }, ...hook,
        didDrawCell:h => { if(h.section === 'body' && h.column.index === 3){ const n = Number(h.cell.raw) || 0, bw = (h.cell.width - 14) * n / max; doc.setFillColor(...TEA); doc.roundedRect(h.cell.x + 2.5, h.cell.y + h.cell.height / 2 - 1.8, Math.max(bw, 1.5), 3.6, 1.5, 1.5, 'F'); } } }));
    }
    y = doc.lastAutoTable.finalY;
  }
  if(y > H - 34){ doc.addPage(); band(doc, kt); y = 30; }
  const W = doc.internal.pageSize.getWidth(); doc.setDrawColor(...INK); doc.setLineWidth(0.3); doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...INK);
  [['Chief Proctor', 30], ['Principal', W - 80]].forEach(([t, x]) => { doc.line(x, y + 20, x + 50, y + 20); doc.text(t, x + 25, y + 25, { align:'center' }); });
  footers(doc);
  return { blob:doc.output('blob'), name:fileName(kind, 'pdf') };
}
/* phone: share sheet (WhatsApp, Gmail, Drive…) · laptop: download */
function deliver(files){
  const F = files.map(f => new File([f.blob], f.name, { type:f.blob.type }));
  const down = () => F.forEach((f, i) => setTimeout(() => { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 8000); }, i * 600));
  const canShare = /Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files:F });
  $('#dlgIn').innerHTML = `<h2 style="margin:0 0 6px">${F.length === 1 ? 'File ready' : F.length + ' files ready'}</h2><div class="sub">${F.map(f => esc(f.name)).join('<br>')}</div><div class="acts">${canShare ? '<button class="btn pri" id="dSh">Share (WhatsApp, Gmail…)</button>' : ''}<button class="btn ${canShare ? '' : 'pri'}" id="dDn">Download</button><button class="btn" id="dClose">Close</button></div>`;
  if(!$('#dlg').open) $('#dlg').showModal();
  $('#dClose').onclick = () => $('#dlg').close();
  $('#dDn').onclick = () => { down(); $('#dlg').close(); };
  canShare && ($('#dSh').onclick = () => navigator.share({ files:F, title:EX.title }).catch(() => {}).finally(() => $('#dlg').close()));
}
async function onePdf(kind, btn){
  const t = btn && btn.textContent; if(btn){ btn.disabled = true; btn.textContent = 'Making…'; }
  try{ deliver([await buildPdf(kind)]); }catch(e){ alert(e.message); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = t; } }
}
async function allPdfs(){
  const b = $('#bAll'), t = b.textContent; b.disabled = true;
  try{
    const out = [], L = [...Object.keys(KINDS), 'sumdates', 'sumcount'];
    for(const k of L){ b.textContent = 'Making ' + (out.length + 1) + ' of ' + L.length + '…'; out.push(await buildPdf(k)); await new Promise(r => setTimeout(r, 30)); }
    deliver(out);
  }catch(e){ alert(e.message); }
  finally{ b.disabled = false; b.textContent = t; }
}
/* tables for Excel / Google Sheet */
function tableOf(kind){
  if(kind === 'sumdates') return { name:'Teacher DAY-DATE', rows:[['Teacher', 'DAY/DATE'], ...summaryDates()], red:[] };
  if(kind === 'sumcount') return { name:'Total Duties', rows:[['Teacher', 'Duties', 'Total Duties'], ...summaryCount()], red:[] };
  if(kind === 'rows') return { name:'All rows', rows:[['Date', 'Day', 'Time', 'Class', 'Subject', 'Room', 'Staff on duty (as written)', 'Teachers'], ...EX.rows.map(r => [r.dt, r.day, r.time, r.cls, r.sub, r.room, String(r.staff || '').replace(/\n/g, ', '), splitStaff(r.staff).map(stdName).join(', ')])], red:[] };
  const first = { teacher:'TEACHER', room:'ROOM', date:'DATE/DAY', class:'CLASS', subject:'SUBJECT' }[kind], cols = colsOf(kind);
  const rows = [[first, '#', ...cols.map(c => COLNAME[c])]], red = [];
  groups(kind).forEach(g => g.items.forEach((it, i) => { if(it.x) red.push(rows.length); rows.push([i ? '' : g.label, i + 1, ...cols.map(c => cellOf(it, c))]); }));
  return { name:KINDS[kind].tab, rows, red };
}
const ALL_TABS = ['teacher', 'sumdates', 'sumcount', 'room', 'date', 'class', 'subject', 'rows'];
async function makeXlsx(){
  const b = $('#bXlsx'), t = b.textContent; b.disabled = true; b.textContent = 'Making…';
  try{
    await xlsxLib(); const X = window.XLSX, wb = X.utils.book_new();
    const bd = { style:'thin', color:{ rgb:'E2C0B8' } }, border = { top:bd, bottom:bd, left:bd, right:bd };
    ALL_TABS.map(tableOf).forEach(tb => {
      const n = Math.max(...tb.rows.map(r => r.length)), head = [['JINNAH COLLEGE FOR WOMEN — ' + (EX.title || '') + ' — ' + tb.name.toUpperCase()], ['Duty timings ' + (EX.timing || '') + ' · made ' + longDate()]];
      const ws = X.utils.aoa_to_sheet(head.concat(tb.rows));
      for(let r = 0; r < tb.rows.length + 2; r++) for(let c = 0; c < n; c++){
        const a = X.utils.encode_cell({ r, c }); if(!ws[a]) ws[a] = { t:'s', v:'' };
        const isRed = tb.red.includes(r - 2);
        ws[a].s = r === 0 ? { font:{ bold:true, sz:14, color:{ rgb:'6B3423' } } } : r === 1 ? { font:{ italic:true, sz:9, color:{ rgb:'7C6159' } } }
          : r === 2 ? { fill:{ patternType:'solid', fgColor:{ rgb:'6B3423' } }, font:{ bold:true, color:{ rgb:'FFFFFF' } }, alignment:{ vertical:'center', wrapText:true }, border }
          : { fill:{ patternType:'solid', fgColor:{ rgb:r % 2 ? 'FBEDEA' : 'FFFFFF' } }, font:{ color:{ rgb:isRed ? 'C81E1E' : '2B1912' }, bold:isRed || c === 0 }, alignment:{ vertical:'top', wrapText:true }, border };
      }
      ws['!merges'] = [{ s:{ r:0, c:0 }, e:{ r:0, c:n - 1 } }, { s:{ r:1, c:0 }, e:{ r:1, c:n - 1 } }];
      ws['!cols'] = Array.from({ length:n }, (_, c) => ({ wch:Math.min(60, Math.max(6, ...tb.rows.map(r => String(r[c] == null ? '' : r[c]).length + 2))) }));
      ws['!freeze'] = { xSplit:0, ySplit:3 };
      X.utils.book_append_sheet(wb, ws, tb.name.replace(/[\\/?*\[\]:]/g, ' ').slice(0, 31));
    });
    const out = X.write(wb, { bookType:'xlsx', type:'array' });
    deliver([{ blob:new Blob([out], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name:fileName('all', 'xlsx') }]);
  }catch(e){ alert(e.message); }
  finally{ b.disabled = false; b.textContent = t; }
}
async function makeSheet(){
  const b = $('#bSheet'); b.disabled = true; b.textContent = 'Making the Google Sheet…';
  try{
    const r = await api({ action:'dut_sheet', id:EX.id, title:EX.title + ' — Duty lists ' + stamp(), fileId:EX.sheet || '', tabs:ALL_TABS.map(tableOf) }, 180000);
    EX.sheet = r.fileId; EX.sheetUrl = r.url; ls.set('dut_cur', EX); V.msg = 'Google Sheet ready in the Drive folder “JCW Duty Lists”.'; V.err = '';
    window.open(r.url, '_blank', 'noopener');
  }catch(e){ V.err = 'Google Sheet not made: ' + e.message; V.msg = ''; }
  render();
}

render();
