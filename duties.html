<style>
:root{--bg:#F7EDEA;--surface:#fff;--surface2:#FBEDEA;--ink:#2B1912;--muted:#7C6159;--line:#E2C0B8;--brown:#6B3423;--tea:#E7B7AE;--good:#0E8A5F;--good-bg:#E3F4EC;--bad:#C0392B;--bad-bg:#FDE3E1;--mid:#B4740E;--mid-bg:#FFF2D6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A110F;--surface:#261915;--surface2:#30201B;--ink:#F6E9E5;--muted:#C4A8A0;--line:#4A3029;--tea:#8A5A50;--good-bg:#14302A;--bad-bg:#3A1C1F;--mid-bg:#3A2F14}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:40px}
button,select,input{font:inherit;color:inherit}
header{background:linear-gradient(120deg,#4A2418,#8A4A35);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px}
header .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:50%;background:#fff;padding:3px;flex:none}
header h1{margin:0;font-size:19px;line-height:1.2}
header small{display:block;opacity:.85;font-size:12.5px;font-weight:400}

.card{background:var(--surface);border:1.5px solid var(--line);border-top:5px solid var(--brown);border-radius:20px;padding:16px;margin-bottom:16px}

.sub{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
label.f input,label.f select,input.sq,select.sq{height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;background:var(--surface);font-size:15px;font-weight:600;color:var(--ink);width:100%}

.btn{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;padding:0 14px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

dialog{border:none;border-radius:18px;padding:0;max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink)}

<body>
<header><div class="in"><img src="jcw-logo.png" alt=""><h1>Exam duty lists<small>Teacher-wise · room-wise · day-wise, from the Word duty table</small></h1><a href="./">← App</a></div></header>
<main id="main"></main>
<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<input type="file" id="fDoc" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="hidden">
<script>
const API = 'https://script.google.com/macros/s/AKfycbzl-DwgASIhf-pIGYi9D3M-CGOm7d7-UKg0W-OoWAiuRBHe4mjlRgMQXIHuLm6zi--i/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ls = { get(k, d){ try{ const v = localStorage.getItem('csa2_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem('csa2_' + k, JSON.stringify(v)); return true; }catch(e){ return false; } } };
const user = ls.get('user', ''), pass = ls.get('pass', ''), me = ls.get('teacher', '') || user, isAdmin0 = !!ls.get('admin', false);
let isAdm = isAdmin0 || !!ls.get('dsAdmin', false);   // admin or DS ADMIN (role in the Users sheet) = duty operator
let roleChecked = false;

/* ---------- state (kept on this phone, works without internet) ---------- */
let EX = ls.get('dut_cur', null);          // { id, title, rows:[{dt, iso, day, time, cls, sub, room, staff}], saved, sheet }
let PAIRS = ls.get('dut_names', []);       // [[name as written, standard name]] — same idea as the old "names" sheet
let CTS = (c => c && c.user === user ? c : null)(ls.get('dut_cts', null));   // app teachers (names + WhatsApp) from the server
let V = { tab: ls.get('dut_tab', 'teachers'), q: '', sort: 'name', daysOnly: false, roomPage: true, msg: '', err: '', busy: '' };
let C = null;                              // worked-out lists (built from EX)

function saveLocal(){ if(EX) EX.saved = false; ls.set('dut_cur', EX); C = null; }
const newId = () => 'D' + Date.now().toString(36).toUpperCase();

async function api(payload, ms = 120000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(API, { method:'POST', body:JSON.stringify({ username:user, password:pass, ...payload }), signal:ctl.signal, redirect:'follow' });
    const txt = await r.text(); let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('The server sent a web page instead of data. Check the deployment.'); }
    if(j && j.error === 'UNKNOWN_ACTION') throw new Error('The server does not know this yet: paste Duties.gs, add the dut_ line in doPost and deploy a new version.');
    if(j && j.error === 'BAD_LOGIN') throw new Error('Your saved login was refused. Open the app, sign out and sign in again.');
    if(j && j.ok === false) throw new Error(j.error || 'Server error');
    return j;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('The server took too long. Try again.');
    if(e instanceof TypeError) throw new Error(navigator.onLine ? 'The Apps Script server did not answer. Try again in a minute.' : 'No internet. Everything else on this page works offline.');
    throw e;
  }finally{ clearTimeout(t); }
}

/* =====================================================================
   1) READING THE WORD TABLE  (pasted HTML, .docx file, or tab text from a sheet)
   Merged cells are copied into every cell they cover — same as the old optimizeExpandMergedCells.
   ===================================================================== */
function cellText(el){
  const c = el.cloneNode(true);
  c.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
  c.querySelectorAll('p,div,li,h1,h2,h3,h4,h5,h6').forEach(p => p.append('\n'));
  return tidy(c.textContent);
}
const tidy = s => String(s || '').replace(/\u00a0/g, ' ').split(/\r?\n/).map(l => l.replace(/[ \t]+/g, ' ').trim()).filter(Boolean).join('\n');

function htmlGrids(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const tables = [...doc.querySelectorAll('table')].filter(t => !t.parentElement.closest('table'));
  let title = '';
  for(const p of doc.body.querySelectorAll('p,h1,h2,h3')){ if(p.closest('table')) break; const t = tidy(p.textContent); if(t){ title = t.split('\n')[0]; break; } }
  const grids = tables.map(t => {
    const g = [], rows = [...t.rows];
    rows.forEach((tr, r) => {
      g[r] = g[r] || []; let c = 0;
      [...tr.cells].forEach(td => {
        while(g[r][c] !== undefined) c++;
        const rs = Math.max(1, td.rowSpan || 1), cs = Math.max(1, td.colSpan || 1), v = cellText(td);
        for(let i = 0; i < rs && r + i < rows.length; i++){ g[r + i] = g[r + i] || []; for(let j = 0; j < cs; j++) g[r + i][c + j] = v; }
        c += cs;
      });
    });
    return g.map(row => Array.from(row, v => v || ''));
  });
  return { grids, title };
}

/* .docx = a zip; the browser itself unpacks word/document.xml (no library, works offline) */
async function unzipText(buf, name){
  const dv = new DataView(buf); let e = buf.byteLength - 22;
  while(e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if(e < 0) throw new Error('This is not a .docx file. In Word use File > Save As > Word Document (.docx), or copy the table and paste it.');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const dec = new TextDecoder();
  for(let i = 0; i < n; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const fname = dec.decode(new Uint8Array(buf, p + 46, nl));
    if(fname === name){
      const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true), data = new Uint8Array(buf, start, size);
      if(method === 0) return dec.decode(data);
      if(typeof DecompressionStream === 'undefined') throw new Error('This browser cannot open .docx files. Update Chrome, or copy the table in Word and paste it here.');
      return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    }
    p += 46 + nl + el + cl;
  }
  throw new Error('No Word text found in this file.');
}
async function docxGrids(file){
  const xml = await unzipText(await file.arrayBuffer(), 'word/document.xml');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const kids = (el, tag) => [...el.childNodes].filter(k => k.nodeName === tag);
  const val = (el, tag) => { const pr = kids(el, tag.split('/')[0])[0]; if(!pr) return null; const x = kids(pr, tag.split('/')[1])[0]; return x ? (x.getAttribute('w:val') || '') : null; };
  const paraText = p => { let s = ''; p.querySelectorAll('*').forEach(n => { if(n.nodeName === 'w:t') s += n.textContent; else if(n.nodeName === 'w:tab') s += ' '; else if(n.nodeName === 'w:br' || n.nodeName === 'w:cr') s += '\n'; }); return s; };
  const cellTxt = tc => tidy([...tc.getElementsByTagName('w:p')].filter(p => p.parentNode.closest ? true : true).map(paraText).join('\n'));
  const body = doc.getElementsByTagName('w:body')[0];
  let title = '';
  for(const n of body.childNodes){ if(n.nodeName === 'w:tbl') break; if(n.nodeName === 'w:p'){ const t = tidy(paraText(n)); if(t){ title = t.split('\n')[0]; break; } } }
  const tables = [...doc.getElementsByTagName('w:tbl')].filter(t => { let p = t.parentNode; while(p){ if(p.nodeName === 'w:tbl') return false; p = p.parentNode; } return true; });
  const grids = tables.map(t => {
    const g = [];
    kids(t, 'w:tr').forEach((tr, r) => {
      const row = []; let c = Number(val(tr, 'w:trPr/w:gridBefore')) || 0;
      for(let k = 0; k < c; k++) row[k] = '';
      const cells = []; tr.childNodes.forEach(n => { if(n.nodeName === 'w:tc') cells.push(n); else if(n.nodeName === 'w:sdt'){ n.getElementsByTagName('w:tc').length && cells.push(...n.getElementsByTagName('w:tc')); } });
      cells.forEach(tc => {
        const span = Number(val(tc, 'w:tcPr/w:gridSpan')) || 1, vm = val(tc, 'w:tcPr/w:vMerge');
        const v = vm !== null && vm !== 'restart' ? ((g[r - 1] || [])[c] || '') : cellTxt(tc);   // vMerge "continue" = same as the cell above
        for(let j = 0; j < span; j++) row[c + j] = v;
        c += span;
      });
      g[r] = Array.from(row, v => v || '');
    });
    return g;
  });
  return { grids, title };
}

/* tab text (copied from Google Sheets / Excel). Cells with line breaks come in "quotes". */
function tsvGrid(text){
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; continue; }
    if(ch === '"' && cur === '') q = true;
    else if(ch === '\t'){ row.push(tidy(cur)); cur = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; row.push(tidy(cur)); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if(cur || row.length){ row.push(tidy(cur)); rows.push(row); }
  return rows;
}

/* ---------- dates: "12/02/2026 Thursday", "Thursday 12-02-2026", "12 Feb 2026" … (day first, as in Pakistan) ---------- */
const MON = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pad = n => String(n).padStart(2, '0');
function parseDate(s){
  const t = String(s || '').replace(/\s+/g, ' ');
  let d, m, y, r;
  if((r = t.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/))){ d = +r[1]; m = +r[2]; y = +r[3]; if(m > 12 && d <= 12) [d, m] = [m, d]; }
  else if((r = t.match(/(\d{1,2})(?:st|nd|rd|th)?[\s\-,]*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?[\s,\-]*(\d{4})?/i))){ d = +r[1]; m = MON.indexOf(r[2].toLowerCase()) + 1; y = +(r[3] || new Date().getFullYear()); }
  else if((r = t.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?/i))){ d = +r[2]; m = MON.indexOf(r[1].toLowerCase()) + 1; y = +(r[3] || new Date().getFullYear()); }
  const dm = t.match(/\b(mon|tues?|wed(?:nes)?|thu(?:rs)?|fri|sat(?:ur)?|sun)(?:day)?\b/i);
  const tm = t.match(/(morning|evening|afternoon|(?:1st|2nd|first|second)\s*shift|\d{1,2}[:.]\d{2}\s*(?:am|pm)?(?:\s*(?:-|to)\s*\d{1,2}[:.]\d{2}\s*(?:am|pm)?)?)/i);
  const out = { iso:'', dt:'', day: dm ? DAYS.find(x => x.toLowerCase().startsWith(dm[1].toLowerCase().slice(0, 3))) : '', time: tm ? tm[1] : '' };
  if(d && m){
    if(y < 100) y += 2000;
    const D = new Date(y, m - 1, d);
    if(D.getMonth() === m - 1 && D.getDate() === d){ out.iso = y + '-' + pad(m) + '-' + pad(d); out.dt = pad(d) + '/' + pad(m) + '/' + y; out.day = DAYS[D.getDay()]; }
  }
  return out;
}

/* ---------- columns: found from the header row (Date/Day, Class, Subject, Room, Staff on Duty …) ---------- */
const HEAD_RX = /^(date\s*[\/&-]?\s*day|day\s*[\/&-]?\s*date|date|day|class(es)?|class\s*[\/&-]\s*section|programs?|sections?|subjects?|papers?|rooms?(\s*no\.?)?|room\s*#|halls?|venue|staff(\s*on\s*duty)?|invigilators?|invigilation(\s*staff)?|duty(\s*staff)?|teachers?(\s*on\s*duty)?|supervisors?|time|timing|shift|session|s\.?\s*no\.?|sr\.?\s*(no\.?)?|#)$/i;
const isHeader = cells => cells.filter(c => HEAD_RX.test(String(c).trim())).length >= 2;
function headerCols(cells){
  const col = {};
  cells.forEach((c, i) => {
    const t = String(c).toLowerCase().trim(); if(!t) return;
    const put = f => { if(col[f] === undefined) col[f] = i; };
    if(/date|day/.test(t)) put('date');
    else if(/class|program|section/.test(t)) put('cls');
    else if(/subject|paper/.test(t)) put('sub');
    else if(/room|hall|venue/.test(t)) put('room');
    else if(/staff|invigil|duty|teacher|supervis/.test(t)) put('staff');
    else if(/time|shift|session/.test(t)) put('time');
  });
  return col;
}
const DEF_COLS = { date:0, cls:1, sub:2, room:3, staff:4 };

function gridsToRows(grids){
  const out = []; let col = null, cur = { dt:'', iso:'', day:'', time:'' }, block = 0, title = '';

    cells = cells.map(c => String(c || '').trim());
    const filled = cells.filter(Boolean); if(!filled.length) return;
    if(isHeader(cells)){ col = headerCols(cells); cur = { dt:'', iso:'', day:'', time:'' }; block = out.length; return; }   // new Date/Day block
    if(new Set(filled).size === 1 && (filled.length > 1 || cells.length === 1 || !col)){         // a line across the whole table: title or a date line
      const p = parseDate(filled[0]);
      if(p.iso){ cur = p; backfill(); } else if(!title && !out.length) title = filled[0].split('\n')[0];
      return;

    const dcell = v('date');
    if(dcell){ const p = parseDate(dcell); if(p.iso && p.iso !== cur.iso){ cur = p; backfill(); } else if(!p.iso && p.day && !cur.iso) cur.day = p.day; }
    const row = { dt:cur.dt, iso:cur.iso, day:cur.day, time:v('time') || cur.time, cls:v('cls'), sub:v('sub'), room:v('room'), staff:v('staff') };
    if(!(row.cls || row.sub || row.room || row.staff)) return;                                      // only the date column filled
    out.push(row);

  let last = null; for(let k = out.length - 1; k >= 0; k--){ if(out[k].iso) last = out[k]; else if(last){ out[k].iso = last.iso; out[k].dt = last.dt; out[k].day = last.day; } }

const rollParts = r => { const m = String(r).match(/^(.*?)(\d+)\s*$/); return m ? [m[1], +m[2], m[2]] : [String(r), 0, '']; };

  const isPdf = i => /\.pdf$/i.test(F[i].name);

  const row = (f, i) => `<div class="li" style="flex-wrap:wrap"><div style="flex:1;min-width:180px;font-weight:700;font-size:13.5px;word-break:break-all">${isPdf(i) ? '📄' : '📊'} ${esc(f.name)}<div class="sub">${Math.max(1, Math.round(f.size / 1024))} KB</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${isPdf(i) ? `<button class="btn sm" data-fo="${i}">Open</button><button class="btn sm" data-fp="${i}">Print</button>` : ''}${shareOk([f]) ? `<button class="btn sm good" data-fs="${i}">Share</button>` : ''}<button class="btn sm" data-fd="${i}">Download</button></div></div>`;

    <div>${F.map(row).join('')}</div>
    <div class="acts">${F.length > 1 && shareOk(F) ? '<button class="btn good" id="dShAll">Share all</button>' : ''}${F.length > 1 ? '<button class="btn pri" id="dDn">Download all</button>' : `<button class="btn pri" id="dDn">Download</button>`}<button class="btn" id="dClose">Close</button></div>
    ${shareOk(F) ? '' : '<div class="sub" style="margin-top:6px">Share needs Chrome on a phone (or Windows). Here: Download, then send the file.</div>'}`;
  if(!$('#dlg').open) $('#dlg').showModal();
  $('#dClose').onclick = () => $('#dlg').close();
  $('#dDn').onclick = () => F.forEach((f, i) => setTimeout(() => down(i), i * 600));
  $('#dShAll') && ($('#dShAll').onclick = () => share(F));
  $('#dlgIn').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.fo !== undefined) open(+b.dataset.fo);
    if(b.dataset.fp !== undefined) print(+b.dataset.fp);

const CRC = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
